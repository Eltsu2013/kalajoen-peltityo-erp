<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asiakkaat — Kalajoen Peltityö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<!-- Ulkoasuremontti R4b (26.11.2026): uusi ulkoasu (tyyli.css + teema.js), venytys pois (lista ja tiedot vierivät
     erikseen), puhelimella tiedot koko ruudulle listan päälle. Toiminnot ennallaan. -->
<link rel="stylesheet" href="tyyli.css?v=2">
<script src="teema.js?v=1"></script>
<style>
  /* Ulkoasuremontti R4b (26.11.2026): yhteinen tyyli.css, sivun omissa tyyleissä vain --kpt-muuttujia.
     Vanhat muuttujanimet kytketty uusiin, koska skripti tuottaa niillä inline-tyylejä. */
  :root, html[data-teema] {
    --bg: var(--kpt-tausta); --panel: var(--kpt-paneeli); --border: var(--kpt-reuna);
    --accent: var(--kpt-korostus); --accent-glow: var(--kpt-korostus-tausta);
    --text: var(--kpt-teksti); --text-dim: var(--kpt-himmea); --input-bg: var(--kpt-kentta);
    --success: var(--kpt-ok); --danger: var(--kpt-virhe); --warn: var(--kpt-huom);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Asettelu: lista ja tiedot vierivät erikseen (yläpalkin korkeudesta riippumatta) */
  body.kpt-sivu { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); }
  .left-panel {
    background: var(--kpt-paneeli); border-right: 1px solid var(--kpt-reuna);
    min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
  }
  .right-panel { min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  /* Haku ja välilehdet */
  .search-bar { padding: 12px 14px; border-bottom: 1px solid var(--kpt-reuna); display: flex; gap: 8px; align-items: center; }
  .search-bar input { flex: 1; }
  .filter-tabs { display: flex; border-bottom: 1px solid var(--kpt-reuna); }
  .filter-tab {
    flex: 1; padding: 10px 4px; min-height: 40px; font: 600 12.5px var(--kpt-fontti);
    background: none; border: none; border-bottom: 2px solid transparent; color: var(--kpt-himmea); cursor: pointer;
  }
  .filter-tab:hover { color: var(--kpt-teksti); }
  .filter-tab.active { color: var(--kpt-korostus); border-bottom-color: var(--kpt-korostus); }

  /* Asiakaslista */
  .customer-list { flex: 1; overflow-y: auto; }
  .customer-item {
    padding: 11px 16px; border-bottom: 1px solid var(--kpt-reuna); border-left: 3px solid transparent;
    cursor: pointer; display: flex; flex-direction: column; gap: 2px;
  }
  .customer-item:hover { background: var(--kpt-korostus-tausta); }
  .customer-item.active { background: var(--kpt-korostus-tausta); border-left-color: var(--kpt-korostus); }
  .customer-item.inactive { opacity: 0.5; }
  .customer-name { font-size: 14px; font-weight: 500; color: var(--kpt-teksti); }
  .customer-meta { font-size: 12px; color: var(--kpt-himmea); font-family: var(--kpt-mono); }
  .customer-num { font-size: 11px; color: var(--kpt-korostus); font-family: var(--kpt-mono); font-weight: 600; }
  .list-footer { padding: 10px 14px; border-top: 1px solid var(--kpt-reuna); display: flex; gap: 8px; }

  /* Asiakaskortti */
  .customer-card { background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna); border-radius: var(--kpt-pyoristys); }
  .customer-card + .customer-card { margin-top: 16px; }
  .card-header {
    padding: 14px 20px; border-bottom: 1px solid var(--kpt-reuna); display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .card-header h2 { font-size: 18px; font-weight: 600; color: var(--kpt-teksti); flex: 1; }
  .customer-badge {
    font-family: var(--kpt-mono); font-size: 11.5px; font-weight: 600; color: var(--kpt-korostus);
    background: var(--kpt-korostus-tausta); border: 1px solid var(--kpt-korostus); border-radius: 5px; padding: 2px 8px;
  }
  .inactive-badge {
    font-family: var(--kpt-mono); font-size: 11.5px; color: var(--kpt-virhe);
    background: color-mix(in srgb, var(--kpt-virhe) 12%, transparent); border: 1px solid var(--kpt-virhe); border-radius: 5px; padding: 2px 8px;
  }
  .card-body { padding: 20px; }
  .section-title {
    font-family: var(--kpt-mono); font-size: 11.5px; font-weight: 600; color: var(--kpt-himmea);
    letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px;
  }

  /* Kentät */
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .field-grid.cols4 { grid-template-columns: 2fr 1fr 2fr 1fr; }
  .field-grid.cols4-addr { grid-template-columns: 3fr 1fr 2fr 1fr; }
  .field-grid.cols4-contact { grid-template-columns: 1fr 2fr 2fr 2fr; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--kpt-himmea); font-family: var(--kpt-mono); }
  input, select, textarea {
    background: var(--kpt-kentta); border: 1px solid var(--kpt-reuna); color: var(--kpt-teksti);
    font: 14px var(--kpt-fontti); padding: 8px 10px; border-radius: 6px; width: 100%; min-height: 38px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--kpt-korostus); box-shadow: 0 0 0 3px var(--kpt-korostus-tausta); }
  input::placeholder, textarea::placeholder { color: var(--kpt-heikko); }
  /* Katselutilassa kentät tekstinä */
  input[readonly], textarea[readonly] { color: var(--kpt-teksti); cursor: default; border-color: transparent; background: transparent; padding-left: 0; font-size: 15px; box-shadow: none; }
  textarea { resize: vertical; min-height: 60px; }
  .divider { border: none; border-top: 1px solid var(--kpt-reuna); margin: 16px 0; }

  /* Napit */
  .btn {
    padding: 8px 14px; min-height: 38px; border: 1px solid transparent; border-radius: 8px;
    font: 600 13px var(--kpt-fontti); cursor: pointer;
  }
  .btn-primary { background: var(--kpt-korostus); color: var(--kpt-teksti-korostuksella); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { background: var(--kpt-paneeli2); border-color: var(--kpt-reuna2); color: var(--kpt-teksti); }
  .btn-secondary:hover { border-color: var(--kpt-himmea); }
  .btn-danger { background: transparent; border-color: var(--kpt-virhe); color: var(--kpt-virhe); }
  .btn-danger:hover { background: color-mix(in srgb, var(--kpt-virhe) 12%, transparent); }
  .btn-warn { background: var(--kpt-huom); color: var(--kpt-teksti-korostuksella); }
  .btn-warn:hover { filter: brightness(1.08); }
  .btn-sm { padding: 5px 10px; min-height: 32px; font-size: 12.5px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Tilaushistoria */
  .order-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--kpt-reuna); font-size: 14px; cursor: pointer; }
  .order-row:last-child { border-bottom: none; }
  .order-row:hover { background: var(--kpt-korostus-tausta); }
  .copy-order-btn {
    margin-left: auto; background: none; border: 1px solid var(--kpt-reuna); color: var(--kpt-himmea); font-family: var(--kpt-mono);
    font-size: 11px; padding: 5px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .copy-order-btn:hover { border-color: var(--kpt-korostus); color: var(--kpt-korostus); }
  .order-date { font-family: var(--kpt-mono); font-size: 12px; color: var(--kpt-himmea); min-width: 90px; }
  .order-desc { flex: 1; color: var(--kpt-teksti); min-width: 0; }
  .order-kohde { font-size: 13px; color: var(--kpt-himmea); min-width: 80px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-status { --v: var(--kpt-himmea); font-family: var(--kpt-mono); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 5px; color: var(--v); background: color-mix(in srgb, var(--v) 15%, transparent); white-space: nowrap; }
  .status-draft { --v: var(--kpt-himmea); }
  .status-active { --v: var(--kpt-v-tilaukset); }
  .status-done { --v: var(--kpt-ok); }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--kpt-himmea); font-size: 14px; }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.35; }
  .saving { font-size: 12px; color: var(--kpt-himmea); font-family: var(--kpt-mono); }
  .saving.ok { color: var(--kpt-ok); }
  .saving.err { color: var(--kpt-virhe); }

  /* Puhelin: lista koko ruudulla, asiakkaan tiedot avautuvat sen päälle (← Takaisin listaan) */
  .mobile-back { display: none; padding: 10px 14px; border-bottom: 1px solid var(--kpt-reuna); background: var(--kpt-paneeli); position: sticky; top: 0; z-index: 2; }
  .mobile-back button { background: none; border: none; color: var(--kpt-korostus); font: 600 15px var(--kpt-fontti); cursor: pointer; padding: 6px 0; min-height: 36px; }
  @media (max-width: 700px) {
    .main { grid-template-columns: minmax(0, 1fr); }
    .left-panel { border-right: none; }
    .kpt-yla .uusi-ylhaalla { display: none; }   /* sama nappi listan alalaidassa */
    .right-panel { display: none; position: fixed; inset: 0; background: var(--kpt-tausta); z-index: 300; padding: 0 0 24px; gap: 0; }
    .right-panel.mobile-open { display: flex; }
    .right-panel > #emptyState, .right-panel > #customerCard, .right-panel > #newCustomerForm { margin: 12px; }
    .mobile-back { display: block; }
    .field-grid.cols4, .field-grid.cols4-addr, .field-grid.cols4-contact { grid-template-columns: 1fr 1fr; }
    .field-grid.cols4 > .field:first-child, .field-grid.cols4-addr > .field:first-child { grid-column: 1 / -1; }   /* nimi ja katuosoite koko leveydelle */
    .card-header { padding: 12px 14px; }
    .card-body { padding: 14px; }
    input, select, textarea { font-size: 16px; min-height: 44px; }   /* iPhone ei zoomaa kenttään */
    input[readonly] { min-height: 0; }
    .btn { min-height: 44px; }
    .order-row { flex-wrap: wrap; gap: 4px 10px; }
    .order-desc { flex-basis: 100%; order: 5; font-size: 13px; color: var(--kpt-himmea); }
    .order-desc:empty { display: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
</head>
<body class="kpt-sivu">

<header class="kpt-yla">
  <a class="kpt-logo" href="etusivu.html">
    <img class="kpt-vain-tumma" src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="118" height="40">
    <img class="kpt-vain-vaalea" src="logo-musta.png" alt="Kalajoen Peltityö" width="118" height="40">
  </a>
  <div class="nav-menu-wrap">
    <button class="kpt-valikko-nappi" type="button">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=6"></script>
  </div>
  <div class="kpt-otsikko"><span class="kpt-kategoria"></span><h1>Asiakkaat</h1></div>
  <div class="header-right">
    <span class="saving" id="saveStatus"></span>
    <button class="kpt-nappi ensisijainen pieni uusi-ylhaalla" type="button" onclick="uusiAsiakas()">+ Uusi asiakas</button>
    <button class="kpt-teema-kytkin" type="button"></button>
  </div>
</header>

<div class="main" id="mainGrid">

  <!-- VASEN: asiakaslista -->
  <div class="left-panel" id="leftPanel">

    <!-- Haku -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Hae asiakasta..." oninput="filterCustomers(this.value)">
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" id="tab-active" onclick="setFilter('active')">Aktiiviset</button>
      <button class="filter-tab" id="tab-archived" onclick="setFilter('archived')">Arkistoidut</button>
      <button class="filter-tab" id="tab-all" onclick="setFilter('all')">Kaikki</button>
    </div>

    <!-- Lista -->
    <div class="customer-list" id="customerList">
      <div class="empty-state">Ladataan...</div>
    </div>

    <!-- Lisää-nappi alhaalla -->
    <div class="list-footer">
      <button class="btn btn-primary" style="flex:1" onclick="uusiAsiakas()">+ Uusi asiakas</button>
      <span class="saving" id="listCount" style="align-self:center;min-width:50px;text-align:right;"></span>
    </div>
  </div>

  <!-- OIKEA: asiakkaan tiedot -->
  <div class="right-panel" id="rightPanel">
    <div class="mobile-back">
      <button onclick="mobileBack()">← Takaisin listaan</button>
    </div>

    <!-- TYHJä TILA -->
    <div id="emptyState" class="empty-state">
      <div class="icon">👤</div>
      <div>Valitse asiakas listasta tai luo uusi</div>
    </div>

    <!-- ASIAKASKORTTI (piilotettu aluksi) -->
    <div id="customerCard" style="display:none;">

      <!-- Kortin otsikko -->
      <div class="customer-card">
        <div class="card-header">
          <h2 id="cardName">—</h2>
          <span class="customer-badge" id="cardNumber">—</span>
          <span class="inactive-badge" id="cardInactiveBadge" style="display:none;">Arkistoitu</span>
          <div class="row">
            <button class="btn btn-secondary btn-sm" id="editToggleBtn" onclick="toggleEdit()">✎ Muokkaa</button>
            <button class="btn btn-danger btn-sm" id="archiveBtn" onclick="toggleArchive()">Arkistoi</button>
          </div>
        </div>

        <!-- Perustiedot -->
        <div class="card-body">
          <div class="section-title">Perustiedot</div>
          <div class="field-grid cols4">
            <div class="field">
              <label>Asiakasnimi *</label>
              <input type="text" id="f_name" placeholder="Yritys tai henkilö" oninput="markDirty()">
            </div>
            <div class="field">
              <label>Asiakasnumero</label>
              <input type="text" id="f_customer_number" oninput="markDirty()">
            </div>
            <div class="field">
              <label>Yhteyshenkilö</label>
              <input type="text" id="f_contact_person" oninput="markDirty()">
            </div>
            <div class="field">
              <label>Y-tunnus</label>
              <input type="text" id="f_business_id" oninput="markDirty()">
            </div>
          </div>

          <hr class="divider">
          <div class="section-title">Laskutusosoite</div>
          <div class="field-grid cols4-addr">
            <div class="field">
              <label>Katuosoite</label>
              <input type="text" id="f_billing_address" oninput="markDirty()">
            </div>
            <div class="field">
              <label>Postinumero</label>
              <input type="text" id="f_billing_postal_code" oninput="markDirty()">
            </div>
            <div class="field">
              <label>Kaupunki</label>
              <input type="text" id="f_billing_city" oninput="markDirty()">
            </div>
            <div class="field">
              <label>Maa</label>
              <input type="text" id="f_billing_country" value="Suomi" oninput="markDirty()">
            </div>
          </div>

          <hr class="divider">
          <div class="section-title">Yhteystiedot & Laskutus</div>
          <div class="field-grid cols4-contact">
            <div class="field">
              <label>Puhelin</label>
              <input type="text" id="f_phone" oninput="markDirty()">
            </div>
            <div class="field">
              <label>Sähköposti</label>
              <input type="text" id="f_email" oninput="markDirty()">
            </div>
            <div class="field">
              <label>Sähköposti 2</label>
              <input type="text" id="f_email2" oninput="markDirty()">
            </div>
            <div class="field">
              <label>OVT-numero</label>
              <input type="text" id="f_ovt_number" oninput="markDirty()">
            </div>
          </div>

          <hr class="divider">
          <div class="section-title">Muistiinpanot</div>
          <div class="field">
            <textarea id="f_notes" placeholder="Vapaat muistiinpanot..." oninput="markDirty()"></textarea>
          </div>

          <!-- Tallenna/Peruuta -->
          <div class="row" id="editActions" style="display:none;margin-top:14px;">
            <button class="btn btn-primary" onclick="saveCustomer()">Tallenna</button>
            <button class="btn btn-secondary" onclick="cancelEdit()">Peruuta</button>
            <span class="saving" id="cardSaveStatus"></span>
          </div>
        </div>
      </div>

      <!-- TILAUSHISTORIA -->
      <div class="customer-card">
        <div class="card-header" style="padding:12px 20px;">
          <h2 style="font-size:15px;">Tilaushistoria</h2>
          <span class="customer-badge" id="orderCount" style="margin-left:0;">0 tilausta</span>
          <div style="margin-left:auto;">
            <button class="btn btn-warn btn-sm" onclick="uusiTilaus()">+ Uusi tilaus</button>
          </div>
        </div>
        <div id="orderList">
          <div class="empty-state" style="padding:28px;">Ei tilauksia</div>
        </div>
      </div>

    </div><!-- /customerCard -->

    <!-- UUSI ASIAKAS -lomake (piilotettu aluksi) -->
    <div id="newCustomerForm" style="display:none;">
      <div class="customer-card">
        <div class="card-header">
          <h2>Uusi asiakas</h2>
        </div>
        <div class="card-body">
          <div class="section-title">Perustiedot</div>
          <div class="field-grid cols4-addr">
            <div class="field">
              <label>Asiakasnimi *</label>
              <input type="text" id="new_name" placeholder="Yritys tai henkilö" tabindex="1">
            </div>
            <div class="field">
              <label>Yhteyshenkilö</label>
              <input type="text" id="new_contact_person" tabindex="2">
            </div>
            <div class="field">
              <label>Y-tunnus</label>
              <input type="text" id="new_business_id" placeholder="1234567-8" tabindex="3">
            </div>
            <div class="field">
              <label>OVT-numero</label>
              <input type="text" id="new_ovt_number" tabindex="4">
            </div>
          </div>

          <hr class="divider">
          <div class="section-title">Laskutusosoite</div>
          <div class="field-grid cols4-addr">
            <div class="field">
              <label>Katuosoite</label>
              <input type="text" id="new_billing_address" tabindex="5">
            </div>
            <div class="field">
              <label>Postinumero</label>
              <input type="text" id="new_billing_postal_code" tabindex="6">
            </div>
            <div class="field">
              <label>Kaupunki</label>
              <input type="text" id="new_billing_city" tabindex="7">
            </div>
            <div class="field">
              <label>Maa</label>
              <input type="text" id="new_billing_country" value="Suomi" tabindex="8">
            </div>
          </div>

          <hr class="divider">
          <div class="section-title">Yhteystiedot</div>
          <div class="field-grid cols4-contact">
            <div class="field">
              <label>Puhelin</label>
              <input type="text" id="new_phone" tabindex="9">
            </div>
            <div class="field">
              <label>Sähköposti</label>
              <input type="text" id="new_email" tabindex="10">
            </div>
            <div class="field">
              <label>Sähköposti 2</label>
              <input type="text" id="new_email2" tabindex="11">
            </div>
            <div class="field"></div>
          </div>

          <hr class="divider">
          <div class="field">
            <label>Muistiinpanot</label>
            <textarea id="new_notes" placeholder="Vapaat muistiinpanot..." tabindex="12"></textarea>
          </div>

          <hr class="divider">
          <div class="field" style="max-width:180px;">
            <label>Asiakasnumero (automaattinen)</label>
            <input type="text" id="new_customer_number" readonly
              style="color:var(--text-dim);font-style:italic;"
              placeholder="Haetaan tallennuksessa...">
          </div>

          <div class="row" style="margin-top:14px;padding-bottom:24px;">
            <button class="btn btn-primary" onclick="createCustomer()" tabindex="13">Luo asiakas</button>
            <button class="btn btn-secondary" onclick="cancelNew()" tabindex="14">Peruuta</button>
            <span class="saving" id="newSaveStatus"></span>
          </div>
        </div>
      </div>
    </div><!-- /newCustomerForm -->

  </div><!-- /right-panel -->
</div><!-- /main -->

<script>
const SUPABASE_URL = 'https://hjyeugeqmyavxisndlwp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4';

async function supabaseGet(table, params = '') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  return r.json();
}

async function supabasePost(table, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', Prefer: 'return=representation'
    },
    body: JSON.stringify(data)
  });
  return r.json();
}

async function supabasePatch(table, id, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'PATCH',
    headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', Prefer: 'return=representation'
    },
    body: JSON.stringify(data)
  });
  return r.json();
}

// =============================================
// TILA
// =============================================
let customers = [];
let filteredCustomers = [];
let activeCustomer = null;
let isDirty = false;
let isEditMode = false;
let activeFilter = 'active';

function setFilter(f) {
  activeFilter = f;
  ['active','archived','all'].forEach(id => {
    document.getElementById('tab-' + id).classList.toggle('active', id === f);
  });
  filterCustomers(document.getElementById('searchInput').value);
}

// =============================================
// LATAUS
// =============================================
async function loadCustomers() {
  const data = await supabaseGet('customers', '?select=*&order=name.asc');
  customers = Array.isArray(data) ? data : [];
  filterCustomers(document.getElementById('searchInput').value);
}

function filterCustomers(q) {
  const ql = (q || '').toLowerCase();
  filteredCustomers = customers.filter(c => {
    if (activeFilter === 'active' && !c.is_active) return false;
    if (activeFilter === 'archived' && c.is_active) return false;
    if (!ql) return true;
    return (c.name || '').toLowerCase().includes(ql)
      || (c.customer_number || '').toLowerCase().includes(ql)
      || (c.contact_person || '').toLowerCase().includes(ql)
      || (c.phone || '').toLowerCase().includes(ql);
  });
  renderList();
}

function renderList() {
  const el = document.getElementById('customerList');
  const count = document.getElementById('listCount');
  count.textContent = `${filteredCustomers.length} kpl`;
  if (!filteredCustomers.length) {
    el.innerHTML = '<div class="empty-state" style="padding:32px;">Ei asiakkaita</div>';
    return;
  }
  el.innerHTML = filteredCustomers.map(c => `
    <div class="customer-item ${!c.is_active ? 'inactive' : ''} ${activeCustomer?.id === c.id ? 'active' : ''}"
         onclick="selectCustomer('${c.id}')">
      <div class="customer-name">${c.name || '—'}</div>
      <div style="display:flex;gap:8px;align-items:center;">
        ${c.customer_number ? `<span class="customer-num">#${c.customer_number}</span>` : ''}
        ${c.contact_person ? `<span class="customer-meta">${c.contact_person}</span>` : ''}
      </div>
      ${c.phone || c.email ? `<div class="customer-meta">${[
        c.phone ? `<a href="tel:${c.phone.replace(/\s+/g,'')}" onclick="event.stopPropagation()" style="color:inherit;text-decoration:underline dotted;">${c.phone}</a>` : null,
        c.email ? `<a href="mailto:${c.email.trim()}" onclick="event.stopPropagation()" style="color:inherit;text-decoration:underline dotted;">${c.email}</a>` : null
      ].filter(Boolean).join(' · ')}</div>` : ''}
    </div>
  `).join('');
}

// =============================================
// VALINTA
// =============================================
function selectCustomer(id) {
  if (isDirty && !confirm('Tallentamattomat muutokset häviävät. Jatketaanko?')) return;
  activeCustomer = customers.find(c => c.id === id);
  isDirty = false;
  isEditMode = false;
  renderList();
  showCustomer();
  loadOrders(id);
  document.getElementById('rightPanel').classList.add('mobile-open');
}

function mobileBack() {
  document.getElementById('rightPanel').classList.remove('mobile-open');
}

function showCustomer() {
  const c = activeCustomer;
  if (!c) return;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('newCustomerForm').style.display = 'none';
  document.getElementById('customerCard').style.display = 'block';

  document.getElementById('cardName').textContent = c.name || '—';
  document.getElementById('cardNumber').textContent = c.customer_number ? `#${c.customer_number}` : '';
  document.getElementById('cardInactiveBadge').style.display = c.is_active ? 'none' : '';
  document.getElementById('archiveBtn').textContent = c.is_active ? 'Arkistoi' : 'Palauta';
  document.getElementById('archiveBtn').className = c.is_active ? 'btn btn-danger btn-sm' : 'btn btn-warn btn-sm';

  setFields(c);
  setReadonly(!isEditMode);
  document.getElementById('editActions').style.display = 'none';
}

function setFields(c) {
  const m = {
    f_name: c.name, f_customer_number: c.customer_number,
    f_contact_person: c.contact_person, f_business_id: c.business_id,
    f_billing_address: c.billing_address, f_billing_postal_code: c.billing_postal_code,
    f_billing_city: c.billing_city, f_billing_country: c.billing_country || 'Suomi',
    f_phone: c.phone, f_email: c.email, f_email2: c.email2,
    f_ovt_number: c.ovt_number, f_notes: c.notes
  };
  for (const [id, val] of Object.entries(m)) {
    const el = document.getElementById(id);
    if (el) el.value = val || '';
  }
}

function setReadonly(ro) {
  ['f_name','f_customer_number','f_contact_person','f_business_id',
   'f_billing_address','f_billing_postal_code','f_billing_city','f_billing_country',
   'f_phone','f_email','f_email2','f_ovt_number','f_notes'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.readOnly = ro;
  });
}

// =============================================
// MUOKKAUS
// =============================================
function toggleEdit() {
  isEditMode = !isEditMode;
  setReadonly(!isEditMode);
  document.getElementById('editToggleBtn').textContent = isEditMode ? '✕ Peruuta muokkaus' : '✎ Muokkaa';
  document.getElementById('editActions').style.display = isEditMode ? 'flex' : 'none';
  if (isEditMode) document.getElementById('f_name').focus();
}

function cancelEdit() {
  isEditMode = false;
  isDirty = false;
  setFields(activeCustomer);
  setReadonly(true);
  document.getElementById('editToggleBtn').textContent = '✎ Muokkaa';
  document.getElementById('editActions').style.display = 'none';
  document.getElementById('cardSaveStatus').textContent = '';
}

function markDirty() { isDirty = true; }

async function saveCustomer() {
  const el = document.getElementById('cardSaveStatus');
  el.className = 'saving'; el.textContent = 'Tallennetaan...';
  const data = {
    name: document.getElementById('f_name').value.trim().toUpperCase(),
    customer_number: document.getElementById('f_customer_number').value.trim() || null,
    contact_person: document.getElementById('f_contact_person').value.trim() || null,
    business_id: document.getElementById('f_business_id').value.trim() || null,
    billing_address: (document.getElementById('f_billing_address').value.trim() || '').toUpperCase() || null,
    billing_postal_code: document.getElementById('f_billing_postal_code').value.trim() || null,
    billing_city: (document.getElementById('f_billing_city').value.trim() || '').toUpperCase() || null,
    billing_country: document.getElementById('f_billing_country').value.trim() || null,
    phone: document.getElementById('f_phone').value.trim() || null,
    email: document.getElementById('f_email').value.trim() || null,
    email2: document.getElementById('f_email2').value.trim() || null,
    ovt_number: document.getElementById('f_ovt_number').value.trim() || null,
    notes: document.getElementById('f_notes').value.trim() || null,
  };
  if (!data.name) { el.className = 'saving err'; el.textContent = 'Nimi puuttuu!'; return; }
  try {
    const result = await supabasePatch('customers', activeCustomer.id, data);
    if (result && result[0]) {
      Object.assign(activeCustomer, result[0]);
      const idx = customers.findIndex(c => c.id === activeCustomer.id);
      if (idx >= 0) customers[idx] = activeCustomer;
      isDirty = false;
      isEditMode = false;
      setReadonly(true);
      document.getElementById('cardName').textContent = activeCustomer.name;
      document.getElementById('cardNumber').textContent = activeCustomer.customer_number ? `#${activeCustomer.customer_number}` : '';
      document.getElementById('editToggleBtn').textContent = '✎ Muokkaa';
      document.getElementById('editActions').style.display = 'none';
      el.className = 'saving ok'; el.textContent = '✓ Tallennettu';
      setTimeout(() => el.textContent = '', 2500);
      renderList();
    } else {
      el.className = 'saving err'; el.textContent = 'Virhe tallennuksessa';
    }
  } catch(e) {
    el.className = 'saving err'; el.textContent = 'Verkkovirhe';
  }
}

async function toggleArchive() {
  const newState = !activeCustomer.is_active;
  const verb = newState ? 'palauttaa' : 'arkistoida';
  if (!confirm(`Haluatko ${verb} asiakkaan ${activeCustomer.name}?`)) return;
  const result = await supabasePatch('customers', activeCustomer.id, { is_active: newState });
  if (result && result[0]) {
    Object.assign(activeCustomer, result[0]);
    const idx = customers.findIndex(c => c.id === activeCustomer.id);
    if (idx >= 0) customers[idx] = activeCustomer;
    showCustomer();
    renderList();
  }
}

// =============================================
// UUSI ASIAKAS
// =============================================
function uusiAsiakas() {
  if (isDirty && !confirm('Tallentamattomat muutokset häviävät. Jatketaanko?')) return;
  activeCustomer = null;
  isDirty = false;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('customerCard').style.display = 'none';
  document.getElementById('newCustomerForm').style.display = 'block';
  // Tyhjennetään kaikki kentät
  ['new_name','new_contact_person','new_business_id','new_ovt_number',
   'new_billing_address','new_billing_postal_code','new_billing_city',
   'new_phone','new_email','new_email2','new_notes'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('new_billing_country').value = 'Suomi';
  document.getElementById('new_customer_number').value = '';
  document.getElementById('newSaveStatus').textContent = '';
  // Mobiili: avaa oikea paneeli
  document.getElementById('rightPanel').classList.add('mobile-open');
  document.getElementById('new_name').focus();
  renderList();
}

function cancelNew() {
  document.getElementById('newCustomerForm').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
}

async function createCustomer() {
  const el = document.getElementById('newSaveStatus');
  el.className = 'saving'; el.textContent = 'Tallennetaan...';

  // Haetaan seuraava vapaa asiakasnumero Supabasesta
  let nextNum = null;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/next_customer_number`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    nextNum = await r.json();
    document.getElementById('new_customer_number').value = nextNum;
  } catch(e) {}

  const data = {
    name: document.getElementById('new_name').value.trim().toUpperCase(),
    customer_number: nextNum ? String(nextNum) : null,
    contact_person: document.getElementById('new_contact_person').value.trim() || null,
    business_id: document.getElementById('new_business_id').value.trim() || null,
    billing_address: (document.getElementById('new_billing_address').value.trim() || '').toUpperCase() || null,
    billing_postal_code: document.getElementById('new_billing_postal_code').value.trim() || null,
    billing_city: (document.getElementById('new_billing_city').value.trim() || '').toUpperCase() || null,
    billing_country: 'Suomi',
    phone: document.getElementById('new_phone').value.trim() || null,
    email: document.getElementById('new_email').value.trim() || null,
    email2: document.getElementById('new_email2').value.trim() || null,
    ovt_number: document.getElementById('new_ovt_number').value.trim() || null,
    notes: document.getElementById('new_notes').value.trim() || null,
    is_active: true,
  };
  if (!data.name) { el.className = 'saving err'; el.textContent = 'Nimi puuttuu!'; return; }
  try {
    const result = await supabasePost('customers', data);
    if (result && result[0]) {
      customers.push(result[0]);
      customers.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      el.className = 'saving ok'; el.textContent = '✓ Luotu!';
      setTimeout(() => { selectCustomer(result[0].id); }, 500);
    } else {
      el.className = 'saving err'; el.textContent = 'Virhe luonnissa';
    }
  } catch(e) {
    el.className = 'saving err'; el.textContent = 'Verkkovirhe';
  }
}

// =============================================
// TILAUSHISTORIA
// =============================================
async function loadOrders(customerId) {
  document.getElementById('orderList').innerHTML = '<div class="empty-state" style="padding:24px;">Ladataan...</div>';
  document.getElementById('orderCount').textContent = '...';
  const data = await supabaseGet('orders', `?customer_id=eq.${customerId}&order=order_date.desc&select=id,order_date,status,notes,kohde`);
  const orders = Array.isArray(data) ? data : [];
  document.getElementById('orderCount').textContent = `${orders.length} tilausta`;
  if (!orders.length) {
    document.getElementById('orderList').innerHTML = '<div class="empty-state" style="padding:28px;">Ei tilauksia</div>';
    return;
  }
  const statusLabel = {
    DRAFT: 'Luonnos', IN_PROGRESS: 'Kesken', QUOTED: 'Tarjottu',
    ORDERED: 'Tilattu', IN_PRODUCTION: 'Työn alla',
    COMPLETED: 'Valmis', INVOICED: 'Laskutettu', ARCHIVED: 'Arkisto'
  };
  const statusClass = {
    DRAFT: 'status-draft', IN_PROGRESS: 'status-active', QUOTED: 'status-active',
    ORDERED: 'status-active', IN_PRODUCTION: 'status-active',
    COMPLETED: 'status-done', INVOICED: 'status-done', ARCHIVED: 'status-draft'
  };
  document.getElementById('orderList').innerHTML = orders.map(o => `
    <div class="order-row" onclick="avaaTilaus('${o.id}')">
      <span class="order-date">${(o.order_date || '').slice(0,10)}</span>
      <span class="order-kohde">${o.kohde || '—'}</span>
      <span class="order-desc">${o.notes || ''}</span>
      <span class="order-status ${statusClass[o.status] || 'status-draft'}">${statusLabel[o.status] || o.status}</span>
      <button class="copy-order-btn" onclick="event.stopPropagation(); kopioi('${o.id}', true)" title="Kopioi uudeksi tilaukseksi samalle asiakkaalle">⧉ Kopioi</button>
    </div>
  `).join('');
}

function uusiTilaus() {
  if (!activeCustomer) return;
  localStorage.setItem('newOrderCustomerId', activeCustomer.id);
  localStorage.setItem('newOrderCustomerName', activeCustomer.name);
  window.open('../orders/tilaus.html', '_blank');
}

function avaaTilaus(orderId) {
  localStorage.setItem('openOrderId', orderId);
  window.open('../orders/tilaus.html', '_blank');
}

function kopioi(orderId, keepCustomer) {
  localStorage.setItem('copyOrderId', orderId);
  localStorage.setItem('copyKeepCustomer', keepCustomer ? 'true' : 'false');
  window.open('../orders/tilaus.html', '_blank');
}

// Valikon avaa ja sulkee nav.js (uusi ulkoasu, R4b)

// =============================================
// INIT
// =============================================
// ── Suora linkitys yhteen asiakkaaseen (esim. tehtävälistasta) ──
// Käyttö: asiakkaat.html?id=<asiakkaan id>
// Avaa asiakkaan tiedot suoraan, riippumatta onko hän aktiivinen vai arkistoitu.
function focusCustomerFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const targetId = params.get('id');
  if (!targetId) return;

  const exists = customers.find(c => c.id === targetId);
  if (!exists) return;

  setFilter('all'); // varmistetaan että asiakas näkyy listassa vaikka olisi arkistoitu
  document.getElementById('searchInput').value = '';
  filterCustomers('');
  selectCustomer(targetId);

  setTimeout(() => {
    const row = document.querySelector('.customer-item.active');
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 150);
}

loadCustomers().then(focusCustomerFromUrl);
