<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajanseuranta — Kalajoen Peltityö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #1e2a30;
    --bg-panel: #253540;
    --bg-card: #2b3d48;
    --border: #374b56;
    --text: #e8edf0;
    --text-dim: #9fb0b8;
    --accent: #f43f5e;
    --accent-dim: #f43f5e33;
    --accent-glow: rgba(244,63,94,0.15);
    --high: #ef4444;
    --normal: #eab308;
    --low: #22c55e;
    --run: #f43f5e;
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  header {
    background: #241e30;
    border-bottom: 2px solid var(--accent);
    padding: 10px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 500; color: var(--text); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .nav-menu-wrap { position: relative; }
  .nav-btn {
    background: #3a3545; border: 1px solid #585568;
    color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; letter-spacing: 0.04em;
  }
  .nav-btn:hover { background: #4a4558; }
  .nav-dropdown {
    display: none; position: absolute; top: calc(100% + 6px); left: 0;
    background: #3a3545; border: 1px solid var(--border);
    border-radius: 6px; min-width: 200px; z-index: 999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); overflow: hidden;
  }
  .nav-dropdown.open { display: block; }
  .nav-section-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); padding: 8px 14px 4px;
  }
  .nav-item {
    display: block; width: 100%; text-align: left;
    padding: 8px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--text); background: none;
    border: none; cursor: pointer; text-decoration: none;
    transition: background 0.1s;
  }
  .nav-item:hover { background: var(--accent-glow); color: var(--accent); }
  .nav-item.current { color: var(--accent); font-weight: 600; }
  .nav-item.external::after { content: ' ↗'; opacity: 0.6; font-size: 11px; }
  .nav-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  main{max-width:900px;margin:0 auto;padding:20px;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    margin-bottom:20px;
  }
  .filter-tabs{display:flex;flex-wrap:wrap;gap:6px;}
  .filter-tab{
    background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    padding:7px 12px;border-radius:var(--radius);cursor:pointer;letter-spacing:.02em;
  }
  .filter-tab:hover{border-color:var(--accent);color:var(--text);}
  .filter-tab.active{background:var(--accent);border-color:var(--accent);color:#2a0e15;}

  .btn{
    background:var(--accent);color:#2a0e15;border:none;
    padding:10px 18px;border-radius:var(--radius);font-weight:600;
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;cursor:pointer;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn.secondary{
    background:transparent;color:var(--text);border:1px solid var(--border);
  }
  .btn.secondary:hover{border-color:var(--accent);color:var(--accent);}
  .btn.danger{background:var(--high);color:#fff;}
  .btn-primary{background:var(--accent);color:#2a0e15;}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .saving{font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
</style>
<style>
  /* ---------- Projektikortit (listanäkymä) ---------- */
  .cards{display:flex;flex-direction:column;gap:10px;}
  .empty-state{
    color:var(--text-dim);font-size:14px;padding:24px 10px;text-align:center;
    border:1px dashed var(--border);border-radius:var(--radius);
  }
  .project-card{
    background:var(--bg-card);border-radius:var(--radius);
    border-left:4px solid var(--border);
    padding:14px 16px;cursor:pointer;
    transition:background .15s;
  }
  .project-card:hover{background:#324450;}
  .project-card.running{border-left-color:var(--run);}
  .project-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .project-card-title{font-weight:600;font-size:15px;}
  .project-card-total{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-dim);
    white-space:nowrap;
  }
  .project-card-meta{
    margin-top:6px;font-size:12px;color:var(--text-dim);
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  .running-badge{
    display:inline-flex;align-items:center;gap:5px;color:var(--run);font-weight:600;
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  }
  .pulse-dot{
    width:8px;height:8px;border-radius:50%;background:var(--run);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(244,63,94,0.5);}
    70%{box-shadow:0 0 0 7px rgba(244,63,94,0);}
    100%{box-shadow:0 0 0 0 rgba(244,63,94,0);}
  }

  /* ---------- Detail-näkymä ---------- */
  #detailView{display:none;}
  .back-btn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:13px;padding:0;margin-bottom:16px;
  }
  .back-btn:hover{color:var(--accent);}
  .detail-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .detail-header h2{margin:0;font-size:20px;font-weight:600;}
  .icon-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    cursor:pointer;border-radius:var(--radius);padding:4px 8px;font-size:13px;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}
  .detail-name-input{
    background:var(--bg-card);border:1px solid var(--accent);color:var(--text);
    padding:8px 10px;border-radius:var(--radius);font-size:18px;font-weight:600;
    font-family:'IBM Plex Sans',sans-serif;width:100%;max-width:420px;
  }
  .detail-links{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;
  }
  .link-chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
    padding:5px 12px;font-size:13px;color:var(--text-dim);
  }
  .link-chip a{color:var(--accent);text-decoration:none;font-weight:600;}
  .link-chip a:hover{text-decoration:underline;}
  .link-chip button{
    background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;padding:0;
  }
  .link-chip button:hover{color:var(--high);}
  .add-link-btn{
    background:none;border:1px dashed var(--border);color:var(--text-dim);
    border-radius:12px;padding:5px 12px;font-size:13px;cursor:pointer;
  }
  .add-link-btn:hover{border-color:var(--accent);color:var(--accent);}

  .rows-toolbar{margin-bottom:14px;}
  .start-row-btn{
    background:var(--accent);color:#2a0e15;border:none;
    padding:14px 22px;border-radius:var(--radius);font-weight:700;
    font-family:'IBM Plex Sans',sans-serif;font-size:16px;cursor:pointer;
    width:100%;
  }
  .start-row-btn:hover{filter:brightness(1.1);}
  .start-row-btn:active{transform:scale(0.98);}

  .row-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
  .row-card{
    background:var(--bg-card);border-radius:var(--radius);
    border-left:4px solid var(--border);padding:12px 14px;
  }
  .row-card.running{border-left-color:var(--run);}
  .row-line1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .row-label-input{
    flex:1;min-width:140px;background:transparent;border:none;border-bottom:1px solid transparent;
    color:var(--text);font-size:14px;font-weight:600;padding:4px 2px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .row-label-input::placeholder{color:var(--text-dim);font-weight:400;}
  .row-label-input:focus{outline:none;border-bottom-color:var(--accent);}
  .row-timer{
    font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;
    color:var(--text);white-space:nowrap;
  }
  .row-timer.running{color:var(--run);}
  .row-line2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}
  .row-category-input, .row-detail-input{
    background:var(--bg-panel);border:1px solid var(--border);color:var(--text);
    padding:6px 8px;border-radius:var(--radius);font-size:12px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .row-detail-input{flex:1;min-width:100px;}
  .row-actions{display:flex;gap:6px;margin-left:auto;}
  .stop-btn{
    background:var(--run);color:#fff;border:none;padding:7px 16px;
    border-radius:var(--radius);font-weight:700;font-size:13px;cursor:pointer;
  }
  .stop-btn:hover{filter:brightness(1.1);}
  .resume-btn{
    background:var(--low);color:#0e2a12;border:none;padding:7px 16px;
    border-radius:var(--radius);font-weight:700;font-size:13px;cursor:pointer;
  }
  .resume-btn:hover{filter:brightness(1.1);}
  .duration-edit-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    border-radius:var(--radius);padding:6px 10px;font-size:12px;cursor:pointer;
  }
  .duration-edit-btn:hover{border-color:var(--accent);color:var(--accent);}
  .row-delete-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    border-radius:var(--radius);padding:6px 10px;font-size:12px;cursor:pointer;
  }
  .row-delete-btn:hover{border-color:var(--high);color:var(--high);}
  .row-saved-tick{
    font-size:11px;color:var(--low);opacity:0;transition:opacity .3s;
    font-family:'IBM Plex Mono',monospace;
  }
  .row-saved-tick.show{opacity:1;}

  .duration-edit-box{
    display:flex;gap:8px;align-items:center;margin-top:8px;
    background:var(--bg-panel);border:1px solid var(--accent);border-radius:var(--radius);
    padding:8px;
  }
  .duration-edit-box input{
    width:70px;background:var(--bg-card);border:1px solid var(--border);color:var(--text);
    padding:6px 8px;border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;
  }
  .duration-edit-box label{font-size:12px;color:var(--text-dim);}

  /* ---------- Segmenttichipit (yksittäiset aloita/lopeta-pätkät ajanoton sisällä) ---------- */
  .row-segments{
    display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--border);
  }
  .seg-chip{
    position:relative;
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;
    padding:4px 8px;font-size:11px;color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
  }
  .seg-chip.running{border-color:var(--run);color:var(--run);}
  .seg-live{font-weight:700;}
  .seg-edit-btn, .seg-del-btn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    font-size:11px;padding:0;line-height:1;
  }
  .seg-edit-btn:hover{color:var(--accent);}
  .seg-del-btn:hover{color:var(--high);}
  .seg-chip .duration-edit-box{
    position:absolute;top:calc(100% + 4px);left:0;z-index:20;white-space:nowrap;
  }

  /* ---------- Yhteenveto ---------- */
  .summary-box{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;
  }
  .summary-box h3{margin:0 0 12px 0;font-size:14px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.06em;}
  .summary-row{
    display:flex;justify-content:space-between;padding:6px 0;
    border-bottom:1px solid var(--border);font-size:13px;
  }
  .summary-row:last-of-type{border-bottom:none;}
  .summary-row .cat{color:var(--text-dim);}
  .summary-row .val{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .summary-total{
    display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;
    border-top:2px solid var(--accent);font-size:16px;font-weight:700;
  }
  .summary-total .val{font-family:'IBM Plex Mono',monospace;color:var(--accent);}

  /* ---------- Modaali ---------- */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
    z-index:100;align-items:center;justify-content:center;padding:16px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--bg-panel);border:1px solid var(--border);
    border-radius:var(--radius);width:100%;max-width:480px;
    max-height:90vh;overflow-y:auto;padding:20px;
  }
  .modal h3{margin:0 0 16px 0;font-size:17px;color:var(--accent);}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:13px;color:var(--text-dim);margin-bottom:5px;
  }
  .field input[type=text],
  .field select{
    width:100%;background:var(--bg-card);border:1px solid var(--border);
    color:var(--text);padding:9px 10px;border-radius:var(--radius);
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;
  }
  .field input:focus, .field select:focus{
    outline:none;border-color:var(--accent);
  }
  .modal-actions{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:18px;gap:10px;flex-wrap:wrap;
  }
  .modal-actions .right{display:flex;gap:10px;}

  /* Haku-dropdown (tilaushaku): lista avautuu hakukentän alle ikkunan sisään, ei omaa pientä vieritysikkunaa */
  .search-dropdown{
    display:none;margin-top:6px;
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  }
  .search-dropdown.open{display:block;}
  .search-dropdown-item{
    padding:12px 14px;min-height:56px;cursor:pointer;font-size:15px;line-height:1.3;
    border-bottom:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:3px;
  }
  .search-dropdown-item:last-child{border-bottom:none;}
  .search-dropdown-item:hover,.search-dropdown-item:active{background:var(--accent-glow);}
  .search-dropdown-item .sd-title{font-weight:600;color:var(--text);}
  .search-dropdown-item .sd-sub{color:var(--text-dim);font-size:12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;}
  .st-chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--text-dim);}
  .st-chip.st-draft{color:var(--text-dim);}
  .st-chip.st-active{color:#eab308;border-color:#eab308;}
  .st-chip.st-done{color:#22c55e;border-color:#22c55e;}
  .chip-preview{
    margin-top:8px;display:flex;align-items:center;gap:8px;
    background:var(--accent-glow);border:1px solid var(--accent);border-radius:12px;
    padding:5px 10px;font-size:13px;color:var(--accent);width:fit-content;
  }
  .chip-preview button{
    background:none;border:none;color:var(--accent);cursor:pointer;
    font-size:12px;padding:0;line-height:1;
  }

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--bg-card);border:1px solid var(--accent);color:var(--text);
    padding:10px 18px;border-radius:var(--radius);font-size:14px;z-index:200;
    display:none;
  }
  .toast.show{display:block;}

  /* Puhelin: ikkunat täyttävät koko ruudun, isommat kosketuskohteet */
  @media (max-width:700px){
    .overlay{padding:0;align-items:stretch;}
    .modal{max-width:none;max-height:none;height:100%;border-radius:0;border:none;padding:16px;}
    .field input[type=text],.field select{font-size:16px;padding:12px;}
    .modal-actions{position:sticky;bottom:0;background:var(--bg-panel);padding:12px 0 4px;margin-top:14px;}
    .modal-actions .right{width:100%;}
    .modal-actions .right .btn{flex:1;min-height:48px;font-size:15px;}
    .chip-preview{font-size:14px;padding:8px 12px;}
    .chip-preview button{font-size:16px;padding:6px 8px;}
  }

  @media (max-width:600px){
    main{padding:14px;}
    .project-card-top{flex-direction:column;}
    .row-actions{margin-left:0;width:100%;justify-content:flex-end;}
  }
</style>
</head>
<body>

<header>
  <div class="logo-img" style="height:50px;display:flex;align-items:center"><img src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="147" height="50" style="height:50px;width:auto;display:block"></div>
  <div class="nav-menu-wrap">
    <button class="nav-btn" onclick="toggleNav(event)">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <div class="nav-section-label">Sivut</div>
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
      <a class="nav-item" href="asiakkaat.html">👤 Asiakkaat</a>
      <a class="nav-item" href="tilaukset.html">📋 Tilaukset</a>
      <a class="nav-item" href="tilaus.html">✏️ Uusi tilaus</a>
      <a class="nav-item" href="tuotanto.html">⚙️ Tuotanto</a>
      <a class="nav-item" href="peltipiirturi.html">🔨 Mallisto</a>
      <a class="nav-item" href="vakiomallit.html">🔧 Vakiomallit</a>
      <a class="nav-item" href="varasto.html">📦 Varasto</a>
      <hr class="nav-divider">
      <div class="nav-section-label">Hallinta</div>
      <a class="nav-item" href="hinnasto.html">💰 Hinnasto</a>
      <a class="nav-item" href="lasku.html">🧾 Laskutus</a>
      <a class="nav-item" href="tehtavat.html">✅ Tehtävät</a>
      <a class="nav-item" href="kalenteri.html">📅 Kalenteri</a>
      <hr class="nav-divider">
      <div class="nav-section-label">Työkalut</div>
      <a class="nav-item" href="tunnit.html">⏱ Tunnit</a>
      <a class="nav-item current" href="ajanseuranta.html">⏲ Ajanseuranta</a>
      <a class="nav-item" href="laskin.html">🧮 Laskin</a>
      <a class="nav-item" href="piippu.html">🏭 Piippu</a>
    </div>
  </div>

  <h1>Ajanseuranta</h1>
  <div class="header-right">
    <span class="saving" id="saveStatus"></span>
  </div>
</header>

<main>

  <div id="listView">
    <div class="toolbar">
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all">Kaikki</button>
        <button class="filter-tab" data-filter="mine">Omat</button>
        <button class="filter-tab" data-filter="order">Tilaukseen liitetyt</button>
        <button class="filter-tab" data-filter="research">Tutkimusprojektit</button>
      </div>
      <button class="btn btn-primary" id="newProjectBtn">+ Uusi aikaprojekti</button>
    </div>
    <div class="cards" id="projectCards">
      <div class="empty-state">Ladataan…</div>
    </div>
  </div>

  <div id="detailView">
    <button class="back-btn" id="backBtn">← Takaisin listaan</button>

    <div class="detail-header">
      <h2 id="detailName">—</h2>
      <button class="icon-btn" id="editNameBtn" title="Muokkaa nimeä">✎</button>
    </div>

    <div class="detail-links" id="detailLinks"></div>

    <div class="rows-toolbar">
      <button class="start-row-btn" id="startRowBtn">▶ Aloita uusi ajanotto</button>
    </div>

    <div class="row-list" id="rowList"></div>
    <datalist id="categoryOptions"></datalist>

    <div class="summary-box" id="summaryBox"></div>
  </div>

</main>

<!-- Uusi aikaprojekti -->
<div class="overlay" id="newProjectOverlay">
  <div class="modal">
    <h3>Uusi aikaprojekti</h3>
    <div class="field">
      <label for="npName">Nimi *</label>
      <input type="text" id="npName" placeholder="esim. Piippu, Matti Meikäläinen">
    </div>
    <div class="field">
      <label for="npOrderSearch">Liitä tilaukseen (valinnainen)</label>
      <div style="position:relative;">
        <input type="text" id="npOrderSearch" placeholder="Hae kohteen tai asiakkaan nimellä..." autocomplete="off">
        <div id="npOrderDropdown" class="search-dropdown"></div>
      </div>
      <input type="hidden" id="npOrderId">
      <div id="npOrderChip" class="chip-preview" style="display:none;">
        <span id="npOrderChipText"></span>
        <button type="button" id="npOrderChipClear" title="Poista">✕</button>
      </div>
    </div>

(function(){

  // Kategoria on vapaa tekstikenttä — nämä ovat vain autocomplete-ehdotuksia

  // ---------- Auth helpers ----------

  // ---------- Toast ----------
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2500);
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  // ---------- Ajan formatointi ----------
  function formatDuration(totalSeconds){
    totalSeconds = Math.max(0, Math.round(totalSeconds || 0));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    if(h > 0) return h + " h " + m + " min";
    if(m > 0) return m + " min " + s + " s";
    return s + " s";
  }

  function formatClock(totalSeconds){
    totalSeconds = Math.max(0, Math.round(totalSeconds || 0));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    function pad(n){ return n < 10 ? "0" + n : "" + n; }
    if(h > 0) return h + ":" + pad(m) + ":" + pad(s);
    return pad(m) + ":" + pad(s);
  }

  const WEEKDAYS_FI = ["su","ma","ti","ke","to","pe","la"];
  function formatSegClock(d){
    function pad(n){ return n < 10 ? "0" + n : "" + n; }
    return WEEKDAYS_FI[d.getDay()] + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  // Segmentti = yksi yhtäjaksoinen "aloita...lopeta"-pätkä. Yksi ajanotto (rivi)
  // voi koostua useasta segmentistä, jos työtä on tauotettu ja jatkettu.
  function rowSegments(row){
    return (row.time_row_segments || []).slice().sort(function(a, b){
      return new Date(a.started_at) - new Date(b.started_at);
    });
  }
  function rowRunningSegment(row){
    return rowSegments(row).find(function(seg){ return !seg.stopped_at; }) || null;
  }
  function rowCompletedSeconds(row){
    let total = 0;
    rowSegments(row).forEach(function(seg){
      if(seg.stopped_at) total += seg.duration_seconds != null ? seg.duration_seconds : 0;
    });
    return total;
  }
  function rowElapsedSeconds(row){
    const runningSeg = rowRunningSegment(row);
    let total = rowCompletedSeconds(row);
    if(runningSeg){
      total += (Date.now() - new Date(runningSeg.started_at).getTime()) / 1000;
    }
    return total;
  }
  function rowIsRunning(row){
    return !!rowRunningSegment(row);
  }

  function projectTotalSeconds(project){
    let total = 0;
    (project.time_project_rows || []).forEach(function(r){
      total += rowElapsedSeconds(r);
    });
    return total;
  }

  function projectIsRunning(project){
    return (project.time_project_rows || []).some(rowIsRunning);
  }

  // ---------- Data ----------
  async function loadProjects(){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(
        REST_PROJECTS + "?select=*,orders(id,kohde,customers(name)),time_project_rows(*,time_row_segments(*))&order=created_at.desc",
        { headers: headers }
      );
      if(!res.ok) throw new Error("Haku epäonnistui: " + res.status);
      allProjects = await res.json();
      renderList();
      if(currentProjectId){
        renderDetail();
      }
    }catch(err){
      console.error(err);
      showToast("Aikaprojektien haku epäonnistui");
    }
  }

  async function loadProductGroupSuggestions(){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(REST_PRODUCTS + "?select=product_group&is_active=eq.true", { headers: headers });
      if(!res.ok) return;
      const rows = await res.json();
      const groups = Array.from(new Set(rows.map(function(r){ return r.product_group; }).filter(Boolean)));
      const dl = document.getElementById("productGroupList");
      dl.innerHTML = groups.map(function(g){ return '<option value="' + escapeHtml(g) + '">'; }).join("");
    }catch(err){
      console.error(err);
    }
  }

  // ---------- Listanäkymä ----------
  function filteredProjects(){
    return allProjects.filter(function(p){
      if(currentFilter === "mine") return p.created_by === currentUserId;
      if(currentFilter === "order") return !!p.order_id;
      if(currentFilter === "research") return !p.order_id && !!p.product_group;
      return true;
    });
  }

  function projectCardHtml(p){
    const running = projectIsRunning(p);
    const total = projectTotalSeconds(p);
    const rowCount = (p.time_project_rows || []).length;
    const metaBits = [];
    if(p.order_id){
      const custName = p.orders && p.orders.customers && p.orders.customers.name ? p.orders.customers.name : "";
      const kohde = p.orders && p.orders.kohde ? p.orders.kohde : "";
      const parts = [];
      if(custName) parts.push(escapeHtml(custName));
      if(kohde) parts.push(escapeHtml(kohde));
      metaBits.push("🔗 " + (parts.length ? parts.join(" — ") : "Liitetty tilaukseen"));
    }
    if(p.product_group){
      metaBits.push("🏷 " + escapeHtml(p.product_group));
    }
    metaBits.push(rowCount + " ajanotto" + (rowCount === 1 ? "" : "a"));
    const runningBadge = running
      ? '<span class="running-badge"><span class="pulse-dot"></span>Käynnissä</span>'
      : "";
    return (
      '<div class="project-card' + (running ? " running" : "") + '" data-id="' + p.id + '">' +
        '<div class="project-card-top">' +
          '<div class="project-card-title">' + escapeHtml(p.name) + '</div>' +
          '<div class="project-card-total">' + formatDuration(total) + '</div>' +
        '</div>' +
        '<div class="project-card-meta">' + runningBadge + metaBits.map(function(b){ return "<span>" + b + "</span>"; }).join("") + '</div>' +
      '</div>'
    );
  }

  function renderList(){
    const wrap = document.getElementById("projectCards");
    const list = filteredProjects();
    if(list.length === 0){
      wrap.innerHTML = '<div class="empty-state">Ei aikaprojekteja tässä näkymässä.</div>';
      return;
    }
    wrap.innerHTML = list.map(projectCardHtml).join("");
    Array.prototype.forEach.call(wrap.querySelectorAll(".project-card"), function(card){
      card.addEventListener("click", function(){
        openProject(card.getAttribute("data-id"));
      });
    });
  }

  // ---------- Detail-näkymä ----------
  function currentProject(){
    return allProjects.find(function(p){ return p.id === currentProjectId; });
  }

  function openProject(id){
    currentProjectId = id;
    const url = new URL(window.location.href);
    url.searchParams.set("id", id);
    window.history.pushState({}, "", url);
    document.getElementById("listView").style.display = "none";
    document.getElementById("detailView").style.display = "block";
    renderDetail();
  }

  function closeProject(){
    currentProjectId = null;
    const url = new URL(window.location.href);
    url.searchParams.delete("id");
    window.history.pushState({}, "", url);
    document.getElementById("detailView").style.display = "none";
    document.getElementById("listView").style.display = "block";
    renderList();
  }

  function renderDetailLinks(p){
    const wrap = document.getElementById("detailLinks");
    let html = "";
    if(p.order_id){
      const kohde = p.orders && p.orders.kohde ? p.orders.kohde : "";
      const cust = p.orders && p.orders.customers && p.orders.customers.name ? p.orders.customers.name : "";
      const parts = [];
      if(cust) parts.push(escapeHtml(cust));
      if(kohde) parts.push(escapeHtml(kohde));
      const label = parts.length ? parts.join(" — ") : "Tilaus";
      html += '<div class="link-chip">🔗 <a href="tilaukset.html?id=' + p.order_id + '">' +
        label + '</a>' +
        '<button type="button" id="removeOrderLinkBtn" title="Poista tilausliitos">✕</button></div>';
    } else {
      html += '<button class="add-link-btn" id="addOrderLinkBtn">+ Liitä tilaukseen</button>';
    }
    if(p.product_group){
      html += '<div class="link-chip">🏷 ' + escapeHtml(p.product_group) + '</div>';
    }
    wrap.innerHTML = html;

    const addBtn = document.getElementById("addOrderLinkBtn");
    if(addBtn) addBtn.addEventListener("click", function(){ openLinkOrderModal(); });
    const removeBtn = document.getElementById("removeOrderLinkBtn");
    if(removeBtn) removeBtn.addEventListener("click", async function(){
      if(!confirm("Poistetaanko tilausliitos tästä aikaprojektista?")) return;
      await updateProject(p.id, { order_id: null });
    });
  }

  function segmentChipHtml(seg){
    const running = !seg.stopped_at;
    const startD = new Date(seg.started_at);
    if(running){
      return '<span class="seg-chip running" data-id="' + seg.id + '">' +
        formatSegClock(startD) + '– <span class="seg-live">käynnissä</span>' +
        '</span>';
    }
    const stopD = new Date(seg.stopped_at);
    function pad(n){ return n < 10 ? "0" + n : "" + n; }
    const stopTxt = pad(stopD.getHours()) + ":" + pad(stopD.getMinutes());
    return '<span class="seg-chip" data-id="' + seg.id + '" data-started="' + seg.started_at + '">' +
      formatSegClock(startD) + '–' + stopTxt + ' (' + formatDuration(seg.duration_seconds || 0) + ')' +
      '<button type="button" class="seg-edit-btn" data-id="' + seg.id + '" title="Muokkaa kestoa">✎</button>' +
      '<button type="button" class="seg-del-btn" data-id="' + seg.id + '" title="Poista pätkä">✕</button>' +
      '</span>';
  }

  function rowCardHtml(row){
    const running = rowIsRunning(row);
    const runningSeg = rowRunningSegment(row);
    const elapsed = rowElapsedSeconds(row);
    const segs = rowSegments(row);
    const segsHtml = segs.length
      ? '<div class="row-segments">' + segs.map(segmentChipHtml).join("") + '</div>'
      : "";
    return (
      '<div class="row-card' + (running ? " running" : "") + '" data-id="' + row.id + '">' +
        '<div class="row-line1">' +
          '<input type="text" class="row-label-input" placeholder="Nimeämätön ajanotto — kirjoita otsikko" value="' + escapeHtml(row.label || "") + '">' +
          '<span class="row-timer' + (running ? " running" : "") + '" data-base="' + rowCompletedSeconds(row) + '" data-started="' + (runningSeg ? runningSeg.started_at : "") + '">' + formatClock(elapsed) + '</span>' +
        '</div>' +
        '<div class="row-line2">' +
          '<input type="text" class="row-category-input" list="categoryOptions" placeholder="Kategoria (valinnainen — valitse tai kirjoita oma)" value="' + escapeHtml(row.category || "") + '">' +
          '<input type="text" class="row-detail-input" placeholder="Tarkennus (valinnainen)" value="' + escapeHtml(row.category_detail || "") + '">' +
          '<span class="row-saved-tick">✓ tallennettu</span>' +
          '<div class="row-actions">' +
            (running
              ? '<button class="stop-btn">⏸ Tauko</button>'
              : '<button class="resume-btn">▶ Jatka</button>') +
            '<button class="row-delete-btn">🗑</button>' +
          '</div>' +
        '</div>' +
        segsHtml +
      '</div>'
    );
  }

  function renderDetail(){
    const p = currentProject();
    if(!p){
      closeProject();
      return;
    }
    document.getElementById("detailName").textContent = p.name;
    renderDetailLinks(p);

    const rows = (p.time_project_rows || []).slice().sort(function(a, b){
      return new Date(a.created_at) - new Date(b.created_at);
    });
    const rowWrap = document.getElementById("rowList");
    if(rows.length === 0){
      rowWrap.innerHTML = '<div class="empty-state">Ei vielä ajanottoja. Paina "Aloita uusi ajanotto".</div>';
    } else {
      rowWrap.innerHTML = rows.map(rowCardHtml).join("");
      attachRowEvents(p);
    }

    renderSummary(p);
  }

  function attachRowEvents(project){
    const cards = document.querySelectorAll("#rowList .row-card");
    Array.prototype.forEach.call(cards, function(card){
      const rowId = card.getAttribute("data-id");
      const labelInput = card.querySelector(".row-label-input");
      const categoryInput = card.querySelector(".row-category-input");
      const detailInput = card.querySelector(".row-detail-input");
      const savedTick = card.querySelector(".row-saved-tick");

      function flashSaved(){
        savedTick.classList.add("show");
        setTimeout(function(){ savedTick.classList.remove("show"); }, 1500);
      }

      labelInput.addEventListener("change", async function(){
        await updateRow(rowId, { label: labelInput.value.trim() || null }, project.id);
        flashSaved();
      });
      categoryInput.addEventListener("change", async function(){
        await updateRow(rowId, { category: categoryInput.value.trim() || null }, project.id);
        flashSaved();
      });
      detailInput.addEventListener("change", async function(){
        await updateRow(rowId, { category_detail: detailInput.value.trim() || null }, project.id);
        flashSaved();
      });

      const stopBtn = card.querySelector(".stop-btn");
      if(stopBtn){
        stopBtn.addEventListener("click", async function(){
          const row = (project.time_project_rows || []).find(function(r){ return r.id === rowId; });
          const runningSeg = rowRunningSegment(row);
          if(runningSeg) await pauseSegment(runningSeg.id, runningSeg.started_at);
        });
      }

      const resumeBtn = card.querySelector(".resume-btn");
      if(resumeBtn){
        resumeBtn.addEventListener("click", async function(){
          await resumeRow(rowId);
        });
      }

      Array.prototype.forEach.call(card.querySelectorAll(".seg-edit-btn"), function(btn){
        btn.addEventListener("click", function(){
          const segId = btn.getAttribute("data-id");
          const chip = card.querySelector('.seg-chip[data-id="' + segId + '"]');
          if(chip.querySelector(".duration-edit-box")) return; // jo auki
          const row = (project.time_project_rows || []).find(function(r){ return r.id === rowId; });
          const seg = rowSegments(row).find(function(s){ return s.id === segId; });
          const currentMinutes = Math.round((seg.duration_seconds || 0) / 60 * 10) / 10;
          const box = document.createElement("div");
          box.className = "duration-edit-box";
          box.innerHTML =
            '<label>Kesto (min)</label>' +
            '<input type="number" min="0" step="0.5" value="' + currentMinutes + '">' +
            '<button class="btn btn-sm">Tallenna</button>' +
            '<button class="btn secondary btn-sm">Peruuta</button>';
          chip.appendChild(box);
          const input = box.querySelector("input");
          const saveBtn = box.querySelectorAll("button")[0];
          const cancelBtn = box.querySelectorAll("button")[1];
          saveBtn.addEventListener("click", async function(){
            const minutes = parseFloat(input.value);
            if(isNaN(minutes) || minutes < 0){
              showToast("Anna kelvollinen kesto");
              return;
            }
            const durationSeconds = Math.round(minutes * 60);
            const newStopped = new Date(new Date(seg.started_at).getTime() + durationSeconds * 1000).toISOString();
            await updateSegment(segId, { duration_seconds: durationSeconds, stopped_at: newStopped }, project.id);
            box.remove();
          });
          cancelBtn.addEventListener("click", function(){ box.remove(); });
        });
      });

      Array.prototype.forEach.call(card.querySelectorAll(".seg-del-btn"), function(btn){
        btn.addEventListener("click", async function(){
          if(!confirm("Poistetaanko tämä ajanotto-pätkä?")) return;
          await deleteSegment(btn.getAttribute("data-id"), project.id);
        });
      });

      const delBtn = card.querySelector(".row-delete-btn");
      delBtn.addEventListener("click", async function(){
        if(!confirm("Poistetaanko koko ajanotto kaikkine pätkineen?")) return;
        await deleteRow(rowId, project.id);
      });
    });
  }

  function renderSummary(project){
    const rows = project.time_project_rows || [];
    const byCategory = {};
    let total = 0;
    rows.forEach(function(r){
      const sec = rowElapsedSeconds(r);
      total += sec;
      const key = r.category || "NONE";
      byCategory[key] = (byCategory[key] || 0) + sec;
    });
    const wrap = document.getElementById("summaryBox");
    if(rows.length === 0){
      wrap.innerHTML = "";
      return;
    }
    const catRows = Object.keys(byCategory).map(function(key){
      const label = key === "NONE" ? "Ei kategoriaa" : key;
      return '<div class="summary-row"><span class="cat">' + escapeHtml(label) + '</span><span class="val">' + formatDuration(byCategory[key]) + '</span></div>';
    }).join("");
    wrap.innerHTML =
      '<h3>Yhteenveto</h3>' +
      catRows +
      '<div class="summary-total"><span>Yhteensä</span><span class="val">' + formatDuration(total) + '</span></div>';
  }

  // ---------- Live-tikitys ----------
  function tickRunningTimers(){
    Array.prototype.forEach.call(document.querySelectorAll(".row-timer.running"), function(el){
      const started = el.getAttribute("data-started");
      if(!started) return;
      const base = parseFloat(el.getAttribute("data-base") || "0");
      const elapsed = base + (Date.now() - new Date(started).getTime()) / 1000;
      el.textContent = formatClock(elapsed);
    });
    // Päivitä myös listan projektikorttien kokonaisajat jos joku on käynnissä
    if(document.getElementById("listView").style.display !== "none"){
      const anyRunning = allProjects.some(projectIsRunning);
      if(anyRunning) renderList();
    } else if(currentProjectId){
      renderSummary(currentProject());
    }
  }

  // ---------- CRUD ----------
  async function updateProject(id, patch){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(REST_PROJECTS + "?id=eq." + id, {
        method: "PATCH",
        headers: headers,
        body: JSON.stringify(patch)
      });
      if(!res.ok) throw new Error("Tallennus epäonnistui: " + res.status);
      await loadProjects();
    }catch(err){
      console.error(err);
      showToast("Tallennus epäonnistui");
    }
  }

  async function updateRow(rowId, patch, projectId){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(REST_ROWS + "?id=eq." + rowId, {
        method: "PATCH",
        headers: headers,
        body: JSON.stringify(patch)
      });
      if(!res.ok) throw new Error("Tallennus epäonnistui: " + res.status);
      await loadProjects();
    }catch(err){
      console.error(err);
      showToast("Ajanoton tallennus epäonnistui");
    }
  }

  async function deleteRow(rowId, projectId){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(REST_ROWS + "?id=eq." + rowId, {
        method: "DELETE",
        headers: headers
      });
      if(!res.ok) throw new Error("Poisto epäonnistui: " + res.status);
      await loadProjects();
    }catch(err){
      console.error(err);
      showToast("Poisto epäonnistui");
    }
  }

  // Uusi ajanotto = uusi rivi + sen ensimmäinen segmentti samalla kertaa
  async function startNewRow(projectId){
    try{
      const headers = await getAuthHeaders();
      const rowRes = await fetch(REST_ROWS, {
        method: "POST",
        headers: Object.assign({}, headers, { "Prefer": "return=representation" }),
        body: JSON.stringify({
          project_id: projectId,
          row_order: (currentProject().time_project_rows || []).length
        })
      });
      if(!rowRes.ok) throw new Error("Aloitus epäonnistui: " + rowRes.status);
      const createdRows = await rowRes.json();
      const newRowId = createdRows[0].id;
      const segRes = await fetch(REST_SEGMENTS, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ row_id: newRowId, started_at: new Date().toISOString() })
      });
      if(!segRes.ok) throw new Error("Aloitus epäonnistui: " + segRes.status);
      await loadProjects();
      showToast("Ajanotto käynnissä");
    }catch(err){
      console.error(err);
      showToast("Ajanoton aloitus epäonnistui");
    }
  }

  // Jatka aiemmin tauolle jäänyttä ajanottoa — luo uuden segmentin samalle riville
  async function resumeRow(rowId){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(REST_SEGMENTS, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ row_id: rowId, started_at: new Date().toISOString() })
      });
      if(!res.ok) throw new Error("Jatkaminen epäonnistui: " + res.status);
      await loadProjects();
      showToast("Jatketaan ajanottoa");
    }catch(err){
      console.error(err);
      showToast("Ajanoton jatkaminen epäonnistui");
    }
  }

  async function pauseSegment(segId, startedAtIso){
    try{
      const headers = await getAuthHeaders();
      const nowIso = new Date().toISOString();
      const durationSeconds = Math.max(0, Math.round((Date.now() - new Date(startedAtIso).getTime()) / 1000));
      const res = await fetch(REST_SEGMENTS + "?id=eq." + segId, {
        method: "PATCH",
        headers: headers,
        body: JSON.stringify({ stopped_at: nowIso, duration_seconds: durationSeconds })
      });
      if(!res.ok) throw new Error("Tauko epäonnistui: " + res.status);
      await loadProjects();
    }catch(err){
      console.error(err);
      showToast("Tauon tallennus epäonnistui");
    }
  }

  async function updateSegment(segId, patch, projectId){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(REST_SEGMENTS + "?id=eq." + segId, {
        method: "PATCH",
        headers: headers,
        body: JSON.stringify(patch)
      });
      if(!res.ok) throw new Error("Tallennus epäonnistui: " + res.status);
      await loadProjects();
    }catch(err){
      console.error(err);
      showToast("Pätkän tallennus epäonnistui");
    }
  }

  async function deleteSegment(segId, projectId){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(REST_SEGMENTS + "?id=eq." + segId, {
        method: "DELETE",
        headers: headers
      });
      if(!res.ok) throw new Error("Poisto epäonnistui: " + res.status);
      await loadProjects();
    }catch(err){
      console.error(err);
      showToast("Pätkän poisto epäonnistui");
    }
  }

  async function createProject(name, orderId, productGroup){
    try{
      const headers = await getAuthHeaders();
      const body = {
        name: name,
        order_id: orderId || null,
        product_group: productGroup || null,
        created_by: currentUserId
      };
      const res = await fetch(REST_PROJECTS, {
        method: "POST",
        headers: Object.assign({}, headers, { "Prefer": "return=representation" }),
        body: JSON.stringify(body)
      });
      if(!res.ok) throw new Error("Luonti epäonnistui: " + res.status);
      const created = await res.json();
      await loadProjects();
      if(created && created[0]){
        openProject(created[0].id);
      }
    }catch(err){
      console.error(err);
      showToast("Aikaprojektin luonti epäonnistui");
    }
  }

  // ---------- Tilaushaku (uudelle projektille + linkitykselle) ----------
  let orderSearchCache = [];

  async function searchOrders(query){
    const headers = await getAuthHeaders();
    const q = query.trim();
    if(!q) return [];
    const [byKohde, byCustomer] = await Promise.all([
      fetch(REST_ORDERS + "?select=id,kohde,order_date,status,customers(name)&kohde=ilike.*" + encodeURIComponent(q) + "*&order=order_date.desc&limit=8", { headers: headers }).then(function(r){ return r.ok ? r.json() : []; }),
      fetch(REST_CUSTOMERS + "?select=id,name&name=ilike.*" + encodeURIComponent(q) + "*&limit=6", { headers: headers }).then(function(r){ return r.ok ? r.json() : []; })
    ]);
    let ordersByCustomer = [];
    if(byCustomer.length > 0){
      const ids = byCustomer.map(function(c){ return c.id; }).join(",");
      ordersByCustomer = await fetch(
        REST_ORDERS + "?select=id,kohde,order_date,status,customers(name)&customer_id=in.(" + ids + ")&order=order_date.desc&limit=15",
        { headers: headers }
      ).then(function(r){ return r.ok ? r.json() : []; });
    }
    const merged = byKohde.concat(ordersByCustomer);
    const seen = {};
    const deduped = [];
    merged.forEach(function(o){
      if(!seen[o.id]){ seen[o.id] = true; deduped.push(o); }
    });
    return deduped.slice(0, 10);
  }

  function orderResultLabel(o){
    const kohde = o.kohde || "(ei kohdetta)";
    const cust = o.customers && o.customers.name ? o.customers.name : "";
    return kohde + (cust ? " — " + cust : "");
  }

  // Tilauksen tilat suomeksi (sama kuin asiakkaat.html ja tilaus.html)
  const ORDER_STATUS_FI = {
    DRAFT: "Luonnos", IN_PROGRESS: "Kesken", QUOTED: "Tarjottu", ORDERED: "Tilattu",
    IN_PRODUCTION: "Työn alla", COMPLETED: "Valmis", INVOICED: "Laskutettu", ARCHIVED: "Arkisto"
  };
  const ORDER_STATUS_CLASS = {
    DRAFT: "st-draft", ARCHIVED: "st-draft", IN_PROGRESS: "st-active", QUOTED: "st-active",
    ORDERED: "st-active", IN_PRODUCTION: "st-active", COMPLETED: "st-done", INVOICED: "st-done"
  };
  function formatDateFi(d){
    const m = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? (parseInt(m[3], 10) + "." + parseInt(m[2], 10) + "." + m[1]) : String(d || "");
  }
  function orderResultHtml(o){
    const kohde = o.kohde || "(ei kohdetta)";
    const cust = o.customers && o.customers.name ? o.customers.name : "";
    const stLabel = ORDER_STATUS_FI[o.status] || o.status || "";
    const stClass = ORDER_STATUS_CLASS[o.status] || "st-draft";
    const sub = [];
    if(cust) sub.push("<span>" + escapeHtml(cust) + "</span>");
    if(o.order_date) sub.push("<span>" + escapeHtml(formatDateFi(o.order_date)) + "</span>");
    if(stLabel) sub.push('<span class="st-chip ' + stClass + '">' + escapeHtml(stLabel) + "</span>");
    return '<div class="sd-title">' + escapeHtml(kohde) + '</div><div class="sd-sub">' + sub.join("") + '</div>';
  }

  function wireOrderSearch(searchInputId, dropdownId, hiddenId, chipId, chipTextId, chipClearId, onPick){
    const input = document.getElementById(searchInputId);
    const dropdown = document.getElementById(dropdownId);
    const hidden = document.getElementById(hiddenId);
    const chip = document.getElementById(chipId);
    const chipText = document.getElementById(chipTextId);
    const chipClear = document.getElementById(chipClearId);
    let debounceTimer = null;

    input.addEventListener("input", function(){
      clearTimeout(debounceTimer);
      const q = input.value;
      debounceTimer = setTimeout(async function(){
        if(!q.trim()){ dropdown.classList.remove("open"); dropdown.innerHTML = ""; return; }
        const results = await searchOrders(q);
        if(results.length === 0){
          dropdown.innerHTML = '<div class="search-dropdown-item">Ei osumia</div>';
        } else {
          dropdown.innerHTML = results.map(function(o){
            return '<div class="search-dropdown-item" data-id="' + o.id + '" data-label="' + escapeHtml(orderResultLabel(o)) + '">' +
              orderResultHtml(o) +
            '</div>';
          }).join("");
          Array.prototype.forEach.call(dropdown.querySelectorAll(".search-dropdown-item[data-id]"), function(item){
            item.addEventListener("click", function(){
              hidden.value = item.getAttribute("data-id");
              chipText.textContent = item.getAttribute("data-label");
              input.value = "";
              dropdown.classList.remove("open");
              dropdown.innerHTML = "";
              if(typeof onPick === "function"){
                // Yhden napautuksen valinta: ei erillistä chip-esikatselua
                onPick(item.getAttribute("data-id"), item.getAttribute("data-label"));
                return;
              }
              chip.style.display = "flex";
            });
          });
        }
        dropdown.classList.add("open");
      }, 250);
    });

    chipClear.addEventListener("click", function(){
      hidden.value = "";
      chip.style.display = "none";
    });

    document.addEventListener("click", function(e){
      if(!input.contains(e.target) && !dropdown.contains(e.target)){
        dropdown.classList.remove("open");
      }
    });
  }

  // ---------- Uusi aikaprojekti -modaali ----------
  function openNewProjectModal(){
    document.getElementById("npName").value = "";
    document.getElementById("npOrderSearch").value = "";
    document.getElementById("npOrderId").value = "";
    document.getElementById("npOrderChip").style.display = "none";
    document.getElementById("npProductGroup").value = "";
    document.getElementById("newProjectOverlay").classList.add("open");
    document.getElementById("npName").focus();
  }
  function closeNewProjectModal(){
    document.getElementById("newProjectOverlay").classList.remove("open");
  }

  // ---------- Liitä tilaukseen -modaali (olemassa olevalle projektille) ----------
  function openLinkOrderModal(){
    document.getElementById("loOrderSearch").value = "";
    document.getElementById("loOrderId").value = "";
    document.getElementById("loOrderChip").style.display = "none";
    document.getElementById("linkOrderOverlay").classList.add("open");
  }
  function closeLinkOrderModal(){
    document.getElementById("linkOrderOverlay").classList.remove("open");
  }

  // ---------- Nimen muokkaus ----------
  function enableNameEdit(){
    const p = currentProject();
    if(!p) return;
    const heading = document.getElementById("detailName");
    const input = document.createElement("input");
    input.type = "text";
    input.className = "detail-name-input";
    input.value = p.name;
    heading.replaceWith(input);
    input.focus();
    input.select();
    async function commit(){
      const newName = input.value.trim();
      if(newName && newName !== p.name){
        await updateProject(p.id, { name: newName });
      } else {
        renderDetail();
      }
    }
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter") input.blur();
      if(e.key === "Escape"){ input.value = p.name; input.blur(); }
    });
  }

  // ---------- URL-deeplink ----------
  function openProjectFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if(id){
      currentProjectId = id;
      document.getElementById("listView").style.display = "none";
      document.getElementById("detailView").style.display = "block";
      renderDetail();
    }
  }

  // ---------- Init ----------
  document.getElementById("newProjectBtn").addEventListener("click", openNewProjectModal);
  document.getElementById("npCancelBtn").addEventListener("click", closeNewProjectModal);
  document.getElementById("npSaveBtn").addEventListener("click", function(){
    const name = document.getElementById("npName").value.trim();
    if(!name){ showToast("Anna aikaprojektille nimi"); return; }
    const orderId = document.getElementById("npOrderId").value || null;
    const productGroup = document.getElementById("npProductGroup").value.trim() || null;
    closeNewProjectModal();
    createProject(name, orderId, productGroup);
  });
  wireOrderSearch("npOrderSearch", "npOrderDropdown", "npOrderId", "npOrderChip", "npOrderChipText", "npOrderChipClear");

  document.getElementById("loCancelBtn").addEventListener("click", closeLinkOrderModal);
  document.getElementById("loSaveBtn").addEventListener("click", async function(){
    const orderId = document.getElementById("loOrderId").value;
    if(!orderId){ showToast("Valitse tilaus listasta"); return; }
    closeLinkOrderModal();
    await updateProject(currentProjectId, { order_id: orderId });
  });
  wireOrderSearch("loOrderSearch", "loOrderDropdown", "loOrderId", "loOrderChip", "loOrderChipText", "loOrderChipClear", async function(orderId){
    // Yksi napautus riittää: valittu tilaus liitetään heti projektiin
    closeLinkOrderModal();
    await updateProject(currentProjectId, { order_id: orderId });
  });

  document.getElementById("backBtn").addEventListener("click", closeProject);
  document.getElementById("editNameBtn").addEventListener("click", enableNameEdit);
  document.getElementById("startRowBtn").addEventListener("click", function(){
    startNewRow(currentProjectId);
  });

  Array.prototype.forEach.call(document.querySelectorAll(".filter-tab"), function(tab){
    tab.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll(".filter-tab"), function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      currentFilter = tab.getAttribute("data-filter");
      renderList();
    });
  });

  function fillCategoryDatalist(){
    const dl = document.getElementById("categoryOptions");
    dl.innerHTML = PRESET_CATEGORIES.map(function(c){ return '<option value="' + c + '">'; }).join("");
  }

  window._authReady.then(async function(){
    currentUserId = await getCurrentUserId();
    fillCategoryDatalist();
    await loadProjects();
    await loadProductGroupSuggestions();
    openProjectFromUrl();
    tickTimer = setInterval(tickRunningTimers, 1000);
  });

})();
</script>
