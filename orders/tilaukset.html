<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilaukset — Kalajoen Peltityö</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root {
    --bg: #1e2a30;
    --panel: #253035;
    --panel2: #2e3a40;
    --border: #3a5060;
    --accent: #0ea5e9;
    --accent-dim: #0284c7;
    --accent-glow: rgba(14,165,233,0.12);
    --text: #ededf0;
    --text-dim: #9595a0;
    --input-bg: #2a3840;
    --success: #3dba6e;
    --danger: #e84040;
    --warn: #e8a020;
    --violet: #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }

  /* HEADER */
  header {
    background: #16222a;
    border-bottom: 2px solid var(--accent);
    padding: 10px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 500; color: var(--text); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  /* NAV */
  .nav-menu-wrap { position: relative; }
  .nav-btn {
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; letter-spacing: 0.04em;
  }
  .nav-btn:hover { background: var(--input-bg); }
  .nav-dropdown {
    display: none; position: absolute; top: calc(100% + 6px); left: 0;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; min-width: 200px; z-index: 999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); overflow: hidden;
  }
  .nav-dropdown.open { display: block; }
  .nav-section-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); padding: 8px 14px 4px;
  }
  .nav-item {
    display: block; padding: 8px 14px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: var(--text); text-decoration: none; transition: background 0.1s;
  }
  .nav-item:hover { background: var(--accent-glow); color: var(--accent); }
  .nav-item.current { color: var(--accent); font-weight: 600; }
  .nav-item.external::after { content: ' ↗'; opacity: 0.6; font-size: 11px; }
  .nav-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  /* SISÄLTÖ */
  .page { padding: 20px 24px; max-width: 1400px; }

  /* YHTEENVETO-KORTIT */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .summary-card:hover { border-color: var(--accent); }
  .summary-card.active { border-color: var(--accent); background: var(--accent-glow); }
  .summary-card .card-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .summary-card .card-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 24px; font-weight: 600;
    line-height: 1;
  }

  /* SUODATINPALKKI */
  .filter-bar {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.06em; white-space: nowrap;
  }
  .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .fbtn {
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; padding: 4px 10px; border-radius: 3px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .fbtn:hover { border-color: var(--accent); color: var(--text); }
  .fbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .fbtn.archive-btn.active { background: var(--text-dim); border-color: var(--text-dim); color: #1a1a1a; }
  .filter-search {
    background: var(--input-bg); border: 1px solid var(--border);
    color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; padding: 5px 10px; border-radius: 3px;
    width: 200px;
  }
  .filter-search:focus { outline: none; border-color: var(--accent); }
  .filter-search::placeholder { color: var(--text-dim); }

  /* TAULUKKO */
  .orders-table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .orders-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .orders-table thead tr {
    background: var(--panel2);
  }
  .orders-table th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim);
    padding: 10px 14px; text-align: left;
    border-bottom: 1px solid var(--border);
    cursor: pointer; white-space: nowrap; user-select: none;
  }
  .orders-table th:hover { color: var(--text); }
  .orders-table th.sorted { color: var(--accent); }
  .sort-arrow { margin-left: 4px; opacity: 0.6; }
  .orders-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .orders-table tr:last-child td { border-bottom: none; }
  .orders-table tbody tr {
    cursor: pointer;
    transition: background 0.1s;
  }
  .orders-table tbody tr:hover { background: var(--accent-glow); }
  .orders-table tbody tr td:first-child {
    border-left: 3px solid transparent;
    padding-left: 11px;
  }

  /* Korostus kun tilaus avataan suoralinkillä (esim. kalenterista) */
  .orders-table tbody tr.highlight-target {
    animation: highlightPulse 1.5s ease-in-out 2;
  }
  @keyframes highlightPulse {
    0%, 100% { background: transparent; }
    50% { background: var(--accent-glow); }
  }

  /* Reunaviivan väri statuksen mukaan */
  tr.s-draft td:first-child   { border-left-color: var(--border); }
  tr.s-active td:first-child   { border-left-color: var(--accent); }
  tr.s-quoted td:first-child   { border-left-color: var(--violet); }
  tr.s-ordered td:first-child  { border-left-color: var(--accent); }
  tr.s-production td:first-child { border-left-color: var(--warn); }
  tr.s-done td:first-child     { border-left-color: var(--success); }
  tr.s-invoiced td:first-child { border-left-color: var(--success); }
  tr.s-archived td:first-child { border-left-color: #444; }

  /* STATUS-BADGE */
  .badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 3px;
    white-space: nowrap;
  }
  .badge-draft     { background: #333340; color: var(--text-dim); }
  .badge-active    { background: #0e2535; color: var(--accent); }
  .badge-quoted    { background: #1e1535; color: var(--violet); }
  .badge-ordered   { background: #0e2535; color: var(--accent); }
  .badge-production { background: #2a2010; color: var(--warn); }
  .badge-done      { background: #1a3028; color: var(--success); }
  .badge-invoiced  { background: #1a3028; color: var(--success); }
  .badge-archived  { background: #2a2a2a; color: #666; }

  /* Statuksen muutospudotusvalikko listassa */
  .status-wrap { position: relative; display: inline-block; cursor: pointer; }
  .status-menu {
    display: none; position: fixed;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 5px; z-index: 500;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5); min-width: 130px; overflow: hidden;
  }
  .status-menu.open { display: block; }
  .status-item {
    padding: 8px 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    cursor: pointer; color: var(--text);
    transition: background 0.1s;
  }
  .status-item:hover { background: var(--accent-glow); color: var(--accent); }

  .customer-name { font-weight: 500; color: var(--text); }
  .order-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .order-kohde { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); }
  .order-arrow { color: var(--border); font-size: 16px; }
  .copy-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; padding: 3px 8px; border-radius: 3px; cursor: pointer;
    white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .orders-table tbody tr:hover .order-arrow { color: var(--accent); }

  /* FOOTER */
  .table-footer {
    background: var(--panel2);
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--text-dim);
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-dim); font-size: 13px;
  }

  /* NAPIT */
  .btn {
    padding: 8px 14px; border: none; border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: 0.04em;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dim); }

  /* MOBIILI */
  @media (max-width: 700px) {
    .page { padding: 12px; }
    .summary-row { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .summary-card .card-number { font-size: 18px; }
    .col-kohde, .col-delivery { display: none; }
    .filter-search { width: 100%; }
  }

    /* Valikko mahtuu ruudulle: pitkä lista vierittyy (17.11.2026) */
    #navDropdown, #navDropdownLasku { max-height: calc(100vh - 90px); overflow-y: auto; }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
</head>
<body>

<header>
  <div class="logo-img" style="height:50px;display:flex;align-items:center"><img src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="147" height="50" style="height:50px;width:auto;display:block"></div>
  <div class="nav-menu-wrap">
    <button class="nav-btn" onclick="toggleNav(event)">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=5"></script>
  </div>
  <h1>Tilaukset</h1>
  <div class="header-right">
    <button class="btn btn-primary" onclick="uusiTilaus()">+ Uusi tilaus</button>
  </div>
</header>

<div class="page">

  <!-- YHTEENVETO-KORTIT -->
  <div class="summary-row" id="summaryRow">
    <div class="summary-card active" onclick="setFilter('active')" id="card-active">
      <div class="card-label">Aktiiviset</div>
      <div class="card-number" id="cnt-active" style="color:var(--accent)">—</div>
    </div>
    <div class="summary-card" onclick="setFilter('draft')" id="card-draft">
      <div class="card-label">Luonnokset</div>
      <div class="card-number" id="cnt-draft" style="color:var(--text-dim)">—</div>
    </div>
    <div class="summary-card" onclick="setFilter('invoiced')" id="card-invoiced">
      <div class="card-label">Laskutettu</div>
      <div class="card-number" id="cnt-invoiced" style="color:var(--success)">—</div>
    </div>
    <div class="summary-card" onclick="setFilter('archived')" id="card-archived">
      <div class="card-label">Arkisto</div>
      <div class="card-number" id="cnt-archived" style="color:var(--text-dim)">—</div>
    </div>
    <div class="summary-card" onclick="setFilter('all')" id="card-all">
      <div class="card-label">Kaikki</div>
      <div class="card-number" id="cnt-all" style="color:var(--text)">—</div>
    </div>
  </div>

  <!-- SUODATINPALKKI -->
  <div class="filter-bar">
    <span class="filter-label">STATUS:</span>
    <div class="filter-btns" id="statusBtns">
      <button class="fbtn active" onclick="setStatusBtn(this,'active')"   data-filter="active">Aktiiviset</button>
      <button class="fbtn"        onclick="setStatusBtn(this,'IN_PROGRESS')" data-filter="IN_PROGRESS">Kesken</button>
      <button class="fbtn"        onclick="setStatusBtn(this,'QUOTED')"    data-filter="QUOTED">Tarjottu</button>
      <button class="fbtn"        onclick="setStatusBtn(this,'ORDERED')"   data-filter="ORDERED">Tilattu</button>
      <button class="fbtn"        onclick="setStatusBtn(this,'IN_PRODUCTION')" data-filter="IN_PRODUCTION">Työn alla</button>
      <button class="fbtn"        onclick="setStatusBtn(this,'COMPLETED')" data-filter="COMPLETED">Valmis</button>
      <button class="fbtn"        onclick="setStatusBtn(this,'INVOICED')"  data-filter="INVOICED">Laskutettu</button>
      <button class="fbtn"        onclick="setStatusBtn(this,'DRAFT')"     data-filter="DRAFT">Luonnos</button>
      <button class="fbtn archive-btn" onclick="setStatusBtn(this,'ARCHIVED')" data-filter="ARCHIVED">Arkisto</button>
      <button class="fbtn"        onclick="setStatusBtn(this,'all')"       data-filter="all">Kaikki</button>
    </div>
    <input type="text" class="filter-search" id="searchInput"
           placeholder="Hae asiakasta..." oninput="applyFilters()">
  </div>

  <!-- TAULUKKO -->
  <div class="orders-table-wrap">
    <table class="orders-table">
      <thead>
        <tr>
          <th onclick="sortBy('order_date')" id="th-date">
            Pvm <span class="sort-arrow" id="sa-date">↓</span>
          </th>
          <th onclick="sortBy('customer')" id="th-customer">
            Asiakas <span class="sort-arrow" id="sa-customer"></span>
          </th>
          <th class="col-kohde" onclick="sortBy('kohde')" id="th-kohde">
            Kohde <span class="sort-arrow" id="sa-kohde"></span>
          </th>
          <th onclick="sortBy('status')" id="th-status">
            Status <span class="sort-arrow" id="sa-status"></span>
          </th>
          <th class="col-delivery" onclick="sortBy('delivery_date')" id="th-delivery">
            Toimitus <span class="sort-arrow" id="sa-delivery"></span>
          </th>
          <th style="width:80px;"></th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="6" class="empty-state">Ladataan...</td></tr>
      </tbody>
    </table>
    <div class="table-footer">
      <span id="footerCount">—</span>
      <span id="footerInfo" style="color:var(--text-dim);font-size:10px;"></span>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://hjyeugeqmyavxisndlwp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4';

const STATUS_FI = {
  DRAFT: 'Luonnos', IN_PROGRESS: 'Kesken', QUOTED: 'Tarjottu',
  ORDERED: 'Tilattu', IN_PRODUCTION: 'Työn alla',
  COMPLETED: 'Valmis', INVOICED: 'Laskutettu', ARCHIVED: 'Arkisto'
};
const STATUS_CLASS = {
  DRAFT: 'draft', IN_PROGRESS: 'active', QUOTED: 'quoted',
  ORDERED: 'ordered', IN_PRODUCTION: 'production',
  COMPLETED: 'done', INVOICED: 'invoiced', ARCHIVED: 'archived'
};
const ACTIVE_STATUSES = ['IN_PROGRESS','QUOTED','ORDERED','IN_PRODUCTION','COMPLETED'];

let allOrders = [];
let currentFilter = 'active';
let currentSearch = '';
let sortField = 'order_date';
let sortDir = 'desc';

async function loadOrders() {
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/orders?select=id,order_date,delivery_date,status,kohde,notes,customer_id,customers(name,customer_number)&order=order_date.desc`,
    { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
  );
  allOrders = await r.json();
  updateCounts();
  applyFilters();
}

function updateCounts() {
  const active = allOrders.filter(o => ACTIVE_STATUSES.includes(o.status)).length;
  const draft   = allOrders.filter(o => o.status === 'DRAFT').length;
  const inv     = allOrders.filter(o => o.status === 'INVOICED').length;
  const arch    = allOrders.filter(o => o.status === 'ARCHIVED').length;
  document.getElementById('cnt-active').textContent   = active;
  document.getElementById('cnt-draft').textContent    = draft;
  document.getElementById('cnt-invoiced').textContent = inv;
  document.getElementById('cnt-archived').textContent = arch;
  document.getElementById('cnt-all').textContent      = allOrders.length;
}

function setFilter(f) {
  currentFilter = f;
  // Synkronoi summary-kortit
  document.querySelectorAll('.summary-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + f);
  if (card) card.classList.add('active');
  // Synkronoi status-napit
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.fbtn[data-filter="${f}"]`);
  if (btn) btn.classList.add('active');
  applyFilters();
}

function setStatusBtn(btn, f) {
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Synkronoi summary-kortit
  document.querySelectorAll('.summary-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + f);
  if (card) card.classList.add('active');
  applyFilters();
}

function applyFilters() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase();
  let rows = allOrders.filter(o => {
    // Status-suodatus
    if (currentFilter === 'active')   return ACTIVE_STATUSES.includes(o.status);
    if (currentFilter === 'all')      return true;
    if (currentFilter === 'draft')    return o.status === 'DRAFT';
    if (currentFilter === 'invoiced') return o.status === 'INVOICED';
    if (currentFilter === 'archived') return o.status === 'ARCHIVED';
    return o.status === currentFilter;
  });
  // Hakusuodatus
  if (currentSearch) {
    rows = rows.filter(o => {
      const name = (o.customers?.name || '').toLowerCase();
      const kohde = (o.kohde || '').toLowerCase();
      const notes = (o.notes || '').toLowerCase();
      return name.includes(currentSearch) || kohde.includes(currentSearch) || notes.includes(currentSearch);
    });
  }
  // Lajittelu
  rows.sort((a, b) => {
    let va, vb;
    if (sortField === 'order_date')    { va = a.order_date || ''; vb = b.order_date || ''; }
    else if (sortField === 'delivery_date') { va = a.delivery_date || ''; vb = b.delivery_date || ''; }
    else if (sortField === 'customer') { va = a.customers?.name || ''; vb = b.customers?.name || ''; }
    else if (sortField === 'kohde')    { va = a.kohde || ''; vb = b.kohde || ''; }
    else if (sortField === 'status')   { va = a.status || ''; vb = b.status || ''; }
    else { va = ''; vb = ''; }
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return sortDir === 'asc' ? cmp : -cmp;
  });
  renderTable(rows);
}

function sortBy(field) {
  if (sortField === field) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
  else { sortField = field; sortDir = field === 'order_date' ? 'desc' : 'asc'; }
  // Päivitä nuolet
  ['date','customer','kohde','status','delivery'].forEach(k => {
    document.getElementById('sa-' + k).textContent = '';
  });
  const fieldMap = { order_date:'date', customer:'customer', kohde:'kohde', status:'status', delivery_date:'delivery' };
  const el = document.getElementById('sa-' + fieldMap[field]);
  if (el) el.textContent = sortDir === 'asc' ? '↑' : '↓';
  document.querySelectorAll('.orders-table th').forEach(t => t.classList.remove('sorted'));
  const th = document.getElementById('th-' + fieldMap[field]);
  if (th) th.classList.add('sorted');
  applyFilters();
}

function renderTable(rows) {
  const tbody = document.getElementById('ordersBody');
  document.getElementById('footerCount').textContent =
    rows.length === 0 ? 'Ei tilauksia' : `${rows.length} tilausta`;

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Ei tilauksia valituilla suodattimilla</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(o => {
    const cls  = STATUS_CLASS[o.status] || 'draft';
    const fi   = STATUS_FI[o.status] || o.status;
    const date = (o.order_date || '').slice(0, 10).split('-').reverse().join('.');
    const deliv = o.delivery_date ? o.delivery_date.slice(0,10).split('-').reverse().join('.') : '—';
    const name  = o.customers?.name || '<span style="color:var(--text-dim)">— ei asiakasta —</span>';
    const kohde = o.kohde || '<span style="color:var(--border)">—</span>';
    return `<tr id="order-row-${o.id}" class="s-${cls}" onclick="openOrder('${o.id}')">
      <td class="order-date">${date}</td>
      <td class="customer-name">${name}</td>
      <td class="col-kohde order-kohde">${kohde}</td>
      <td onclick="event.stopPropagation()">
        <div class="status-wrap">
          <span class="badge badge-${cls}" onclick="toggleStatusMenu('${o.id}', event)">${fi}</span>
          <div class="status-menu" id="status-menu-${o.id}">
            <div class="status-item" onclick="setOrderStatus('${o.id}','DRAFT')">Luonnos</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','IN_PROGRESS')">Kesken</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','QUOTED')">Tarjottu</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','ORDERED')">Tilattu</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','IN_PRODUCTION')">Työn alla</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','COMPLETED')">Valmis</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','INVOICED')">Laskutettu</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','ARCHIVED')">Arkisto</div>
          </div>
        </div>
      </td>
      <td class="col-delivery order-date">${deliv}</td>
      <td style="white-space:nowrap;display:flex;gap:6px;align-items:center;">
        <button class="copy-btn" onclick="event.stopPropagation(); kopioi('${o.id}')" title="Kopioi uudeksi tilaukseksi">⧉ Kopioi</button>
        <span class="order-arrow">›</span>
      </td>
    </tr>`;
  }).join('');
}

function openOrder(id) {
  localStorage.setItem('openOrderId', id);
  window.location.href = 'tilaus.html';
}

function kopioi(id) {
  localStorage.setItem('copyOrderId', id);
  localStorage.setItem('copyKeepCustomer', 'false');
  window.location.href = 'tilaus.html';
}

function uusiTilaus() {
  window.location.href = 'tilaus.html';
}

function toggleNav(e) {
  e.stopPropagation();
  document.getElementById('navDropdown').classList.toggle('open');
}

// ── Statuksen muutospudotusvalikko listassa ──
function toggleStatusMenu(id, e) {
  e.stopPropagation();
  const menu = document.getElementById('status-menu-' + id);
  const wasOpen = menu.classList.contains('open');

  // Suljetaan kaikki muut mahdollisesti auki olevat valikot ensin
  document.querySelectorAll('.status-menu').forEach(m => m.classList.remove('open'));

  if (!wasOpen) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const menuH = 8 * 37; // arvio valikon korkeudesta (8 vaihtoehtoa × ~37px/rivi)
    const goUp = rect.bottom + menuH > window.innerHeight - 8;

    menu.style.left = rect.left + 'px';
    if (goUp) {
      // Ei tarpeeksi tilaa alapuolella → avataan ylöspäin ettei valikko jää ruudun ulkopuolelle
      menu.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
      menu.style.top = 'auto';
    } else {
      menu.style.top = (rect.bottom + 4) + 'px';
      menu.style.bottom = 'auto';
    }
    menu.classList.add('open');
  }
}

async function setOrderStatus(id, newStatus) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json', Prefer: 'return=representation'
      },
      body: JSON.stringify({ status: newStatus })
    });
    if (!res.ok) throw new Error('Tallennus epäonnistui: ' + res.status);

    // Päivitetään paikallinen tieto ja piirretään taulukko uudelleen ilman
    // koko listan hakemista uudelleen palvelimelta — nopeampaa ja sulavampaa.
    const o = allOrders.find(x => x.id === id);
    if (o) o.status = newStatus;
    updateCounts();
    applyFilters();
  } catch (err) {
    console.error(err);
    alert('Statuksen päivitys epäonnistui. Yritä uudelleen.');
  } finally {
    document.querySelectorAll('.status-menu').forEach(m => m.classList.remove('open'));
  }
}

document.addEventListener('click', () => {
  document.getElementById('navDropdown').classList.remove('open');
  document.querySelectorAll('.status-menu').forEach(m => m.classList.remove('open'));
});

// ── Suora linkitys yhteen tilaukseen tai valmiiksi suodatettuna (esim. etusivulta/kalenterista) ──
// Käyttö A: tilaukset.html?id=<tilauksen id>        → näyttää yhden tilauksen, korostaa sen
// Käyttö B: tilaukset.html?filter=DRAFT              → avaa listan valmiiksi suodatettuna
//           (kelpaavat arvot: samat kuin fbtn-nappien data-filter, esim. DRAFT, QUOTED,
//           ORDERED, IN_PRODUCTION, COMPLETED, INVOICED, ARCHIVED, active, all)
function focusOrderFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const targetId = params.get('id');
  const filterParam = params.get('filter');

  if (targetId) {
    // Varmistetaan että rivi näkyy suodattimesta riippumatta
    setFilter('all');
    document.getElementById('searchInput').value = '';
    applyFilters();

    setTimeout(function () {
      const row = document.getElementById('order-row-' + targetId);
      if (!row) return;
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('highlight-target');
      setTimeout(function () {
        row.classList.remove('highlight-target');
      }, 3000);
    }, 150);
    return;
  }

  if (filterParam) {
    setFilter(filterParam);
  }
}

loadOrders().then(focusOrderFromUrl);
</script>
