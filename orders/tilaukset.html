<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilaukset — Kalajoen Peltityö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<!-- Ulkoasuremontti R4a (26.11.2026): uusi ulkoasu (tyyli.css + teema.js). Tila-suodatin tiiviinä nappina, joka avaa
     valinnat (Tomi 26.11.: suodatinpalkki vei puhelimella paljon tilaa, kuten Peltilistojen mallinvalitsin), luvut
     valinnoissa. Puhelimella taulukon rivit kortteina. Sivun omissa tyyleissä vain --kpt-muuttujia. -->
<link rel="stylesheet" href="tyyli.css?v=2">
<script src="teema.js?v=1"></script>
<style>
  :root, html[data-teema] {
    --t-luonnos: var(--kpt-himmea); --t-kesken: var(--kpt-v-tilaukset); --t-tarjottu: var(--kpt-v-ajat);
    --t-tilattu: var(--kpt-v-tilaukset); --t-tyon-alla: var(--kpt-huom); --t-valmis: var(--kpt-ok);
    --t-laskutettu: var(--kpt-ok); --t-arkisto: var(--kpt-heikko);
  }

  /* Yhteenveto (tietokoneella): napautus suodattaa */
  .summary-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .summary-card {
    background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna); border-radius: var(--kpt-pyoristys);
    padding: 12px 16px; cursor: pointer; transition: border-color .15s;
  }
  .summary-card:hover { border-color: var(--kpt-korostus); }
  .summary-card.active { border-color: var(--kpt-korostus); background: var(--kpt-korostus-tausta); }
  .summary-card .card-label { font-family: var(--kpt-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--kpt-himmea); margin-bottom: 6px; }
  .summary-card .card-number { font-family: var(--kpt-mono); font-size: 24px; font-weight: 600; line-height: 1; color: var(--kpt-teksti); }
  #cnt-active { color: var(--kpt-korostus); }
  #cnt-invoiced { color: var(--kpt-ok); }
  #cnt-draft, #cnt-archived { color: var(--kpt-himmea); }

  /* Tila-valitsin ja haku */
  .tyokalut { position: relative; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .tila-nappi {
    display: inline-flex; align-items: center; gap: 10px; min-height: 42px; padding: 6px 14px; cursor: pointer;
    background: var(--kpt-korostus); border: 1px solid var(--kpt-korostus); border-radius: 8px;
    color: var(--kpt-teksti-korostuksella); font: 600 15px var(--kpt-fontti);
  }
  .tila-nappi .otsikko { font-weight: 400; opacity: .85; }
  .tila-nappi .maara { font-family: var(--kpt-mono); font-size: 13px; opacity: .85; }
  .tila-nuoli { font-size: 12px; transition: transform .15s; }
  .tila-nappi[aria-expanded="true"] .tila-nuoli { transform: rotate(180deg); }
  .tila-paneeli {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; width: min(560px, 100%);
    padding: 12px; background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna2); border-radius: 10px;
    box-shadow: var(--kpt-varjo);
  }
  .tila-paneeli[hidden] { display: none; }
  .filter-btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .fbtn {
    --v: var(--kpt-himmea);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 6px 12px;
    background: var(--kpt-kentta); border: 1px solid var(--kpt-reuna); border-left: 3px solid var(--v); border-radius: 6px;
    color: var(--kpt-teksti); font: 500 14px var(--kpt-fontti); cursor: pointer; text-align: left;
  }
  .fbtn:hover { border-color: var(--kpt-korostus); border-left-color: var(--v); }
  .fbtn.active { background: var(--kpt-korostus-tausta); border-color: var(--kpt-korostus); border-left-color: var(--v); font-weight: 600; }
  .fbtn .maara { font-family: var(--kpt-mono); font-size: 12.5px; color: var(--kpt-himmea); }
  .fbtn[data-filter="active"], .fbtn[data-filter="all"] { --v: var(--kpt-korostus); }
  .fbtn[data-filter="DRAFT"] { --v: var(--t-luonnos); }
  .fbtn[data-filter="IN_PROGRESS"] { --v: var(--t-kesken); }
  .fbtn[data-filter="QUOTED"] { --v: var(--t-tarjottu); }
  .fbtn[data-filter="ORDERED"] { --v: var(--t-tilattu); }
  .fbtn[data-filter="IN_PRODUCTION"] { --v: var(--t-tyon-alla); }
  .fbtn[data-filter="COMPLETED"] { --v: var(--t-valmis); }
  .fbtn[data-filter="INVOICED"] { --v: var(--t-laskutettu); }
  .fbtn[data-filter="ARCHIVED"] { --v: var(--t-arkisto); }
  .filter-search {
    flex: 1 1 220px; max-width: 360px; min-height: 42px; padding: 8px 12px;
    background: var(--kpt-kentta); border: 1px solid var(--kpt-reuna); border-radius: 8px;
    color: var(--kpt-teksti); font: 14px var(--kpt-fontti);
  }
  .filter-search:focus { outline: none; border-color: var(--kpt-korostus); box-shadow: 0 0 0 3px var(--kpt-korostus-tausta); }
  .filter-search::placeholder { color: var(--kpt-heikko); }

  /* Taulukko */
  .orders-table-wrap { background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna); border-radius: var(--kpt-pyoristys); overflow: hidden; }
  .orders-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .orders-table th {
    font-family: var(--kpt-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--kpt-himmea); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--kpt-reuna);
    cursor: pointer; white-space: nowrap; user-select: none;
  }
  .orders-table th:hover { color: var(--kpt-teksti); }
  .orders-table th.sorted { color: var(--kpt-korostus); }
  .sort-arrow { margin-left: 4px; opacity: .6; }
  .orders-table td { padding: 10px 14px; border-bottom: 1px solid var(--kpt-reuna); vertical-align: middle; }
  .orders-table tr:last-child td { border-bottom: none; }
  .orders-table tbody tr { cursor: pointer; transition: background .1s; }
  .orders-table tbody tr:hover { background: var(--kpt-korostus-tausta); }
  .orders-table tbody tr td:first-child { border-left: 3px solid transparent; padding-left: 11px; }
  .orders-table tbody tr.highlight-target { animation: highlightPulse 1.5s ease-in-out 2; }
  @keyframes highlightPulse { 0%, 100% { background: transparent; } 50% { background: var(--kpt-korostus-tausta); } }
  tr.s-draft td:first-child      { border-left-color: var(--t-luonnos); }
  tr.s-active td:first-child     { border-left-color: var(--t-kesken); }
  tr.s-quoted td:first-child     { border-left-color: var(--t-tarjottu); }
  tr.s-ordered td:first-child    { border-left-color: var(--t-tilattu); }
  tr.s-production td:first-child { border-left-color: var(--t-tyon-alla); }
  tr.s-done td:first-child       { border-left-color: var(--t-valmis); }
  tr.s-invoiced td:first-child   { border-left-color: var(--t-laskutettu); }
  tr.s-archived td:first-child   { border-left-color: var(--t-arkisto); }

  /* Tilan merkki (napautus avaa tilan vaihdon) */
  .badge {
    --v: var(--kpt-himmea);
    display: inline-block; font-family: var(--kpt-mono); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 5px;
    white-space: nowrap; color: var(--v); background: color-mix(in srgb, var(--v) 15%, transparent); border: 1px solid color-mix(in srgb, var(--v) 35%, transparent);
  }
  .badge-draft { --v: var(--t-luonnos); }  .badge-active { --v: var(--t-kesken); }  .badge-quoted { --v: var(--t-tarjottu); }
  .badge-ordered { --v: var(--t-tilattu); }  .badge-production { --v: var(--t-tyon-alla); }  .badge-done { --v: var(--t-valmis); }
  .badge-invoiced { --v: var(--t-laskutettu); }  .badge-archived { --v: var(--t-arkisto); }
  .status-wrap { position: relative; display: inline-block; cursor: pointer; }
  .status-menu {
    display: none; position: fixed; z-index: 500; min-width: 150px; overflow: hidden;
    background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna2); border-radius: 8px; box-shadow: var(--kpt-varjo);
  }
  .status-menu.open { display: block; }
  .status-item { padding: 9px 14px; font-size: 14px; cursor: pointer; color: var(--kpt-teksti); }
  .status-item:hover { background: var(--kpt-korostus-tausta); color: var(--kpt-korostus); }

  .customer-name { font-weight: 500; color: var(--kpt-teksti); }
  .order-date { font-family: var(--kpt-mono); font-size: 12.5px; color: var(--kpt-himmea); white-space: nowrap; }
  .order-kohde { font-size: 13.5px; color: var(--kpt-himmea); }
  .order-arrow { color: var(--kpt-heikko); font-size: 16px; }
  .orders-table tbody tr:hover .order-arrow { color: var(--kpt-korostus); }
  .copy-btn {
    background: none; border: 1px solid var(--kpt-reuna); color: var(--kpt-himmea); font-family: var(--kpt-mono);
    font-size: 11px; padding: 5px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--kpt-korostus); color: var(--kpt-korostus); }
  .table-footer {
    border-top: 1px solid var(--kpt-reuna); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
    font-family: var(--kpt-mono); font-size: 11.5px; color: var(--kpt-himmea);
  }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--kpt-himmea); font-size: 14px; }
  .ei-asiakasta, .ei-kohdetta { color: var(--kpt-heikko); }

  /* Puhelin: yhteenveto pois (luvut ovat tila-valinnoissa), rivit kortteina, joten mitään ei tarvitse vierittää sivuttain */
  @media (max-width: 700px) {
    .summary-row { display: none; }
    .filter-search { max-width: none; font-size: 16px; }
    .tila-paneeli { width: 100%; }
    .filter-btns { grid-template-columns: 1fr 1fr; }
    .orders-table thead { display: none; }
    .orders-table, .orders-table tbody { display: block; }
    .orders-table tbody tr {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; row-gap: 2px;
      grid-template-areas: "asiakas tila" "kohde tila" "pvm kopio";
      padding: 10px 12px 10px 11px; border-bottom: 1px solid var(--kpt-reuna); border-left: 3px solid transparent;
    }
    .orders-table tbody tr:last-child { border-bottom: none; }
    .orders-table td { padding: 0 !important; border: none !important; display: block; }
    .orders-table td:nth-child(1) { grid-area: pvm; align-self: center; }
    .orders-table td:nth-child(2) { grid-area: asiakas; font-size: 15px; }
    .orders-table td:nth-child(3) { grid-area: kohde; }
    .orders-table td:nth-child(4) { grid-area: tila; align-self: start; justify-self: end; }
    .orders-table td:nth-child(5) { display: none; }
    .orders-table td:nth-child(6) { grid-area: kopio; justify-self: end; display: flex !important; }
    .orders-table td[colspan] { grid-column: 1 / -1; }
    .orders-table .col-kohde { display: block; }
    tr.s-draft { border-left-color: var(--t-luonnos) !important; }  tr.s-active { border-left-color: var(--t-kesken) !important; }
    tr.s-quoted { border-left-color: var(--t-tarjottu) !important; }  tr.s-ordered { border-left-color: var(--t-tilattu) !important; }
    tr.s-production { border-left-color: var(--t-tyon-alla) !important; }  tr.s-done { border-left-color: var(--t-valmis) !important; }
    tr.s-invoiced { border-left-color: var(--t-laskutettu) !important; }  tr.s-archived { border-left-color: var(--t-arkisto) !important; }
    .badge { font-size: 12px; padding: 6px 10px; }
    .copy-btn { min-height: 34px; }
    .order-arrow { display: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
</head>
<body class="kpt-sivu">

<header class="kpt-yla">
  <a class="kpt-logo" href="etusivu.html">
    <img class="kpt-vain-tumma" src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="118" height="40">
    <img class="kpt-vain-vaalea" src="logo-musta.png" alt="Kalajoen Peltityö" width="118" height="40">
  </a>
  <div class="nav-menu-wrap">
    <button class="kpt-valikko-nappi" type="button">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=5"></script>
  </div>
  <div class="kpt-otsikko"><span class="kpt-kategoria"></span><h1>Tilaukset</h1></div>
  <div class="header-right">
    <button class="kpt-nappi ensisijainen pieni" type="button" onclick="uusiTilaus()">+ Uusi tilaus</button>
    <button class="kpt-teema-kytkin" type="button"></button>
  </div>
</header>

<main class="kpt-sisalto">

  <!-- YHTEENVETO-KORTIT (tietokoneella) -->
  <div class="summary-row" id="summaryRow">
    <div class="summary-card active" onclick="setFilter('active')" id="card-active">
      <div class="card-label">Aktiiviset</div>
      <div class="card-number" id="cnt-active">—</div>
    </div>
    <div class="summary-card" onclick="setFilter('draft')" id="card-draft">
      <div class="card-label">Luonnokset</div>
      <div class="card-number" id="cnt-draft">—</div>
    </div>
    <div class="summary-card" onclick="setFilter('invoiced')" id="card-invoiced">
      <div class="card-label">Laskutettu</div>
      <div class="card-number" id="cnt-invoiced">—</div>
    </div>
    <div class="summary-card" onclick="setFilter('archived')" id="card-archived">
      <div class="card-label">Arkisto</div>
      <div class="card-number" id="cnt-archived">—</div>
    </div>
    <div class="summary-card" onclick="setFilter('all')" id="card-all">
      <div class="card-label">Kaikki</div>
      <div class="card-number" id="cnt-all">—</div>
    </div>
  </div>

  <!-- TILA-VALITSIN JA HAKU -->
  <div class="tyokalut" id="tila-rivi">
    <button type="button" id="tila-nappi" class="tila-nappi" onclick="avaaTilat()" aria-expanded="false" aria-controls="tila-paneeli">
      <span class="otsikko">Tila:</span> <span id="tila-nimi">Aktiiviset</span> <span class="maara" id="tila-maara"></span><span class="tila-nuoli">▾</span>
    </button>
    <input type="text" class="filter-search" id="searchInput" placeholder="Hae asiakasta tai kohdetta..." oninput="applyFilters()">
    <div class="tila-paneeli" id="tila-paneeli" hidden>
      <div class="filter-btns" id="statusBtns">
        <button class="fbtn active" onclick="setStatusBtn(this,'active')" data-filter="active"><span>Aktiiviset</span><span class="maara"></span></button>
        <button class="fbtn" onclick="setStatusBtn(this,'IN_PROGRESS')" data-filter="IN_PROGRESS"><span>Kesken</span><span class="maara"></span></button>
        <button class="fbtn" onclick="setStatusBtn(this,'QUOTED')" data-filter="QUOTED"><span>Tarjottu</span><span class="maara"></span></button>
        <button class="fbtn" onclick="setStatusBtn(this,'ORDERED')" data-filter="ORDERED"><span>Tilattu</span><span class="maara"></span></button>
        <button class="fbtn" onclick="setStatusBtn(this,'IN_PRODUCTION')" data-filter="IN_PRODUCTION"><span>Työn alla</span><span class="maara"></span></button>
        <button class="fbtn" onclick="setStatusBtn(this,'COMPLETED')" data-filter="COMPLETED"><span>Valmis</span><span class="maara"></span></button>
        <button class="fbtn" onclick="setStatusBtn(this,'INVOICED')" data-filter="INVOICED"><span>Laskutettu</span><span class="maara"></span></button>
        <button class="fbtn" onclick="setStatusBtn(this,'DRAFT')" data-filter="DRAFT"><span>Luonnos</span><span class="maara"></span></button>
        <button class="fbtn archive-btn" onclick="setStatusBtn(this,'ARCHIVED')" data-filter="ARCHIVED"><span>Arkisto</span><span class="maara"></span></button>
        <button class="fbtn" onclick="setStatusBtn(this,'all')" data-filter="all"><span>Kaikki</span><span class="maara"></span></button>
      </div>
    </div>
  </div>

  <!-- TAULUKKO -->
  <div class="orders-table-wrap">
    <table class="orders-table">
      <thead>
        <tr>
          <th onclick="sortBy('order_date')" id="th-date">
            Pvm <span class="sort-arrow" id="sa-date">↓</span>
          </th>
          <th onclick="sortBy('customer')" id="th-customer">
            Asiakas <span class="sort-arrow" id="sa-customer"></span>
          </th>
          <th class="col-kohde" onclick="sortBy('kohde')" id="th-kohde">
            Kohde <span class="sort-arrow" id="sa-kohde"></span>
          </th>
          <th onclick="sortBy('status')" id="th-status">
            Status <span class="sort-arrow" id="sa-status"></span>
          </th>
          <th class="col-delivery" onclick="sortBy('delivery_date')" id="th-delivery">
            Toimitus <span class="sort-arrow" id="sa-delivery"></span>
          </th>
          <th style="width:80px;"></th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="6" class="empty-state">Ladataan...</td></tr>
      </tbody>
    </table>
    <div class="table-footer">
      <span id="footerCount">—</span>
      <span id="footerInfo"></span>
    </div>
  </div>

</main>

<script>
const SUPABASE_URL = 'https://hjyeugeqmyavxisndlwp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4';

const STATUS_FI = {
  DRAFT: 'Luonnos', IN_PROGRESS: 'Kesken', QUOTED: 'Tarjottu',
  ORDERED: 'Tilattu', IN_PRODUCTION: 'Työn alla',
  COMPLETED: 'Valmis', INVOICED: 'Laskutettu', ARCHIVED: 'Arkisto'
};
const STATUS_CLASS = {
  DRAFT: 'draft', IN_PROGRESS: 'active', QUOTED: 'quoted',
  ORDERED: 'ordered', IN_PRODUCTION: 'production',
  COMPLETED: 'done', INVOICED: 'invoiced', ARCHIVED: 'archived'
};
const ACTIVE_STATUSES = ['IN_PROGRESS','QUOTED','ORDERED','IN_PRODUCTION','COMPLETED'];

let allOrders = [];
let currentFilter = 'active';
let currentSearch = '';
let sortField = 'order_date';
let sortDir = 'desc';

async function loadOrders() {
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/orders?select=id,order_date,delivery_date,status,kohde,notes,customer_id,customers(name,customer_number)&order=order_date.desc`,
    { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
  );
  allOrders = await r.json();
  updateCounts();
  applyFilters();
}

function updateCounts() {
  const active = allOrders.filter(o => ACTIVE_STATUSES.includes(o.status)).length;
  const draft   = allOrders.filter(o => o.status === 'DRAFT').length;
  const inv     = allOrders.filter(o => o.status === 'INVOICED').length;
  const arch    = allOrders.filter(o => o.status === 'ARCHIVED').length;
  document.getElementById('cnt-active').textContent   = active;
  document.getElementById('cnt-draft').textContent    = draft;
  document.getElementById('cnt-invoiced').textContent = inv;
  document.getElementById('cnt-archived').textContent = arch;
  document.getElementById('cnt-all').textContent      = allOrders.length;
  // Luvut myös tila-valintoihin (puhelimella yhteenvetokortit ovat piilossa)
  const maara = f => allOrders.filter(o => suodatinSallii(o, f)).length;
  document.querySelectorAll('.fbtn').forEach(b => { const m = b.querySelector('.maara'); if (m) m.textContent = maara(b.dataset.filter); });
  paivitaTilaNappi();
}

// Sama ehto kuin applyFiltersissä: kuuluuko tilaus suodattimeen f
function suodatinSallii(o, f) {
  if (f === 'active')   return ACTIVE_STATUSES.includes(o.status);
  if (f === 'all')      return true;
  if (f === 'draft')    return o.status === 'DRAFT';
  if (f === 'invoiced') return o.status === 'INVOICED';
  if (f === 'archived') return o.status === 'ARCHIVED';
  return o.status === f;
}

// ── Tila-valitsin: tiivis nappi, joka avaa valinnat (Tomi 26.11.2026) ──
const SUODATIN_NIMI = { draft: 'DRAFT', invoiced: 'INVOICED', archived: 'ARCHIVED' };
function paivitaTilaNappi() {
  const f = SUODATIN_NIMI[currentFilter] || currentFilter;
  const b = document.querySelector(`.fbtn[data-filter="${f}"]`);
  const nimi = document.getElementById('tila-nimi'), m = document.getElementById('tila-maara');
  if (nimi) nimi.textContent = b ? b.querySelector('span').textContent : currentFilter;
  if (m) m.textContent = allOrders.length ? '(' + allOrders.filter(o => suodatinSallii(o, currentFilter)).length + ')' : '';
}
function avaaTilat(auki) {
  const p = document.getElementById('tila-paneeli'), n = document.getElementById('tila-nappi');
  if (auki === undefined) auki = p.hidden;
  p.hidden = !auki;
  n.setAttribute('aria-expanded', auki ? 'true' : 'false');
}
document.addEventListener('click', e => { if (!e.target.closest || !e.target.closest('#tila-rivi')) avaaTilat(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') avaaTilat(false); });

function setFilter(f) {
  currentFilter = f;
  // Synkronoi summary-kortit
  document.querySelectorAll('.summary-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + f);
  if (card) card.classList.add('active');
  // Synkronoi status-napit
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.fbtn[data-filter="${SUODATIN_NIMI[f] || f}"]`);
  if (btn) btn.classList.add('active');
  applyFilters();
  paivitaTilaNappi();
}

function setStatusBtn(btn, f) {
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Synkronoi summary-kortit
  document.querySelectorAll('.summary-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + f) || document.getElementById('card-' + (Object.keys(SUODATIN_NIMI).find(k => SUODATIN_NIMI[k] === f) || ''));
  if (card) card.classList.add('active');
  applyFilters();
  paivitaTilaNappi();
  avaaTilat(false);
}

function applyFilters() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase();
  let rows = allOrders.filter(o => suodatinSallii(o, currentFilter));   // Status-suodatus
  // Hakusuodatus
  if (currentSearch) {
    rows = rows.filter(o => {
      const name = (o.customers?.name || '').toLowerCase();
      const kohde = (o.kohde || '').toLowerCase();
      const notes = (o.notes || '').toLowerCase();
      return name.includes(currentSearch) || kohde.includes(currentSearch) || notes.includes(currentSearch);
    });
  }
  // Lajittelu
  rows.sort((a, b) => {
    let va, vb;
    if (sortField === 'order_date')    { va = a.order_date || ''; vb = b.order_date || ''; }
    else if (sortField === 'delivery_date') { va = a.delivery_date || ''; vb = b.delivery_date || ''; }
    else if (sortField === 'customer') { va = a.customers?.name || ''; vb = b.customers?.name || ''; }
    else if (sortField === 'kohde')    { va = a.kohde || ''; vb = b.kohde || ''; }
    else if (sortField === 'status')   { va = a.status || ''; vb = b.status || ''; }
    else { va = ''; vb = ''; }
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return sortDir === 'asc' ? cmp : -cmp;
  });
  renderTable(rows);
}

function sortBy(field) {
  if (sortField === field) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
  else { sortField = field; sortDir = field === 'order_date' ? 'desc' : 'asc'; }
  // Päivitä nuolet
  ['date','customer','kohde','status','delivery'].forEach(k => {
    document.getElementById('sa-' + k).textContent = '';
  });
  const fieldMap = { order_date:'date', customer:'customer', kohde:'kohde', status:'status', delivery_date:'delivery' };
  const el = document.getElementById('sa-' + fieldMap[field]);
  if (el) el.textContent = sortDir === 'asc' ? '↑' : '↓';
  document.querySelectorAll('.orders-table th').forEach(t => t.classList.remove('sorted'));
  const th = document.getElementById('th-' + fieldMap[field]);
  if (th) th.classList.add('sorted');
  applyFilters();
}

function renderTable(rows) {
  const tbody = document.getElementById('ordersBody');
  document.getElementById('footerCount').textContent =
    rows.length === 0 ? 'Ei tilauksia' : `${rows.length} tilausta`;

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Ei tilauksia valituilla suodattimilla</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(o => {
    const cls  = STATUS_CLASS[o.status] || 'draft';
    const fi   = STATUS_FI[o.status] || o.status;
    const date = (o.order_date || '').slice(0, 10).split('-').reverse().join('.');
    const deliv = o.delivery_date ? o.delivery_date.slice(0,10).split('-').reverse().join('.') : '—';
    const name  = o.customers?.name || '<span class="ei-asiakasta">— ei asiakasta —</span>';
    const kohde = o.kohde || '<span class="ei-kohdetta">—</span>';
    return `<tr id="order-row-${o.id}" class="s-${cls}" onclick="openOrder('${o.id}')">
      <td class="order-date">${date}</td>
      <td class="customer-name">${name}</td>
      <td class="col-kohde order-kohde">${kohde}</td>
      <td onclick="event.stopPropagation()">
        <div class="status-wrap">
          <span class="badge badge-${cls}" onclick="toggleStatusMenu('${o.id}', event)">${fi}</span>
          <div class="status-menu" id="status-menu-${o.id}">
            <div class="status-item" onclick="setOrderStatus('${o.id}','DRAFT')">Luonnos</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','IN_PROGRESS')">Kesken</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','QUOTED')">Tarjottu</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','ORDERED')">Tilattu</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','IN_PRODUCTION')">Työn alla</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','COMPLETED')">Valmis</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','INVOICED')">Laskutettu</div>
            <div class="status-item" onclick="setOrderStatus('${o.id}','ARCHIVED')">Arkisto</div>
          </div>
        </div>
      </td>
      <td class="col-delivery order-date">${deliv}</td>
      <td style="white-space:nowrap;display:flex;gap:6px;align-items:center;">
        <button class="copy-btn" onclick="event.stopPropagation(); kopioi('${o.id}')" title="Kopioi uudeksi tilaukseksi">⧉ Kopioi</button>
        <span class="order-arrow">›</span>
      </td>
    </tr>`;
  }).join('');
}

function openOrder(id) {
  localStorage.setItem('openOrderId', id);
  window.location.href = 'tilaus.html';
}

function kopioi(id) {
  localStorage.setItem('copyOrderId', id);
  localStorage.setItem('copyKeepCustomer', 'false');
  window.location.href = 'tilaus.html';
}

function uusiTilaus() {
  window.location.href = 'tilaus.html';
}

// ── Statuksen muutospudotusvalikko listassa ──
function toggleStatusMenu(id, e) {
  e.stopPropagation();
  const menu = document.getElementById('status-menu-' + id);
  const wasOpen = menu.classList.contains('open');

  // Suljetaan kaikki muut mahdollisesti auki olevat valikot ensin
  document.querySelectorAll('.status-menu').forEach(m => m.classList.remove('open'));

  if (!wasOpen) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const menuH = 8 * 37; // arvio valikon korkeudesta (8 vaihtoehtoa × ~37px/rivi)
    const goUp = rect.bottom + menuH > window.innerHeight - 8;

    menu.style.left = rect.left + 'px';
    if (goUp) {
      // Ei tarpeeksi tilaa alapuolella → avataan ylöspäin ettei valikko jää ruudun ulkopuolelle
      menu.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
      menu.style.top = 'auto';
    } else {
      menu.style.top = (rect.bottom + 4) + 'px';
      menu.style.bottom = 'auto';
    }
    menu.classList.add('open');
    // Ruudun oikeaan reunaan asti, ei yli (puhelimella merkki on lähellä reunaa)
    const yli = rect.left + menu.offsetWidth - (window.innerWidth - 8);
    if (yli > 0) menu.style.left = Math.max(8, rect.left - yli) + 'px';
  }
}

async function setOrderStatus(id, newStatus) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json', Prefer: 'return=representation'
      },
      body: JSON.stringify({ status: newStatus })
    });
    if (!res.ok) throw new Error('Tallennus epäonnistui: ' + res.status);

    // Päivitetään paikallinen tieto ja piirretään taulukko uudelleen ilman
    // koko listan hakemista uudelleen palvelimelta — nopeampaa ja sulavampaa.
    const o = allOrders.find(x => x.id === id);
    if (o) o.status = newStatus;
    updateCounts();
    applyFilters();
  } catch (err) {
    console.error(err);
    alert('Statuksen päivitys epäonnistui. Yritä uudelleen.');
  } finally {
    document.querySelectorAll('.status-menu').forEach(m => m.classList.remove('open'));
  }
}

document.addEventListener('click', () => {
  document.querySelectorAll('.status-menu').forEach(m => m.classList.remove('open'));
});

// ── Suora linkitys yhteen tilaukseen tai valmiiksi suodatettuna (esim. etusivulta/kalenterista) ──
// Käyttö A: tilaukset.html?id=<tilauksen id>        → näyttää yhden tilauksen, korostaa sen
// Käyttö B: tilaukset.html?filter=DRAFT              → avaa listan valmiiksi suodatettuna
//           (kelpaavat arvot: samat kuin fbtn-nappien data-filter, esim. DRAFT, QUOTED,
//           ORDERED, IN_PRODUCTION, COMPLETED, INVOICED, ARCHIVED, active, all)
function focusOrderFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const targetId = params.get('id');
  const filterParam = params.get('filter');

  if (targetId) {
    // Varmistetaan että rivi näkyy suodattimesta riippumatta
    setFilter('all');
    document.getElementById('searchInput').value = '';
    applyFilters();

    setTimeout(function () {
      const row = document.getElementById('order-row-' + targetId);
      if (!row) return;
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('highlight-target');
      setTimeout(function () {
        row.classList.remove('highlight-target');
      }, 3000);
    }, 150);
    return;
  }

  if (filterParam) {
    setFilter(filterParam);
  }
}

loadOrders().then(focusOrderFromUrl);
