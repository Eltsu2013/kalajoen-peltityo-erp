<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tunnit — Kalajoen Peltityö</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Ulkoasuremontti R6a (26.11.2026): uusi ulkoasu (tyyli.css + teema.js). Vanhat värinimet kytketty --kpt-muuttujiin,
       rakenne ja skripti ennallaan. Aikaväli napin taakse (Tomi 26.11.), merkintäikkuna puhelimella koko ruudulle
       (Tomi: tunteja kirjataan puhelimella ja koneella). Tulosteessa vanhat värit, lisäksi logo + päiväys (Tomi 26.11.). -->
  <link rel="stylesheet" href="tyyli.css?v=2">
  <script src="teema.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Vanhat värinimet → yhteiset --kpt-värit (ruudulla). Tulosteessa vanhat arvot, jotta tuloste pysyy ennallaan. */
    :root, html[data-teema] {
      --bg:       var(--kpt-kentta);
      --surface:  var(--kpt-paneeli);
      --border:   var(--kpt-reuna);
      --text:     var(--kpt-teksti);
      --muted:    var(--kpt-himmea);
      --accent:   var(--kpt-korostus);
      --accent2:  color-mix(in srgb, var(--kpt-korostus) 82%, #000);
      --danger:   var(--kpt-virhe);
      --danger-bg:color-mix(in srgb, var(--kpt-virhe) 12%, transparent);
    }
    @media print {
      :root, html[data-teema] {
        --bg:       #0f1117;
        --surface:  #1a1d27;
        --border:   #2a2d3a;
        --text:     #e8eaf0;
        --muted:    #555;   /* R6a: selitteet luettavammiksi tulosteessa (ennen #7a7f96) */
        --accent:   #f59e0b;
        --accent2:  #d97706;
        --danger:   #ef4444;
        --danger-bg:#2d1212;
      }
      body.kpt-sivu { font-size: 16px; line-height: normal; }
      .kpt-sivu h2 { line-height: inherit; }
      html { color-scheme: light; }
    }

    /* ── PAGE ── */
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }
    @media screen { .page { padding: 20px 16px 64px; } }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .month-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .month-nav button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .month-nav button:hover { background: var(--border); }
    .month-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      min-width: 160px;
      text-align: center;
    }
    .employee-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .btn:hover { background: var(--border); }
    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }
    .btn-accent:hover { background: var(--accent2); border-color: var(--accent2); }
    .ml-auto { margin-left: auto; }

    /* ── SUMMARY ── */
    .summary-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .summary-card .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .summary-card .value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--accent);
    }

    /* ── TABLE ── */
    .time-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .time-table th {
      text-align: left;
      padding: 8px 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .time-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .time-table tr.weekend td {
      color: var(--muted);
      background: rgba(0,0,0,0.15);
    }
    .time-table tr.has-entry td { color: var(--text); }
    .time-table tr.is-vacation td { background: rgba(34,197,94,0.08); }
    .time-table tr.is-sick td { background: rgba(239,68,68,0.08); }
    .time-table tr.clickable:hover td { background: rgba(245,158,11,0.08); cursor: pointer; }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      padding: 2px 7px;
      border-radius: 3px;
      font-weight: 600;
    }
    .badge-vacation { background: rgba(34,197,94,0.15); color: #22c55e; }
    .badge-sick     { background: rgba(239,68,68,0.15);  color: #ef4444; }
    .badge-hours    { background: rgba(245,158,11,0.12); color: var(--accent); }

    .day-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-left: 4px;
    }

    /* ── MODAL ── */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      width: 100%;
      max-width: 420px;
      margin: 1rem;
    }
    .modal h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 0.75rem;
    }
    .form-group label {
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-group input, .form-group textarea, .form-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 4px;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .checkbox-row {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 0.75rem;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 13px;
      cursor: pointer;
    }
    .checkbox-label input[type=checkbox] {
      width: 16px; height: 16px; cursor: pointer;
      accent-color: var(--accent);
    }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }
    .btn-danger {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
      margin-right: auto;
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    /* ── PRINT ── */
    .print-header { display: none; }
    @media print {
      nav, .toolbar, .modal-backdrop { display: none !important; }
      body { background: #fff; color: #000; }
      .print-header {
        display: block;
        margin-bottom: 1rem;
        border-bottom: 2px solid #000;
        padding-bottom: 0.5rem;
      }
      .print-header h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.2rem; }
      .print-header p  { font-size: 0.9rem; color: #444; }
      .summary-bar { border: 1px solid #ccc; padding: 0.5rem; border-radius: 4px; }
      .summary-card { border: 1px solid #ccc; }
      .summary-card .value { color: #000; }
      .time-table th, .time-table td { color: #000; border-color: #ccc; }
      .time-table tr.weekend td { background: #f5f5f5; color: #666; }
      .time-table tr.is-vacation td { background: #e6fce6; }
      .time-table tr.is-sick td { background: #fce6e6; }
      .time-table tr.no-entry { display: none !important; }
      .badge-hours { background: #eee !important; color: #000 !important; }
    }


    /* ── R6a: tulosteen logo ja päiväys (Tomi 26.11.2026: logo oli unohtunut) ── */
    .print-header { position: relative; }
    .print-logo { position: absolute; right: 0; top: 0; height: 30px; width: auto; }
    .print-pvm { position: absolute; right: 0; top: 32px; font-size: 0.75rem !important; color: #444; margin: 0 !important; }
    /* R6a: tuloste luettavaksi mustavalkotulostimella. Ennen arkipäivien rivit tulostuivat lähes valkoisina
       (ruudun vaalea tekstiväri) ja yhteenvedon luvut mustina tummalla pohjalla. */
    @media print {
      body.kpt-sivu { font-family: 'IBM Plex Sans', sans-serif; }
      .summary-card { background: #fff; }
      .summary-card .label { color: #444; }
      .time-table tr.has-entry td { color: #000; }
      .badge-vacation, .badge-sick { background: #fff !important; color: #000 !important; border: 1px solid #000; }
    }

    /* ── R6a: uusi ulkoasu ruudulla (tuloste käyttää yllä olevia vanhoja sääntöjä) ── */
    @media screen {
      .toolbar { position: relative; gap: 10px; margin-bottom: 16px; }
      .kpt-yla a.kpt-nappi { color: var(--kpt-teksti); }
      .month-nav button, .employee-select {
        min-height: 40px; border-radius: 6px; border-color: var(--kpt-reuna2); background: var(--kpt-paneeli);
        font-size: 15px;
      }
      .month-nav button { padding: 0 14px; font-family: var(--kpt-fontti); }
      .month-nav button:hover, .employee-select:hover { border-color: var(--kpt-himmea); background: var(--kpt-paneeli); }
      .month-label { font-size: 15px; min-width: 150px; }
      .employee-select { padding: 0 10px; }

      .aikavali-nappi {
        display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; cursor: pointer;
        background: transparent; border: 1px solid var(--kpt-reuna2); border-radius: 6px;
        color: var(--kpt-teksti); font: 600 14px var(--kpt-fontti);
      }
      .aikavali-nappi:hover { border-color: var(--kpt-himmea); }
      .aikavali-nappi .otsikko { font-weight: 400; color: var(--kpt-himmea); }
      .aikavali-nappi.valittu { background: var(--kpt-korostus); border-color: var(--kpt-korostus); color: var(--kpt-teksti-korostuksella); }
      .aikavali-nappi.valittu .otsikko { color: inherit; opacity: .85; }
      .aikavali-nappi .nuoli { font-size: 12px; transition: transform .15s; }
      .aikavali-nappi[aria-expanded="true"] .nuoli { transform: rotate(180deg); }
      .aikavali-paneeli {
        position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; width: min(420px, 100%);
        padding: 14px; background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna2); border-radius: 10px;
        box-shadow: var(--kpt-varjo);
      }
      .aikavali-paneeli[hidden] { display: none; }
      .aikavali-kentat { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
      .aikavali-kentat label, .aikavali-kentat input { min-width: 0; }
      .aikavali-kentat label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--kpt-himmea); }
      .aikavali-kentat input {
        min-height: 44px; padding: 0 10px; font: 15px var(--kpt-mono); width: 100%;
        background: var(--kpt-kentta); color: var(--kpt-teksti); border: 1px solid var(--kpt-reuna2); border-radius: 6px;
      }
      .aikavali-vihje { font-size: 13px; color: var(--kpt-himmea); margin: 10px 0 12px; }
      .aikavali-napit { display: flex; gap: 8px; justify-content: flex-end; }

      .summary-bar { gap: 10px; margin-bottom: 16px; }
      .summary-card { border-radius: var(--kpt-pyoristys); padding: 10px 16px; min-width: 110px; }
      .summary-card .label { font-size: 11px; }

      .time-table { background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna); border-radius: var(--kpt-pyoristys); border-collapse: separate; border-spacing: 0; overflow: hidden; }
      .time-table th { background: var(--kpt-paneeli2); font-size: 11px; }
      .time-table tr:last-child td { border-bottom: 0; }
      .time-table tr.weekend td { background: color-mix(in srgb, var(--kpt-himmea) 9%, transparent); }
      .time-table tr.is-vacation td { background: color-mix(in srgb, var(--kpt-ok) 10%, transparent); }
      .time-table tr.is-sick td { background: color-mix(in srgb, var(--kpt-virhe) 10%, transparent); }
      .time-table tr.clickable:hover td { background: var(--kpt-korostus-tausta); }
      .badge-vacation { background: color-mix(in srgb, var(--kpt-ok) 15%, transparent); color: var(--kpt-ok); }
      .badge-sick     { background: color-mix(in srgb, var(--kpt-virhe) 15%, transparent); color: var(--kpt-virhe); }
      .badge-hours    { background: var(--kpt-korostus-tausta); }

      .modal-backdrop { background: rgba(0,0,0,0.55); padding: 16px; }
      .modal { margin: 0; border-radius: var(--kpt-pyoristys); box-shadow: var(--kpt-varjo); max-height: calc(100vh - 32px); overflow-y: auto; }
      .modal h3 { font-family: var(--kpt-fontti); font-size: 17px; }
      .form-group label { font-family: var(--kpt-fontti); font-size: 13px; text-transform: none; letter-spacing: 0; }
      .form-group input, .form-group textarea, .form-group select { min-height: 42px; font-size: 15px; border-color: var(--kpt-reuna2); border-radius: 6px; }
      .form-group input:focus, .form-group textarea:focus { box-shadow: 0 0 0 3px var(--kpt-korostus-tausta); }
      .checkbox-label { font-size: 15px; min-height: 40px; }
      .checkbox-label input[type=checkbox] { width: 20px; height: 20px; }
      .btn { min-height: 40px; padding: 0 16px; border-radius: 6px; font: 600 14px var(--kpt-fontti); letter-spacing: 0; border-color: var(--kpt-reuna2); background: transparent; }
      .btn:hover { background: transparent; border-color: var(--kpt-himmea); }
      .btn-accent { background: var(--kpt-korostus); border-color: var(--kpt-korostus); color: var(--kpt-teksti-korostuksella); }
      .btn-accent:hover { background: var(--kpt-korostus); border-color: var(--kpt-korostus); filter: brightness(1.08); }
      .btn-danger { color: var(--kpt-virhe); border-color: color-mix(in srgb, var(--kpt-virhe) 55%, transparent); }
      .btn-danger:hover { background: color-mix(in srgb, var(--kpt-virhe) 12%, transparent); color: var(--kpt-virhe); }
    }

    /* ── R6a: puhelin. Merkintäikkuna koko ruudulle, isot kentät ja napit (Tomi: tunteja kirjataan myös puhelimella) ── */
    @media screen and (max-width: 700px) {
      .page { padding: 12px 12px 48px; }
      .month-nav { width: 100%; }
      .month-label { flex: 1; min-width: 0; }
      .month-nav button { min-height: 44px; min-width: 48px; }
      .employee-select { width: 100%; min-height: 44px; font-size: 16px; }
      .aikavali-nappi { width: 100%; min-height: 44px; justify-content: flex-start; }
      .aikavali-nappi .nuoli { margin-left: auto; }
      .aikavali-paneeli { width: 100%; }
      .aikavali-kentat input { font-size: 16px; min-height: 48px; }
      .aikavali-napit .kpt-nappi { flex: 1; }
      .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .summary-card { min-width: 0; padding: 8px 10px; }
      .time-table td { padding: 12px 10px; }      /* isompi rivi: sormi osuu oikeaan päivään */
      .time-table td:first-child { white-space: nowrap; }

      .modal-backdrop { padding: 0; align-items: stretch; }
      .modal { max-width: none; max-height: none; height: 100%; border-radius: 0; border: 0; padding: 16px 16px 0; display: flex; flex-direction: column; }
      .form-group input, .form-group textarea, .form-group select { min-height: 52px; font-size: 18px; }
      .checkbox-row { gap: 10px; }
      .checkbox-label { flex: 1; min-height: 52px; padding: 0 14px; border: 1px solid var(--kpt-reuna2); border-radius: 6px; font-size: 16px; }
      .checkbox-label input[type=checkbox] { width: 24px; height: 24px; }
      .modal-actions { position: sticky; bottom: 0; margin-top: auto; padding: 12px 0 16px; background: var(--kpt-paneeli); }
      .modal-actions .btn { flex: 1; min-height: 52px; font-size: 16px; }
      .modal-actions .btn-danger { flex-basis: 100%; margin-right: 0; }
    }

    @media (max-width: 600px) {
      .time-table th:nth-child(3),
      .time-table td:nth-child(3) { display: none; }
      .summary-card .value { font-size: 1.1rem; }
    }
  
  </style>
</head>
<body class="kpt-sivu">

<header class="kpt-yla">
  <a class="kpt-logo" href="etusivu.html">
    <img class="kpt-vain-tumma" src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="118" height="40">
    <img class="kpt-vain-vaalea" src="logo-musta.png" alt="Kalajoen Peltityö" width="118" height="40">
  </a>
  <div class="nav-menu-wrap">
    <button class="kpt-valikko-nappi" type="button">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=6"></script>
  </div>
  <div class="kpt-otsikko"><span class="kpt-kategoria"></span><h1>Tunnit</h1></div>
  <div class="header-right">
    <button class="kpt-nappi pieni" type="button" onclick="doPrint()">🖨 Tulosta</button>
    <a href="henkilosto.html" class="kpt-nappi pieni">👥 Henkilöstö</a>
    <button class="kpt-teema-kytkin" type="button"></button>
  </div>
</header>


<div class="page">

  <!-- PRINT-OTSIKKO (näkyy vain tulostuksessa) -->
  <div class="print-header" id="printHeader">
    <img class="print-logo" src="logo-musta.png" alt="Kalajoen Peltityö">
    <p class="print-pvm" id="printPvm"></p>
    <h2 id="printName">—</h2>
    <p id="printPeriod">—</p>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar" id="aikavali-rivi">
    <div class="month-nav">
      <button onclick="changeMonth(-1)" aria-label="Edellinen kuukausi">◀</button>
      <div class="month-label" id="monthLabel">—</div>
      <button onclick="changeMonth(1)" aria-label="Seuraava kuukausi">▶</button>
    </div>
    <select class="employee-select" id="employeeSelect" onchange="loadMonth()">
      <option value="">Ladataan...</option>
    </select>
    <!-- Aikaväli napin takana (R6a, Tomi 26.11.2026). Kentät samoilla id:illä ja käsittelijöillä kuin ennen. -->
    <button type="button" id="aikavali-nappi" class="aikavali-nappi" onclick="avaaAikavali()" aria-expanded="false" aria-controls="aikavali-paneeli">
      <span class="otsikko">Aikaväli:</span> <span id="aikavali-nimi">koko kuukausi</span><span class="nuoli">▾</span>
    </button>
    <div class="aikavali-paneeli" id="aikavali-paneeli" hidden>
      <div class="aikavali-kentat">
        <label>Alkaen <input type="date" id="dateFrom" onchange="onDateRangeChange()"></label>
        <label>Päättyen <input type="date" id="dateTo" onchange="onDateRangeChange()"></label>
      </div>
      <p class="aikavali-vihje">Valitse molemmat päivät. Kuukauden vaihto nuolilla palaa koko kuukauteen.</p>
      <div class="aikavali-napit">
        <button class="kpt-nappi pieni" type="button" onclick="clearDateRange(); avaaAikavali(false)">Tyhjennä</button>
        <button class="kpt-nappi ensisijainen pieni" type="button" onclick="avaaAikavali(false)">Valmis</button>
      </div>
    </div>
  </div>

  <!-- YHTEENVETO -->
  <div class="summary-bar" id="summaryBar">
    <div class="summary-card">
      <div class="label">Tunnit</div>
      <div class="value" id="sumHours">—</div>
    </div>
    <div class="summary-card">
      <div class="label">Ylityöt</div>
      <div class="value" id="sumOvertime">—</div>
    </div>
    <div class="summary-card">
      <div class="label">Lomapäiviä</div>
      <div class="value" id="sumVacation">—</div>
    </div>
    <div class="summary-card">
      <div class="label">Sairauspäiviä</div>
      <div class="value" id="sumSick">—</div>
    </div>
    <div class="summary-card">
      <div class="label">Työpäiviä</div>
      <div class="value" id="sumDays">—</div>
    </div>
  </div>

  <!-- TAULUKKO -->
  <table class="time-table" id="timeTable">
    <thead>
      <tr>
        <th>Päivämäärä</th>
        <th>Tunnit</th>
        <th>Ylityöt</th>
        <th>Tila</th>
        <th>Selite</th>
      </tr>
    </thead>
    <tbody id="timeBody">
      <tr><td colspan="5" style="color:var(--muted);padding:2rem;text-align:center">Ladataan...</td></tr>
    </tbody>
  </table>
</div>

<!-- MODAALI -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal">
    <h3 id="modalTitle">Merkintä</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Tunnit</label>
        <input type="number" id="fHours" min="0" max="24" step="0.5" placeholder="8">
      </div>
      <div class="form-group">
        <label>Ylityöt</label>
        <input type="number" id="fOvertime" min="0" max="24" step="0.5" placeholder="0">
      </div>
    </div>
    <div class="checkbox-row">
      <label class="checkbox-label">
        <input type="checkbox" id="fVacation" onchange="handleVacationSick('vacation')">
        Loma
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="fSick" onchange="handleVacationSick('sick')">
        Sairas
      </label>
    </div>
    <div class="form-group">
      <label>Selite</label>
      <input type="text" id="fNote" placeholder="Vapaaehtoinen huomio...">
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteEntry()" style="display:none">Poista</button>
      <button class="btn" onclick="closeModal()">Peruuta</button>
      <button class="btn btn-accent" onclick="saveEntry()">Tallenna</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hjyeugeqmyavxisndlwp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4';

let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-indexed
let employees    = [];
let entries      = {};   // { 'YYYY-MM-DD': entry }
let editingDate  = null;
let editingId    = null;
let authToken    = null;

const MONTHS_FI = ['Tammikuu','Helmikuu','Maaliskuu','Huhtikuu','Toukokuu','Kesäkuu',
                   'Heinäkuu','Elokuu','Syyskuu','Lokakuu','Marraskuu','Joulukuu'];
const DAYS_FI   = ['Su','Ma','Ti','Ke','To','Pe','La'];

// ── AUTH ──
window._authReady.then(async session => {
  authToken = session?.data?.session?.access_token;
  await loadEmployees();
  loadMonth();
});

function getHeaders() {
  const h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
  if (authToken) h['Authorization'] = 'Bearer ' + authToken;
  return h;
}

// ── TYÖNTEKIJÄT ──
async function loadEmployees() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/employees?is_active=eq.true&order=employee_number`, {
    headers: getHeaders()
  });
  employees = await res.json();
  const sel = document.getElementById('employeeSelect');
  sel.innerHTML = employees.map(e =>
    `<option value="${e.id}">${e.name}</option>`
  ).join('');
}

// ── KUUKAUSI ──
function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  // Tyhjennetään päivämääräkentät kun vaihdetaan kuukautta nuolilla
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value   = '';
  loadMonth();
}

function onDateRangeChange() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  if (from && to) loadMonth();
}

function clearDateRange() {
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value   = '';
  loadMonth();
}

function getDateRange() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  if (from && to) {
    return { from, to, label: `${formatDateFi(from)} – ${formatDateFi(to)}`, isRange: true };
  }
  const firstDay = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-01`;
  const lastDay  = new Date(currentYear, currentMonth+1, 0).getDate();
  const lastDate = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return { from: firstDay, to: lastDate, label: `${MONTHS_FI[currentMonth]} ${currentYear}`, isRange: false };
}

function formatDateFi(dateStr) {
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(d)}.${parseInt(m)}.${y}`;
}

async function loadMonth() {
  const empId = document.getElementById('employeeSelect').value;
  if (!empId) return;

  const range = getDateRange();
  document.getElementById('monthLabel').textContent = range.isRange ? 'Aikaväli' : range.label;

  // Päivitetään print-otsikko
  const emp = employees.find(e => e.id === empId);
  document.getElementById('printName').textContent   = emp ? emp.name : '';
  document.getElementById('printPeriod').textContent = `Tunti-ilmoitus: ${range.label}`;

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/time_entries?employee_id=eq.${empId}&entry_date=gte.${range.from}&entry_date=lte.${range.to}&order=entry_date`,
    { headers: getHeaders() }
  );
  const data = await res.json();

  entries = {};
  data.forEach(e => { entries[e.entry_date] = e; });

  renderTable(range);
  renderSummary();
}

function doPrint() {
  window.print();
}

// ── TAULUKKO ──
function renderTable(range) {
  if (!range) range = getDateRange();
  const tbody = document.getElementById('timeBody');

  // Rakennetaan lista kaikista päivistä välillä from..to
  const days = [];
  const cur = new Date(range.from + 'T00:00:00');
  const end = new Date(range.to   + 'T00:00:00');
  while (cur <= end) {
    days.push(new Date(cur));
    cur.setDate(cur.getDate() + 1);
  }

  let rows = '';
  days.forEach(date => {
    const y = date.getFullYear();
    const m = date.getMonth();
    const d = date.getDate();
    const dateStr  = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow      = date.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const entry    = entries[dateStr];
    const dayName  = DAYS_FI[dow];
    const hasEntry = entry && (entry.hours > 0 || entry.overtime_hours > 0 || entry.is_vacation || entry.is_sick || entry.note);

    let classes = 'clickable';
    if (isWeekend)          classes += ' weekend';
    if (!hasEntry)          classes += ' no-entry';
    if (entry?.is_vacation) classes += ' is-vacation';
    if (entry?.is_sick)     classes += ' is-sick';
    if (entry && !entry.is_vacation && !entry.is_sick) classes += ' has-entry';

    let hoursCell  = entry?.hours > 0          ? `<span class="badge badge-hours">${entry.hours}h</span>`          : '';
    let otCell     = entry?.overtime_hours > 0  ? `<span class="badge badge-hours">${entry.overtime_hours}h</span>` : '';
    let statusCell = '';
    if (entry?.is_vacation) statusCell = '<span class="badge badge-vacation">Loma</span>';
    if (entry?.is_sick)     statusCell = '<span class="badge badge-sick">Sairas</span>';
    const noteCell = entry?.note ? `<span style="color:var(--muted);font-size:12px">${entry.note}</span>` : '';

    rows += `<tr class="${classes}" onclick="openModal('${dateStr}')">
      <td><strong>${dayName} ${d}.${m+1}.${y}</strong></td>
      <td>${hoursCell}</td>
      <td>${otCell}</td>
      <td>${statusCell}</td>
      <td>${noteCell}</td>
    </tr>`;
  });

  tbody.innerHTML = rows;
}

// ── YHTEENVETO ──
function renderSummary() {
  const vals = Object.values(entries);
  const hours    = vals.reduce((s, e) => s + (e.hours || 0), 0);
  const overtime = vals.reduce((s, e) => s + (e.overtime_hours || 0), 0);
  const vacation = vals.filter(e => e.is_vacation).length;
  const sick     = vals.filter(e => e.is_sick).length;
  const days     = vals.filter(e => e.hours > 0).length;

  document.getElementById('sumHours').textContent    = hours + 'h';
  document.getElementById('sumOvertime').textContent = overtime + 'h';
  document.getElementById('sumVacation').textContent = vacation;
  document.getElementById('sumSick').textContent     = sick;
  document.getElementById('sumDays').textContent     = days;
}

// ── MODAALI ──
function openModal(dateStr) {
  editingDate = dateStr;
  const entry = entries[dateStr];
  editingId   = entry?.id || null;

  const d = new Date(dateStr + 'T00:00:00');
  const dow = DAYS_FI[d.getDay()];
  const [y,m,day] = dateStr.split('-');
  document.getElementById('modalTitle').textContent =
    `${parseInt(day)}.${parseInt(m)}.${y} ${dow}`;

  document.getElementById('fHours').value    = entry?.hours ?? '';
  document.getElementById('fOvertime').value = entry?.overtime_hours ?? '';
  document.getElementById('fVacation').checked = entry?.is_vacation ?? false;
  document.getElementById('fSick').checked     = entry?.is_sick ?? false;
  document.getElementById('fNote').value       = entry?.note ?? '';
  document.getElementById('deleteBtn').style.display = editingId ? 'inline-block' : 'none';

  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('fHours').focus();
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalBackdrop')) return;
  document.getElementById('modalBackdrop').classList.remove('open');
  editingDate = null;
  editingId   = null;
}

function handleVacationSick(type) {
  if (type === 'vacation' && document.getElementById('fVacation').checked) {
    document.getElementById('fSick').checked = false;
  }
  if (type === 'sick' && document.getElementById('fSick').checked) {
    document.getElementById('fVacation').checked = false;
  }
}

async function saveEntry() {
  const empId    = document.getElementById('employeeSelect').value;
  const hours    = parseFloat(document.getElementById('fHours').value) || 0;
  const overtime = parseFloat(document.getElementById('fOvertime').value) || 0;
  const vacation = document.getElementById('fVacation').checked;
  const sick     = document.getElementById('fSick').checked;
  const note     = document.getElementById('fNote').value.trim() || null;

  const payload = {
    employee_id:     empId,
    entry_date:      editingDate,
    hours:           hours,
    overtime_hours:  overtime,
    is_vacation:     vacation,
    is_sick:         sick,
    note:            note,
    source:          'manual'
  };

  let res;
  if (editingId) {
    res = await fetch(`${SUPABASE_URL}/rest/v1/time_entries?id=eq.${editingId}`, {
      method: 'PATCH',
      headers: { ...getHeaders(), 'Prefer': 'return=representation' },
      body: JSON.stringify(payload)
    });
  } else {
    res = await fetch(`${SUPABASE_URL}/rest/v1/time_entries`, {
      method: 'POST',
      headers: { ...getHeaders(), 'Prefer': 'return=representation' },
      body: JSON.stringify(payload)
    });
  }

  if (res.ok) {
    document.getElementById('modalBackdrop').classList.remove('open');
    await loadMonth();
  } else {
    const err = await res.json();
    alert('Virhe tallennuksessa: ' + (err.message || JSON.stringify(err)));
  }
}

async function deleteEntry() {
  if (!editingId) return;
  if (!confirm('Poistetaanko merkintä?')) return;

  const res = await fetch(`${SUPABASE_URL}/rest/v1/time_entries?id=eq.${editingId}`, {
    method: 'DELETE',
    headers: getHeaders()
  });

  if (res.ok) {
    document.getElementById('modalBackdrop').classList.remove('open');
    await loadMonth();
  } else {
    alert('Poisto epäonnistui');
  }
}

</script>
<script>
// R6a (26.11.2026): aikavälin nappi ja tulosteen päiväys. Vanha skripti yllä ennallaan.
function avaaAikavali(auki) {
  const p = document.getElementById('aikavali-paneeli'), n = document.getElementById('aikavali-nappi');
  if (auki === undefined) auki = p.hidden;
  p.hidden = !auki;
  n.setAttribute('aria-expanded', auki ? 'true' : 'false');
}
function paivitaAikavaliNappi() {
  const a = document.getElementById('dateFrom').value, l = document.getElementById('dateTo').value;
  const valittu = !!(a && l);
  document.getElementById('aikavali-nimi').textContent = valittu ? formatDateFi(a) + ' – ' + formatDateFi(l) : 'koko kuukausi';
  document.getElementById('aikavali-nappi').classList.toggle('valittu', valittu);
}
(function () {
  // Napin teksti päivittyy aina, kun lista ladataan (kuukauden vaihto, tyhjennys, aikaväli) tai päivää muutetaan.
  const lataa = loadMonth;
  loadMonth = async function () { const r = await lataa.apply(this, arguments); paivitaAikavaliNappi(); return r; };
  ['dateFrom', 'dateTo'].forEach(id => document.getElementById(id).addEventListener('change', paivitaAikavaliNappi));
  document.addEventListener('click', e => { if (!e.target.closest || !e.target.closest('#aikavali-rivi')) avaaAikavali(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') avaaAikavali(false); });
  function pvm() {
    const d = new Date();
    document.getElementById('printPvm').textContent = 'Tulostettu ' + d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear();
  }
  pvm();
  window.addEventListener('beforeprint', pvm);
})();
</script>
</body>
</html>
