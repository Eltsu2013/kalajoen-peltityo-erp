<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalenteri — Kalajoen Peltityö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
  :root{
    --bg: #1e2a30;
    --bg-panel: #253540;
    --bg-card: #2b3d48;
    --bg-dim: #1a2429;
    --border: #374b56;
    --text: #e8edf0;
    --text-dim: #9fb0b8;
    --accent: #6366f1;
    --accent-dim: #4f46e5;
    --accent-glow: rgba(99,102,241,0.15);
    --today-bg: rgba(99,102,241,0.10);
    --high: #ef4444;
    --normal: #eab308;
    --low: #22c55e;
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }

  /* HEADER — sama rakenne kuin muilla sivuilla */
  header {
    background: #241e30;
    border-bottom: 2px solid var(--accent);
    padding: 10px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 500; color: var(--text); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .nav-menu-wrap { position: relative; }
  .nav-btn {
    background: #3a3545; border: 1px solid #585568;
    color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; letter-spacing: 0.04em;
  }
  .nav-btn:hover { background: #4a4558; }
  .nav-dropdown {
    display: none; position: absolute; top: calc(100% + 6px); left: 0;
    background: #3a3545; border: 1px solid var(--border);
    border-radius: 6px; min-width: 200px; z-index: 999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); overflow: hidden;
  }
  .nav-dropdown.open { display: block; }
  .nav-section-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); padding: 8px 14px 4px;
  }
  .nav-item {
    display: block; width: 100%; text-align: left;
    padding: 8px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--text); background: none;
    border: none; cursor: pointer; text-decoration: none;
    transition: background 0.1s;
  }
  .nav-item:hover { background: var(--accent-glow); color: var(--accent); }
  .nav-item.current { color: var(--accent); font-weight: 600; }
  .nav-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  .btn{
    background:var(--bg-card);color:var(--text);border:1px solid var(--border);
    padding:8px 14px;border-radius:var(--radius);font-weight:600;
    font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-accent:hover{background:var(--accent-dim);border-color:var(--accent-dim);color:#fff;}

  main{max-width:1100px;margin:0 auto;padding:20px;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    background:var(--bg-card);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:14px;
    padding:7px 13px;border-radius:var(--radius);cursor:pointer;
  }
  .month-nav button:hover{border-color:var(--accent);color:var(--accent);}
  .month-label{
    font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;
    color:var(--accent);min-width:150px;text-align:center;
  }

  .legend{
    display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);
    margin-bottom:14px;font-family:'IBM Plex Mono',monospace;
  }
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* ---------- KUUKAUSIRUUDUKKO (desktop) ---------- */
  .cal-wrap{
    background:var(--bg-panel);border:1px solid var(--border);
    border-radius:6px;overflow:hidden;
  }
  .cal-weekdays{
    display:grid;grid-template-columns:repeat(7,1fr);
    background:var(--bg-dim);border-bottom:1px solid var(--border);
  }
  .cal-weekday{
    padding:9px 6px;text-align:center;font-family:'IBM Plex Mono',monospace;
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--text-dim);
  }
  .cal-weekday.weekend{color:#6b7c85;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-day{
    min-height:96px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    padding:5px;transition:background .1s;
  }
  .cal-day:nth-child(7n){border-right:none;}
  .cal-day.other-month{background:var(--bg-dim);opacity:.5;}
  .cal-day.today{background:var(--today-bg);}
  .cal-day.weekend{background:#233039;}
  .cal-day.weekend.other-month{background:var(--bg-dim);}

  .day-number{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    color:var(--text-dim);margin-bottom:4px;
    display:flex;align-items:center;justify-content:space-between;gap:4px;
  }
  .day-number.today-num{color:var(--accent);}
  .day-number-right{display:flex;align-items:center;gap:5px;}
  .week-num{font-size:9px;color:var(--text-dim);font-weight:400;}
  .add-day-btn{
    width:16px;height:16px;border-radius:3px;flex-shrink:0;
    background:var(--bg-dim);border:1px solid var(--border);color:var(--text-dim);
    font-size:12px;line-height:1;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
  }
  .add-day-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
  .mobile-add{
    width:22px;height:22px;border-radius:4px;flex-shrink:0;align-self:flex-start;
    background:var(--bg-panel);border:1px solid var(--border);color:var(--text-dim);
    font-size:14px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .mobile-add:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

  .event{
    display:block;padding:3px 6px;border-radius:3px;font-size:11px;font-weight:500;
    margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;text-decoration:none;border-left:3px solid transparent;
  }
  .event:hover{filter:brightness(1.2);}
  .event-more{
    color:var(--text-dim);font-size:11px;cursor:pointer;padding:2px 6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .event-more:hover{color:var(--accent);}

  /* Tilausväreillä samat kuin tilaukset.html */
  .event-draft{background:#333340;color:var(--text-dim);}
  .event-active{background:#0e2535;color:#0ea5e9;}
  .event-quoted{background:#1e1535;color:#a855f7;}
  .event-production{background:#2a2010;color:#e8a020;}
  .event-done{background:#1a3028;color:#3dba6e;}
  .event-invoiced{background:#1a3028;color:#3dba6e;}
  .event-archived{background:#2a2a2a;color:#666;}

  /* Tehtäväväreillä prioriteetti */
  .event-todo{background:var(--bg-card);color:var(--text);}
  .event-todo.prio-high{border-left-color:var(--high);}
  .event-todo.prio-normal{border-left-color:var(--normal);}
  .event-todo.prio-low{border-left-color:var(--low);}
  .event-todo.is-done{opacity:.5;text-decoration:line-through;}

  /* ---------- MOBIILILISTA ---------- */
  .mobile-list{display:none;}
  .day-row{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--bg-card);border-radius:var(--radius);
    border-left:3px solid transparent;
    padding:10px 14px;margin-bottom:4px;
  }
  .day-row.weekend{background:#263540;}
  .day-row.empty-day{opacity:.55;}
  .day-row.today{border-left-color:var(--accent);background:var(--accent-glow);}
  .day-label{
    flex-shrink:0;width:78px;font-family:'IBM Plex Mono',monospace;
    display:flex;flex-direction:column;line-height:1.3;padding-top:2px;
  }
  .day-name{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}
  .day-num{font-size:15px;font-weight:600;}
  .day-row.today .day-num{color:var(--accent);}
  .day-tags{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
  .day-empty{color:var(--text-dim);font-size:13px;flex:1;padding-top:3px;}
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:12px;font-size:12px;
    text-decoration:none;border:1px solid transparent;line-height:1.2;
  }
  .tag-order{cursor:pointer;font-weight:600;}
  .tag-order .tag-status{font-size:10px;font-weight:400;opacity:.8;font-family:'IBM Plex Mono',monospace;}
  .tag-todo{background:var(--bg-panel);color:var(--text);cursor:pointer;border-left:3px solid var(--normal);}
  .tag-todo.prio-high{border-left-color:var(--high);}
  .tag-todo.prio-normal{border-left-color:var(--normal);}
  .tag-todo.prio-low{border-left-color:var(--low);}
  .tag-todo.is-done{opacity:.5;text-decoration:line-through;}
  .tag-todo input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;margin:0;}

  @media (max-width:640px){
    .cal-wrap{display:none;}
    .mobile-list{display:block;}
    .legend{display:none;}
    main{padding:14px;}
  }

  /* ---------- MODAALIT ---------- */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
    z-index:100;align-items:center;justify-content:center;padding:16px;
  }
  .overlay.open{display:flex;}
  #todoOverlay{ z-index:150; } /* aina ylivuotomodaalin päällä, ettei jää piiloon */
  .modal{
    background:var(--bg-panel);border:1px solid var(--border);
    border-radius:var(--radius);width:100%;max-width:420px;
    max-height:90vh;overflow-y:auto;padding:20px;
  }
  .modal h3{margin:0 0 14px 0;font-size:17px;color:var(--accent);}
  .modal-field{margin-bottom:12px;}
  .modal-field label{
    display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:3px;font-family:'IBM Plex Mono',monospace;
  }
  .modal-field .value{font-size:14px;color:var(--text);white-space:pre-wrap;word-break:break-word;}
  .modal-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .badge-pill{
    padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;
    font-family:'IBM Plex Mono',monospace;
  }
  .badge-pill.prio-high{background:#3a1a1a;color:var(--high);}
  .badge-pill.prio-normal{background:#3a3110;color:var(--normal);}
  .badge-pill.prio-low{background:#153a1e;color:var(--low);}
  .badge-pill.shared{background:#1e1535;color:#a855f7;}
  .badge-pill.own{background:#2b3d48;color:var(--text-dim);}
  .badge-pill.done{background:#1a3028;color:#3dba6e;}
  .badge-pill.notdone{background:#333340;color:var(--text-dim);}
  .modal-actions{
    display:flex;justify-content:flex-end;gap:10px;margin-top:16px;
  }

  .overflow-list{display:flex;flex-direction:column;gap:6px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--bg-card);border:1px solid var(--accent);color:var(--text);
    padding:10px 18px;border-radius:var(--radius);font-size:14px;z-index:200;
    display:none;
  }
  .toast.show{display:block;}

    /* Valikko mahtuu ruudulle: pitkä lista vierittyy (17.11.2026) */
    #navDropdown, #navDropdownLasku { max-height: calc(100vh - 90px); overflow-y: auto; }
  </style>
</head>
<body>

<header>
  <div class="logo-img" style="height:50px;display:flex;align-items:center"><img src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="147" height="50" style="height:50px;width:auto;display:block"></div>
  <div class="nav-menu-wrap">
    <button class="nav-btn" onclick="toggleNav(event)">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=5"></script>
  </div>
  <h1>Kalenteri</h1>
  <div class="header-right">
    <button class="btn" id="todayBtn">Tänään</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">◀</button>
      <div class="month-label" id="monthLabel">—</div>
      <button onclick="changeMonth(1)">▶</button>
    </div>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--high)"></span> Kiireellinen tehtävä</span>
    <span><span class="dot" style="background:var(--normal)"></span> Normaali tehtävä</span>
    <span><span class="dot" style="background:var(--low)"></span> Ei kiireellinen</span>
    <span>💡 Väritetyt laatikot = tilauksen tila</span>
  </div>

  <!-- DESKTOP: kuukausiruudukko -->
  <div class="cal-wrap">
    <div class="cal-weekdays">
      <div class="cal-weekday">Ma</div>
      <div class="cal-weekday">Ti</div>
      <div class="cal-weekday">Ke</div>
      <div class="cal-weekday">To</div>
      <div class="cal-weekday">Pe</div>
      <div class="cal-weekday weekend">La</div>
      <div class="cal-weekday weekend">Su</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- MOBIILI: lista päivistä -->
  <div class="mobile-list" id="mobileList"></div>
</main>

<!-- Tehtävän pikakatselu -->
<div class="overlay" id="todoOverlay">
  <div class="modal">
    <h3 id="todoModalTitle">Tehtävä</h3>
    <div class="modal-field">
      <label>Muistiinpanot</label>
      <div class="value" id="todoModalNotes">—</div>
    </div>
    <div class="modal-field" id="todoModalPhoneWrap" style="display:none;">
      <label>Puhelin</label>
      <div class="value"><a id="todoModalPhone" href="#" style="color:var(--accent);text-decoration:none;font-weight:600;"></a></div>
    </div>
    <div class="modal-field">
      <label>Eräpäivä</label>
      <div class="value" id="todoModalDue">—</div>
    </div>
    <div class="modal-badges">
      <span class="badge-pill" id="todoModalPriority"></span>
      <span class="badge-pill" id="todoModalShared"></span>
      <span class="badge-pill" id="todoModalDone"></span>
    </div>
    <div class="modal-actions">
      <button class="btn" id="todoModalClose">Sulje</button>
      <a class="btn btn-accent" href="#" id="todoModalEditLink">✏️ Muokkaa →</a>
    </div>
  </div>
</div>

<!-- Päivän ylivuoto ("+N lisää") -->
<div class="overlay" id="overflowOverlay">
  <div class="modal">
    <h3 id="overflowTitle">Päivän tapahtumat</h3>
    <div class="overflow-list" id="overflowList"></div>
    <div class="modal-actions">
      <button class="btn" id="overflowClose">Sulje</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://hjyeugeqmyavxisndlwp.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4";

  const MONTHS_FI = ['Tammikuu','Helmikuu','Maaliskuu','Huhtikuu','Toukokuu','Kesäkuu',
                      'Heinäkuu','Elokuu','Syyskuu','Lokakuu','Marraskuu','Joulukuu'];
  const DAYS_SHORT_FI = ['Su','Ma','Ti','Ke','To','Pe','La']; // getDay()-indeksoitu (0=su)

  const STATUS_FI = {
    DRAFT: 'Luonnos', IN_PROGRESS: 'Kesken', QUOTED: 'Tarjottu',
    ORDERED: 'Tilattu', IN_PRODUCTION: 'Työn alla',
    COMPLETED: 'Valmis', INVOICED: 'Laskutettu', ARCHIVED: 'Arkisto'
  };
  const STATUS_CLASS = {
    DRAFT: 'draft', IN_PROGRESS: 'active', QUOTED: 'quoted',
    ORDERED: 'active', IN_PRODUCTION: 'production',
    COMPLETED: 'done', INVOICED: 'invoiced', ARCHIVED: 'archived'
  };
  const PRIORITY_FI = { high: 'Kiireellinen', normal: 'Normaali', low: 'Ei kiireellinen' };

  const MAX_TAGS_PER_DAY = 3;

  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth(); // 0-indeksoitu
  let ordersByDate = {};
  let todosByDate = {};

  // ---------- Nav-valikko ----------
  window.toggleNav = function(e){
    e.stopPropagation();
    document.getElementById("navDropdown").classList.toggle("open");
  };
  document.addEventListener("click", function(){
    document.getElementById("navDropdown").classList.remove("open");
  });

  // ---------- Auth helpers ----------
  async function getAuthHeaders(){
    const session = await window.getAuthSession();
    const token = session && session.data && session.data.session
      ? session.data.session.access_token
      : null;
    return {
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + (token || ANON_KEY),
      "Content-Type": "application/json"
    };
  }

  // ---------- Apurit ----------
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2500);
  }
  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function pad2(n){ return String(n).padStart(2, "0"); }
  function dateKey(y, m, d){ return y + "-" + pad2(m+1) + "-" + pad2(d); }
  function todayKey(){
    const d = new Date();
    return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function fmtDateFi(dateStr){
    if(!dateStr) return "—";
    const p = dateStr.split("-");
    return parseInt(p[2],10) + "." + parseInt(p[1],10) + "." + p[0];
  }

  // ISO-viikkonumero
  function getWeekNum(date){
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  function getMonthRange(){
    const lastDayNum = new Date(viewYear, viewMonth + 1, 0).getDate();
    return {
      from: dateKey(viewYear, viewMonth, 1),
      to: dateKey(viewYear, viewMonth, lastDayNum),
      label: MONTHS_FI[viewMonth] + " " + viewYear,
      lastDayNum: lastDayNum
    };
  }

  // ---------- Kuukauden vaihto ----------
  window.changeMonth = function(dir){
    viewMonth += dir;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    loadMonth();
  };
  document.getElementById("todayBtn").addEventListener("click", function(){
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    loadMonth();
  });

  // ---------- Data ----------
  async function loadMonth(){
    const range = getMonthRange();
    document.getElementById("monthLabel").textContent = range.label;

    try{
      const headers = await getAuthHeaders();
      // Haetaan vähän marginaalia (edellisen/seuraavan kk täytepäivät saattavat
      // tarvita dataa, mutta koska ne kuuluvat eri kuukauteen ei niitä täydennetä
      // tässä versiossa — täytepäivät näytetään aina tyhjinä ellei erikseen ladata).
      const ordersUrl = SUPABASE_URL + "/rest/v1/orders?select=id,delivery_date,status,kohde,customers(name)"
        + "&delivery_date=gte." + range.from + "&delivery_date=lte." + range.to
        + "&order=delivery_date.asc";
      const todosUrl = SUPABASE_URL + "/rest/v1/todos?select=*"
        + "&due_date=gte." + range.from + "&due_date=lte." + range.to
        + "&order=due_date.asc";

      const [ordersRes, todosRes] = await Promise.all([
        fetch(ordersUrl, { headers: headers }),
        fetch(todosUrl, { headers: headers })
      ]);
      if(!ordersRes.ok || !todosRes.ok) throw new Error("Haku epäonnistui");

      const orders = await ordersRes.json();
      const todos = await todosRes.json();

      ordersByDate = {};
      orders.forEach(function(o){
        const key = (o.delivery_date || "").slice(0, 10);
        if(!key) return;
        if(!ordersByDate[key]) ordersByDate[key] = [];
        ordersByDate[key].push(o);
      });

      todosByDate = {};
      todos.forEach(function(t){
        const key = (t.due_date || "").slice(0, 10);
        if(!key) return;
        if(!todosByDate[key]) todosByDate[key] = [];
        todosByDate[key].push(t);
      });

      renderDesktopGrid(range);
      renderMobileList(range);
    }catch(err){
      console.error(err);
      showToast("Kalenterin lataus epäonnistui");
    }
  }

  function itemsForDate(key){
    const orders = ordersByDate[key] || [];
    const todos = todosByDate[key] || [];
    return { orders: orders, todos: todos, total: orders.length + todos.length };
  }

  // ---------- Tägien HTML ----------
  function orderEventHtml(o, forGrid){
    const cls = STATUS_CLASS[o.status] || "draft";
    const fi = STATUS_FI[o.status] || o.status;
    const name = (o.customers && o.customers.name) ? o.customers.name : (o.kohde || "Tilaus");
    if(forGrid){
      return '<a class="event event-' + cls + '" href="tilaukset.html?id=' + o.id + '" title="' + escapeHtml(name) + ' — ' + fi + '">'
        + '📋 ' + escapeHtml(name)
        + '</a>';
    }
    return '<a class="tag tag-order event-' + cls + '" href="tilaukset.html?id=' + o.id + '">'
      + '📋 ' + escapeHtml(name)
      + ' <span class="tag-status">' + fi + '</span>'
      + '</a>';
  }

  function todoEventHtml(t, forGrid){
    const prio = t.priority || "normal";
    const doneClass = t.is_done ? " is-done" : "";
    if(forGrid){
      return '<div class="event event-todo prio-' + prio + doneClass + '" data-todo-id="' + t.id + '" title="' + escapeHtml(t.title) + '">'
        + (t.is_done ? "✓ " : "") + escapeHtml(t.title)
        + '</div>';
    }
    return '<label class="tag tag-todo prio-' + prio + doneClass + '" data-id="' + t.id + '">'
      + '<input type="checkbox" class="todo-check" ' + (t.is_done ? "checked" : "") + '>'
      + escapeHtml(t.title)
      + '</label>';
  }

  // ---------- DESKTOP: kuukausiruudukko ----------
  function renderDesktopGrid(range){
    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";

    const firstDay = new Date(viewYear, viewMonth, 1);
    let startDow = firstDay.getDay() - 1; // Ma=0 ... Su=6
    if(startDow < 0) startDow = 6;

    const todayStr = todayKey();
    const cells = [];

    // Edellisen kuun täytepäivät
    for(let i = 0; i < startDow; i++){
      const d = new Date(viewYear, viewMonth, -(startDow - 1 - i));
      cells.push({ date: d, otherMonth: true });
    }
    // Tämän kuukauden päivät
    for(let d = 1; d <= range.lastDayNum; d++){
      cells.push({ date: new Date(viewYear, viewMonth, d), otherMonth: false });
    }
    // Seuraavan kuun täytepäivät (täydennetään 7:n monikertaan)
    const remainder = cells.length % 7;
    if(remainder > 0){
      for(let i = 1; i <= 7 - remainder; i++){
        cells.push({ date: new Date(viewYear, viewMonth + 1, i), otherMonth: true });
      }
    }

    cells.forEach(function(c){
      grid.appendChild(buildDayCell(c.date, c.otherMonth, todayStr));
    });
  }

  function buildDayCell(date, otherMonth, todayStr){
    const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
    const key = dateKey(y, m, d);
    const dow = date.getDay();
    const isWeekend = (dow === 0 || dow === 6);
    const isToday = (key === todayStr);
    const isMonday = (dow === 1);

    const cell = document.createElement("div");
    cell.className = "cal-day"
      + (otherMonth ? " other-month" : "")
      + (isWeekend ? " weekend" : "")
      + (isToday ? " today" : "");

    const numDiv = document.createElement("div");
    numDiv.className = "day-number" + (isToday ? " today-num" : "");

    const numText = document.createElement("span");
    numText.textContent = d;
    numDiv.appendChild(numText);

    const rightWrap = document.createElement("span");
    rightWrap.className = "day-number-right";
    if(isMonday){
      const weekSpan = document.createElement("span");
      weekSpan.className = "week-num";
      weekSpan.textContent = "vko " + getWeekNum(date);
      rightWrap.appendChild(weekSpan);
    }
    const addBtn = document.createElement("button");
    addBtn.className = "add-day-btn";
    addBtn.type = "button";
    addBtn.title = "Lisää tehtävä " + key + " päivälle";
    addBtn.textContent = "+";
    addBtn.setAttribute("data-add-date", key);
    rightWrap.appendChild(addBtn);
    numDiv.appendChild(rightWrap);

    cell.appendChild(numDiv);

    const items = itemsForDate(key);
    const allEntries = items.orders.map(function(o){ return { type: "order", o: o }; })
      .concat(items.todos.map(function(t){ return { type: "todo", t: t }; }));

    const visible = allEntries.slice(0, MAX_TAGS_PER_DAY);
    const overflowCount = allEntries.length - visible.length;

    visible.forEach(function(entry){
      const wrap = document.createElement("div");
      wrap.innerHTML = entry.type === "order" ? orderEventHtml(entry.o, true) : todoEventHtml(entry.t, true);
      cell.appendChild(wrap.firstChild);
    });

    if(overflowCount > 0){
      const more = document.createElement("div");
      more.className = "event-more";
      more.textContent = "+" + overflowCount + " lisää";
      more.addEventListener("click", function(){
        openOverflowModal(key, items);
      });
      cell.appendChild(more);
    }

    return cell;
  }

  // ---------- MOBIILI: lista päivistä ----------
  function renderMobileList(range){
    const list = document.getElementById("mobileList");
    const todayStr = todayKey();
    let html = "";

    for(let d = 1; d <= range.lastDayNum; d++){
      const key = dateKey(viewYear, viewMonth, d);
      const dateObj = new Date(viewYear, viewMonth, d);
      const dow = dateObj.getDay();
      const isWeekend = (dow === 0 || dow === 6);
      const isToday = (key === todayStr);
      const items = itemsForDate(key);

      let classes = "day-row";
      if(isWeekend) classes += " weekend";
      if(isToday) classes += " today";
      if(!items.total) classes += " empty-day";

      const tagsHtml = items.total
        ? '<div class="day-tags">'
          + items.orders.map(function(o){ return orderEventHtml(o, false); }).join("")
          + items.todos.map(function(t){ return todoEventHtml(t, false); }).join("")
          + '</div>'
        : '<div class="day-empty">—</div>';

      html += '<div class="' + classes + '" id="mday-' + key + '">'
        + '<div class="day-label"><span class="day-name">' + DAYS_SHORT_FI[dow] + '</span><span class="day-num">' + d + '.' + (viewMonth+1) + '.</span></div>'
        + tagsHtml
        + '<button type="button" class="mobile-add" data-add-date="' + key + '" title="Lisää tehtävä">+</button>'
        + '</div>';
    }

    list.innerHTML = html;
    attachTodoCheckEvents(list);
    attachOrderNoop();

    const now = new Date();
    if(viewYear === now.getFullYear() && viewMonth === now.getMonth()){
      setTimeout(function(){
        const el = document.getElementById("mday-" + todayStr);
        if(el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 150);
    }
  }

  function attachOrderNoop(){ /* tilaus-tägit ovat tavallisia <a>-linkkejä, ei lisäkäsittelyä */ }

  // ---------- Tehtävien klikkaustapahtumat ----------
  function attachTodoCheckEvents(root){
    root.querySelectorAll(".todo-check").forEach(function(cb){
      cb.addEventListener("click", function(e){
        e.stopPropagation();
        const tag = cb.closest(".tag-todo");
        toggleTodoDone(tag.getAttribute("data-id"), cb.checked, tag);
      });
    });
    root.querySelectorAll(".tag-todo").forEach(function(label){
      label.addEventListener("click", function(e){
        if(e.target.tagName !== "INPUT"){
          e.preventDefault();
          const id = label.getAttribute("data-id");
          const todo = findTodoById(id);
          if(todo) openTodoModal(todo);
        }
      });
    });
  }

  // Ruudukossa tehtävätägit eivät ole checkbox-labeleita, joten klikkaus avaa
  // suoraan katselumodaalin (raksitus tehdään mobiililistalta tai tehtavat.html:stä).
  document.getElementById("calGrid").addEventListener("click", function(e){
    const el = e.target.closest(".event-todo");
    if(!el) return;
    const id = el.getAttribute("data-todo-id");
    const todo = findTodoById(id);
    if(todo) openTodoModal(todo);
  });

  function findTodoById(id){
    let found = null;
    Object.keys(todosByDate).forEach(function(key){
      todosByDate[key].forEach(function(t){
        if(String(t.id) === String(id)) found = t;
      });
    });
    return found;
  }

  async function toggleTodoDone(id, isDone, tagEl){
    try{
      const headers = await getAuthHeaders();
      const body = { is_done: isDone, done_at: isDone ? new Date().toISOString() : null };
      const res = await fetch(SUPABASE_URL + "/rest/v1/todos?id=eq." + id, {
        method: "PATCH", headers: headers, body: JSON.stringify(body)
      });
      if(!res.ok) throw new Error("Päivitys epäonnistui");
      if(tagEl) tagEl.classList.toggle("is-done", isDone);
      Object.keys(todosByDate).forEach(function(key){
        todosByDate[key].forEach(function(t){
          if(String(t.id) === String(id)){ t.is_done = isDone; t.done_at = body.done_at; }
        });
      });
    }catch(err){
      console.error(err);
      showToast("Tehtävän päivitys epäonnistui");
    }
  }

  // ---------- Tehtävän pikakatselu-modaali ----------
  function openTodoModal(t){
    document.getElementById("todoModalTitle").textContent = t.title;
    document.getElementById("todoModalNotes").textContent = t.notes || "—";
    document.getElementById("todoModalDue").textContent = fmtDateFi(t.due_date) + (t.due_time ? " klo " + t.due_time.substring(0,5) : "");

    const phoneWrap = document.getElementById("todoModalPhoneWrap");
    if(t.phone){
      phoneWrap.style.display = "";
      const phoneLink = document.getElementById("todoModalPhone");
      phoneLink.textContent = t.phone;
      phoneLink.href = "tel:" + t.phone.replace(/[^\d+]/g, "");
    }else{
      phoneWrap.style.display = "none";
    }

    const prioEl = document.getElementById("todoModalPriority");
    prioEl.textContent = PRIORITY_FI[t.priority] || "Normaali";
    prioEl.className = "badge-pill prio-" + (t.priority || "normal");

    const sharedEl = document.getElementById("todoModalShared");
    sharedEl.textContent = t.is_shared ? "Yhteinen" : "Oma";
    sharedEl.className = "badge-pill " + (t.is_shared ? "shared" : "own");

    const doneEl = document.getElementById("todoModalDone");
    doneEl.textContent = t.is_done ? "Tehty" : "Tekemättä";
    doneEl.className = "badge-pill " + (t.is_done ? "done" : "notdone");

    document.getElementById("todoModalEditLink").href = "tehtavat.html?edit=" + t.id;

    document.getElementById("todoOverlay").classList.add("open");
  }
  document.getElementById("todoModalClose").addEventListener("click", function(){
    document.getElementById("todoOverlay").classList.remove("open");
  });
  document.getElementById("todoOverlay").addEventListener("click", function(e){
    if(e.target === this) this.classList.remove("open");
  });

  // ---------- Päivän ylivuotomodaali ("+N lisää") ----------
  function openOverflowModal(key, items){
    document.getElementById("overflowTitle").textContent = fmtDateFi(key);
    const list = document.getElementById("overflowList");
    list.innerHTML = items.orders.map(function(o){ return orderEventHtml(o, false); }).join("")
      + items.todos.map(function(t){ return todoEventHtml(t, false); }).join("");
    document.getElementById("overflowOverlay").classList.add("open");
    attachTodoCheckEvents(list);
  }
  document.getElementById("overflowClose").addEventListener("click", function(){
    document.getElementById("overflowOverlay").classList.remove("open");
  });
  document.getElementById("overflowOverlay").addEventListener("click", function(e){
    if(e.target === this) this.classList.remove("open");
  });

  // ---------- "+"-napit: uuden tehtävän lisäys valitulle päivälle ----------
  // Toimii sekä desktop-ruudukossa (.add-day-btn) että mobiililistassa (.mobile-add),
  // koska molemmat käyttävät samaa data-add-date-attribuuttia. Kuunnellaan koko
  // dokumentista (event delegation), jotta uudetkin renderöinnit toimivat automaattisesti
  // ilman että jokaiseen nappiin tarvitsee erikseen kiinnittää kuuntelijaa.
  document.addEventListener("click", function(e){
    const btn = e.target.closest("[data-add-date]");
    if(!btn) return;
    window.location.href = "tehtavat.html?newDate=" + btn.getAttribute("data-add-date");
  });

  // ---------- Init ----------
  window._authReady.then(function(){
    loadMonth();
  });

})();
</script>
