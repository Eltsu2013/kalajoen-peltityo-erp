<script>
  const SUPABASE_URL = 'https://hjyeugeqmyavxisndlwp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4';
  const WAREHOUSE_ID = 'e56f3534-50f9-4081-8840-f81f03905113';

  // Puhelimen muistiin tallennettavat asiat (localStorage)
  const LS_RECENT_LOCS   = 'varastotyo.recentLocs';   // viimeksi käytetyt paikat (id-lista)
  const LS_CURRENT_LOC   = 'varastotyo.currentLoc';   // valittu paikka + aikaleima
  const LS_RECENT_PRODS  = 'varastotyo.recentProducts'; // viimeksi käytetyt tuotteet (id-lista)
  const LS_RECENT_WIDTHS = 'varastotyo.recentWidths';   // viimeksi käytetyt leveydet (mm)
  const RECENT_MAX       = 4;
  const RECENT_PROD_MAX  = 6;
  const CURRENT_MAX_AGE  = 4 * 60 * 60 * 1000;        // valittu paikka muistetaan 4 h
  const TYPE_FI = { ROLL: 'Rulla', SHEET: 'Levy', OFFCUT: 'Siivu', ITEM: 'Kpl', BULK: 'Metri' };

  // ─── Tila ────────────────────────────────────────────
  let allLocations = [];
  let locById      = new Map();   // id → paikka
  let childrenOf   = new Map();   // yläpaikan id → lapset (tasot/piikit)
  let currentLoc   = null;        // lopullinen valittu paikka
  let pendingTop   = null;        // yläpaikka, jonka tasoa/piikkiä valitaan
  let pendingRow   = null;        // piikkien rivi (1/2)

  let allProducts    = [];        // aktiiviset tuotteet
  let currentProduct = null;      // valittu tuote
  let hereStock      = [];        // valitun paikan ACTIVE-rivit
  let hereOpen       = false;     // "Tällä paikalla" -lista auki/kiinni
  let np             = null;      // uuden tuotteen lomakkeen tila
  let am             = null;      // ruudun 3 lomakkeen tila
  let sessionLog     = [];        // tällä kerralla lisätyt (kumoa)
  let sessionOpen    = false;
  let mode           = 'lisaa';   // 'lisaa' | 'inventoi'
  let invMarks       = {};        // itemId → 'found' | 'missing' (vain muistissa kuittaukseen asti)
  let invEditId      = null;      // rivi, jonka mittoja korjataan
  let pendingPick    = null;      // { banner, onPick(loc) } — paikan valinta jollekin toimenpiteelle (siirto, palan paikka)
  let invCutId       = null;      // rivi, josta leikataan
  let cut            = null;      // leikkauslomakkeen tila

  // ─── Apufunktiot ─────────────────────────────────────
  // localStorage voi olla estetty (esim. yksityinen selaus) → aina try/catch
  function lsGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  // Tekstit turvallisesti HTML:ään (ettei esim. "<" nimessä riko sivua)
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // Hakua varten: pienet kirjaimet, ei välilyöntejä/viivoja, pilkku = piste
  function norm(s) {
    return String(s ?? '').toLowerCase().replace(/[\s\-_]/g, '').replace(/,/g, '.');
  }

  function lastPart(code) { const p = code.split('-'); return p[p.length - 1]; }

  // "Hyllykkö 3 - Hylly 2" → "Hylly 2" (tasonapin teksti)
  function levelLabel(loc) {
    const i = loc.name.indexOf(' - ');
    return i >= 0 ? loc.name.slice(i + 3) : loc.name;
  }
  // "Hyllykkö 3 - Hylly 2" → "Hyllykkö 3, Hylly 2" (yläpalkin teksti)
  function displayName(loc) { return loc.name.replace(' - ', ', '); }

  // Piikkipaikka = kaikkien lasten koodin loppuosa on 2+ numeroa (IN-L-05-11 … -213)
  function isSpikeParent(topId) {
    const kids = childrenOf.get(topId) || [];
    return kids.length > 0 && kids.every(k => /^\d{2,}$/.test(lastPart(k.code)));
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  async function authHeaders() {
    const session = await window.getAuthSession();
    const token = session?.data?.session?.access_token || SUPABASE_KEY;
    return { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' };
  }

  // ─── Liikeloki (stock_movements) ─────────────────────
  // Lokin epäonnistuminen ei estä toimenpidettä → vain varoitus
  async function logMovements(rows) {
    if (!rows.length) return;
    try {
      const headers = await authHeaders();
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=minimal';
      const uid = window._currentUser?.id || null;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_movements`, {
        method: 'POST', headers, body: JSON.stringify(rows.map(r => Object.assign({ created_by: uid }, r)))
      });
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
    } catch (err) {
      console.warn('Liikeloki:', err);
      showToast('Tehty, mutta lokimerkintä epäonnistui', 'error');
    }
  }

  // ─── Datan haku ──────────────────────────────────────
  async function loadLocations() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/locations?select=id,code,name,zone,location_type,parent_location_id&is_active=eq.true&order=code`,
      { headers: await authHeaders() }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
    allLocations = await res.json();

    locById = new Map(allLocations.map(l => [l.id, l]));
    childrenOf = new Map();
    allLocations.forEach(l => {
      // Itseensä osoittava yläpaikka on datavirhe → käsitellään ylätason paikkana
      if (l.parent_location_id === l.id) l.parent_location_id = null;
      if (!l.parent_location_id) return;
      if (!childrenOf.has(l.parent_location_id)) childrenOf.set(l.parent_location_id, []);
      childrenOf.get(l.parent_location_id).push(l);
    });
    // Numerojärjestys: 2 ennen 11:tä (tavallinen aakkosjärjestys laittaisi 11 ennen 2:ta)
    childrenOf.forEach(list => list.sort((a, b) => a.code.localeCompare(b.code, 'fi', { numeric: true })));
  }

  async function loadProducts() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/products?select=id,nimi,laji,material,color,thickness_mm,unit&is_active=eq.true`,
      { headers: await authHeaders() }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
    allProducts = await res.json();
    sortProducts();
  }
  function sortProducts() {
    allProducts.sort((a, b) => String(a.nimi).localeCompare(String(b.nimi), 'fi', { numeric: true }));
  }

  // Valitun paikan nykyinen sisältö ("Tällä paikalla: 4 erää")
  async function loadHereStock() {
    hereStock = [];
    hereOpen = false;
    renderHere(true);
    if (!currentLoc) return;
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/stock_items?select=id,type,quantity,length_estimated,remaining_length_mm,remaining_width_mm,original_length_mm,original_width_mm,note,checked_at,product_id,products(nimi)&status=eq.ACTIVE&location_id=eq.${currentLoc.id}`,
        { headers: await authHeaders() }
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      hereStock = await res.json();
    } catch (e) {
      console.error('loadHereStock:', e);
    }
    renderHere(false);
    if (!document.getElementById('screenInventory').hidden) renderInventory();
  }

  // ─── Nimi- ja mittafunktiot (samat kuin varasto.html:ssä) ──
  function lajiFromUnit(unit) { return unit === 'm²' ? 'pelti' : 'tarvike'; }
  function generoiNimi(material, color, thickness_mm, unit) {
    const parts = [material, color].filter(Boolean);
    if (lajiFromUnit(unit) === 'pelti' && thickness_mm) {
      parts.push(String(Number(thickness_mm)).replace('.', ','));
    }
    return parts.join(' ');
  }
  function itemQuantity(item) {
    if (item.quantity != null) return Number(item.quantity);
    const l = item.remaining_length_mm ?? item.original_length_mm;
    if (l == null) return null;
    return item.type === 'BULK' ? l / 1000 : l;
  }
  function formatQty(n) {
    return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, '').replace('.', ',');
  }
  function formatMitat(item) {
    const type = item.type;
    if (type === 'ITEM') { const q = itemQuantity(item); return q != null ? formatQty(q) + ' kpl' : '—'; }
    if (type === 'BULK') { const q = itemQuantity(item); return q != null ? formatQty(q) + ' m' : '—'; }
    const w = item.remaining_width_mm ?? item.original_width_mm;
    const l = item.remaining_length_mm ?? item.original_length_mm;
    const wStr = w != null ? w + ' mm' : '—';
    const est  = (type === 'ROLL' && item.length_estimated) ? '~' : '';
    const lStr = l != null ? est + (l >= 1000 ? (l/1000).toFixed(3).replace('.',',') + ' m' : l + ' mm') : '—';
    return lStr + ' <span class="dim">× ' + wStr + '</span>';
  }
  // "0,5" tai "0.5" → 0.5
  function parseNum(s) { const n = parseFloat(String(s ?? '').trim().replace(',', '.')); return isNaN(n) ? null : n; }
  function fmtThick(t) { return String(Number(t)).replace('.', ','); }

  // ─── Näkymien vaihto ─────────────────────────────────
  const SCREENS = { place: 'screenPlace', product: 'screenProduct', newProduct: 'screenNewProduct', amount: 'screenAmount', inventory: 'screenInventory' };
  function showScreen(name) {
    Object.entries(SCREENS).forEach(([key, id]) => { document.getElementById(id).hidden = key !== name; });
    if (name === 'place') showSearchView();
    if (name === 'product') { renderProductRecent(); renderProductSearch(document.getElementById('productSearch').value); }
    if (name === 'inventory') renderInventory();
    document.getElementById('moveBanner').hidden = !(name === 'place' && pendingPick);
    window.scrollTo(0, 0);
  }

  function showSearchView() {
    pendingTop = null; pendingRow = null;
    document.getElementById('placeSearchView').hidden = false;
    document.getElementById('levelView').hidden = true;
    renderRecent();
    renderSearch(document.getElementById('placeSearch').value);
  }

  // ─── Yläpalkki ───────────────────────────────────────
  function renderPlaceBar() {
    const bar = document.getElementById('placeBar');
    if (!currentLoc) {
      bar.classList.add('empty');
      bar.innerHTML = '📍 <span>Valitse paikka</span>';
      return;
    }
    bar.classList.remove('empty');
    bar.innerHTML =
      '📍 <span class="place-code">' + esc(currentLoc.code) + '</span>' +
      '<span class="place-name">' + esc(displayName(currentLoc)) + '</span>' +
      '<span class="place-change">vaihda ▸</span>';
  }

  // ─── Haku ────────────────────────────────────────────
  function renderSearch(query) {
    const wrap = document.getElementById('searchResultsWrap');
    const tokens = query.trim().split(/\s+/).map(norm).filter(Boolean);
    document.getElementById('recentWrap').hidden = tokens.length > 0;

    if (!tokens.length) { wrap.hidden = true; return; }
    wrap.hidden = false;

    // Jokaisen hakusanan pitää löytyä koodista tai nimestä
    const hits = allLocations.filter(l => {
      const hay = norm(l.code) + '|' + norm(l.name);
      return tokens.every(t => hay.includes(t));
    });
    // Yläpaikat ensin, sitten tasot/piikit
    hits.sort((a, b) => (a.parent_location_id ? 1 : 0) - (b.parent_location_id ? 1 : 0)
                        || a.code.localeCompare(b.code, 'fi', { numeric: true }));

    const list = document.getElementById('searchResults');
    if (!hits.length) {
      list.innerHTML = '<div class="empty-msg">Ei osumia. Kokeile koodia (esim. r07) tai nimen osaa.</div>';
      return;
    }
    list.innerHTML = hits.slice(0, 25).map(placeButtonHtml).join('');
  }

  function placeButtonHtml(loc) {
    const hasKids = (childrenOf.get(loc.id) || []).length > 0;
    return '<button class="big-btn" type="button" data-loc-id="' + esc(loc.id) + '">' +
      '<span class="code">' + esc(loc.code) + '</span>' +
      '<span class="name">' + esc(displayName(loc)) + '</span>' +
      (hasKids ? '<span class="arrow">valitse taso ▸</span>' : '') +
      '</button>';
  }

  // ─── Viimeksi käytetyt ───────────────────────────────
  function renderRecent() {
    const ids = lsGet(LS_RECENT_LOCS, []);
    const locs = ids.map(id => locById.get(id)).filter(Boolean);
    const list = document.getElementById('recentList');
    list.innerHTML = locs.length
      ? locs.map(placeButtonHtml).join('')
      : '<div class="empty-msg">Ei vielä käytettyjä paikkoja. Hae yllä tai skannaa hyllyn QR-tarra.</div>';
  }

  // ─── Kaikki paikat seinittäin ────────────────────────
  // Koodin alku kertoo seinän: IN-R = oikea, IN-L = vasen, IN-C = keskellä koneiden ympärillä
  // Koodin alku kertoo seinän: IN-R = oikea, IN-L = vasen, IN-C = keskellä koneiden ympärillä.
  // Varalla DB:n zone-sarake, jos koodi ei ala tutuilla kirjaimilla.
  const ZONE_GROUPS = [
    { title: 'Verstaan sisäosa', zones: [
      { label: 'Oikea seinä',      match: l => l.code.startsWith('IN-R') || l.zone === 'IN-R' },
      { label: 'Vasen seinä',      match: l => l.code.startsWith('IN-L') || l.zone === 'IN-L' },
      { label: 'Koneiden ympärys', match: l => l.code.startsWith('IN-C') || l.zone === 'IN-C' },
    ]},
    { title: 'Muut varastopaikat', zones: [
      { label: 'Auto',             match: l => /^AUTO/.test(l.code) },
      { label: 'Kontti',           match: l => /^KONTTI/.test(l.code) },
      { label: 'Ulkovarastot',     match: l => /^ULK/.test(l.code) || l.zone === 'ULK' },
    ]},
  ];

  function renderAllPlaces() {
    // Vain yläpaikat; tasot valitaan napautuksen jälkeen.
    // (Lapsi, jonka yläpaikka on pois käytöstä, näytetään myös, ettei se katoa listalta.)
    const tops = allLocations.filter(l => !l.parent_location_id || !locById.has(l.parent_location_id));
    const used = new Set();
    let html = '';
    const zoneHtml = (label, locs) =>
      '<details class="zone"><summary>' + esc(label) +
      '<span class="count">' + locs.length + '</span></summary>' +
      '<div class="big-list">' + locs.map(placeButtonHtml).join('') + '</div></details>';

    ZONE_GROUPS.forEach((g, gi) => {
      let groupHtml = '';
      g.zones.forEach(z => {
        const locs = tops.filter(l => !used.has(l.id) && z.match(l));
        locs.forEach(l => used.add(l.id));
        if (locs.length) groupHtml += zoneHtml(z.label, locs);
      });
      if (!groupHtml) return;
      // Ensimmäinen lohko (verstaan sisäosa) suoraan "Kaikki paikat" -otsikon alle, muut oman väliotsikon alle
      if (gi > 0) html += '<div class="zone-group-title">' + esc(g.title) + '</div>';
      html += groupHtml;
    });
    const rest = tops.filter(l => !used.has(l.id));
    if (rest.length) {
      html += '<div class="zone-group-title">Luokittelemattomat</div>' + zoneHtml('Muut', rest);
    }
    document.getElementById('allPlaces').innerHTML = html;
  }

  function addRecent(id) {
    const ids = lsGet(LS_RECENT_LOCS, []).filter(x => x !== id);
    ids.unshift(id);
    lsSet(LS_RECENT_LOCS, ids.slice(0, RECENT_MAX));
  }

  // ─── Valinta ─────────────────────────────────────────
  // Napautettiin paikkaa: jos sillä on tasoja/piikkejä → valitaan ne, muuten valmis
  function pickLocation(loc) {
    const kids = childrenOf.get(loc.id) || [];
    if (kids.length) {
      pendingTop = loc;
      pendingRow = null;
      renderLevelView();
    } else {
      selectFinal(loc);
    }
  }

  function selectFinal(loc) {
    if (pendingPick) { const p = pendingPick; pendingPick = null; document.getElementById('moveBanner').hidden = true; p.onPick(loc); return; }
    currentLoc = loc;
    lsSet(LS_CURRENT_LOC, { id: loc.id, at: Date.now() });
    addRecent(loc.id);
    document.getElementById('placeSearch').value = '';
    document.getElementById('productSearch').value = '';
    invMarks = {}; invEditId = null;
    renderPlaceBar();
    showScreen(mode === 'inventoi' ? 'inventory' : 'product');
    loadHereStock();
  }

  function setMode(m) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    if (!currentLoc) { showScreen('place'); return; }
    showScreen(m === 'inventoi' ? 'inventory' : 'product');
  }

  // ═══ RUUTU 2: TUOTE ═══════════════════════════════════

  function productButtonHtml(p) {
    return '<button class="big-btn" type="button" data-product-id="' + esc(p.id) + '">' +
      '<span class="name">' + esc(p.nimi) +
        '<span class="sub">' + esc(p.unit || '') + '</span></span>' +
      '<span class="laji-tag laji-' + esc(p.laji) + '">' + esc(p.laji) + '</span>' +
      '</button>';
  }

  // Haku: jokaisen hakusanan pitää löytyä nimestä. "rr23 5" → "Pural RR 23 0,5"
  function renderProductSearch(query) {
    const wrap = document.getElementById('productResultsWrap');
    const tokens = query.trim().split(/\s+/).map(norm).filter(Boolean);
    document.getElementById('productRecentWrap').hidden = tokens.length > 0;
    if (!tokens.length) { wrap.hidden = true; return; }
    wrap.hidden = false;

    const hits = allProducts.filter(p => {
      const hay = norm(p.nimi);
      return tokens.every(t => hay.includes(t));
    });

    let html = hits.slice(0, 30).map(productButtonHtml).join('');
    if (hits.length > 30) html += '<div class="empty-msg">' + hits.length + ' osumaa — tarkenna hakua.</div>';
    if (!hits.length) html += '<div class="empty-msg">Ei osumia.</div>';

    // "Uusi väri" -pikanapit: jos osumat ovat 1–3 eri tuotetta (esim. Kateruuvi 4,8x35),
    // voi luoda saman tuotteen uudessa värissä ilman nimen kirjoittamista
    const materials = [...new Map(hits.map(p => [p.material + '|' + p.laji, p])).values()];
    if (materials.length >= 1 && materials.length <= 3) {
      materials.forEach(p => {
        html += '<button class="big-btn new-btn" type="button" data-new-variant="' + esc(p.id) + '">' +
          '+ ' + esc(p.material) + ' — uusi ' + (p.laji === 'pelti' ? 'väri/paksuus' : 'väri') + '</button>';
      });
    }
    // Aina tarjolla: kokonaan uusi tuote hakusanasta
    html += '<button class="big-btn new-btn" type="button" data-new-product="1">+ Luo uusi tuote: ' + esc(query.trim()) + '</button>';
    document.getElementById('productResults').innerHTML = html;
  }

  function renderProductRecent() {
    const ids = lsGet(LS_RECENT_PRODS, []);
    const prods = ids.map(id => allProducts.find(p => p.id === id)).filter(Boolean);
    document.getElementById('productRecent').innerHTML = prods.length
      ? prods.map(productButtonHtml).join('')
      : '<div class="empty-msg">Ei vielä käytettyjä tuotteita. Hae yllä.</div>';
  }

  function addRecentProduct(id) {
    const ids = lsGet(LS_RECENT_PRODS, []).filter(x => x !== id);
    ids.unshift(id);
    lsSet(LS_RECENT_PRODS, ids.slice(0, RECENT_PROD_MAX));
  }

  // "Tällä paikalla: 4 erää ▸" — supistettu, aukeaa napauttamalla
  function renderHere(loading) {
    const box = document.getElementById('hereBox');
    if (!currentLoc) { box.innerHTML = ''; return; }
    if (loading) { box.innerHTML = '<div class="here-toggle"><span><span class="spinner"></span>Tarkistetaan paikan sisältöä…</span></div>'; return; }
    if (!hereStock.length) {
      box.innerHTML = '<div class="here-toggle">Tällä paikalla ei ole vielä mitään</div>';
      return;
    }
    let html = '<button class="here-toggle" type="button" id="hereToggle">' +
      '<span>Tällä paikalla: <strong>' + hereStock.length + ' erää</strong></span>' +
      '<span>' + (hereOpen ? '▾' : '▸') + '</span></button>';
    if (hereOpen) {
      const sorted = hereStock.slice().sort((a, b) =>
        String(a.products?.nimi).localeCompare(String(b.products?.nimi), 'fi', { numeric: true }));
      html += '<div class="here-list">' + sorted.map(it =>
        // Napautus valitsee saman tuotteen → nopea "lisää samaa"
        '<button class="here-row" type="button" data-product-id="' + esc(it.product_id) + '">' +
          '<span>' + esc(it.products?.nimi || '—') + ' <span class="dim">· ' + esc(TYPE_FI[it.type] || it.type) + '</span>' +
            (it.note ? '<span class="sub">⚠ ' + esc(it.note) + '</span>' : '') + '</span>' +
          '<span class="mitat">' + formatMitat(it) + '</span>' +
        '</button>').join('') + '</div>';
    }
    box.innerHTML = html;
  }

  function chooseProduct(p) {
    currentProduct = p;
    addRecentProduct(p.id);
    document.getElementById('productSearch').value = '';
    document.getElementById('chosenCard').innerHTML =
      '<div class="np-name">' + esc(p.nimi) + '</div>' +
      '<div class="dim" style="margin-top:4px">' + esc(p.laji) + ' · ' + esc(p.unit || '') + '</div>';
    startAmount();
    showScreen('amount');
  }

  // ═══ RUUTU 3: MITAT, MÄÄRÄ JA TALLENNUS ═══════════════

  // Aloittaa ruudun 3 tyhjältä pöydältä (tai säilyttää arvot "Tallenna + samanlainen" -napin jälkeen)
  function startAmount(keep) {
    const p = currentProduct;
    const isPelti = p.laji === 'pelti';
    document.getElementById('amPelti').hidden   = !isPelti;
    document.getElementById('amTarvike').hidden = isPelti;

    if (!keep) {
      am = { type: 'ROLL', length: '', width: '', estimated: false, count: '1', qty: '1', note: '' };
      document.getElementById('amNote').value = '';
      document.getElementById('amEstimated').checked = false;
    }
    if (isPelti) {
      ['amLength','amWidth'].forEach(id => { if (!keep) document.getElementById(id).value = ''; });
      document.getElementById('amCount').value = '1';
      am.count = '1';
      if (keep) { am.note = ''; document.getElementById('amNote').value = ''; }
      renderAmountPelti();
    } else {
      document.getElementById('amQty').value = keep ? am.qty : '1';
      if (!keep) am.qty = '1';
      renderAmountTarvike();
    }
    renderAmPreview();
  }

  // Leveydelle pikanapit: viimeksi käytetyt + yleisimmät
  function widthChips() {
    const used = lsGet(LS_RECENT_WIDTHS, []);
    const common = [1250, 1200, 1000, 625];
    return [...new Set([...used, ...common])].slice(0, 6);
  }

  function renderAmountPelti() {
    document.querySelectorAll('#amTypeSeg button').forEach(b => b.classList.toggle('active', b.dataset.value === am.type));
    const isRoll = am.type === 'ROLL';
    // Rullan pituus metreinä (kymmeniä metrejä), levyn ja siivun millimetreinä
    document.getElementById('amLengthLabel').textContent = isRoll ? 'PITUUS (m)' : 'PITUUS (mm)';
    document.getElementById('amLength').placeholder = isRoll ? 'esim. 40' : 'esim. 2500';
    document.getElementById('amEstRow').hidden = !isRoll;
    document.getElementById('amCountHint').textContent =
      Number(am.count) > 1 ? 'Tallentaa ' + Number(am.count) + ' erillistä riviä, jokaisella omat mitat.' : '';
    document.getElementById('amWidthChips').innerHTML = widthChips().map(w =>
      '<button class="chip' + (String(w) === String(parseNum(am.width)) ? ' selected' : '') +
      '" type="button" data-am="width" data-value="' + w + '">' + w + '</button>').join('');
  }

  function renderAmountTarvike() {
    // Jos samaa tuotetta on jo tällä paikalla, näytetään nykyinen määrä ja +1 / −1
    const ex = existingHere();
    document.getElementById('amExisting').hidden = !ex;
    document.getElementById('amNewQty').hidden   = !!ex;
    const unit = currentProduct.unit === 'm' ? 'm' : 'kpl';
    if (ex) {
      const q = itemQuantity(ex.item);
      document.getElementById('amExistingQty').textContent  = q != null ? formatQty(q) : '—';
      document.getElementById('amExistingUnit').textContent = unit;
      document.getElementById('amSetQty').value = '';
      if (ex.extra) {
        showToast('Huom: tällä paikalla on ' + (ex.extra + 1) + ' riviä samaa tuotetta — korjaa pöytäkoneella', 'error');
      }
    } else {
      document.getElementById('amQtyLabel').textContent = 'MÄÄRÄ (' + unit + ')';
    }
  }

  // Saman tuotteen ACTIVE-rivi tällä paikalla (tuplat: päivitetään ensimmäistä ja varoitetaan)
  function existingHere() {
    if (!currentProduct || currentProduct.laji === 'pelti') return null;
    const rows = hereStock.filter(i => i.product_id === currentProduct.id && (i.type === 'ITEM' || i.type === 'BULK'));
    if (!rows.length) return null;
    return { item: rows[0], extra: rows.length - 1 };
  }

  // Mitä tallennetaan: rivit tietokantaan + virheteksti, jos jotain puuttuu
  function amResult() {
    const p = currentProduct;
    if (p.laji !== 'pelti') {
      const unit = p.unit === 'm' ? 'm' : 'kpl';
      const qty = parseNum(am.qty);
      if (qty == null || qty <= 0) return { error: 'Anna määrä' };
      return { kind: 'tarvike', type: unit === 'm' ? 'BULK' : 'ITEM', qty, unit,
               summary: formatQty(qty) + ' ' + unit };
    }
    const isRoll = am.type === 'ROLL';
    const lenRaw = parseNum(am.length);
    const width  = parseNum(am.width);
    const count  = parseInt(am.count, 10);
    if (lenRaw == null || lenRaw <= 0) return { error: isRoll ? 'Anna pituus metreinä' : 'Anna pituus millimetreinä' };
    if (width == null || width <= 0)   return { error: 'Anna leveys millimetreinä' };
    if (!(count >= 1))                 return { error: 'Määrän pitää olla vähintään 1' };
    // Rullan pituus metreistä millimetreiksi, jotta kaikki pituudet ovat tietokannassa samassa yksikössä
    const lengthMm = Math.round(isRoll ? lenRaw * 1000 : lenRaw);
    const lenTxt = isRoll ? (am.estimated ? '~' : '') + formatQty(lenRaw) + ' m' : formatQty(lenRaw) + ' mm';
    return { kind: 'pelti', type: am.type, lengthMm, width, count, estimated: isRoll && am.estimated,
             summary: (count > 1 ? count + ' × ' : '') + lenTxt + ' × ' + width + ' mm' };
  }

  function renderAmPreview() {
    const r = amResult();
    const box  = document.getElementById('amPreview');
    const save = document.getElementById('amSave');
    const same = document.getElementById('amSaveSame');
    const ex = existingHere();
    if (ex) {
      // Olemassa olevaa määrää muutetaan napeista, ei Tallenna-napista
      box.innerHTML = '<div class="dim">Määrän muutos tallentuu heti napista.</div>';
      save.hidden = true; same.hidden = true;
      return;
    }
    save.hidden = false;
    same.hidden = currentProduct.laji !== 'pelti';
    if (r.error) {
      box.innerHTML = '<div class="np-error">' + esc(r.error) + '</div>';
      save.disabled = true; same.disabled = true;
    } else {
      box.innerHTML = '<div class="dim">Tallennetaan paikalle ' + esc(currentLoc.code) + ':</div>' +
        '<div class="np-name">' + esc(currentProduct.nimi) + '</div>' +
        '<div class="mono" style="color:var(--accent);margin-top:4px">' + esc(r.summary) + '</div>' +
        (am.note.trim() ? '<div class="dim" style="margin-top:4px">⚠ ' + esc(am.note.trim()) + '</div>' : '');
      save.disabled = false; same.disabled = false;
    }
  }

  // ─── Tallennus ───────────────────────────────────────
  async function saveStock(keepValues) {
    const r = amResult();
    if (r.error) return;
    const save = document.getElementById('amSave');
    const same = document.getElementById('amSaveSame');
    save.disabled = true; same.disabled = true;
    const label = save.textContent;
    save.textContent = 'Tallennetaan…';

    try {
      const headers = await authHeaders();
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=representation';

      const rows = [];
      if (r.kind === 'tarvike') {
        rows.push({
          product_id: currentProduct.id, warehouse_id: WAREHOUSE_ID, location_id: currentLoc.id,
          type: r.type, status: 'ACTIVE', quantity: r.qty,
          note: am.note.trim() || null,
        });
      } else {
        for (let i = 0; i < r.count; i++) {
          rows.push({
            product_id: currentProduct.id, warehouse_id: WAREHOUSE_ID, location_id: currentLoc.id,
            type: r.type, status: 'ACTIVE', quantity: null,
            original_length_mm: r.lengthMm, remaining_length_mm: r.lengthMm,
            original_width_mm:  r.width,    remaining_width_mm:  r.width,
            length_estimated: r.estimated,
            note: am.note.trim() || null,
          });
        }
      }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?select=id,type,quantity,length_estimated,remaining_length_mm,remaining_width_mm,original_length_mm,original_width_mm,note,product_id`, {
        method: 'POST', headers, body: JSON.stringify(rows)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
      const created = await res.json();

      await logMovements(created.map(c => ({
        stock_item_id: c.id, movement_type: 'IN',
        remaining_length_after_mm: c.remaining_length_mm ?? null,
        remaining_width_after_mm:  c.remaining_width_mm  ?? null,
        reference_note: 'Lisätty ' + currentLoc.code + (r.kind === 'tarvike' ? ' · ' + r.summary : '') + (am.note.trim() ? ' · ' + am.note.trim() : ''),
      })));

      // Paikan sisältö ja leveyden pikanapit ajan tasalle
      created.forEach(c => hereStock.push({ ...c, products: { nimi: currentProduct.nimi } }));
      if (r.kind === 'pelti') rememberWidth(r.width);

      addSessionEntry({
        kind: 'insert',
        ids: created.map(c => c.id),
        at: Date.now(),
        name: currentProduct.nimi,
        sub: currentLoc.code + ' · ' + r.summary,
      });

      showToast('Tallennettu ✓', 'success');
      if (keepValues) {
        startAmount(true);                 // tuote, tyyppi ja mitat jäävät
      } else {
        showScreen(mode === 'inventoi' ? 'inventory' : 'product');   // takaisin sinne, mistä tultiin
        renderHere(false);
      }
    } catch (err) {
      showToast('Virhe: ' + err.message, 'error');
    } finally {
      save.textContent = label;
      renderAmPreview();
    }
  }

  function rememberWidth(w) {
    const list = lsGet(LS_RECENT_WIDTHS, []).filter(x => x !== w);
    list.unshift(w);
    lsSet(LS_RECENT_WIDTHS, list.slice(0, 4));
  }

  // Määrätavaran määrän muutos: päivitetään olemassa olevaa riviä, ei luoda uutta
  async function adjustExisting(delta, absolute) {
    const ex = existingHere();
    if (!ex) return;
    const before = itemQuantity(ex.item) ?? 0;
    const after  = absolute != null ? absolute : before + delta;
    if (after < 0) { showToast('Määrä ei voi olla negatiivinen', 'error'); return; }
    try {
      const headers = await authHeaders();
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=minimal';
      const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=eq.${ex.item.id}`, {
        method: 'PATCH', headers, body: JSON.stringify({ quantity: after })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
      ex.item.quantity = after;
      const unit = currentProduct.unit === 'm' ? 'm' : 'kpl';
      await logMovements([{ stock_item_id: ex.item.id, movement_type: 'ADJUST',
        reference_note: 'Määrä ' + formatQty(before) + ' → ' + formatQty(after) + ' ' + unit + ' · ' + currentLoc.code }]);
      addSessionEntry({
        kind: 'quantity', itemId: ex.item.id, before, at: Date.now(),
        name: currentProduct.nimi,
        sub: currentLoc.code + ' · ' + formatQty(before) + ' → ' + formatQty(after) + ' ' + unit,
      });
      renderAmountTarvike();
      showToast('Määrä: ' + formatQty(after) + ' ' + unit, 'success');
    } catch (err) {
      showToast('Virhe: ' + err.message, 'error');
    }
  }

  // ═══ RUUTU 4: INVENTOI ════════════════════════════════

  function fmtDate(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    return d.getDate() + '.' + (d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(2);
  }

  function renderInventory() {
    const sum  = document.getElementById('invSummary');
    const list = document.getElementById('invList');
    const rows = hereStock.slice().sort((a, b) =>
      String(a.products?.nimi).localeCompare(String(b.products?.nimi), 'fi', { numeric: true }));
    const nFound   = rows.filter(r => invMarks[r.id] === 'found').length;
    const nMissing = rows.filter(r => invMarks[r.id] === 'missing').length;
    const nOpen    = rows.length - nFound - nMissing;

    document.getElementById('invAllFound').hidden = !rows.length;
    document.getElementById('invFinish').hidden   = !rows.length;
    document.getElementById('invMoveAll').hidden  = !rows.length;

    if (!rows.length) {
      sum.innerHTML = 'Järjestelmän mukaan tällä paikalla <b>ei ole mitään</b>.';
      list.innerHTML = '<div class="inv-empty">Jos hyllyssä kuitenkin on tavaraa, lisää se alta.</div>';
      return;
    }
    sum.innerHTML = 'Järjestelmän mukaan <b>' + rows.length + ' erää</b>' +
      ' · <span style="color:var(--ok)">' + nFound + ' löytyi</span>' +
      ' · <span style="color:var(--danger)">' + nMissing + ' puuttuu</span>' +
      (nOpen ? ' · ' + nOpen + ' avoinna' : '');

    list.innerHTML = rows.map(it => {
      const mark = invMarks[it.id];
      const checked = fmtDate(it.checked_at);
      const isEdit = invEditId === it.id;
      const isCut  = invCutId === it.id;
      return '<div class="inv-row ' + (mark || '') + '">' +
        '<div class="inv-top"><div>' +
          '<div class="inv-name">' + esc(it.products?.nimi || '—') + '</div>' +
          '<div class="inv-meta">' + esc(TYPE_FI[it.type] || it.type) +
            (checked ? ' · inventoitu ' + checked : ' · ei inventoitu') +
            (it.note ? '<br>⚠ ' + esc(it.note) : '') + '</div>' +
        '</div><div class="inv-mitat">' + formatMitat(it) + '</div></div>' +
        '<div class="inv-btns">' +
          '<button class="inv-btn' + (mark === 'found' ? ' on-found' : '') + '" type="button" data-inv-mark="found" data-inv-id="' + esc(it.id) + '">✓ Löytyi</button>' +
          '<button class="inv-btn' + (mark === 'missing' ? ' on-missing' : '') + '" type="button" data-inv-mark="missing" data-inv-id="' + esc(it.id) + '">✗ Ei löydy</button>' +
          '<button class="inv-btn' + (isEdit ? ' on-edit' : '') + '" type="button" data-inv-edit="' + esc(it.id) + '">✎ Korjaa</button>' +
        '</div>' +
        '<div class="inv-btns2">' +
          (isPelti(it) ? '<button class="inv-btn' + (isCut ? ' on-edit' : '') + '" type="button" data-inv-cut="' + esc(it.id) + '">✂ Leikkaa</button>' : '<span></span>') +
          '<button class="inv-btn" type="button" data-inv-move="' + esc(it.id) + '">⇄ Siirrä tämä</button>' +
        '</div>' +
        (isEdit ? invEditHtml(it) : '') +
        (isCut ? invCutHtml(it) : '') +
      '</div>';
    }).join('');
    if (invEditId || (invCutId && !cut?.returned)) {
      const el = list.querySelector('.inv-edit input');
      if (el) el.focus();
    }
    if (cut) cut.returned = false;
  }
  function isPelti(it) { return it.type === 'ROLL' || it.type === 'SHEET' || it.type === 'OFFCUT'; }

  // Korjauslomake: muuttaa vain remaining_* tai quantity, ei koskaan alkuperäisiä mittoja
  function invEditHtml(it) {
    if (it.type === 'ITEM' || it.type === 'BULK') {
      const q = itemQuantity(it);
      return '<div class="inv-edit">' +
        '<label class="form-label">OIKEA MÄÄRÄ (' + (it.type === 'BULK' ? 'm' : 'kpl') + ')</label>' +
        '<input class="text-input num-input" id="invQty" type="text" inputmode="decimal" value="' + esc(q != null ? formatQty(q) : '') + '">' +
        '<div class="inv-edit-btns"><button class="primary-btn" type="button" id="invEditSave">Tallenna</button>' +
        '<button class="secondary-btn" type="button" id="invEditCancel">Peru</button></div></div>';
    }
    const isRoll = it.type === 'ROLL';
    const l = it.remaining_length_mm ?? it.original_length_mm;
    const w = it.remaining_width_mm ?? it.original_width_mm;
    return '<div class="inv-edit">' +
      '<label class="form-label">PITUUS (' + (isRoll ? 'm' : 'mm') + ')</label>' +
      '<input class="text-input num-input" id="invLen" type="text" inputmode="decimal" value="' + esc(l != null ? (isRoll ? formatQty(l / 1000) : l) : '') + '">' +
      (isRoll ? '<label class="check-row"><input type="checkbox" id="invEst"' + (it.length_estimated ? ' checked' : '') + '> Arvio (ei mitattu)</label>' : '') +
      '<label class="form-label">LEVEYS (mm)</label>' +
      '<input class="text-input num-input" id="invWid" type="text" inputmode="numeric" value="' + esc(w ?? '') + '">' +
      '<div class="inv-edit-btns"><button class="primary-btn" type="button" id="invEditSave">Tallenna</button>' +
      '<button class="secondary-btn" type="button" id="invEditCancel">Peru</button></div></div>';
  }

  async function saveInvEdit() {
    const it = hereStock.find(i => i.id === invEditId);
    if (!it) return;
    const patch = {};
    if (it.type === 'ITEM' || it.type === 'BULK') {
      const q = parseNum(document.getElementById('invQty').value);
      if (q == null || q < 0) { showToast('Anna määrä', 'error'); return; }
      patch.quantity = q;
    } else {
      const isRoll = it.type === 'ROLL';
      const l = parseNum(document.getElementById('invLen').value);
      const w = parseNum(document.getElementById('invWid').value);
      if (l == null || l <= 0 || w == null || w <= 0) { showToast('Anna pituus ja leveys', 'error'); return; }
      patch.remaining_length_mm = Math.round(isRoll ? l * 1000 : l);
      patch.remaining_width_mm  = Math.round(w);
      if (isRoll) patch.length_estimated = !!document.getElementById('invEst').checked;
    }
    try {
      const headers = await authHeaders();
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=minimal';
      const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=eq.${it.id}`, { method: 'PATCH', headers, body: JSON.stringify(patch) });
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
      Object.assign(it, patch);
      await logMovements([{ stock_item_id: it.id, movement_type: 'ADJUST',
        remaining_length_after_mm: it.remaining_length_mm ?? null,
        remaining_width_after_mm:  it.remaining_width_mm  ?? null,
        reference_note: patch.quantity != null ? 'Inventointi: määrä → ' + formatQty(patch.quantity) : 'Inventointi: mitat korjattu' }]);
      invMarks[it.id] = 'found';      // korjattu = nähty hyllyssä
      invEditId = null;
      renderInventory();
      showToast('Korjattu ✓', 'success');
    } catch (err) {
      showToast('Virhe: ' + err.message, 'error');
    }
  }

  // "Paikka inventoitu": löytyneet leimataan, puuttuvat arkistoidaan — vasta tässä tapahtuu jotain
  async function finishInventory() {
    const found   = hereStock.filter(r => invMarks[r.id] === 'found').map(r => r.id);
    const missing = hereStock.filter(r => invMarks[r.id] === 'missing').map(r => r.id);
    const open    = hereStock.length - found.length - missing.length;
    if (!found.length && !missing.length) { showToast('Merkitse ensin rivit', 'error'); return; }
    let msg = found.length + ' riviä leimataan löytyneeksi.';
    if (missing.length) msg += '\n' + missing.length + ' riviä ARKISTOIDAAN (poistuu varastosta).';
    if (open) msg += '\n' + open + ' riviä ilman merkintää jätetään ennalleen.';
    if (!confirm(msg + '\n\nJatketaanko?')) return;

    const btn = document.getElementById('invFinish');
    btn.disabled = true;
    try {
      const headers = await authHeaders();
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=minimal';
      const now = new Date().toISOString();
      if (found.length) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=in.(${found.join(',')})`,
          { method: 'PATCH', headers, body: JSON.stringify({ checked_at: now }) });
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
      }
      if (missing.length) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=in.(${missing.join(',')})`,
          { method: 'PATCH', headers, body: JSON.stringify({ status: 'ARCHIVED', checked_at: now }) });
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
        await logMovements(missing.map(id => ({ stock_item_id: id, movement_type: 'ARCHIVE', reference_note: 'Inventointi: ei löytynyt paikasta ' + currentLoc.code })));
        addSessionEntry({ kind: 'archive', ids: missing, at: Date.now(),
          name: 'Inventointi: ' + missing.length + ' riviä arkistoitu', sub: currentLoc.code });
      }
      showToast('Paikka ' + currentLoc.code + ' inventoitu ✓', 'success');
      invMarks = {};
      await loadHereStock();
    } catch (err) {
      showToast('Virhe: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ─── Siirto: kaikki rivit tai yksi rivi ──────────────
  function startMove(ids, label) {
    if (!ids.length) return;
    const from = currentLoc;
    pendingPick = {
      onPick: target => doMove(ids, from, target),
    };
    document.getElementById('moveBanner').innerHTML =
      '⇄ Siirretään <b>' + esc(label) + '</b> paikasta <b class="mono">' + esc(from.code) + '</b>.<br>Valitse kohdepaikka. ' +
      '<button class="undo-btn" type="button" id="pickCancel" style="margin-top:8px">Peru</button>';
    showScreen('place');
  }
  function startMoveAll() { startMove(hereStock.map(r => r.id), hereStock.length + ' erää'); }
  function startMoveOne(id) {
    const it = hereStock.find(r => r.id === id);
    if (it) startMove([id], (it.products?.nimi || 'erä') + ' (' + (TYPE_FI[it.type] || it.type) + ')');
  }

  async function doMove(ids, from, target) {
    if (target.id === from.id) { showToast('Sama paikka — ei siirretty', 'error'); showScreen('inventory'); return; }
    const all = ids.length === hereStock.length;
    if (!confirm('Siirretäänkö ' + ids.length + ' erää\n' + from.code + ' → ' + target.code + '?')) { showScreen('inventory'); return; }
    try {
      const headers = await authHeaders();
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=minimal';
      const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=in.(${ids.join(',')})`,
        { method: 'PATCH', headers, body: JSON.stringify({ location_id: target.id }) });
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
      await logMovements(ids.map(id => ({ stock_item_id: id, movement_type: 'TRANSFER', reference_note: from.code + ' → ' + target.code })));
      addSessionEntry({ kind: 'move', ids, fromId: from.id, at: Date.now(),
        name: 'Siirto: ' + ids.length + ' erää', sub: from.code + ' → ' + target.code });
      showToast('Siirretty paikkaan ' + target.code + ' ✓', 'success');
      // Kaikki siirrettiin → jatketaan kohdepaikassa. Yksi siirrettiin → jäädään tähän paikkaan.
      if (all) { invMarks = {}; selectFinal(target); }
      else { ids.forEach(id => delete invMarks[id]); showScreen('inventory'); loadHereStock(); }
    } catch (err) {
      showToast('Virhe: ' + err.message, 'error');
      showScreen('inventory');
    }
  }

  // ─── Leikkaus: rullasta/levystä otetaan osa, ylijäämäpala varastoon emoon linkitettynä ──
  function startCut(id) {
    const it = hereStock.find(r => r.id === id);
    if (!it) return;
    if (invCutId === id) { invCutId = null; cut = null; renderInventory(); return; }
    invEditId = null;
    invCutId = id;
    cut = { taken: '', makeOff: false, offLen: '', offWid: '', offLocId: currentLoc.id, note: '', returned: false };
    renderInventory();
  }

  // Rulla: otettu pituus metreinä → remaining_length pienenee.
  // Levy/siivu: otettu leveys millimetreinä koko pituudelta → remaining_width pienenee (remaining-malli).
  function cutCalc(it) {
    const isRoll = it.type === 'ROLL';
    const have = isRoll ? (it.remaining_length_mm ?? it.original_length_mm) : (it.remaining_width_mm ?? it.original_width_mm);
    const takenRaw = parseNum(cut.taken);
    const takenMm = takenRaw == null ? null : Math.round(isRoll ? takenRaw * 1000 : takenRaw);
    const left = takenMm == null ? null : have - takenMm;
    return { isRoll, have, takenMm, left };
  }

  function invCutHtml(it) {
    const c = cutCalc(it);
    const unit = c.isRoll ? 'm' : 'mm';
    let calc = '';
    if (c.takenMm != null) {
      if (c.takenMm <= 0) calc = '<div class="cut-calc bad">Anna otettu määrä</div>';
      else if (c.left < 0) calc = '<div class="cut-calc bad">Ei riitä: ' + (c.isRoll ? 'rullassa' : 'levyssä') + ' on vain ' + (c.isRoll ? formatQty(c.have / 1000) + ' m' : c.have + ' mm') + '</div>';
      else if (c.left === 0) calc = '<div class="cut-calc">' + (c.isRoll ? 'Rulla' : 'Levy') + ' käytetään kokonaan → merkitään käytetyksi</div>';
      else calc = '<div class="cut-calc">' + (c.isRoll ? 'Rullaan jää ' + formatQty(c.left / 1000) + ' m' : 'Levyyn jää ' + c.left + ' mm leveyttä') + '</div>';
    }
    const offLoc = locById.get(cut.offLocId) || currentLoc;
    return '<div class="inv-edit">' +
      '<label class="form-label">' + (c.isRoll ? 'OTETTU RULLASTA (m)' : 'OTETTU LEVEYS (mm, koko pituudelta)') + '</label>' +
      '<input class="text-input num-input" id="cutTaken" type="text" inputmode="decimal" value="' + esc(cut.taken) + '" placeholder="' + (c.isRoll ? 'esim. 3' : 'esim. 350') + '">' +
      calc +
      '<label class="check-row"><input type="checkbox" id="cutMakeOff"' + (cut.makeOff ? ' checked' : '') + '> Otetusta jää pala varastoon</label>' +
      (cut.makeOff ?
        '<label class="form-label">PALAN PITUUS (mm)</label>' +
        '<input class="text-input num-input" id="cutOffLen" type="text" inputmode="numeric" value="' + esc(cut.offLen) + '" placeholder="esim. 3000">' +
        '<label class="form-label">PALAN LEVEYS (mm)</label>' +
        '<input class="text-input num-input" id="cutOffWid" type="text" inputmode="numeric" value="' + esc(cut.offWid) + '" placeholder="esim. 350">' +
        '<label class="form-label">PALAN PAIKKA</label>' +
        '<div class="cut-loc"><span><span class="code">' + esc(offLoc.code) + '</span> ' + esc(displayName(offLoc)) + '</span>' +
        '<button type="button" id="cutPickLoc">Vaihda</button></div>' +
        '<label class="form-label">HUOMIO (valinnainen)</label>' +
        '<input class="text-input" id="cutNote" type="text" value="' + esc(cut.note) + '" placeholder="esim. naarmu reunassa" autocapitalize="sentences">'
      : '') +
      '<div class="inv-edit-btns"><button class="primary-btn" type="button" id="cutSave">Tallenna leikkaus</button>' +
      '<button class="secondary-btn" type="button" id="cutCancel">Peru</button></div></div>';
  }

  function startCutPickLoc() {
    const it = hereStock.find(r => r.id === invCutId);
    pendingPick = {
      onPick: loc => { cut.offLocId = loc.id; cut.returned = true; showScreen('inventory'); },
    };
    document.getElementById('moveBanner').innerHTML =
      '✂ Mihin paikkaan <b>' + esc(it?.products?.nimi || 'pala') + '</b> -pala laitetaan?<br>' +
      '<button class="undo-btn" type="button" id="pickCancel" style="margin-top:8px">Peru</button>';
    showScreen('place');
  }

  async function saveCut() {
    const it = hereStock.find(r => r.id === invCutId);
    if (!it) return;
    const c = cutCalc(it);
    if (c.takenMm == null || c.takenMm <= 0) { showToast('Anna otettu määrä', 'error'); return; }
    if (c.left < 0) { showToast('Otettu määrä on suurempi kuin varastossa', 'error'); return; }
    let off = null;
    if (cut.makeOff) {
      const l = parseNum(cut.offLen), w = parseNum(cut.offWid);
      if (!(l > 0) || !(w > 0)) { showToast('Anna palan pituus ja leveys', 'error'); return; }
      off = { l: Math.round(l), w: Math.round(w) };
    }
    const parentPatch = c.isRoll ? { remaining_length_mm: c.left } : { remaining_width_mm: c.left };
    if (c.left === 0) parentPatch.status = 'USED';
    const before = { remaining_length_mm: it.remaining_length_mm, remaining_width_mm: it.remaining_width_mm, status: 'ACTIVE' };

    const btn = document.getElementById('cutSave');
    btn.disabled = true;
    try {
      const headers = await authHeaders();
      headers['Content-Type'] = 'application/json';
      // 1) Emo pienenee
      const r1 = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=eq.${it.id}`,
        { method: 'PATCH', headers: { ...headers, 'Prefer': 'return=minimal' }, body: JSON.stringify(parentPatch) });
      if (!r1.ok) throw new Error('HTTP ' + r1.status + ': ' + await r1.text());
      Object.assign(it, parentPatch);

      // 2) Ylijäämäpala uutena OFFCUT-rivinä, viittaus emoon
      let offIds = [];
      if (off) {
        const r2 = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?select=id`, {
          method: 'POST', headers: { ...headers, 'Prefer': 'return=representation' },
          body: JSON.stringify({
            product_id: it.product_id, warehouse_id: WAREHOUSE_ID, location_id: cut.offLocId,
            type: 'OFFCUT', status: 'ACTIVE', quantity: null,
            original_length_mm: off.l, remaining_length_mm: off.l,
            original_width_mm:  off.w, remaining_width_mm:  off.w,
            length_estimated: false,
            parent_stock_item_id: it.id,
            note: cut.note.trim() || null,
          })
        });
        if (!r2.ok) throw new Error('Pala: HTTP ' + r2.status + ': ' + await r2.text());
        offIds = (await r2.json()).map(x => x.id);
      }

      const offLoc = locById.get(cut.offLocId);
      const logs = [{
        stock_item_id: it.id, movement_type: 'CUT',
        length_used_mm: c.isRoll ? c.takenMm : null,
        width_used_mm:  c.isRoll ? null : c.takenMm,
        remaining_length_after_mm: it.remaining_length_mm ?? null,
        remaining_width_after_mm:  it.remaining_width_mm  ?? null,
        reference_note: (c.left === 0 ? 'Käytetty loppuun' : 'Leikattu') + (off ? ' · pala ' + off.l + '×' + off.w + ' → ' + (offLoc?.code || '') : ''),
      }];
      offIds.forEach(id => logs.push({
        stock_item_id: id, movement_type: 'IN',
        remaining_length_after_mm: off.l, remaining_width_after_mm: off.w,
        reference_note: 'Ylijäämäpala leikkauksesta · ' + (offLoc?.code || ''),
      }));
      await logMovements(logs);
      addSessionEntry({ kind: 'cut', parentId: it.id, before, offIds, at: Date.now(),
        name: 'Leikkaus: ' + (it.products?.nimi || ''),
        sub: (c.isRoll ? '−' + formatQty(c.takenMm / 1000) + ' m' : '−' + c.takenMm + ' mm') +
             (off ? ' · pala ' + off.l + '×' + off.w + ' → ' + (offLoc?.code || '') : '') });
      showToast('Leikkaus tallennettu ✓', 'success');
      invCutId = null; cut = null;
      invMarks[it.id] = c.left === 0 ? undefined : 'found';
      await loadHereStock();
    } catch (err) {
      showToast('Virhe: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ─── Tällä kerralla lisätty + kumoa ──────────────────
  function addSessionEntry(entry) {
    sessionLog.unshift(entry);
    renderSession();
  }

  function renderSession() {
    const bar = document.getElementById('sessionBar');
    const spacer = document.getElementById('sessionSpacer');
    if (!sessionLog.length) { bar.hidden = true; spacer.hidden = true; return; }
    bar.hidden = false; spacer.hidden = false;
    document.getElementById('sessionCount').textContent = sessionLog.length;
    document.getElementById('sessionArrow').textContent = sessionOpen ? '▾' : '▴';
    const list = document.getElementById('sessionList');
    list.hidden = !sessionOpen;
    if (!sessionOpen) return;
    list.innerHTML = sessionLog.map((e, i) =>
      '<div class="session-row">' +
        '<div class="srow-main"><div class="srow-name">' + esc(e.name) + '</div>' +
        '<div class="srow-sub">' + esc(e.sub) + '</div></div>' +
        '<button class="undo-btn" type="button" data-undo="' + i + '">Kumoa</button>' +
      '</div>').join('');
  }

  async function undoEntry(index) {
    const e = sessionLog[index];
    if (!e) return;
    try {
      const headers = await authHeaders();
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=minimal';

      if (e.kind === 'cut') {
        // Emo takaisin entisiin mittoihin; pala pois (tuore → poisto, vanha → arkisto)
        const r1 = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=eq.${e.parentId}`,
          { method: 'PATCH', headers, body: JSON.stringify(e.before) });
        if (!r1.ok) throw new Error('HTTP ' + r1.status + ': ' + await r1.text());
        await logMovements([{ stock_item_id: e.parentId, movement_type: 'ADJUST',
          remaining_length_after_mm: e.before.remaining_length_mm ?? null, remaining_width_after_mm: e.before.remaining_width_mm ?? null,
          reference_note: 'Kumottu: leikkaus' }]);
        if (e.offIds.length) {
          const idList = '(' + e.offIds.join(',') + ')';
          const fresh = Date.now() - e.at < 60 * 60 * 1000;
          const r2 = fresh
            ? await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=in.${idList}`, { method: 'DELETE', headers })
            : await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=in.${idList}`, { method: 'PATCH', headers, body: JSON.stringify({ status: 'ARCHIVED' }) });
          if (!r2.ok) throw new Error('HTTP ' + r2.status + ': ' + await r2.text());
        }
        sessionLog.splice(index, 1);
        renderSession();
        await loadHereStock();
        showToast('Kumottu ✓', 'success');
        return;
      }
      if (e.kind === 'archive' || e.kind === 'move') {
        // Inventoinnin arkistointi → takaisin ACTIVE; siirto → takaisin lähtöpaikkaan
        const body = e.kind === 'archive' ? { status: 'ACTIVE' } : { location_id: e.fromId };
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=in.(${e.ids.join(',')})`, {
          method: 'PATCH', headers, body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
        await logMovements(e.ids.map(id => e.kind === 'archive'
          ? { stock_item_id: id, movement_type: 'ADJUST', reference_note: 'Kumottu: arkistointi → takaisin varastoon' }
          : { stock_item_id: id, movement_type: 'TRANSFER', reference_note: 'Kumottu siirto → ' + (locById.get(e.fromId)?.code || '') }));
        sessionLog.splice(index, 1);
        renderSession();
        await loadHereStock();
        showToast('Kumottu ✓', 'success');
        return;
      }
      if (e.kind === 'quantity') {
        // Määrän muutos: palautetaan edellinen määrä
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=eq.${e.itemId}`, {
          method: 'PATCH', headers, body: JSON.stringify({ quantity: e.before })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
        const row = hereStock.find(i => i.id === e.itemId);
        if (row) row.quantity = e.before;
        await logMovements([{ stock_item_id: e.itemId, movement_type: 'ADJUST', reference_note: 'Kumottu: määrä → ' + formatQty(e.before) }]);
      } else {
        // Lisäys: alle tunnin vanhat rivit poistetaan kokonaan (ei jätetä roskaa),
        // vanhemmat arkistoidaan, koska poisto-oikeus kattaa vain tuoreet rivit
        const idList = '(' + e.ids.join(',') + ')';
        const fresh  = Date.now() - e.at < 60 * 60 * 1000;
        const res = fresh
          ? await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=in.${idList}`, { method: 'DELETE', headers })
          : await fetch(`${SUPABASE_URL}/rest/v1/stock_items?id=in.${idList}`, {
              method: 'PATCH', headers, body: JSON.stringify({ status: 'ARCHIVED' }) });
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
        if (!fresh) await logMovements(e.ids.map(id => ({ stock_item_id: id, movement_type: 'ARCHIVE', reference_note: 'Kumottu lisäys (yli tunnin vanha → arkistoitu)' })));
        hereStock = hereStock.filter(i => !e.ids.includes(i.id));
      }

      sessionLog.splice(index, 1);
      renderSession();
      renderHere(false);
      if (!document.getElementById('screenAmount').hidden && currentProduct?.laji !== 'pelti') renderAmountTarvike();
      showToast('Kumottu ✓', 'success');
    } catch (err) {
      showToast('Kumoaminen ei onnistunut: ' + err.message, 'error');
    }
  }

  // ═══ UUSI TUOTE ═══════════════════════════════════════

  // Värit nappeihin: kaikkien aktiivisten tuotteiden värit, RR-värit numerojärjestyksessä ensin
  function allColors() {
    const set = [...new Set(allProducts.map(p => p.color).filter(Boolean))];
    const rrNum = c => { const m = /^RR\s*(\d+)/i.exec(c); return m ? Number(m[1]) : null; };
    return set.sort((a, b) => {
      const na = rrNum(a), nb = rrNum(b);
      if (na != null && nb != null) return na - nb;
      if (na != null) return -1;
      if (nb != null) return 1;
      return a.localeCompare(b, 'fi');
    });
  }
  function peltiMaterials() {
    return [...new Set(allProducts.filter(p => p.laji === 'pelti').map(p => p.material).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'fi'));
  }
  // Paksuudet valitulle materiaalille (tai kaikki pellin paksuudet, jos materiaali on uusi)
  function thicknessesFor(material) {
    const pelti = allProducts.filter(p => p.laji === 'pelti' && p.thickness_mm);
    const own = pelti.filter(p => norm(p.material) === norm(material));
    return [...new Set((own.length ? own : pelti).map(p => Number(p.thickness_mm)))].sort((a, b) => a - b);
  }

  // Poistaa värin tekstistä: "kateruuvi 4,8x35 rr23" − "RR 23" → "kateruuvi 4,8x35"
  function removeColorText(text, color) {
    const pattern = norm(color).split('').map(ch => ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('[\\s\\-]*');
    return text.replace(new RegExp(pattern, 'i'), '').replace(/\s+/g, ' ').trim();
  }
  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  // Avaa lomakkeen hakusanasta: arvataan materiaali, väri ja laji, jotta kirjoitettavaa jää vähän
  function openNewFromQuery(query) {
    const q  = query.trim();
    const qn = norm(q);

    // Pisin olemassa oleva materiaali, jolla hakusana alkaa (esim. "Kateruuvi 4,8x35")
    let best = null;
    [...new Set(allProducts.map(p => p.material).filter(Boolean))].forEach(m => {
      const mn = norm(m);
      if (mn && qn.startsWith(mn) && (!best || mn.length > norm(best).length)) best = m;
    });
    const rest = best ? qn.slice(norm(best).length) : qn;

    // Väri, joka löytyy hakusanan lopusta (esim. "rr33" → "RR 33")
    let color = '';
    allColors().forEach(c => {
      const cn = norm(c);
      if (cn && rest.includes(cn) && (!color || cn.length > norm(color).length)) color = c;
    });

    const bestProd = best ? allProducts.find(p => p.material === best) : null;
    const laji = bestProd ? bestProd.laji : 'tarvike';
    let name = best || capitalize(color ? removeColorText(q, color) : q);

    openNewProduct({
      laji,
      material: laji === 'pelti' ? (best || '') : '',
      name:     laji === 'tarvike' ? name : '',
      unit:     bestProd && laji === 'tarvike' ? bestProd.unit : 'kpl',
      color,
    });
  }

  // "+ Kateruuvi 4,8x35 — uusi väri": nimi valmiina, väri valitaan
  function openNewVariant(p) {
    openNewProduct({
      laji:     p.laji,
      material: p.laji === 'pelti' ? p.material : '',
      name:     p.laji === 'tarvike' ? p.material : '',
      unit:     p.laji === 'tarvike' ? p.unit : 'kpl',
      color:    '',
    });
  }

  function openNewProduct(opts) {
    np = {
      laji:       opts.laji || 'tarvike',
      material:   opts.material || '',
      name:       opts.name || '',
      unit:       opts.unit === 'm' ? 'm' : 'kpl',
      color:      opts.color || '',   // '' = ei vielä valittu, '__none' = ei väriä, '__other' = muu
      colorOther: '',
      thickness:  '',
    };
    document.getElementById('npMaterial').value   = np.material;
    document.getElementById('npName').value       = np.name;
    document.getElementById('npThickness').value  = '';
    document.getElementById('npColorOther').value = '';
    showScreen('newProduct');
    renderNewProduct();
  }

  function chipHtml(field, value, label, selected, extraClass) {
    return '<button class="chip' + (selected ? ' selected' : '') + (extraClass ? ' ' + extraClass : '') +
      '" type="button" data-np="' + field + '" data-value="' + esc(value) + '">' + esc(label) + '</button>';
  }

  // Lomakkeen tulos: mitä tietokantaan tallennettaisiin + mahdollinen virhe
  function npResult() {
    const isPelti = np.laji === 'pelti';
    const material = (isPelti ? np.material : np.name).trim();
    const unit     = isPelti ? 'm²' : np.unit;
    const thick    = isPelti ? parseNum(np.thickness) : 0;
    let color, error = null;

    if (np.color === '__none')       color = null;
    else if (np.color === '__other') color = np.colorOther.trim() || undefined;
    else                             color = np.color || undefined;

    if (!material)                           error = isPelti ? 'Valitse tai kirjoita materiaali' : 'Kirjoita nimi';
    else if (isPelti && !(thick > 0))        error = 'Anna paksuus';
    else if (color === undefined)            error = np.color === '__other' ? 'Kirjoita väri' : 'Valitse väri (tai "Ei väriä")';

    const nimi = generoiNimi(material, color, thick, unit);
    const dup  = !error ? allProducts.find(p => norm(p.nimi) === norm(nimi)) : null;
    return { material, color: color ?? null, unit, thick, nimi, error, dup };
  }

  function renderNewProduct() {
    const isPelti = np.laji === 'pelti';
    document.querySelectorAll('#npLajiSeg button').forEach(b => b.classList.toggle('active', b.dataset.value === np.laji));
    document.querySelectorAll('#npUnitSeg button').forEach(b => b.classList.toggle('active', b.dataset.value === np.unit));
    document.getElementById('npPelti').hidden   = !isPelti;
    document.getElementById('npTarvike').hidden = isPelti;

    if (isPelti) {
      document.getElementById('npMaterialChips').innerHTML = peltiMaterials()
        .map(m => chipHtml('material', m, m, norm(m) === norm(np.material))).join('');
      document.getElementById('npThickChips').innerHTML = thicknessesFor(np.material)
        .map(t => chipHtml('thickness', fmtThick(t), fmtThick(t), parseNum(np.thickness) === t)).join('');
    }

    document.getElementById('npColorChips').innerHTML =
      chipHtml('color', '__none', 'Ei väriä', np.color === '__none', 'chip-muted') +
      allColors().map(c => chipHtml('color', c, c, np.color === c)).join('') +
      chipHtml('color', '__other', 'Muu…', np.color === '__other', 'chip-muted');
    document.getElementById('npColorOther').hidden = np.color !== '__other';

    renderNpPreview();
  }

  function renderNpPreview() {
    const r = npResult();
    const box = document.getElementById('npPreview');
    const btn = document.getElementById('npSave');
    if (r.error) {
      box.innerHTML = '<div class="np-error">' + esc(r.error) + '</div>' +
        (r.nimi ? '<div class="dim" style="margin-top:4px">Nimeksi tulossa: ' + esc(r.nimi) + '</div>' : '');
      btn.disabled = true;
    } else if (r.dup) {
      box.innerHTML = '<div class="np-dup">Tämä tuote on jo olemassa:</div>' +
        '<div class="np-name">' + esc(r.dup.nimi) + '</div>' +
        '<button class="secondary-btn" type="button" data-product-id="' + esc(r.dup.id) + '">Valitse se ▸</button>';
      btn.disabled = true;
    } else {
      box.innerHTML = '<div class="dim">Tuotteen nimeksi tulee:</div><div class="np-name">' + esc(r.nimi) + '</div>';
      btn.disabled = false;
    }
  }

  async function saveNewProduct() {
    const r = npResult();
    if (r.error || r.dup) return;
    const btn = document.getElementById('npSave');
    btn.disabled = true;
    btn.textContent = 'Tallennetaan…';
    try {
      const headers = await authHeaders();
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=representation';   // palauttaa luodun rivin (tarvitaan id)
      const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,nimi,laji,material,color,thickness_mm,unit`, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          material: r.material,
          color: r.color,
          thickness_mm: r.thick,
          unit: r.unit,
          default_vat_percent: 25.5,
          is_active: true,
          laji: lajiFromUnit(r.unit),
          nimi: r.nimi,
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
      const created = (await res.json())[0];
      allProducts.push(created);
      sortProducts();
      showToast('Tuote luotu: ' + created.nimi, 'success');
      chooseProduct(created);
    } catch (err) {
      showToast('Virhe: ' + err.message, 'error');
    } finally {
      btn.textContent = 'Luo tuote ja jatka';
      renderNpPreview();
    }
  }

  // ─── Taso- ja piikkivalinta ──────────────────────────
  function renderLevelView() {
    document.getElementById('placeSearchView').hidden = true;
    document.getElementById('levelView').hidden = false;

    const top  = pendingTop;
    const kids = childrenOf.get(top.id) || [];
    document.getElementById('levelTitle').innerHTML =
      '<span class="code">' + esc(top.code) + '</span>' + esc(top.name);

    const hint = document.getElementById('levelHint');
    const box  = document.getElementById('levelButtons');

    if (!isSpikeParent(top.id)) {
      // Hyllytasot: ylin hylly ylimpänä, lattia alimpana — kuten hyllykkö edessäsi
      hint.textContent = 'Valitse taso';
      box.innerHTML = '<div class="level-stack">' +
        kids.slice().reverse().map(k =>
          '<button class="level-btn" type="button" data-loc-id="' + esc(k.id) + '">' +
            '<span>' + esc(levelLabel(k)) + '</span>' +
            '<span class="lcode">' + esc(k.code) + '</span>' +
          '</button>').join('') +
        '</div>';
      window.scrollTo(0, 0);
      return;
    }

    // Piikit: koodin loppuosa "213" → rivi 2, piikki 13
    const rows = [...new Set(kids.map(k => lastPart(k.code)[0]))].sort();
    if (pendingRow == null && rows.length === 1) pendingRow = rows[0];

    if (pendingRow == null) {
      hint.textContent = 'Valitse rivi';
      box.innerHTML = '<div class="row-grid">' +
        rows.map(r => '<button class="num-btn" type="button" data-row="' + esc(r) + '">Rivi ' + esc(r) + '</button>').join('') +
        '</div>';
    } else {
      hint.textContent = 'Rivi ' + pendingRow + ' — valitse piikki';
      const inRow = kids.filter(k => lastPart(k.code)[0] === pendingRow);
      box.innerHTML = '<div class="num-grid">' +
        inRow.map(k => '<button class="num-btn" type="button" data-loc-id="' + esc(k.id) + '">' +
          esc(lastPart(k.code).slice(1)) + '</button>').join('') +
        '</div>';
    }
    window.scrollTo(0, 0);
  }

  function levelBack() {
    // Piikeissä takaisin rivivalintaan, jos rivejä on useampi
    if (pendingTop && pendingRow != null && isSpikeParent(pendingTop.id)) {
      const kids = childrenOf.get(pendingTop.id) || [];
      const rows = new Set(kids.map(k => lastPart(k.code)[0]));
      if (rows.size > 1) { pendingRow = null; renderLevelView(); return; }
    }
    showSearchView();
  }

  // ─── Tapahtumat ──────────────────────────────────────
  // Yksi kuuntelija koko sivulle: napin data-loc-id kertoo, mitä napautettiin.
  // (Turvallisempi kuin onclick="..."-tekstit, joissa lainausmerkit menevät helposti sekaisin.)
  document.addEventListener('click', e => {
    // Ruutu 2: tuotteen valinta
    const prodBtn = e.target.closest('[data-product-id]');
    if (prodBtn) {
      const p = allProducts.find(x => x.id === prodBtn.dataset.productId);
      if (p) chooseProduct(p);
      else showToast('Tuote ei ole enää käytössä', 'error');
      return;
    }
    if (e.target.closest('[data-new-product]')) {
      openNewFromQuery(document.getElementById('productSearch').value);
      return;
    }
    const variantBtn = e.target.closest('[data-new-variant]');
    if (variantBtn) {
      const p = allProducts.find(x => x.id === variantBtn.dataset.newVariant);
      if (p) openNewVariant(p);
      return;
    }
    if (e.target.closest('#hereToggle')) { hereOpen = !hereOpen; renderHere(false); return; }

    // Ruutu 3: tyyppi, leveyspikanappi, määrän +/− ja olemassa olevan määrän muutos
    const amBtn = e.target.closest('[data-am]');
    if (amBtn && am) {
      const field = amBtn.dataset.am, value = amBtn.dataset.value;
      am[field] = value;
      if (field === 'width') document.getElementById('amWidth').value = value;
      renderAmountPelti();
      renderAmPreview();
      return;
    }
    const qtyBtn = e.target.closest('[data-qty]');
    if (qtyBtn && am) {
      const isPelti = currentProduct.laji === 'pelti';
      const id = isPelti ? 'amCount' : 'amQty';
      const field = isPelti ? 'count' : 'qty';
      const step = Number(qtyBtn.dataset.qty);
      const next = Math.max(isPelti ? 1 : 0, (parseNum(am[field]) ?? 0) + step);
      am[field] = formatQty(next);
      document.getElementById(id).value = am[field];
      if (isPelti) renderAmountPelti();
      renderAmPreview();
      return;
    }
    const adjBtn = e.target.closest('[data-adj]');
    if (adjBtn) { adjustExisting(Number(adjBtn.dataset.adj)); return; }

    const undoBtn = e.target.closest('[data-undo]');
    if (undoBtn) { undoEntry(Number(undoBtn.dataset.undo)); return; }

    // Uusi tuote: valintanapit (laji, yksikkö, materiaali, paksuus, väri)
    const npBtn = e.target.closest('[data-np]');
    if (npBtn && np) {
      const field = npBtn.dataset.np, value = npBtn.dataset.value;
      np[field] = value;
      if (field === 'material')  document.getElementById('npMaterial').value = value;
      if (field === 'thickness') document.getElementById('npThickness').value = value;
      if (field === 'color' && value === '__other') setTimeout(() => document.getElementById('npColorOther').focus(), 0);
      renderNewProduct();
      return;
    }

    const locBtn = e.target.closest('[data-loc-id]');
    if (locBtn) {
      const loc = locById.get(locBtn.dataset.locId);
      if (!loc) return;
      // Tasonäkymässä napautus on aina lopullinen valinta
      if (pendingTop && loc.parent_location_id === pendingTop.id) selectFinal(loc);
      else pickLocation(loc);
      return;
    }
    const rowBtn = e.target.closest('[data-row]');
    if (rowBtn) { pendingRow = rowBtn.dataset.row; renderLevelView(); return; }

    const modeBtn = e.target.closest('[data-mode]');
    if (modeBtn) { setMode(modeBtn.dataset.mode); return; }

    // Ruutu 4: inventointi
    const markBtn = e.target.closest('[data-inv-mark]');
    if (markBtn) {
      const id = markBtn.dataset.invId, v = markBtn.dataset.invMark;
      invMarks[id] = invMarks[id] === v ? undefined : v;   // sama nappi uudestaan = poista merkintä
      if (invEditId === id) invEditId = null;
      renderInventory();
      return;
    }
    const editBtn = e.target.closest('[data-inv-edit]');
    if (editBtn) { invEditId = invEditId === editBtn.dataset.invEdit ? null : editBtn.dataset.invEdit; invCutId = null; cut = null; renderInventory(); return; }
    if (e.target.closest('#invEditCancel')) { invEditId = null; renderInventory(); return; }
    const cutBtn = e.target.closest('[data-inv-cut]');
    if (cutBtn) { startCut(cutBtn.dataset.invCut); return; }
    const moveOneBtn = e.target.closest('[data-inv-move]');
    if (moveOneBtn) { startMoveOne(moveOneBtn.dataset.invMove); return; }
    if (e.target.closest('#cutCancel'))  { invCutId = null; cut = null; renderInventory(); return; }
    if (e.target.closest('#cutSave'))    { saveCut(); return; }
    if (e.target.closest('#cutPickLoc')) { startCutPickLoc(); return; }
    if (e.target.closest('#invEditSave')) { saveInvEdit(); return; }
  });

  document.getElementById('placeBar').addEventListener('click', () => showScreen('place'));
  document.getElementById('levelBack').addEventListener('click', levelBack);
  document.getElementById('placeSearch').addEventListener('input', e => renderSearch(e.target.value));
  document.getElementById('productSearch').addEventListener('input', e => renderProductSearch(e.target.value));
  document.getElementById('changeProduct').addEventListener('click', () => showScreen('product'));
  document.getElementById('npBack').addEventListener('click', () => showScreen('product'));
  document.getElementById('npSave').addEventListener('click', saveNewProduct);
  // Lomakkeen tekstikentät: päivitetään vain valintanapit ja esikatselu, ei itse kenttää (näppäimistö pysyy auki)
  document.getElementById('npMaterial').addEventListener('input', e => { np.material = e.target.value; renderNewProduct(); });
  document.getElementById('npThickness').addEventListener('input', e => { np.thickness = e.target.value; renderNewProduct(); });
  document.getElementById('npName').addEventListener('input', e => { np.name = e.target.value; renderNpPreview(); });
  document.getElementById('npColorOther').addEventListener('input', e => { np.colorOther = e.target.value; renderNpPreview(); });

  // Ruutu 3
  document.getElementById('amLength').addEventListener('input', e => { am.length = e.target.value; renderAmPreview(); });
  document.getElementById('amWidth').addEventListener('input',  e => { am.width  = e.target.value; renderAmountPelti(); renderAmPreview(); });
  document.getElementById('amCount').addEventListener('input',  e => { am.count  = e.target.value; renderAmountPelti(); renderAmPreview(); });
  document.getElementById('amQty').addEventListener('input',    e => { am.qty    = e.target.value; renderAmPreview(); });
  document.getElementById('amNote').addEventListener('input', e => { am.note = e.target.value; renderAmPreview(); });
  document.getElementById('amEstimated').addEventListener('change', e => { am.estimated = e.target.checked; renderAmPreview(); });
  document.getElementById('amSave').addEventListener('click',     () => saveStock(false));
  document.getElementById('amSaveSame').addEventListener('click', () => saveStock(true));
  document.getElementById('amSetBtn').addEventListener('click', () => {
    const v = parseNum(document.getElementById('amSetQty').value);
    if (v == null) { showToast('Anna määrä', 'error'); return; }
    adjustExisting(0, v);
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (!confirm('Kirjaudutaanko ulos?')) return;
    try { await window.authSignOut(); } catch (e) {}
    location.replace('login.html');
  });
  document.addEventListener('input', e => {
    if (!cut) return;
    const id = e.target.id;
    if (id === 'cutTaken') {
      cut.taken = e.target.value;
      const it = hereStock.find(r => r.id === invCutId);
      const old = e.target.parentElement.querySelector('.cut-calc');
      const tmp = document.createElement('div'); tmp.innerHTML = invCutHtml(it);
      const fresh = tmp.querySelector('.cut-calc');
      if (old && fresh) old.replaceWith(fresh); else if (old) old.remove(); else if (fresh) e.target.after(fresh);
    }
    if (id === 'cutOffLen') cut.offLen = e.target.value;
    if (id === 'cutOffWid') cut.offWid = e.target.value;
    if (id === 'cutNote')   cut.note   = e.target.value;
  });
  document.addEventListener('change', e => {
    if (cut && e.target.id === 'cutMakeOff') { cut.makeOff = e.target.checked; renderInventory(); }
  });
  document.getElementById('invAllFound').addEventListener('click', () => { hereStock.forEach(r => { if (!invMarks[r.id]) invMarks[r.id] = 'found'; }); renderInventory(); });
  document.getElementById('invFinish').addEventListener('click', finishInventory);
  document.getElementById('invMoveAll').addEventListener('click', startMoveAll);
  document.getElementById('invAddMissing').addEventListener('click', () => showScreen('product'));
  document.addEventListener('click', e => { if (e.target.closest('#pickCancel')) { pendingPick = null; showScreen('inventory'); } });
  document.getElementById('sessionToggle').addEventListener('click', () => { sessionOpen = !sessionOpen; renderSession(); });

  // ─── Käynnistys ──────────────────────────────────────
  async function init() {
    try {
      await Promise.all([loadLocations(), loadProducts()]);
    } catch (err) {
      document.getElementById('loadingMsg').innerHTML = 'Virhe tietojen haussa:<br>' + esc(err.message);
      return;
    }
    document.getElementById('loadingMsg').hidden = true;
    document.getElementById('footerUser').textContent = window._currentUser?.email || '';
    renderAllPlaces();

    // 1) QR-tarra: varastotyo.html?paikka=IN-R-07
    let qrCode = new URLSearchParams(location.search).get('paikka');
    try {
      if (!qrCode) qrCode = sessionStorage.getItem('varastotyo.qrPaikka');
      sessionStorage.removeItem('varastotyo.qrPaikka');
    } catch (e) {}
    if (qrCode) {
      // Poistetaan parametri osoitteesta, ettei sivun päivitys aloita valintaa uudestaan
      history.replaceState(null, '', location.pathname);
      const loc = allLocations.find(l => l.code.toUpperCase() === qrCode.trim().toUpperCase());
      if (loc) {
        document.getElementById('screenPlace').hidden = false;
        pickLocation(loc);
        return;
      }
      showToast('Paikkaa ' + qrCode + ' ei löydy', 'error');
    }

    // 2) Android voi sulkea taustalla olevan välilehden — palautetaan äskeinen paikka
    const saved = lsGet(LS_CURRENT_LOC, null);
    if (saved && Date.now() - saved.at < CURRENT_MAX_AGE && locById.has(saved.id)) {
      currentLoc = locById.get(saved.id);
      renderPlaceBar();
      showScreen('product');
      loadHereStock();
      return;
    }

    // 3) Muuten paikan valintaan
    showScreen('place');
  }

  window._authReady.then(init);
</script>
