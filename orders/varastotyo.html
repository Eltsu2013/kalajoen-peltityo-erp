<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1d27">
  <title>Varastotyö — Kalajoen Peltityö</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // QR-linkin ?paikka= talteen ennen kirjautumistarkistusta: auth-guard ohjaa login-sivulle
    // ilman osoitteen parametreja, ja tästä se palautetaan kirjautumisen jälkeen.
    try {
      const p = new URLSearchParams(location.search).get('paikka');
      if (p) sessionStorage.setItem('varastotyo.qrPaikka', p);
    } catch (e) {}
  </script>
  <script src="auth-guard.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Samat värit kuin varasto.html:ssä */
    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #222636;
      --border:   #2a2d3a;
      --text:     #e8eaf0;
      --muted:    #7a7f96;
      --accent:   #eab308;
      --accent2:  #ca9a06;
      --danger:   #ef4444;
      --ok:       #22c55e;
    }

    html, body { background: var(--bg); }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; color: inherit; }
    .mono { font-family: 'IBM Plex Mono', monospace; }

    /* ── YLÄPALKKI ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 8px 12px 10px;
    }
    .topbar-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 8px;
    }
    .logo img { height: 34px; width: auto; display: block; }

    .mode-toggle {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .mode-btn {
      background: none; border: none;
      padding: 9px 16px;
      font-size: 15px; font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .mode-btn.active { background: var(--accent); color: #000; }

    .place-bar {
      width: 100%;
      display: flex; align-items: center; gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      min-height: 52px;
    }
    .place-bar.empty { border-style: dashed; color: var(--muted); }
    .place-code { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--accent); font-size: 17px; white-space: nowrap; }
    .place-name { font-size: 15px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .place-change { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }

    /* ── SISÄLTÖ ── */
    main { padding: 14px 12px 40px; max-width: 560px; margin: 0 auto; }
    .screen[hidden] { display: none; }

    .section-label {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted);
      margin: 18px 0 8px;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 18px;
      padding: 14px 14px;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }

    /* Isot napit — sormi ja hanska osuvat */
    .big-list { display: flex; flex-direction: column; gap: 8px; }
    .big-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      min-height: 58px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      text-align: left;
      cursor: pointer;
      font-size: 16px;
    }
    .big-btn:active { background: var(--surface2); border-color: var(--accent); }
    .big-btn .code { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--accent); min-width: 92px; font-size: 15px; }
    .big-btn .name { flex: 1; }
    .big-btn .arrow { color: var(--muted); font-size: 14px; }

    .empty-msg { color: var(--muted); font-size: 15px; padding: 14px 4px; }

    /* Kaikki paikat — ryhmät aukeavat napauttamalla */
    .zone { margin-bottom: 8px; }
    .zone summary {
      list-style: none;
      display: flex; align-items: center; justify-content: space-between;
      min-height: 54px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    .zone summary::-webkit-details-marker { display: none; }
    .zone summary .count { color: var(--muted); font-weight: 400; font-size: 14px; }
    .zone summary .count::after { content: ' ▸'; }
    .zone[open] summary { border-color: var(--accent); color: var(--accent); }
    .zone[open] summary .count::after { content: ' ▾'; }
    .zone .big-list { padding: 8px 0 4px 10px; }
    .zone-group-title {
      font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin: 22px 0 8px; padding-top: 14px; border-top: 1px dashed var(--border);
    }

    /* Taso- ja piikkivalinta */
    .picker-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .back-btn {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; font-size: 15px; cursor: pointer; white-space: nowrap;
    }
    .picker-title { font-size: 18px; font-weight: 600; line-height: 1.3; }
    .picker-title .code { font-family: 'IBM Plex Mono', monospace; color: var(--accent); display: block; font-size: 14px; }
    .picker-hint { color: var(--muted); font-size: 14px; margin-bottom: 10px; }

    .level-stack { display: flex; flex-direction: column; gap: 8px; }
    .level-btn {
      min-height: 60px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 20px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
    }
    .level-btn:active { background: var(--accent); color: #000; border-color: var(--accent); }
    .level-btn .lcode { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); font-weight: 400; }
    .level-btn:active .lcode { color: #000; }

    .num-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .num-btn {
      min-height: 64px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 22px; font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
    }
    .num-btn:active { background: var(--accent); color: #000; border-color: var(--accent); }
    .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* Ruutu 2 -paikanpitäjä */
    .placeholder-card {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 22px 16px;
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
    }
    .placeholder-card strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 17px; }

    /* ── RUUTU 2: TUOTE ── */
    .big-btn .sub, .here-row .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .here-row .sub { color: var(--accent); }
    .big-btn.new-btn { border-style: dashed; border-color: var(--accent2); color: var(--accent); font-weight: 600; }
    .laji-tag {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      padding: 2px 6px; border-radius: 4px; white-space: nowrap;
    }
    .laji-pelti   { background: #14371f; color: #22c55e; }
    .laji-tarvike { background: #2d1845; color: #a855f7; }

    .here-box { margin-top: 22px; }
    .here-toggle {
      width: 100%; min-height: 50px;
      display: flex; align-items: center; justify-content: space-between;
      background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: 0 14px; font-size: 15px; color: var(--muted); cursor: pointer;
    }
    .here-toggle strong { color: var(--text); }
    .here-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .here-row {
      display: flex; justify-content: space-between; gap: 10px; align-items: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 15px; text-align: left; cursor: pointer; width: 100%;
    }
    .here-row .mitat { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--accent); white-space: nowrap; }
    .dim { color: var(--muted); }

    /* ── UUSI TUOTE ── */
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; letter-spacing: 0.04em; }
    .form-hint  { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .text-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit; font-size: 17px; padding: 13px 14px;
    }
    .text-input:focus { outline: none; border-color: var(--accent); }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button { background: var(--surface); border: none; min-height: 52px; font-size: 17px; font-weight: 600; color: var(--muted); cursor: pointer; }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button.active { background: var(--accent); color: #000; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      min-height: 46px; min-width: 64px; padding: 0 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 23px;
      font-size: 15px; font-weight: 500; cursor: pointer;
    }
    .chip.selected { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
    .chip.chip-muted { color: var(--muted); }
    .np-chips-gap { margin-bottom: 8px; }
    .np-preview {
      margin-top: 22px; padding: 14px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border); font-size: 15px; line-height: 1.5;
    }
    .np-preview .np-name { font-size: 19px; font-weight: 600; color: var(--text); }
    .np-preview .np-error { color: var(--danger); }
    .np-preview .np-dup { color: var(--accent); }
    .primary-btn {
      width: 100%; min-height: 60px; margin-top: 14px;
      background: var(--accent); color: #000; border: none; border-radius: 8px;
      font-size: 18px; font-weight: 600; cursor: pointer;
    }
    .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .secondary-btn {
      width: 100%; min-height: 54px; margin-top: 10px;
      background: none; border: 1px solid var(--border); border-radius: 8px;
      font-size: 16px; cursor: pointer;
    }

    /* ── RUUTU 3: MITAT JA MÄÄRÄ ── */
    .num-input { font-family: 'IBM Plex Mono', monospace; font-size: 22px; }
    .check-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 10px; font-size: 16px; color: var(--muted); cursor: pointer;
      min-height: 44px;
    }
    .check-row input { width: 22px; height: 22px; accent-color: var(--accent); }
    .qty-row { display: flex; align-items: stretch; gap: 8px; }
    .qty-row .text-input { flex: 1; text-align: center; }
    .qty-btn {
      min-width: 68px; min-height: 56px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      font-size: 24px; font-weight: 600; cursor: pointer;
    }
    .qty-btn:active { background: var(--accent); color: #000; border-color: var(--accent); }
    .qty-btn.wide { min-width: 92px; font-size: 17px; }
    .qty-row.big { margin-top: 10px; }
    .qty-row.big .qty-btn { flex: 1; min-height: 62px; }
    .existing-box {
      background: var(--surface); border: 1px solid var(--accent2); border-radius: 8px;
      padding: 14px; margin-top: 4px;
    }
    .existing-qty { font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600; color: var(--accent); margin: 4px 0 2px; }
    .secondary-btn.accent { border-color: var(--accent2); color: var(--accent); }

    /* ── TÄLLÄ KERRALLA LISÄTTY ── */
    .session-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
      background: var(--surface); border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .session-toggle {
      width: 100%; min-height: 50px;
      display: flex; align-items: center; justify-content: space-between;
      background: none; border: none; padding: 0 14px;
      font-size: 15px; color: var(--muted); cursor: pointer;
    }
    .session-toggle strong { color: var(--accent); }
    .session-list { max-height: 45vh; overflow-y: auto; border-top: 1px solid var(--border); }
    .session-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .session-row .srow-main { flex: 1; min-width: 0; }
    .session-row .srow-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-row .srow-sub { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
    .undo-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      min-height: 42px; padding: 0 14px; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    .undo-btn:active { border-color: var(--danger); color: var(--danger); }
    .session-spacer { height: 56px; }

    /* Valittu tuote (ruutu 3:n yläosa) */
    .chosen-card {
      background: var(--surface); border: 1px solid var(--accent); border-radius: 8px;
      padding: 14px; margin-bottom: 14px;
    }
    .chosen-card .np-name { font-size: 19px; font-weight: 600; }

    /* auth-guard.js lisää uloskirjautumisen headeriin — puhelimessa se osuu peukalon alle, joten piilotetaan
       ja tarjotaan sama toiminto sivun alalaidassa varmistuksen takana */
    #auth-user-info { display: none !important; }
    .page-footer {
      margin-top: 40px; padding-top: 16px; border-top: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-size: 13px; color: var(--muted);
    }
    .page-footer button {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 12px; font-size: 13px; color: var(--muted); cursor: pointer;
    }

    /* ── RUUTU 4: INVENTOI ── */
    .inv-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .inv-summary { font-size: 15px; color: var(--muted); }
    .inv-summary b { color: var(--text); }
    .inv-row {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .inv-row.found   { border-color: var(--ok); }
    .inv-row.missing { border-color: var(--danger); }
    .inv-row.missing .inv-name { text-decoration: line-through; color: var(--muted); }
    .inv-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .inv-name { font-size: 16px; font-weight: 500; }
    .inv-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .inv-mitat { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--accent); white-space: nowrap; }
    .inv-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
    .inv-btns2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .inv-btns2 .inv-btn { color: var(--muted); font-weight: 400; }
    .inv-btn.on-edit { border-color: var(--accent); color: var(--accent); }
    .cut-calc { font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: var(--accent); margin-top: 8px; }
    .cut-calc.bad { color: var(--danger); }
    .cut-loc {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 4px;
    }
    .cut-loc .code { font-family: 'IBM Plex Mono', monospace; color: var(--accent); font-weight: 600; }
    .cut-loc button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 14px; cursor: pointer; }
    .inv-btn {
      min-height: 48px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer;
    }
    .inv-btn.on-found   { background: var(--ok); border-color: var(--ok); color: #000; }
    .inv-btn.on-missing { background: var(--danger); border-color: var(--danger); color: #fff; }
    .inv-edit { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .inv-edit .form-label { margin-top: 8px; }
    .inv-edit-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .inv-edit-btns .primary-btn, .inv-edit-btns .secondary-btn { margin-top: 0; min-height: 50px; font-size: 16px; }
    .inv-actions { margin-top: 18px; }
    .inv-empty { color: var(--muted); padding: 20px 4px; font-size: 15px; line-height: 1.5; }
    .move-banner {
      background: var(--surface2); border: 1px solid var(--accent); border-radius: 8px;
      padding: 12px 14px; margin-bottom: 14px; font-size: 15px; line-height: 1.4;
    }

    .state-msg { text-align: center; color: var(--muted); padding: 40px 10px; }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 18px;
      font-size: 15px; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; z-index: 500;
      max-width: calc(100vw - 32px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--ok); color: var(--ok); }
    .toast.error   { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <a class="logo" href="varasto.html" title="Varasto (pöytäkone)"><img src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="100" height="34"></a>
    <div class="mode-toggle">
      <button class="mode-btn active" type="button" data-mode="lisaa">Lisää</button>
      <button class="mode-btn" type="button" data-mode="inventoi">Inventoi</button>
    </div>
  </div>
  <button class="place-bar empty" id="placeBar" type="button">📍 <span>Valitse paikka</span></button>
</header>

<main>
  <div class="state-msg" id="loadingMsg"><span class="spinner"></span>Ladataan varastopaikkoja...</div>

  <!-- RUUTU 1: PAIKKA -->
  <section class="screen" id="screenPlace" hidden>

    <div class="move-banner" id="moveBanner" hidden></div>

    <!-- 1a: haku + viimeksi käytetyt -->
    <div id="placeSearchView">
      <input class="search-input" id="placeSearch" type="search"
             placeholder="Hae: r07, porras, kontti…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="searchResultsWrap" hidden>
        <div class="section-label">Hakutulokset</div>
        <div class="big-list" id="searchResults"></div>
      </div>
      <div id="recentWrap">
        <div class="section-label">Viimeksi käytetyt</div>
        <div class="big-list" id="recentList"></div>
        <div class="section-label">Kaikki paikat</div>
        <div id="allPlaces"></div>
      </div>
    </div>

    <!-- 1b: taso- / piikkivalinta -->
    <div id="levelView" hidden>
      <div class="picker-head">
        <button class="back-btn" type="button" id="levelBack">← Takaisin</button>
        <div class="picker-title" id="levelTitle"></div>
      </div>
      <div class="picker-hint" id="levelHint"></div>
      <div id="levelButtons"></div>
    </div>
  </section>

  <!-- RUUTU 2: TUOTE -->
  <section class="screen" id="screenProduct" hidden>
    <input class="search-input" id="productSearch" type="search"
           placeholder="Hae tuote: rr23 5, kateruuvi…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="productResultsWrap" hidden>
      <div class="section-label">Hakutulokset</div>
      <div class="big-list" id="productResults"></div>
    </div>
    <div id="productRecentWrap">
      <div class="section-label">Viimeksi käytetyt</div>
      <div class="big-list" id="productRecent"></div>
    </div>
    <div class="here-box" id="hereBox"></div>
  </section>

  <!-- UUSI TUOTE (minimilomake) -->
  <section class="screen" id="screenNewProduct" hidden>
    <div class="picker-head">
