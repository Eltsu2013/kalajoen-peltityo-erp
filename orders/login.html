<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirjaudu — Kalajoen Peltityö</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Ulkoasuremontti R6c (26.11.2026): uusi ulkoasu (tyyli.css + teema.js). Ei kategoriaväriä (neutraali), ulkoasu
       viimeksi valitun mukaan (kytkimen muisti), logo ulkoasun mukaan, toistuva yritysnimi logon alta pois (Tomi 26.11.).
       Rakenne, id:t ja kirjautumisen skripti ennallaan. -->
  <link rel="stylesheet" href="tyyli.css?v=2">
  <script src="teema.js?v=1"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Kirjautumissivulla ei ole valikkoa eikä kategoriaa: korostus neutraali */
    :root, html[data-teema] { --kpt-korostus: var(--kpt-v-neutraali); }

    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    /* Taustaefekti — peltilevyn viivat */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, transparent 0px, transparent 60px,
          color-mix(in srgb, var(--kpt-teksti) 3%, transparent) 60px, color-mix(in srgb, var(--kpt-teksti) 3%, transparent) 61px),
        repeating-linear-gradient(180deg, transparent 0px, transparent 60px,
          color-mix(in srgb, var(--kpt-teksti) 3%, transparent) 60px, color-mix(in srgb, var(--kpt-teksti) 3%, transparent) 61px);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      background: var(--kpt-paneeli);
      border: 1px solid var(--kpt-reuna);
      border-top: 3px solid var(--kpt-korostus);
      border-radius: var(--kpt-pyoristys);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--kpt-varjo);
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--kpt-reuna);
    }
    .logo-area img { height: 48px; width: auto; display: block; }

    .login-card h1 { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 13px; color: var(--kpt-himmea); margin-bottom: 0.4rem; }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      min-height: 46px;
      background: var(--kpt-kentta);
      border: 1px solid var(--kpt-reuna2);
      border-radius: 6px;
      padding: 0 0.9rem;
      font: 16px var(--kpt-fontti);      /* 16 px: iPhone ei zoomaa kenttään */
      color: var(--kpt-teksti);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus { border-color: var(--kpt-korostus); box-shadow: 0 0 0 3px var(--kpt-korostus-tausta); }
    input::placeholder { color: var(--kpt-himmea); opacity: 0.6; }

    .btn-primary {
      width: 100%;
      min-height: 48px;
      margin-top: 1.5rem;
      padding: 0 0.75rem;
      background: var(--kpt-korostus);
      color: var(--kpt-teksti-korostuksella);
      border: none;
      border-radius: 6px;
      font: 600 16px var(--kpt-fontti);
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }
    .btn-primary:hover  { filter: brightness(1.08); }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .message {
      margin-top: 1rem;
      padding: 0.65rem 0.9rem;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .message.error   { background: color-mix(in srgb, var(--kpt-virhe) 10%, transparent); border: 1px solid color-mix(in srgb, var(--kpt-virhe) 45%, transparent); color: var(--kpt-virhe); display: block; }
    .message.success { background: color-mix(in srgb, var(--kpt-ok) 10%, transparent); border: 1px solid color-mix(in srgb, var(--kpt-ok) 45%, transparent); color: var(--kpt-ok); display: block; }

    .forgot-link, .back-link {
      font-size: 14px;
      color: var(--kpt-himmea) !important;
      text-decoration: none;
      cursor: pointer;
    }
    .forgot-link { display: block; text-align: right; margin-top: 0.6rem; padding: 4px 0; }
    .back-link { display: inline-flex; align-items: center; gap: 0.3rem; margin-bottom: 1rem; padding: 4px 0; }
    .forgot-link:hover, .back-link:hover { color: var(--kpt-teksti) !important; text-decoration: underline; }
    #reset-view { display: none; }
    #login-view { display: block; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid color-mix(in srgb, currentColor 30%, transparent);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 420px) {
      .login-card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body class="kpt-sivu">

<div class="login-card">
  <div class="logo-area">
    <img class="kpt-vain-tumma" src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="141" height="48">
    <img class="kpt-vain-vaalea" src="logo-musta.png" alt="Kalajoen Peltityö" width="141" height="48">
  </div>

  <!-- Kirjautumisnäkymä -->
  <div id="login-view">
    <h1>Kirjaudu sisään</h1>
    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="email">Sähköposti</label>
        <input type="email" id="email" name="email" placeholder="nimi@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Salasana</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        <a class="forgot-link" id="show-reset">Unohditko salasanan?</a>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Kirjaudu</button>
    </form>
    <div class="message" id="login-msg"></div>
  </div>

  <!-- Salasanan palautus -->
  <div id="reset-view">
    <a class="back-link" id="back-to-login">← Takaisin</a>
    <h1>Palauta salasana</h1>
    <form id="reset-form">
      <div class="form-group">
        <label for="reset-email">Sähköposti</label>
        <input type="email" id="reset-email" placeholder="nimi@example.com" required />
      </div>
      <button type="submit" class="btn-primary" id="reset-btn">Lähetä palautuslinkki</button>
    </form>
    <div class="message" id="reset-msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://hjyeugeqmyavxisndlwp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4';
  const _sbAuth = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Jos jo kirjautunut → ohjaa etusivulle
  _sbAuth.auth.getSession().then(({ data }) => {
    if (data.session) redirectAfterLogin();
  });

  function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    window.location.href = next || 'tilaukset.html';
  }

  function showMessage(elId, text, type) {
    const el = document.getElementById(elId);
    el.textContent = text;
    el.className = 'message ' + type;
  }

  function setLoading(btn, loading, label) {
    btn.disabled = loading;
    btn.innerHTML = loading ? `<span class="spinner"></span>${label}` : label;
  }

  // Kirjautuminen
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    setLoading(btn, true, 'Kirjaudutaan...');

    const { error } = await _sbAuth.auth.signInWithPassword({ email, password });

    if (error) {
      const msg = error.message.includes('Invalid login')
        ? 'Väärä sähköposti tai salasana.'
        : error.message.includes('Email not confirmed')
        ? 'Vahvista sähköpostiosoitteesi ensin.'
        : 'Kirjautuminen epäonnistui. Yritä uudelleen.';
      showMessage('login-msg', msg, 'error');
      setLoading(btn, false, 'Kirjaudu');
    } else {
      showMessage('login-msg', 'Kirjautuminen onnistui...', 'success');
      setTimeout(redirectAfterLogin, 500);
    }
  });

  // Näytä/piilota salasanan palautus
  document.getElementById('show-reset').addEventListener('click', () => {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('reset-view').style.display = 'block';
    const email = document.getElementById('email').value;
    if (email) document.getElementById('reset-email').value = email;
  });

  document.getElementById('back-to-login').addEventListener('click', () => {
    document.getElementById('reset-view').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
  });

  // Salasanan palautus
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reset-btn');
    const email = document.getElementById('reset-email').value.trim();

    setLoading(btn, true, 'Lähetetään...');

    const { error } = await _sbAuth.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname.replace('login.html', '') + 'login.html'
    });

    if (error) {
      showMessage('reset-msg', 'Virhe: ' + error.message, 'error');
    } else {
      showMessage('reset-msg', 'Palautuslinkki lähetetty! Tarkista sähköpostisi.', 'success');
    }
    setLoading(btn, false, 'Lähetä palautuslinkki');
  });
</script>
</body>
</html>
