<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piippu — Kalajoen Peltityö</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1a;
    --bg2: #111827;
    --bg3: #1a2332;
    --bg4: #1e2d3d;
    --text: #e2eef5;
    --text2: #6b8fa8;
    --border: #1e3a4a;
    --accent: #22c55e;
    --accent2: #16a34a;
    --input-bg: #111827;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; min-height: 100vh; }

  /* Navigointipalkki */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 16px; font-weight: 500; color: var(--text); margin-left: 8px; }
  .nav-menu-wrap { position: relative; }
  .nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text2);
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    transition: border-color 0.15s, color 0.15s;
  }
  .nav-btn:hover { background: var(--bg3); }
  .nav-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    min-width: 200px;
    z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    padding: 4px 0;
  }
  .nav-dropdown.open { display: block; }
  .nav-section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text2);
    padding: 8px 14px 4px;
    opacity: 0.6;
  }
  .nav-item {
    display: block;
    padding: 8px 14px;
    color: var(--text2);
    text-decoration: none;
    font-size: 13px;
    transition: background 0.1s, color 0.1s;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.current { color: var(--accent); font-weight: 600; }
  .nav-item.external::after { content: ' ↗'; opacity: 0.6; font-size: 11px; }
  .nav-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  .main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 74px); overflow: hidden; }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; position: relative; }
  .sidebar-resizer { position: absolute; top: 0; right: 0; width: 5px; height: 100%; cursor: col-resize; z-index: 10; background: transparent; }
  .sidebar-resizer:hover, .sidebar-resizer.dragging { background: var(--accent); opacity: 0.5; }
  .content { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  .section { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }
  .section h3 { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .section h3.red { color: var(--red); }

  .field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
  .field label { font-size: 11px; color: var(--text2); }
  .field input[type=number] { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; color: var(--text); padding: 5px 8px; font-size: 13px; width: 100%; font-family: 'IBM Plex Mono', monospace; }
  .field input[type=number]:focus { outline: none; border-color: var(--accent); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sidebar.wide .field-grid { grid-template-columns: 1fr 1fr 1fr; }
  .sidebar.xwide .field-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .sidebar.wide .field label { font-size: 10px; }

  .checks { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .check-item { display: flex; align-items: center; gap: 8px; }
  .check-item input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .check-item label { font-size: 13px; cursor: pointer; }
  .sauma-options { display: flex; gap: 6px; margin-left: 23px; margin-top: 2px; }
  .sauma-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 3px; color: var(--text2); padding: 3px 10px; font-size: 12px; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; transition: border-color 0.15s; }
  .sauma-btn.active { background: var(--accent2); border-color: var(--accent); color: white; }

  .vakio-grid { display: grid; grid-template-columns: 1fr 56px; gap: 3px 8px; align-items: center; }
  .vakio-grid label { font-size: 11px; color: var(--text2); }
  .vakio-grid input[type=number] { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; color: var(--text); padding: 3px 5px; font-size: 12px; width: 56px; text-align: right; font-family: 'IBM Plex Mono', monospace; }
  .vakio-grid input[type=number]:focus { outline: none; border-color: var(--accent); }
  .vakio-grid input.red-input { border-color: var(--red) !important; }

  .kuva-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 12px 16px; }
  .kuva-card svg { width: 100%; display: block; }
  .kulmat { display: flex; gap: 40px; padding: 8px 0 2px; border-top: 1px solid var(--border); margin-top: 8px; }
  .kulma-item { font-size: 12px; color: var(--text2); }
  .kulma-item span { color: var(--text); font-weight: 600; font-size: 14px; margin-left: 6px; }

  .luettelo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .luettelo-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 14px; }
  .luettelo-card h3 { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { color: var(--text2); font-weight: 500; text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--border); font-size: 11px; }
  td { padding: 5px 6px; border-bottom: 1px solid #1a2744; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }
  .td-num { text-align: right; font-variant-numeric: tabular-nums; }
  .td-sym { text-align: center; color: var(--text2); font-size: 11px; }
  .total-row td { border-top: 1px solid var(--border); font-weight: 600; color: var(--accent); padding-top: 7px; }
  .empty-msg { color: var(--text2); font-size: 12px; text-align: center; padding: 16px 0; }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; height: auto; overflow: visible; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    .luettelo-grid { grid-template-columns: 1fr; }
    .nav-links { display: none; }
  }
  /* Puhelin: yläpalkki rivittyy (materiaalivalinnat omalle rivilleen), ettei sivu veny leveämmäksi kuin ruutu */
  @media (max-width: 700px) {
    header { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
    .header-right { margin-left: 0; width: 100%; }
    .header-right select { flex: 1 1 0; min-width: 0; font-size: 16px !important; padding: 8px !important; }
    .kulmat { gap: 16px; flex-wrap: wrap; }
  }

    /* Valikko mahtuu ruudulle: pitkä lista vierittyy (17.11.2026) */
    #navDropdown, #navDropdownLasku { max-height: calc(100vh - 90px); overflow-y: auto; }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
</head>
<body>

<header>
  <div class="logo-img" style="height:50px;display:flex;align-items:center"><img src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="147" height="50" style="height:50px;width:auto;display:block"></div>
  <div class="nav-menu-wrap">
    <button class="nav-btn" onclick="toggleNav(event)">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=2"></script>
  </div>
  <h1>Piippu</h1>
  <div class="header-right">
    <select id="sel-materiaali" onchange="paivitaVarit()" style="background:var(--bg3);color:var(--text1);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px;">
      <option value="">Materiaali</option>
    </select>
    <select id="sel-vari" onchange="paivitaPaksuudet()" style="background:var(--bg3);color:var(--text1);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px;">
      <option value="">Väri</option>
    </select>
    <select id="sel-paksuus" onchange="tallennaMateriaali()" style="background:var(--bg3);color:var(--text1);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px;">
      <option value="">Paksuus</option>
    </select>
  </div>
</header>

<div class="main">
<div class="sidebar" id="sidebar">
  <div class="sidebar-resizer" id="sidebar-resizer"></div>

  <div class="section">
    <h3>Piipun osat</h3>
    <div class="checks" style="flex-wrap:wrap;">
      <div class="check-item">
        <input type="checkbox" id="chk-juuret" checked onchange="laske()">
        <label for="chk-juuret">Juuret</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="chk-huppu" checked onchange="laske()">
        <label for="chk-huppu">Huppu</label>
      </div>
      <div class="sauma-options">
        <button class="sauma-btn active" id="sauma1" onclick="setSauma(1)">Sauma 1</button>
        <button class="sauma-btn" id="sauma2" onclick="setSauma(2)">Sauma 2</button>
      </div>
      <div class="check-item">
        <input type="checkbox" id="chk-kansi" checked onchange="laske()">
        <label for="chk-kansi">Kansi</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="chk-hattu" checked onchange="laske()">
        <label for="chk-hattu">Hattu</label>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
      <label style="margin:0;white-space:nowrap;">Piippuja</label>
      <input type="number" id="v-piippukpl" value="1" min="1" style="width:60px;" oninput="laske()">
      <span style="font-size:11px;color:var(--text2);">kpl</span>
    </div>
    <div style="margin-top:8px;">
      <label style="display:block;margin-bottom:4px;">Huomio</label>
      <textarea id="v-huomio" rows="2" style="width:100%;box-sizing:border-box;background:var(--bg3);color:var(--text1);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:12px;resize:vertical;" placeholder="Esim. piipussa lunssi, kootaan paikan päällä..."></textarea>
    </div>
  </div>

  <div class="section">
    <h3>Piipun mitat</h3>
    <div class="field-grid">
      <div class="field">
        <label>Piipun leveys (mm)</label>
        <input type="number" id="leveys" value="400" min="0" oninput="laske()">
      </div>
      <div class="field">
        <label>Suora mitta (mm)</label>
        <input type="number" id="suora" value="600" min="0" oninput="laske()">
      </div>
      <div class="field">
        <label>Etukorkeus (mm)</label>
        <input type="number" id="etukork" value="1000" min="0" oninput="laske()">
      </div>
      <div class="field">
        <label>Takakorkeus (mm)</label>
        <input type="number" id="takakork" value="800" min="0" oninput="laske()">
      </div>
      <div class="field">
        <label>Takareunasta harjalle (mm)</label>
        <input type="number" id="harjalle" value="1050" min="0" oninput="laske()">
      </div>
    </div>
  </div>

  <div class="section">
    <h3>Sivumitat</h3>
    <div class="field-grid">
      <div class="field">
        <label>Vasen harjan ylitys (mm)</label>
        <input type="number" id="vasen" value="150" min="0" oninput="laske()">
      </div>
      <div class="field">
        <label>Oikea harjan ylitys (mm)</label>
        <input type="number" id="oikea" value="100" min="0" oninput="laske()">
      </div>
      <div class="field">
        <label>Harjan ylitys vasemmalle (mm)</label>
        <input type="number" id="poimu" value="20" min="0" oninput="laske()">
      </div>
      <div class="field">
        <label>Harjan ylitys kulma (°)</label>
        <input type="number" id="v-harjakulma" value="90" min="0" max="180" oninput="laske()">
      </div>
    </div>
  </div>

  <div class="section">
    <h3>Juuri — etuosa</h3>
    <div class="field-grid">
      <div class="field">
        <label>Eteen piipusta (mm)</label>
        <input type="number" id="k24" value="200" min="0" oninput="laske()">
      </div>
      <div class="field">
        <label>Alas (mm)</label>
        <input type="number" id="j25" value="15" min="0" oninput="laske()">
      </div>
    </div>
  </div>

  <div class="section">
    <h3>Juuren mitat</h3>
    <div class="vakio-grid">
      <label>Tuplat juuriin</label>
      <input type="number" id="v-tupla" value="15" oninput="laske()">
      <label>Juuri etu lisäys leveyteen</label>
      <input type="number" id="v-etulis" value="40" oninput="laske()">
      <label>Juuri taka leveämpi</label>
      <input type="number" id="v-takalis" value="10" oninput="laske()">
      <label>Juuri nousee piipulle</label>
      <input type="number" id="v-nousu" value="200" oninput="laske()">
      <label>Juuren takareuna eteenpäin</label>
      <input type="number" id="v-takareuna" value="" placeholder="0" oninput="laske()">
      <label>Juuren harjaylitys</label>
      <input type="number" id="v-harjaylitys" value="" placeholder="0" oninput="laske()">
    </div>
    <div style="margin-top:8px;">
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px;">Takakappaleet</div>
      <div class="sauma-options">
        <button class="sauma-btn active" id="taka1" onclick="setTakaKpl(1)">1</button>
        <button class="sauma-btn" id="taka2" onclick="setTakaKpl(2)">2</button>
        <button class="sauma-btn" id="taka3" onclick="setTakaKpl(3)">3</button>
        <button class="sauma-btn" id="taka4" onclick="setTakaKpl(4)">4</button>
      </div>
    </div>
    <div id="taka-extra" style="display:none;margin-top:8px;">
      <div class="vakio-grid">
        <label>Juuren saumat</label>
        <input type="number" id="v-juurisauma" value="20" oninput="laske()">
        <label>Juuri taka 1 mitta</label>
        <input type="number" id="v-taka1mitta" value="" placeholder="mm" oninput="laske()">
      </div>
      <div id="taka2-kentat" style="display:none;">
        <div class="vakio-grid" style="margin-top:4px;">
          <label>Juuri taka 2 mitta</label>
          <input type="number" id="v-taka2mitta" value="" placeholder="mm" oninput="laske()">
        </div>
      </div>
      <div id="taka3-kentat" style="display:none;">
        <div class="vakio-grid" style="margin-top:4px;">
          <label>Juuri taka 3 mitta</label>
          <input type="number" id="v-taka3mitta" value="" placeholder="mm" oninput="laske()">
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <h3 class="red">Hupun mitat ⚠</h3>
    <div class="vakio-grid">
      <label>Hupun saumat</label>
      <input type="number" id="v-sauma" value="20" oninput="laske()">
      <label>Lisää hupun kokoon</label>
      <input type="number" id="v-huplis" value="10" oninput="laske()">
      <label>Hupun yläreuna ⚠</label>
      <input type="number" id="v-ylareunaV" value="20" class="red-input" oninput="laske()">
      <label>Hupun alatuplat</label>
      <input type="number" id="v-alatupla" value="20" oninput="laske()">
      <label>Vähennys korkeudesta</label>
      <input type="number" id="v-vahennys" value="20" oninput="laske()">
      <label>Huppu takaa leveämpi</label>
      <input type="number" id="v-huptakalis" value="5" oninput="laske()">
      <label>Hattu piippua isompi</label>
      <input type="number" id="v-hattulis" value="250" oninput="laske()">
    </div>

    <div style="margin-top:10px;">
      <div style="font-size:12px;color:var(--text2);font-weight:600;margin-bottom:6px;">Lisäosat</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <label style="margin:0;white-space:nowrap;">Piipun jalat</label>
        <input type="number" id="v-jalat" value="0" min="0" style="width:60px;" oninput="laske()">
        <span style="font-size:11px;color:var(--text2);">kpl</span>
      </div>
      <div id="lisaosat-container"></div>
      <button onclick="lisaaLisaosa()" style="margin-top:4px;padding:3px 10px;font-size:11px;background:var(--bg3);color:var(--text1);border:1px solid var(--border);border-radius:4px;cursor:pointer;">+ Lisää osa</button>
    </div>

    <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:12px;">
      <div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:4px;">Huppu etu osat</div>
        <div class="sauma-options">
          <button class="sauma-btn active" id="hetu1" onclick="setHuppuEtuKpl(1)">1</button>
          <button class="sauma-btn" id="hetu2" onclick="setHuppuEtuKpl(2)">2</button>
          <button class="sauma-btn" id="hetu3" onclick="setHuppuEtuKpl(3)">3</button>
        </div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:4px;">Huppu sivut osat</div>
        <div class="sauma-options">
          <button class="sauma-btn active" id="hsivut1" onclick="setHuppuSivutKpl(1)">1</button>
          <button class="sauma-btn" id="hsivut2" onclick="setHuppuSivutKpl(2)">2</button>
          <button class="sauma-btn" id="hsivut3" onclick="setHuppuSivutKpl(3)">3</button>
        </div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:4px;">Huppu taka osat</div>
        <div class="sauma-options">
          <button class="sauma-btn active" id="htaka1" onclick="setHuppuTakaKpl(1)">1</button>
          <button class="sauma-btn" id="htaka2" onclick="setHuppuTakaKpl(2)">2</button>
          <button class="sauma-btn" id="htaka3" onclick="setHuppuTakaKpl(3)">3</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="content">

  <div class="kuva-card">
    <svg id="piippu-svg" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>
      <g id="svg-content"></g>
    </svg>
    <div class="kulmat">
      <div class="kulma-item">Etukulma (kanttikoneeseen):<span id="etukulma-txt">—</span>°</div>
      <div class="kulma-item">Takakulma (kanttikoneeseen):<span id="takakulma-txt">—</span>°</div>
      <div class="kulma-item">Katon kaltevuus:<span id="kaltevuus-txt">—</span></div>
    </div>
  </div>

  <div class="luettelo-grid">
    <div class="luettelo-card">
      <h3>Juuret</h3>
      <div id="luettelo-juuret"><p class="empty-msg">—</p></div>
    </div>
    <div class="luettelo-card">
      <h3>Huppu / Kansi / Hattu</h3>
      <div id="luettelo-huppu"><p class="empty-msg">—</p></div>
    </div>
  </div>
  <div style="padding:12px;border-top:1px solid var(--border);margin-top:8px;">
    <button onclick="lisaaTilaukseen()" style="width:100%;padding:10px;background:var(--accent);color:#000;font-weight:600;font-size:14px;border:none;border-radius:4px;cursor:pointer;">
      Lisää tilaukseen →
    </button>
    <div id="lisays-status" style="font-size:11px;color:var(--text2);text-align:center;margin-top:6px;min-height:16px;"></div>
  </div>

</div>
</div>

<script src="piippu-laskenta.js?v=2"></script>
<script>
let saumatyyppi = 1;
function setSauma(n) {
  saumatyyppi = n;
  document.getElementById('sauma1').classList.toggle('active', n===1);
  document.getElementById('sauma2').classList.toggle('active', n===2);
  laske();
}

let takaKpl = 1;
let huppuEtuKpl = 1;
let huppuTakaKpl = 1;
let huppuSivutKpl = 1;

let lisaosat = [];

function lisaaLisaosa() {
  const id = Date.now();
  lisaosat.push({ id, nimi: '', kpl: 1 });
  renderLisaosat();
}

function poistaLisaosa(id) {
  lisaosat = lisaosat.filter(r => r.id !== id);
  renderLisaosat();
  laske();
}

function renderLisaosat() {
  const c = document.getElementById('lisaosat-container');
  c.innerHTML = lisaosat.map(r => `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;">
      <input type="text" placeholder="Osan nimi" value="${r.nimi}" oninput="lisaosat.find(x=>x.id===${r.id}).nimi=this.value;laske()" style="flex:1;min-width:0;">
      <input type="number" value="${r.kpl}" min="1" oninput="lisaosat.find(x=>x.id===${r.id}).kpl=+this.value;laske()" style="width:50px;">
      <span style="font-size:11px;color:var(--text2);">kpl</span>
      <button onclick="poistaLisaosa(${r.id})" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:0 2px;">×</button>
    </div>`).join('');
}

async function haeMateriaalit() {
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/products?is_active=eq.true&select=material,color,thickness_mm&order=material,color`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    kaikki_tuotteet = await res.json();
    const materiaalit = [...new Set(kaikki_tuotteet.map(p => p.material))].sort();
    const mSel = document.getElementById('sel-materiaali');
    materiaalit.forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      mSel.appendChild(o);
    });
    // Palauta tallennettu valinta
    const muistettu = JSON.parse(localStorage.getItem('kpt_piippu_mat') || '{}');
    if (muistettu.mat && materiaalit.includes(muistettu.mat)) {
      mSel.value = muistettu.mat;
      paivitaVarit(muistettu.vari, muistettu.pak);
    }
  } catch(e) { console.error('Tuotteiden haku epäonnistui', e); }
}

function tallennaMateriaali() {
  localStorage.setItem('kpt_piippu_mat', JSON.stringify({
    mat: document.getElementById('sel-materiaali').value,
    vari: document.getElementById('sel-vari').value,
    pak: document.getElementById('sel-paksuus').value
  }));
}

function paivitaVarit(muistettuVari, muistettuPak) {
  const mat = document.getElementById('sel-materiaali').value;
  const varit = [...new Set(kaikki_tuotteet.filter(p => p.material === mat).map(p => p.color))].sort();
  const vSel = document.getElementById('sel-vari');
  vSel.innerHTML = '<option value="">Väri</option>';
  varit.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    vSel.appendChild(o);
  });
  document.getElementById('sel-paksuus').innerHTML = '<option value="">Paksuus</option>';
  if (muistettuVari && varit.includes(muistettuVari)) {
    vSel.value = muistettuVari;
  }
  // Päivitä paksuudet aina kun väri on valittu
  paivitaPaksuudet(muistettuPak);
  // Tallenna
  localStorage.setItem('kpt_piippu_mat', JSON.stringify({
    mat, vari: vSel.value, pak: document.getElementById('sel-paksuus').value
  }));
}

function paivitaPaksuudet(muistettuPak) {
  const mat = document.getElementById('sel-materiaali').value;
  const vari = document.getElementById('sel-vari').value;
  const paksuudet = [...new Set(kaikki_tuotteet
    .filter(p => p.material === mat && p.color === vari)
    .map(p => p.thickness_mm))]
    .sort((a,b) => a-b);
  const pSel = document.getElementById('sel-paksuus');
  pSel.innerHTML = '<option value="">Paksuus</option>';
  paksuudet.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p + ' mm';
    pSel.appendChild(o);
  });
  if (muistettuPak && paksuudet.map(String).includes(String(muistettuPak))) {
    pSel.value = muistettuPak;
  }
  tallennaMateriaali();
}

async function lisaaTilaukseen() {
  const materiaali = document.getElementById('sel-materiaali').value;
  const vari = document.getElementById('sel-vari').value;
  const paksuus = document.getElementById('sel-paksuus').value;
  const status = document.getElementById('lisays-status');

  const leveys = parseFloat(document.getElementById('leveys').value) || 0;
  const suora  = parseFloat(document.getElementById('suora').value) || 0;
  const huomio = document.getElementById('v-huomio').value.trim();
  const ryhmaNimi = `Lapepiippu ${leveys}×${suora} ${vari}`;

  // Kerää peltirivit juuret + huppu/kansi/hattu listoista
  const pellit = [];
  ['luettelo-juuret', 'luettelo-huppu'].forEach(id => {
    const rows = document.querySelectorAll(`#${id} tbody tr:not(.total-row)`);
    rows.forEach(tr => {
      const tds = tr.querySelectorAll('td');
      if (tds.length < 5) return;
      const osa  = tds[0].textContent.trim();
      const lev  = tds[1].textContent.trim();
      const pit  = tds[3].textContent.trim();
      const kpl  = tds[4].textContent.trim();
      if (!osa || osa === '—') return;
      pellit.push({ osa, lev, pit, kpl });
    });
  });

  if (pellit.length === 0) {
    status.style.color = '#f87171';
    status.textContent = 'Ei peltejä laskettuna — laske ensin piippu';
    return;
  }

  if (!materiaali || !vari || !paksuus) {
    status.style.color = '#f87171';
    status.textContent = `Valitse ${!materiaali?'materiaali':!vari?'väri':'paksuus'} ensin`;
    return;
  }

  // Kerää mittadata profile_data:aan
  const piippuData = {
    tyyppi: 'lapepiippu',
    leveys:      parseFloat(document.getElementById('leveys').value) || 0,
    suora:       parseFloat(document.getElementById('suora').value) || 0,
    etukork:     parseFloat(document.getElementById('etukork').value) || 0,
    takakork:    parseFloat(document.getElementById('takakork').value) || 0,
    harjalle:    parseFloat(document.getElementById('harjalle').value) || 0,
    vasen:       parseFloat(document.getElementById('vasen').value) || 0,
    oikea:       parseFloat(document.getElementById('oikea').value) || 0,
    poimu:       parseFloat(document.getElementById('poimu').value) || 0,
    harjakulma:  parseFloat(document.getElementById('v-harjakulma').value) || 0,
    k24:         parseFloat(document.getElementById('k24').value) || 0,
    j25:         parseFloat(document.getElementById('j25').value) || 0,
    tupla:       parseFloat(document.getElementById('v-tupla').value) || 0,
    etulis:      parseFloat(document.getElementById('v-etulis').value) || 0,
    takalis:     parseFloat(document.getElementById('v-takalis').value) || 0,
    nousu:       parseFloat(document.getElementById('v-nousu').value) || 0,
    takareuna:   parseFloat(document.getElementById('v-takareuna').value) || 0,
    harjaylitys: parseFloat(document.getElementById('v-harjaylitys').value) || 0,
    juurisauma:  parseFloat(document.getElementById('v-juurisauma').value) || 0,
    taka1mitta:  parseFloat(document.getElementById('v-taka1mitta').value) || 0,
    taka2mitta:  parseFloat(document.getElementById('v-taka2mitta').value) || 0,
    taka3mitta:  parseFloat(document.getElementById('v-taka3mitta').value) || 0,
    sauma:       parseFloat(document.getElementById('v-sauma').value) || 0,
    huplis:      parseFloat(document.getElementById('v-huplis').value) || 0,
    ylareunaV:   parseFloat(document.getElementById('v-ylareunaV').value) || 0,
    alatupla:    parseFloat(document.getElementById('v-alatupla').value) || 0,
    vahennys:    parseFloat(document.getElementById('v-vahennys').value) || 0,
    huptakalis:  parseFloat(document.getElementById('v-huptakalis').value) || 0,
    hattulis:    parseFloat(document.getElementById('v-hattulis').value) || 0,
    saumatyyppi, takaKpl, huppuEtuKpl, huppuSivutKpl, huppuTakaKpl,
    piippukpl,   // Tuotanto näyttää piippujen määrän (tallennetaan 20.11.2026 alkaen)
    huomio,
  };

  // Ryhmän id — käytetään lähetyksessä
  const groupId = targetGroupId || ('g_piippu_' + Date.now());

  // Lähetä kaikki kerralla

  // Lähetä kaikki kerralla yhdessä viestissä
  const kaikki = pellit.map((p, i) => {
    const levNum = parseFloat(p.lev) || 0;
    const pitNum = parseFloat(p.pit) || 0;

    const totalM2 = levNum && pitNum ? levNum * pitNum * kplNum / 1000000 : 0;
    return {
      nimike: p.osa,
      profileType: 'piippu',
      aihio_width_mm: levNum,
      profile_data: i === 0 ? { vals: piippuData } : undefined,
      rows: pitNum ? [{ mitta: pitNum, paat: 0, kok: pitNum, kpl: kplNum, huomio: i === 0 ? huomio : '' }] : [],
      // Osille joilla ei ole pituutta (piipun jalat, lisäosat) lähetetään kappalemäärä erikseen,

      kpl: pitNum ? undefined : kplNum,
      angles: [],
      totalM2,
      material: materiaali,
      color: vari,
      thickness: parseFloat(paksuus),
      productGroup: 'Piippu',
      source: 'piippu',

  localStorage.setItem('kpt_add_to_order', JSON.stringify({

function laske() {
  const piippukpl = Math.max(1, gv('v-piippukpl') || 1);
  const hasHuppu  = chk('chk-huppu');

  // Peltien mitat lasketaan yhteisessä tiedostossa piippu-laskenta.js (sama laskenta kuin Tuotannon piippunäkymässä)
  const vals = {};
  LASKENTA_KENTAT.forEach(([nimi, id]) => { vals[nimi] = gv(id); });
  Object.assign(vals, { saumatyyppi, takaKpl, huppuEtuKpl, huppuSivutKpl, huppuTakaKpl });
  const { juuret, muut, geom: g } = KPT_PIIPPU.laskeLapepiippu(vals, {
    juuret: chk('chk-juuret'), huppu: hasHuppu, kansi: chk('chk-kansi'), hattu: chk('chk-hattu'),
  });

  document.getElementById('etukulma-txt').textContent = g.etukulma;
  document.getElementById('takakulma-txt').textContent = g.takakulma;

  // Kaltevuussuhde 1:X
  const kaltEl = document.getElementById('kaltevuus-txt');
  if (g.korkeuserot > 0 && vals.suora > 0) {
    const suhde = (vals.suora / g.korkeuserot).toFixed(1);
    kaltEl.textContent = ` 1:${suhde}`;
  } else {
    kaltEl.textContent = '—';
  }

  // Jalat ja lisäosat
  const jalat = gv('v-jalat');
  if (jalat > 0) {
    muut.push({ osa: 'Piipun jalat', lev: '—', pit: '—', kpl: jalat });
  }
  lisaosat.forEach(r => {
    if (r.nimi && r.kpl > 0) {
      muut.push({ osa: r.nimi, lev: '—', pit: '—', kpl: r.kpl });
    }
  });

  piirraKuva(vals.leveys, vals.suora, vals.etukork, vals.takakork, vals.k24, vals.j25, vals.harjalle, g.vinomitta, vals.takareuna,
    g.hEtuKorkMerkinta, g.hTakaKorkMerkinta, hasHuppu, g.q9, vals.harjaylitys, g.hSivEtenema);
  renderTaulu('luettelo-juuret', juuret, piippukpl);
  renderTaulu('luettelo-huppu', muut, piippukpl);
}

function renderTaulu(elId, pellit, piippukpl) {
  const el = document.getElementById(elId);
  if (!pellit.length) { el.innerHTML = '<p class="empty-msg">—</p>'; return; }
  let tot = 0;
  const rows = pellit.map(p => {
    const kplYht = p.kpl * (piippukpl || 1);
    const m2 = (typeof p.lev === 'number' && typeof p.pit === 'number')
      ? p.lev * p.pit * kplYht / 1000000
      : null;
    if (m2 !== null) tot += m2;
    return `<tr>
      <td>${p.osa}</td>
      <td class="td-num">${p.lev}</td>
      <td class="td-sym">${typeof p.lev === 'number' ? '×' : ''}</td>
      <td class="td-num">${typeof p.pit === 'number' ? p.pit : ''}</td>
      <td class="td-num">${kplYht}</td>
      <td class="td-num">${m2 !== null ? m2.toFixed(3) : ''}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table>
    <thead><tr>
      <th>Osa</th><th class="td-num">Lev</th><th></th>
      <th class="td-num">Pit</th><th class="td-num">Kpl</th><th class="td-num">m²</th>
    </tr></thead>
    <tbody>${rows}
    <tr class="total-row">
      <td colspan="5">Yhteensä</td>
      <td class="td-num">${tot.toFixed(3)} m²</td>
    </tr></tbody>
  </table>`;
}

function piirraKuva(leveys, suora, etukork, takakork, k24, j25, harjalle, vinomitta, takareuna, hEtuKork, hTakaKork, hasHuppu, q9, harjaylitys, hSivEtenemä) {
  const svg = document.getElementById('svg-content');
  const W = 640, H = 260;
  const mL = 85, mR = 130, mT = 22, mB = 20;
  const drawW = W - mL - mR;
  const drawH = H - mT - mB;

  const maxKork = Math.max(etukork, takakork) || 1;
  // Skaala lasketaan koko kuvan leveydelle: etuuloke + piipun suora + harjamatka
  const etuUloke = (k24 || 50);
  const kokonaisLev = etuUloke + (suora || 1) + (harjalle || 1);
  const scaleX  = drawW * 0.92 / kokonaisLev;
  const scaleY  = drawH * 0.72 / maxKork;
  const scale   = Math.min(scaleX, scaleY);

  const etuX = mL + etuUloke * scale;
  const piipW = suora * scale;
  const takaX = etuX + piipW;
  const etuY  = mT + drawH * 0.88;
  const takaY = etuY - (etukork - takakork) * scale;
  const slope = piipW > 0 ? (takaY - etuY) / piipW : 0;

  const kattoVasenX = etuX - etuUloke * scale;
  const kattoVasenY = etuY - slope * (etuUloke * scale);
  const harjW  = harjalle * scale;
  const harjaX = takaX + harjW;
  const harjaY = takaY + slope * harjW;

  const ylaY = Math.min(etuY - etukork * scale, takaY - takakork * scale);

  const c1 = '#f1f5f9', c2 = '#64748b', cInfo = '#38bdf8';
  let h = '';

  // Katon kulma-arktangensista — dx ja dy yksikkövektorina katon suunnassa
  const kattoLen = Math.sqrt((harjaX-kattoVasenX)**2 + (harjaY-kattoVasenY)**2) || 1;
  const kattoDX = (harjaX - kattoVasenX) / kattoLen;  // yksikkövektori katon suunnassa
  const kattoDY = (harjaY - kattoVasenY) / kattoLen;
  // Kohtisuora katon pintaan (alaspäin katsottuna = oikealle kääntynyt normaali)
  const normX =  kattoDY;   //  kohtisuora vektori (katon alle = reunan mitta-offset)
  const normY = -kattoDX;

  // Kattoviiva
  h += `<line x1="${kattoVasenX}" y1="${kattoVasenY}" x2="${harjaX}" y2="${harjaY}" stroke="${c2}" stroke-width="1.5" stroke-linecap="round"/>`;

  // Piipun runko
  h += `<line x1="${etuX}" y1="${etuY}" x2="${etuX}" y2="${ylaY}" stroke="${c1}" stroke-width="2" stroke-linecap="round"/>`;
  h += `<line x1="${takaX}" y1="${takaY}" x2="${takaX}" y2="${ylaY}" stroke="${c1}" stroke-width="2" stroke-linecap="round"/>`;
  h += `<line x1="${etuX}" y1="${ylaY}" x2="${takaX}" y2="${ylaY}" stroke="${c1}" stroke-width="2" stroke-linecap="round"/>`;

  // Juuri etu uloke — oikeassa mittakaavassa
  const jEtuX = kattoVasenX;
  const jEtuKattoY = kattoVasenY;
  h += `<line x1="${etuX}" y1="${etuY}" x2="${jEtuX}" y2="${jEtuKattoY}" stroke="${c1}" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>`;
  // Alas-viiva (j25) kohtisuoraan katon pintaan — normaali osoittaa katon alle (positiivinen = alas)
  const alasLen = j25 * scale;
  h += `<line x1="${jEtuX}" y1="${jEtuKattoY}" x2="${jEtuX - normX*alasLen}" y2="${jEtuKattoY - normY*alasLen}" stroke="${c1}" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>`;

  // Juuri taka harjalle
  h += `<line x1="${takaX}" y1="${takaY}" x2="${harjaX}" y2="${harjaY}" stroke="${c1}" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>`;

  // Saumaviivat — kohtisuoraan harjaviivaa vasten saumapisteiden kohdalla
  if (takaKpl >= 2) {
    const juurisaumaSvg = gv('v-juurisauma');
    const taka1mittaSvg = gv('v-taka1mitta');
    const taka2mittaSvg = gv('v-taka2mitta');
    const taka3mittaSvg = gv('v-taka3mitta');
    const saumaViivaPit = 10; // saumaviivan pituus kohtisuoraan

    function pirraSauma(etaisyys) {
      // Etäisyys takaX:stä harjalle (skaalattu)
      const sx = takaX + kattoDX * etaisyys * scale;
      const sy = takaY + kattoDY * etaisyys * scale;
      // Viiva kohtisuoraan harjaviivaa vasten (normaalivektori)
      h += `<line x1="${sx - normX*saumaViivaPit}" y1="${sy - normY*saumaViivaPit}" x2="${sx + normX*saumaViivaPit}" y2="${sy + normY*saumaViivaPit}" stroke="${cInfo}" stroke-width="1.5" stroke-linecap="round"/>`;
    }

    // Sauma 1: taka1mitta:n kohdalla
    if (taka1mittaSvg > 0) pirraSauma(taka1mittaSvg);
    // Sauma 2: taka1+taka2:n kohdalla (vain 3+ kappaleella)
    if (takaKpl >= 3 && taka2mittaSvg > 0) pirraSauma(taka1mittaSvg + taka2mittaSvg);
    // Sauma 3: taka1+taka2+taka3:n kohdalla (vain 4 kappaleella)
    if (takaKpl >= 4 && taka3mittaSvg > 0) pirraSauma(taka1mittaSvg + taka2mittaSvg + taka3mittaSvg);

    // Pituuslukemat kappaleiden keskikohtiin, harjaviivan yläpuolelle
    function tekstiKeskelle(alku, loppu, teksti) {
      const keski = (alku + loppu) / 2;
      const tx = takaX + kattoDX * keski * scale;
      const ty = takaY + kattoDY * keski * scale;
      // Offset ylöspäin (normaalin vastainen suunta = katon yläpuoli)
      h += `<text x="${tx - normX*16}" y="${ty - normY*16}" text-anchor="middle" font-size="11" fill="${c1}" font-family="system-ui">${r(teksti)}</text>`;
    }

    // Näytetään vain välin mitta — ei koko pellin pituutta
    if (taka1mittaSvg > 0) tekstiKeskelle(0, taka1mittaSvg, taka1mittaSvg);
    if (takaKpl >= 2 && taka1mittaSvg > 0) {
      const loppu2 = takaKpl === 2 ? harjalle : taka1mittaSvg + taka2mittaSvg;
      const vali2 = takaKpl === 2 ? harjalle - taka1mittaSvg : taka2mittaSvg;
      if (loppu2 > taka1mittaSvg) tekstiKeskelle(taka1mittaSvg, loppu2, vali2);
    }
    if (takaKpl >= 3 && taka2mittaSvg > 0) {
      const alku3 = taka1mittaSvg + taka2mittaSvg;
      const loppu3 = takaKpl === 3 ? harjalle : alku3 + taka3mittaSvg;
      const vali3 = takaKpl === 3 ? harjalle - taka1mittaSvg - taka2mittaSvg : taka3mittaSvg;
      if (loppu3 > alku3) tekstiKeskelle(alku3, loppu3, vali3);
    }
    if (takaKpl === 4 && taka3mittaSvg > 0) {
      const alku4 = taka1mittaSvg + taka2mittaSvg + taka3mittaSvg;
      const vali4 = harjalle - alku4;
      if (vali4 > 0) tekstiKeskelle(alku4, harjalle, vali4);
    }
  }

  // Takareuna eteenpäin -koukku — oikeassa mittakaavassa, kääntyy takaisin piippuun päin
  if (takareuna > 0) {
    const koukkuLen = takareuna * scale;
    // Koukku lähtee harjalta takaisin piippuun päin (vastasuunta kattovektoria)
    const koukkuX = harjaX - kattoDX * koukkuLen;
    const koukkuY = harjaY - kattoDY * koukkuLen;
    h += `<line x1="${harjaX}" y1="${harjaY}" x2="${koukkuX}" y2="${koukkuY}" stroke="${c1}" stroke-width="1.5" stroke-linecap="round"/>`;
    // Mitta kohtisuoraan katon yläpuolelle (normaalin vastaiseen suuntaan = ylöspäin katosta)
    const mOff = 10;
    const mMidX = (harjaX + koukkuX) / 2 - normX * mOff;
    const mMidY = (harjaY + koukkuY) / 2 - normY * mOff;
    h += `<text x="${mMidX}" y="${mMidY}" text-anchor="middle" font-size="10" fill="${cInfo}" font-family="system-ui">+${r(takareuna)}</text>`;
  }

  // Harjaylitys — harjapisteestä toiselle lappeelle (peilikuva katon kaltevuudesta)
  if (harjaylitys > 0) {
    const ylitysLen = harjaylitys * scale;
    // Toinen lape on peilikuva — kattoDX sama mutta kattoDY käännetty (nousee ylöspäin)
    const ylitysX = harjaX + kattoDX * ylitysLen;
    const ylitysY = harjaY - kattoDY * ylitysLen;
    h += `<line x1="${harjaX}" y1="${harjaY}" x2="${ylitysX}" y2="${ylitysY}" stroke="${c1}" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>`;
    // Mitta viivan yläpuolelle
    const ymx = (harjaX + ylitysX) / 2 - normX * 14;
    const ymy = (harjaY + ylitysY) / 2 - 8;
    h += `<text x="${ymx}" y="${ymy}" text-anchor="middle" font-size="10" fill="${cInfo}" font-family="system-ui">${r(harjaylitys)}</text>`;
  }

  // Vinomitta — piipun lävistäjänä (etuX,etuY) → (takaX,takaY)
  h += `<line x1="${etuX}" y1="${etuY}" x2="${takaX}" y2="${takaY}" stroke="${cInfo}" stroke-width="1" stroke-dasharray="3 3"/>`;
  h += `<text x="${(etuX+takaX)/2}" y="${(etuY+takaY)/2+14}" text-anchor="middle" font-size="10" fill="${cInfo}" font-family="system-ui">↗ vino ${r(vinomitta)}</text>`;

  // Suora mitta — vaakasuora piipun yläpuolella
  const smY = ylaY - 14;
  h += `<line x1="${etuX}" y1="${smY}" x2="${takaX}" y2="${smY}" stroke="${c2}" stroke-width="0.8" marker-end="url(#arr)" marker-start="url(#arr)"/>`;
  h += `<text x="${(etuX+takaX)/2}" y="${smY-5}" text-anchor="middle" font-size="11" fill="${c2}" font-family="system-ui">Suora ${suora}</text>`;
  if (hSivEtenemä > 0) {
    h += `<text x="${(etuX+takaX)/2}" y="${smY+12}" text-anchor="middle" font-size="10" fill="${cInfo}" font-family="system-ui">↳ etenemä ${hSivEtenemä}</text>`;
  }

  // Etukorkeus — mitta 1/4 yläreunasta alaspäin, ei apuviivoja
  const eMX = etuX - 26;
  const etuMittaY = ylaY + (etuY - ylaY) * 0.25;
  h += `<line x1="${eMX}" y1="${ylaY}" x2="${eMX}" y2="${etuY}" stroke="${c2}" stroke-width="0.8" marker-end="url(#arr)" marker-start="url(#arr)"/>`;
  h += `<text x="${eMX-4}" y="${etuMittaY}" text-anchor="end" font-size="11" fill="${c2}" font-family="system-ui">Etu ${etukork}</text>`;
  if (hasHuppu) {
    h += `<text x="${eMX-4}" y="${etuMittaY+14}" text-anchor="end" font-size="10" fill="${cInfo}" font-family="system-ui">↳ ${r(hEtuKork)}</text>`;
  }

  // Hupun sivujen saumaviivat
  if (hasHuppu && huppuSivutKpl >= 2) {
    const diff = hEtuKork - hTakaKork;

    function pirraSivuSauma(frac, korkeus) {
      const vX = etuX + (takaX - etuX) * frac;
      const vYbot = etuY + (takaY - etuY) * frac;
      const vYtop = vYbot - korkeus * scale;
      h += `<line x1="${vX}" y1="${vYtop}" x2="${vX}" y2="${vYbot}" stroke="${cInfo}" stroke-width="1.5" stroke-linecap="round"/>`;
      // Pelkkä luku, ei mittajanaa
      const mMidY = (vYtop + vYbot) / 2 + 4;
      h += `<text x="${vX-6}" y="${mMidY}" text-anchor="end" font-size="10" fill="${cInfo}" font-family="system-ui">${r(korkeus)}</text>`;
    }

    if (huppuSivutKpl === 2) {
      pirraSivuSauma(0.5, hEtuKork - diff / 2);
    } else {
      pirraSivuSauma(1/3, hEtuKork - diff / 3);
      pirraSivuSauma(2/3, hEtuKork - diff * 2/3);
    }
  }

  // Suora mitta — vaakasuora piipun yläpuolella

  // Takakorkeus — mitta 1/4 yläreunasta alaspäin, ei apuviivoja
  const tMX = takaX + 24;
  const takaMittaY = ylaY + (takaY - ylaY) * 0.25;
  h += `<line x1="${tMX}" y1="${ylaY}" x2="${tMX}" y2="${takaY}" stroke="${c2}" stroke-width="0.8" marker-end="url(#arr)" marker-start="url(#arr)"/>`;
  h += `<text x="${tMX+4}" y="${takaMittaY}" text-anchor="start" font-size="11" fill="${c2}" font-family="system-ui">Taka ${takakork}</text>`;
  if (hasHuppu) {
    h += `<text x="${tMX+4}" y="${takaMittaY+14}" text-anchor="start" font-size="10" fill="${cInfo}" font-family="system-ui">↳ ${r(hTakaKork)}</text>`;
  }

  // Harjalle mitta — katon kaltevuuden suuntaisesti, harjaviivan ALAPUOLELLA (normaali käännetty)
  const hjOff = 14;
  const hj1X = takaX - normX * hjOff;
  const hj1Y = takaY - normY * hjOff;
  const hj2X = harjaX - normX * hjOff;
  const hj2Y = harjaY - normY * hjOff;
  const hjMidX = (hj1X + hj2X) / 2;
  const hjMidY = (hj1Y + hj2Y) / 2;
  h += `<line x1="${hj1X}" y1="${hj1Y}" x2="${hj2X}" y2="${hj2Y}" stroke="${c2}" stroke-width="0.8" marker-end="url(#arr)" marker-start="url(#arr)"/>`;
  h += `<text x="${hjMidX}" y="${hjMidY + 14}" text-anchor="middle" font-size="10" fill="${c2}" font-family="system-ui">harjalle ${harjalle}</text>`;

  svg.innerHTML = h;
}

function r(n) { return Math.round(n); }
laske();

// Sidebar resizer
(function() {
  const STORAGE_KEY = 'kpt_piippu_sidebar_width';
  const MIN_WIDTH = 260;
  const MAX_WIDTH = 700;
  const WIDE_THRESHOLD = 420;
  const XWIDE_THRESHOLD = 580;
  const sidebar = document.getElementById('sidebar');
  const resizer = document.getElementById('sidebar-resizer');
  const main = document.querySelector('.main');

  const saved = parseInt(localStorage.getItem(STORAGE_KEY));
  if (saved && saved >= MIN_WIDTH) {
    main.style.gridTemplateColumns = saved + 'px 1fr';
    if (saved >= XWIDE_THRESHOLD) { sidebar.classList.add('wide'); sidebar.classList.add('xwide'); }
    else if (saved >= WIDE_THRESHOLD) { sidebar.classList.add('wide'); sidebar.classList.remove('xwide'); }
  }

  let startX, startW;
  resizer.addEventListener('mousedown', e => {
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    function onMove(e) {
      const w = Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, startW + (e.clientX - startX)));
      main.style.gridTemplateColumns = w + 'px 1fr';
      if (w >= XWIDE_THRESHOLD) { sidebar.classList.add('wide'); sidebar.classList.add('xwide'); }
      else if (w >= WIDE_THRESHOLD) { sidebar.classList.add('wide'); sidebar.classList.remove('xwide'); }
      else { sidebar.classList.remove('wide'); sidebar.classList.remove('xwide'); }
    }

    function onUp() {
      localStorage.setItem(STORAGE_KEY, sidebar.offsetWidth);
      resizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();
</script>
