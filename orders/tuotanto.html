  // Samat rivit kuin ruudulla (myös työkortin materiaalisuodatin), samassa järjestyksessä

  const nakyvat = cardFilterKey ? sorted.filter(i => itemGroupKey(i) === cardFilterKey) : sorted;
  const ryhmat = [];

    if (!g) { g = { nimi: n, rivit: [] }; ryhmat.push(g); }

  });

  ryhmat.forEach(g => {
    const pellit = g.rivit.filter(i => !isKappale(i));

    h += `<h2>${e(g.nimi)}<span>${kpl ? 'Pellit ' + kpl + ' kpl' : ''}</span></h2>`;

    // Piippu (vaihe 7.4, 23.11.2026): tiivis osat-taulukko ja QR piipun omalle Tuotanto-sivulle, jossa on piipun työkortti

      const mat = [i0.material, i0.color, i0.thickness_mm ? i0.thickness_mm + ' mm' : ''].filter(Boolean).join(' · ');
      const vals = (piippuOsat.find(i => i.profile_data && i.profile_data.vals) || {}).profile_data?.vals || {};
      const tyyppi = vals.tyyppi === 'harjapiippu' ? 'Harjapiippu' : 'Piippu';

      const qrP = T.qrSvg(linkkiP);
      const rivitP = piippuOsat.map(i => {
        const rr = i.order_item_rows || [];
        const r0 = rr[0] || {};
        const kplP = rr.length ? rr.reduce((a, r) => a + (Number(r.kpl) || 0), 0) : (i.quantity || '');

          ${T.aikaRivi ? T.aikaRivi(vals.tyoaika) : ''}

    // Huuva / kartio (vaihe 8.4c): palat taulukkona ja QR sivulle tuotantotilassa, jossa on oma työkortti kuvineen
    ['huuva', 'kartio'].forEach(tyyppi => {

        </div>
      </div></div>`;

    pellit.filter(i => i.profile_type !== 'piippu' && i.profile_type !== 'huuva' && i.profile_type !== 'kartio').forEach(i => {
      const pd = i.profile_data || {};

      const rows = [...(i.order_item_rows || [])].sort((a, b) => (b.kok_mm || 0) - (a.kok_mm || 0));
      let kuva = '';
      if (i.profile_type) {

        const pisin = pituudet.length ? Math.max.apply(null, pituudet) : 1000;
        const kiila = { valsB: kourunValsB(i.profile_type, pd.vals || {}, pd.opts || {}, pisin) || pd.valsB || null, viite: pd.pituusViite };
        kuva = drawKanttausSVG(i.profile_type, pd.vals || {}, pd.opts || {}, pd.asento, null, kiila) || '';
      }
      const rivitHtml = rows.length ? rows.map(r => {

            <tr><th>Mitta</th><th>Päät</th><th>Kok.</th><th class="tk-c">kpl</th><th>Huomio</th><th>Työvaihe</th></tr>

    });

    if (tarvikkeet.length) {

        <tr><th>Tarvikkeet</th><th class="tk-c">Määrä</th><th>Huomio</th><th class="tk-c">Kerätty</th></tr>
        ${tarvikkeet.map(i => {

        }).join('')}</table>`;

  });
  if (!ryhmat.length) h += '<p>Ei tulostettavia rivejä.</p>';
  h += T.alaosa('Työkortti');
  return T.sivu(h);

  { id: 'merkkaus', teksti: 'Merkkausmitat mukaan (levityskuva ja merkkausmitat jokaiselle pellille, lisää sivuja)', oletus: false },
] });

// Työkorttia varten tilausnumero, työmaan osoite ja ohjeet. Haetaan erikseen select=*:llä,
// jotta tilauslistan haku ei kaadu, jos jotain saraketta ei (vielä) ole kannassa.
async function haeTilauksenLisatiedot(o) {
  if (!o || o._lisatiedot) return;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${o.id}&select=*`, { headers });
    if (!r.ok) return;
    const [x] = await r.json();
    if (x) { o.order_number = x.order_number; o.site_address = x.site_address; o.site_instructions = x.site_instructions; o._lisatiedot = true; }
  } catch (e) { console.warn('Tilauksen lisätiedot:', e); }
}

// QR-koodista tai linkistä: tuotanto.html?tilaus=<id> avaa tilauksen suoraan
function avaaLinkinTilaus() {
  let id = null;
  try { id = sessionStorage.getItem('kpt_avaa_tilaus'); sessionStorage.removeItem('kpt_avaa_tilaus'); } catch (e) {}
  if (!id) return;
  if (allOrders.some(o => o.id === id)) openOrder(id);
  else alertTilausEiLoydy(id);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}
function alertTilausEiLoydy() {
  const g = document.getElementById('ordersGrid');
  if (g) g.insertAdjacentHTML('afterbegin', '<div class="empty-state" style="grid-column:1/-1;padding:16px">Linkin tilausta ei löytynyt tuotannosta (se voi olla jo laskutettu tai arkistoitu).</div>');
}

// ── Init ──────────────────────────────────────────────────────────
loadOrders().then(avaaLinkinTilaus);
</script>
</body>
</html>
