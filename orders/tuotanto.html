<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuotanto — Kalajoen Peltityö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<!-- Ulkoasuremontti R3c (26.11.2026): uusi ulkoasu (tyyli.css + teema.js), rakenne ja toiminnot ennallaan, isommat
     vaihenapit. Tulosteet (tilauslista, yhteislista, työkortti) ennallaan. -->
<link rel="stylesheet" href="tyyli.css?v=3">
<script src="teema.js?v=1"></script>
<style>
  /* Ulkoasuremontti R3c (26.11.2026): yhteinen tyyli.css. Rakenne ja luokat pysyivät ennallaan, värit
     --kpt-muuttujista (vanhat värinimet vaihdettu --kpt-muuttujiksi 27.11.2026), myös skriptin inline-tyyleissä. Tulostusohjeet (@media print) ennallaan. */
  :root, html[data-teema] {
    --lisatyo: var(--kpt-v-ajat);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; }

  /* SISÄLTÖ */
  .page { padding: 0; }

  /* ── NÄKYMÄ 1: TILAUSLISTA ── */
  #view-list { display: block; }
  #view-card { display: none; }

  /* Materiaalisuodatin */
  .filter-bar {
    background: var(--kpt-paneeli2);
    border-bottom: 1px solid var(--kpt-reuna);
    padding: 12px 24px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .filter-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    font-weight: 600; letter-spacing: 0.08em; color: var(--kpt-himmea);
    white-space: nowrap;
  }
  .filter-select {
    background: var(--kpt-kentta); border: 1px solid var(--kpt-reuna);
    color: var(--kpt-teksti); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; padding: 6px 10px; border-radius: 4px; cursor: pointer;
  }
  .filter-divider { width: 1px; height: 20px; background: var(--kpt-reuna); margin: 0 4px; }
  .status-filter-btns { display: flex; gap: 4px; flex-wrap: wrap; }
  .status-filter-btn {
    background: var(--kpt-paneeli2); border: 1px solid var(--kpt-reuna);
    color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; padding: 4px 8px; border-radius: 3px; cursor: pointer;
    transition: all 0.15s;
  }
  .status-filter-btn.active {
    background: var(--kpt-korostus-tausta); border-color: var(--kpt-korostus);
    color: var(--kpt-korostus); font-weight: 600;
  }
  .status-filter-btn[data-status="ORDERED"].active { border-color: var(--kpt-v-tilaukset); color: var(--kpt-v-tilaukset); background: color-mix(in srgb, var(--kpt-v-tilaukset) 14%, transparent); }
  .status-filter-btn[data-status="IN_PRODUCTION"].active { border-color: var(--kpt-huom); color: var(--kpt-huom); background: color-mix(in srgb, var(--kpt-huom) 14%, transparent); }
  .status-filter-btn[data-status="IN_PROGRESS"].active { border-color: var(--kpt-himmea); color: var(--kpt-teksti); background: color-mix(in srgb, var(--kpt-himmea) 14%, transparent); }
  .status-filter-btn[data-status="QUOTED"].active { border-color: var(--lisatyo); color: var(--lisatyo); background: color-mix(in srgb, var(--lisatyo) 14%, transparent); }
  .status-filter-btn[data-status="DRAFT"] { border-style: dashed; }
  .status-filter-btn[data-status="DRAFT"].active { border-color: var(--kpt-himmea); color: var(--kpt-teksti); background: color-mix(in srgb, var(--kpt-himmea) 16%, transparent); }
  .status-filter-btn[data-status="COMPLETED"].active { border-color: var(--kpt-korostus); color: var(--kpt-korostus); background: var(--kpt-korostus-tausta); }
  .filter-select option { background: var(--kpt-paneeli2); }
  .filter-clear {
    background: none; border: 1px solid var(--kpt-reuna); color: var(--kpt-himmea);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
  }
  .filter-clear:hover { border-color: var(--kpt-virhe); color: var(--kpt-virhe); }
  .filter-info {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--kpt-korostus); margin-left: auto;
  }
  .filter-list-btn {
    background: none; border: 1px solid var(--kpt-korostus); color: var(--kpt-korostus);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 5px 12px; border-radius: 4px; cursor: pointer;
    transition: all 0.15s;
  }
  .filter-list-btn:hover, .filter-list-btn.active {
    background: var(--kpt-korostus); color: var(--kpt-teksti-korostuksella); font-weight: 600;
  }

  /* Yhteislista */
  .combined-list { padding: 16px 24px; display: flex; flex-direction: column; gap: 16px; }
  .combined-order-block {
    background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna);
    border-radius: 8px; overflow: hidden;
  }
  .combined-order-header {
    background: var(--kpt-paneeli2); padding: 10px 16px;
    border-bottom: 1px solid var(--kpt-reuna);
    display: flex; align-items: baseline; gap: 12px;
  }
  .combined-customer { font-weight: 600; font-size: 14px; }
  .combined-kohde { font-size: 11px; color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace; }
  .combined-matval { font-size: 11px; color: var(--kpt-korostus); font-family: 'IBM Plex Mono', monospace; font-weight: 600; margin-left: auto; }
  .combined-date { font-size: 11px; color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace; margin-left: 12px; }
  .combined-item-row {
    padding: 8px 16px; border-bottom: 1px solid var(--kpt-reuna);
    display: flex; flex-direction: column; gap: 4px;
  }
  .combined-item-row:last-child { border-bottom: none; }
  .combined-item-nimike {
    font-size: 12px; font-weight: 600; color: var(--kpt-teksti);
  }
  .combined-aihio {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--kpt-v-tilaukset); font-weight: 400; margin-bottom: 2px;
  }
  .combined-rows { display: flex; flex-direction: column; gap: 2px; padding-left: 8px; }
  .combined-pituusrivi {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--kpt-himmea); display: flex; gap: 10px; align-items: center;
  }
  .combined-pituusrivi .ck { color: var(--kpt-teksti); min-width: 50px; }
  .combined-pituusrivi .cm { color: var(--kpt-teksti); min-width: 65px; }
  .combined-pituusrivi .cp { color: var(--kpt-v-tilaukset); min-width: 55px; }
  .combined-pituusrivi .cko { color: var(--kpt-huom); font-weight: 700; min-width: 65px; font-size: 13px; }
  .combined-pituusrivi .ch { color: var(--kpt-himmea); font-size: 10px; }
  .combined-pituusrivi .cs {
    font-size: 10px; padding: 1px 5px; border-radius: 3px;
    border: 1px solid var(--kpt-reuna); color: var(--kpt-himmea);
  }
  .combined-pituusrivi .cs.DONE { border-color: var(--kpt-korostus); color: var(--kpt-korostus); }
  .combined-pituusrivi .cs.CUT { border-color: var(--kpt-v-tilaukset); color: var(--kpt-v-tilaukset); }
  .combined-pituusrivi .cs.BENT { border-color: var(--kpt-huom); color: var(--kpt-huom); }
  .combined-pituusrivi .cs.EXTRA { border-color: var(--lisatyo); color: var(--lisatyo); }

  @media print {
    .combined-order-block { break-inside: avoid; }
    .combined-order-header { background: #f5f5f5; }
    .combined-pituusrivi .cs { display: none; }
  }

  /* Tilauskorttilista */
  .orders-grid {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
    gap: 14px;
  }

  .order-card {
    background: var(--kpt-paneeli);
    border: 1px solid var(--kpt-reuna);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    overflow: hidden;
  }
  .order-card:hover { border-color: var(--kpt-korostus); background: var(--kpt-paneeli2); }
  .order-card.status-all-done { border-left: 4px solid var(--kpt-korostus); }
  .order-card.status-started  { border-left: 4px solid var(--kpt-huom); }
  .order-card.status-none     { border-left: 4px solid var(--kpt-reuna); }

  .card-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--kpt-reuna);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .card-header-info { flex: 1; }
  .card-customer { font-weight: 600; font-size: 14px; color: var(--kpt-teksti); }
  .card-kohde { font-size: 12px; color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .card-date { font-size: 11px; color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  .card-status-badge {
    display: inline-block; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    padding: 2px 7px; border-radius: 3px; margin-top: 4px;
    border: 1px solid currentColor;
  }
  /* Kiila ja levityskuva (13.11.2026) */
  .kiila-merkki { display: inline-block; background: #f0a429; color: #1c1f26; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.1em; padding: 2px 8px; border-radius: 5px; vertical-align: middle; }
  .lev-nappi { display: block; margin: 8px auto 0; min-height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--kpt-reuna); background: transparent; color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; }
  .lev-nappi.kiila { border-color: #f0a429; color: #f0a429; }
  .lev-alue { border: 1px solid var(--kpt-paperi-reuna); width: 100%; min-width: 0; box-sizing: border-box; align-self: stretch; overflow: hidden; background: #fff; color: #1c1f26; border-radius: 6px; padding: 10px; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .lev-pituus { font-weight: 600; margin: 6px 0; }
  .lev-laput { margin-top: 8px; padding-top: 6px; border-top: 1px solid #ddd; }
  .lev-laput > div { margin-top: 2px; }
  .lev-suora { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; color: #1d6b3a; background: #e3f1e6; border: 1px solid #a9d3b4; border-radius: 6px; padding: 5px 8px; margin: 6px 0; }
  .lev-kehys { overflow-x: auto; margin-top: 6px; }
  .lev-taulu { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 12px; }
  .lev-taulu th, .lev-taulu td { padding: 5px 7px; text-align: right; border-bottom: 1px solid #ddd; white-space: nowrap; }
  .lev-taulu th { color: #555; font-size: 10px; font-weight: 500; text-transform: uppercase; }
  .lev-taulu .lev-kulma { color: #c0392b; }
  .lev-taulu .lev-b { font-weight: 600; }
  .lev-vihje, .lev-huom { font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #555; margin: 8px 0 0; }
  @media print { .lev-nappi { display: none !important; } .lev-kehys { overflow: visible; } .lev-taulu { min-width: 0; font-size: 10px; } .lev-taulu th, .lev-taulu td { padding: 3px 4px; } }
  .badge-DRAFT        { color: var(--kpt-himmea); border-color: var(--kpt-himmea); border-style: dashed; }
  .badge-IN_PROGRESS  { color: var(--kpt-himmea); border-color: var(--kpt-reuna); }
  .badge-QUOTED       { color: var(--lisatyo); border-color: var(--lisatyo); }
  .badge-ORDERED      { color: var(--kpt-v-tilaukset); border-color: var(--kpt-v-tilaukset); }
  .badge-IN_PRODUCTION{ color: var(--kpt-huom); border-color: var(--kpt-huom); }
  .badge-COMPLETED    { color: var(--kpt-korostus); border-color: var(--kpt-korostus); }
  .badge-INVOICED     { color: var(--kpt-info); border-color: var(--kpt-info); }
  .card-status-mini {
    background: var(--kpt-kentta); border: 1px solid var(--kpt-reuna);
    color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; padding: 2px 6px; border-radius: 3px; cursor: pointer;
  }
  .card-status-mini:focus { outline: none; border-color: var(--kpt-korostus); }

  .card-body { padding: 12px 16px; }

  /* Edistymispalkki */
  .progress-wrap { margin-bottom: 10px; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--kpt-himmea); margin-bottom: 4px;
  }
  .progress-bar-bg {
    background: var(--kpt-paneeli2); border-radius: 3px; height: 6px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 3px; background: var(--kpt-korostus);
    transition: width 0.3s;
  }
  .progress-bar-fill.partial { background: var(--kpt-huom); }
  .progress-bar-fill.zero    { background: var(--kpt-reuna); }

  /* Materiaalitägit */
  .material-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .mtag {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    padding: 2px 7px; border-radius: 3px;
    background: var(--kpt-paneeli2); border: 1px solid var(--kpt-reuna);
    color: var(--kpt-himmea); white-space: nowrap;
  }
  .mtag.highlight { border-color: var(--kpt-korostus); color: var(--kpt-korostus); }

  /* ── NÄKYMÄ 2: TYÖKORTTI ── */
  .card-view-header {
    background: var(--kpt-paneeli2);
    border-bottom: 1px solid var(--kpt-reuna);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .back-btn {
    background: none; border: 1px solid var(--kpt-reuna);
    color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  .back-btn:hover { border-color: var(--kpt-korostus); color: var(--kpt-korostus); }
  .card-view-title { font-size: 16px; font-weight: 600; }
  .card-yhteys { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .card-yhteys:empty { display: none; }
  .card-yhteys a { color: var(--kpt-korostus); text-decoration: none; overflow-wrap: anywhere; }
  .card-yhteys a:hover { text-decoration: underline; }
  .card-view-meta {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--kpt-himmea); display: flex; gap: 16px; flex-wrap: wrap;
    margin-left: auto;
  }

  /* Peltikorttien grid */
  .items-grid {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr));
    gap: 16px;
  }

  .item-card {
    background: var(--kpt-paneeli);
    border: 1px solid var(--kpt-reuna);
    border-radius: 8px;
    overflow: hidden;
  }
  .item-card.done { border-color: var(--kpt-korostus); opacity: 0.7; }

  .item-card-header {
    background: var(--kpt-paneeli2);
    padding: 8px 14px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--kpt-reuna);
  }
  .item-material {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    font-weight: 600; letter-spacing: 0.06em; color: var(--kpt-korostus);
    text-transform: uppercase;
  }
  .item-nimike { font-size: 13px; font-weight: 600; flex: 1; }
  .item-done-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--kpt-korostus); border: 1px solid var(--kpt-korostus);
    padding: 1px 6px; border-radius: 3px;
  }

  .item-card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

  /* LEIKKAUS-lohko */
  .block-title {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; color: var(--kpt-himmea); text-transform: uppercase;
    margin-bottom: 6px;
  }
  .aihio-width {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    color: var(--kpt-v-tilaukset); margin-bottom: 6px;
  }
  .aihio-width-centered {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    color: var(--kpt-v-tilaukset); text-align: center; margin-bottom: 4px;
  }
  .kanttaus-section { display: flex; flex-direction: column; align-items: center; }
  .cut-section { width: 100%; }
  .cut-list { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .cut-list-header {
    display: flex; gap: 0; padding: 3px 0 3px 6px;
    border-bottom: 1px solid var(--kpt-reuna);
    font-size: 10px; color: var(--kpt-himmea);
  }
  .cut-row-wrap { padding-left: 6px; margin-bottom: 1px; }
  .cut-row-wrap.row-done { opacity: 0.55; }
  .cut-row-top {
    display: flex; gap: 0; padding: 4px 0;
    align-items: center;
  }
  .cut-row-bottom {
    display: flex; gap: 8px; padding: 3px 0 5px 0;
    align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid var(--kpt-reuna);
  }
  .cut-row-wrap:last-child .cut-row-bottom { border-bottom: none; }

  /* Sarakeleveydet — sekä header että data-riveille */
  .cut-list .mitta, .cut-list-header .mitta { width: 56px; color: var(--kpt-teksti); }
  .cut-list .paat,  .cut-list-header .paat  { width: 46px; color: var(--kpt-v-tilaukset); }
  .cut-list .kok,   .cut-list-header .kok   { width: 52px; color: var(--kpt-huom); font-weight: 600; }
  .cut-list .kpl,   .cut-list-header .kpl   { width: 32px; color: var(--kpt-korostus); font-weight: 600; }
  .cut-list .done-qty-cell,
  .cut-list-header .done-qty-cell            { width: 56px; }
  .cut-list .huomio-cell,
  .cut-list-header .huomio-cell              { flex: 1; color: var(--kpt-huom); font-size: 11px; min-width: 60px; }

  /* KANTTAUS-lohko */
  .kanttaus-block {
    background: #fff;
    border: 1px solid var(--kpt-paperi-reuna);
    border-radius: 4px;
    padding: 8px;
    display: inline-block;
    min-height: 60px;
  }
  .kanttaus-svg { display: block; }
  .kanttaus-vals {
    display: flex; flex-direction: column; gap: 2px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    padding-top: 4px;
  }
  .vals-row { display: flex; gap: 6px; align-items: baseline; }
  .vals-key { color: #888; min-width: 80px; }
  .vals-val { color: #1a1a1a; font-weight: 600; }
  .kanttaus-placeholder {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: #aaa; align-self: center;
  }

  /* Statusnappirivi */
  .status-row {
    display: flex; gap: 4px; padding: 10px 14px;
    border-top: 1px solid var(--kpt-reuna);
    background: var(--kpt-paneeli2);
    overflow-x: auto;
  }
  .status-step {
    flex: 1; min-width: 70px;
    background: none; border: 1px solid var(--kpt-reuna);
    color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; padding: 6px 4px; border-radius: 4px;
    cursor: pointer; text-align: center; transition: all 0.15s; white-space: nowrap;
  }
  .status-step:hover { border-color: var(--kpt-himmea); color: var(--kpt-teksti); }
  .status-step.active { background: var(--kpt-korostus); border-color: var(--kpt-korostus); color: var(--kpt-teksti-korostuksella); font-weight: 600; }
  .status-step.passed { background: var(--kpt-paneeli); border-color: var(--kpt-korostus); color: var(--kpt-korostus); }

  .cut-row { border-left: 3px solid var(--row-color, var(--kpt-reuna)); }
  .cut-row-sub { border-left: 3px solid var(--row-color, var(--kpt-reuna)); }
  .cut-row.row-done, .cut-row-sub.row-done { opacity: 0.55; }
  .sub-row-cell {
    padding: 3px 6px 6px 0 !important;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .huomio-tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--kpt-huom); white-space: nowrap;
  }
  .row-status-cell { min-width: 260px; padding: 3px 0; }
  .row-steps { display: flex; gap: 3px; flex-wrap: nowrap; }
  .row-status-btn {
    background: none; border: 1px solid var(--kpt-reuna);
    color: var(--kpt-himmea); font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; padding: 3px 5px; border-radius: 3px;
    cursor: pointer; white-space: nowrap; transition: all 0.1s;
  }
  .row-status-btn:hover { border-color: var(--kpt-himmea); color: var(--kpt-teksti); }

// ── Tila ──────────────────────────────────────────────────────────
let allOrders = [];       // Kaikki tilaukset + order_items
let activeOrderId = null;
let combinedListActive = false;
// Oletuksena Tilattu + Työn alla näkyvissä
let activeStatusFilters = new Set(['ORDERED', 'IN_PRODUCTION']);
// Luonnos ei saa tulla mukaan mihinkään näkymään (ei myöskään materiaalisuodatukseen eikä
// yhdistettyyn leikkauslistaan), ellei Luonnos-suodatinta ole erikseen valittu.
const eiPiilotettuLuonnos = o => o.status !== 'DRAFT' || activeStatusFilters.has('DRAFT');

// ── Statussuodatin ─────────────────────────────────────────────────
function toggleStatusFilter(status) {
  if (activeStatusFilters.has(status)) {
    // Älä poista jos se on viimeinen
    if (activeStatusFilters.size > 1) activeStatusFilters.delete(status);
  } else {
    activeStatusFilters.add(status);
  }
  // Päivitä nappien ulkonäkö
  document.querySelectorAll('.status-filter-btn').forEach(btn => {
    btn.classList.toggle('active', activeStatusFilters.has(btn.dataset.status));
  });
  applyFilter();
}

// ── Supabase-haku ─────────────────────────────────────────────────
async function loadOrders() {
  // Haetaan kaikki aktiiviset tilaukset ja luonnokset (ei ARCHIVED) — suodatus clientissä.
  // Luonnokset (DRAFT) näkyvät vain, kun Luonnos-suodatin on valittu päälle (ks. eiPiilotettuLuonnos).
  const statuses = ['DRAFT','IN_PROGRESS','QUOTED','ORDERED','IN_PRODUCTION','COMPLETED'];
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/orders?status=in.(${statuses.join(',')})` +
    `&order=order_date.asc` +
    `&select=id,order_date,delivery_date,status,kohde,notes,customer_id,customers(name,customer_number,phone,email)`,
    { headers }
  );
  const orders = await r.json();

  // Haetaan order_items kaikille
  const orderIds = orders.map(o => o.id).join(',');
  if (!orderIds) { renderOrderList([]); return; }

  const r2 = await fetch(
    `${SUPABASE_URL}/rest/v1/order_items?order_id=in.(${orderIds})` +
    `&select=id,order_id,group_name,group_order,item_order,nimike,profile_type,aihio_width_mm,material,color,thickness_mm,product_group,quantity,production_status,profile_data,order_item_rows(id,mitta_mm,paat_mm,kok_mm,kpl,huomio,row_order,production_status,done_qty)`,
    { headers }
  );
  const items = await r2.json();

  // Työaika: aikaprojektit, jotka on liitetty tilauksiin (ajanseuranta.html)
  const timeByOrder = await fetchTimeProjects(orderIds);

  // Yhdistetään
  allOrders = orders.map(o => ({
    ...o,
    items: (items || []).filter(i => i.order_id === o.id),
    timeProjects: timeByOrder[o.id] || []
  }));

  buildFilterOptions();
  applyFilter();
}

// ── Työaika (luetaan ajanseurannan tauluista) ─────────────────────
// Rakenne: time_projects (order_id) -> time_project_rows (category) -> time_row_segments (alku, loppu, kesto s)
// Haku ei saa kaataa sivua: epäonnistuessa työaika vain jää näyttämättä.
const TIME_SELECT = 'id,name,order_id,created_at,time_project_rows(id,category,time_row_segments(id,started_at,stopped_at,duration_seconds))';

async function fetchTimeProjects(orderIdsCsv) {
  const byOrder = {};
  if (!orderIdsCsv) return byOrder;
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/time_projects?order_id=in.(${orderIdsCsv})&select=${TIME_SELECT}&order=created_at.asc`,
      { headers }
    );
    if (!r.ok) { console.warn('Työajan haku epäonnistui:', r.status); return byOrder; }
    const list = await r.json();
    (Array.isArray(list) ? list : []).forEach(p => { (byOrder[p.order_id] = byOrder[p.order_id] || []).push(p); });
  } catch (e) {
    console.warn('Työajan haku epäonnistui', e);
  }
  return byOrder;
}

const TIME_STALE_SECONDS = 12 * 3600;  // käynnissä oleva pätkä yli 12 h = todennäköisesti unohtunut

function timeSegSeconds(seg, now) {
  if (seg.stopped_at) return Number(seg.duration_seconds) || 0;
  const t = new Date(seg.started_at).getTime();
  return isNaN(t) ? 0 : Math.max(0, (now - t) / 1000);
}
function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return h + ' h ' + m + ' min';
  if (m > 0) return m + ' min';
  return s + ' s';
}
// Kategoria on vapaata tekstiä: yhdistetään isot/pienet kirjaimet ja ylimääräiset välilyönnit
function timeCatKey(c) { return String(c || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
function timeCatLabel(c) {
  const t = String(c || '').trim().replace(/\s+/g, ' ');
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Ei kategoriaa';
}
function orderTimeSummary(order, now) {
  now = now || Date.now();
  let total = 0, running = false, stale = false;
  const cats = new Map();   // avain -> { label, sec }
  (order.timeProjects || []).forEach(p => (p.time_project_rows || []).forEach(row => {
    (row.time_row_segments || []).forEach(seg => {
      const s = timeSegSeconds(seg, now);
      total += s;
      if (!seg.stopped_at) { running = true; if (s > TIME_STALE_SECONDS) stale = true; }
      const k = timeCatKey(row.category);
      const cur = cats.get(k) || { label: timeCatLabel(row.category), sec: 0 };
      cur.sec += s;
      cats.set(k, cur);
    });
  }));
  const catList = [...cats.values()].filter(c => c.sec > 0).sort((a, b) => b.sec - a.sec);
  return { total, running, stale, cats: catList };
}

function ajanseurantaUrl(projectId) {
  return 'ajanseuranta.html' + (projectId ? '?id=' + encodeURIComponent(projectId) : '');
}

function renderTimePanel(order) {
  const el = document.getElementById('timePanel');
  if (!el) return;
  if (!order) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const sum = orderTimeSummary(order);
  const projects = order.timeProjects || [];
  const catsHtml = sum.cats.map(c => `<span class="time-cat">${escT(c.label)} ${escT(fmtDuration(c.sec))}</span>`).join('');
  let action;
  if (!projects.length) {
    action = `<button class="time-start" id="timeStartBtn" onclick="startTimeProject('${order.id}')">▶ Aloita ajanotto</button>`;
  } else if (projects.length === 1) {
    action = `<a class="time-link" href="${ajanseurantaUrl(projects[0].id)}" target="_blank" rel="noopener">Avaa ajanseuranta →</a>`;
  } else {
    action = projects.map(p => `<a class="time-link" href="${ajanseurantaUrl(p.id)}" target="_blank" rel="noopener" title="${escT(p.name || '')}">${escT((p.name || 'Aikaprojekti').slice(0, 24))} →</a>`).join('');
  }
  el.innerHTML =
    `<span class="time-title">⏱ Työaika</span>` +
    (sum.total > 0
      ? `<span class="time-total">${escT(fmtDuration(sum.total))}</span>`
      : `<span class="time-total none">ei mitattua aikaa</span>`) +
    (sum.running ? `<span class="time-running">● kello käynnissä</span>` : '') +
    (sum.stale ? `<span class="time-warn">⚠ pätkä on ollut käynnissä yli 12 h, unohtuiko kello päälle?</span>` : '') +
    catsHtml +
    `<span class="time-spacer"></span>` + action;
  el.style.display = 'flex';
}

async function getCurrentUserIdSafe() {
  try {
    if (typeof window.getAuthSession !== 'function') return null;
    const s = await window.getAuthSession();
    return s && s.data && s.data.session && s.data.session.user ? s.data.session.user.id : null;
  } catch (e) { return null; }
}

// Luo aikaprojektin tilaukselle ja avaa ajanseurannan. Itse ajanotto (aloita/tauko/jatka) tehdään ajanseurannassa.
async function startTimeProject(orderId) {
  const o = allOrders.find(x => x.id === orderId);
  if (!o) return;
  const btn = document.getElementById('timeStartBtn');
  if (btn) btn.disabled = true;
  const name = [o.customers && o.customers.name, o.kohde].filter(Boolean).join(' — ') || 'Tilaus';
  const body = { name, order_id: o.id };
  const uid = await getCurrentUserIdSafe();
  if (uid) body.created_by = uid;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/time_projects`, {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.text();
      console.warn('Aikaprojektin luonti epäonnistui:', res.status, err);
      alert('Aikaprojektin luonti epäonnistui (' + res.status + ')');
      return;
    }
    const created = await res.json();
    const proj = created && created[0];
    if (!proj) return;
    proj.time_project_rows = [];
    o.timeProjects = (o.timeProjects || []).concat([proj]);
    renderTimePanel(o);
    window.open(ajanseurantaUrl(proj.id), '_blank');
  } catch (e) {
    console.warn('Aikaprojektin luonti epäonnistui', e);
    alert('Aikaprojektin luonti epäonnistui (verkkovirhe)');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// Päivittää avatun tilauksen työajan (esim. kun palataan ajanseurannasta)
async function refreshTimeForActive() {
  const o = allOrders.find(x => x.id === activeOrderId);
  if (!o) return;
  const fresh = await fetchTimeProjects(o.id);
  o.timeProjects = fresh[o.id] || [];
  if (activeOrderId === o.id) renderTimePanel(o);
}
window.addEventListener('focus', () => { if (activeOrderId) refreshTimeForActive(); });
// Käynnissä olevan kellon näyttö päivittyy puolen minuutin välein
setInterval(() => {
  if (!activeOrderId) return;
  const o = allOrders.find(x => x.id === activeOrderId);
  if (o && orderTimeSummary(o).running) renderTimePanel(o);
}, 30000);

// ── Suodattimet ───────────────────────────────────────────────────
function buildFilterOptions() {
  const materials = [...new Set(allOrders.flatMap(o => o.items.map(i => i.material).filter(Boolean)))].sort();
  const matSel = document.getElementById('filterMaterial');
  matSel.innerHTML = '<option value="">— Kaikki —</option>' +
    materials.map(m => `<option value="${m}">${m}</option>`).join('');
}

function onMaterialChange() {
  const mat = document.getElementById('filterMaterial').value;
  const colorSel = document.getElementById('filterColor');
  const thickSel = document.getElementById('filterThickness');

  if (!mat) {
    colorSel.style.display = 'none';
    thickSel.style.display = 'none';
    colorSel.value = '';
    thickSel.value = '';
    applyFilter();
    return;
  }

  // Värit tälle materiaalille
  const colors = [...new Set(allOrders.flatMap(o =>
    o.items.filter(i => i.material === mat).map(i => i.color).filter(Boolean)
  ))].sort();
  colorSel.innerHTML = '<option value="">— Kaikki värit —</option>' +
    colors.map(c => `<option value="${c}">${c}</option>`).join('');
  colorSel.style.display = colors.length ? 'block' : 'none';

  // Paksuudet tälle materiaalille
  const thicks = [...new Set(allOrders.flatMap(o =>
    o.items.filter(i => i.material === mat).map(i => i.thickness_mm).filter(Boolean)
  ))].sort((a,b) => a-b);
  thickSel.innerHTML = '<option value="">— Kaikki paksuudet —</option>' +
    thicks.map(t => `<option value="${t}">${t} mm</option>`).join('');
  thickSel.style.display = thicks.length ? 'block' : 'none';

  applyFilter();
}

function applyFilter() {
  const mat   = document.getElementById('filterMaterial').value;
  const color = document.getElementById('filterColor').value;
  const thick = document.getElementById('filterThickness').value;

  // Yhteislista-nappi näkyy vain kun jokin suodatin on valittu
  const combinedBtn = document.getElementById('combinedListBtn');
  combinedBtn.style.display = mat ? 'block' : 'none';
  if (!mat) {
    combinedListActive = false;
    combinedBtn.classList.remove('active');
    document.getElementById('combinedList').style.display = 'none';
    document.getElementById('ordersGrid').style.display = 'grid';
  }

  // Suodatetaan ensin statuksen mukaan
  let filtered = allOrders.filter(o => activeStatusFilters.has(o.status));
  if (mat) {
    filtered = allOrders.filter(eiPiilotettuLuonnos).filter(o =>
      o.items.some(i =>
        i.material === mat &&
        (!color || i.color === color) &&
        (!thick  || String(i.thickness_mm) === String(thick))
      )
    );
  }

  const totalItems = filtered.reduce((s, o) => {
    return s + o.items.filter(i =>
      (!mat   || i.material === mat) &&
      (!color || i.color === color) &&
      (!thick || String(i.thickness_mm) === String(thick))
    ).length;
  }, 0);

  const info = document.getElementById('filterInfo');
  if (mat) {
    info.textContent = `${totalItems} riviä ${filtered.length} tilauksessa`;
  } else {
    info.textContent = `${allOrders.filter(eiPiilotettuLuonnos).length} tilausta`;
  }

  renderOrderList(filtered, mat, color, thick);

  // Päivitetään yhteislista jos se on auki
  if (combinedListActive) renderCombinedList(filtered, mat, color, thick);
}

function clearFilters() {
  document.getElementById('filterMaterial').value = '';
  document.getElementById('filterColor').value = '';
  document.getElementById('filterThickness').value = '';
  document.getElementById('filterColor').style.display = 'none';
  document.getElementById('filterThickness').style.display = 'none';
  applyFilter();
}

function toggleCombinedList() {
  combinedListActive = !combinedListActive;
  const btn = document.getElementById('combinedListBtn');
  const grid = document.getElementById('ordersGrid');
  const list = document.getElementById('combinedList');

  if (combinedListActive) {
    btn.classList.add('active');
    grid.style.display = 'none';
    list.style.display = 'flex';
    const mat   = document.getElementById('filterMaterial').value;
    const color = document.getElementById('filterColor').value;
    const thick = document.getElementById('filterThickness').value;
    const filtered = allOrders.filter(eiPiilotettuLuonnos).filter(o =>
      o.items.some(i =>
        i.material === mat &&
        (!color || i.color === color) &&
        (!thick  || String(i.thickness_mm) === String(thick))
      )
    );
    renderCombinedList(filtered, mat, color, thick);
  } else {
    btn.classList.remove('active');
    grid.style.display = 'grid';
    list.style.display = 'none';
  }
}

const STATUS_FI_ROW = { WAITING: 'Odottaa', CUT: 'Leikattu', BENT: 'Kantattu', EXTRA: 'Lisätyöt', DONE: 'Valmis' };

function renderCombinedList(orders, mat, color, thick) {
  const list = document.getElementById('combinedList');
  // Yhteislistaan vain aktiiviset tuotantotilaukset — ei valmiita eikä muita
  const activeOrders = orders.filter(o => o.status === 'ORDERED' || o.status === 'IN_PRODUCTION');
  if (!activeOrders.length) {
    list.innerHTML = '<div class="empty-state">Ei rivejä valituilla suodattimilla</div>';
    return;
  }

  list.innerHTML = activeOrders.map(o => {
    // Vain suodatetut rivit tästä tilauksesta
    const matchItems = o.items.filter(i =>
      i.material === mat &&
      (!color || i.color === color) &&
      (!thick  || String(i.thickness_mm) === String(thick))
    );
    if (!matchItems.length) return '';

    const date = (o.order_date || '').slice(0,10).split('-').reverse().join('.');

    const itemsHtml = matchItems.map(item => {
      const rows = (item.order_item_rows || []).sort((a,b) => (b.kok_mm||0)-(a.kok_mm||0));
      const rowsHtml = rows.map(r => {
        const rs = r.production_status || 'WAITING';
        const rsIdx = STEP_KEYS.indexOf(rs);
        const rsColor = STEP_COLORS[rs] || 'var(--kpt-reuna)';
        const dq = r.done_qty || 0;
        const totalKpl = r.kpl || 0;

        const rowSteps = STEP_KEYS.map((key, si) => {
          const active = si === rsIdx ? ' ractive' : si < rsIdx ? ' rpassed' : '';
          return `<button class="row-status-btn${active}"
            onclick="setCombinedRowStatus('${r.id}', '${key}', '${item.id}', '${o.id}')"
            title="${STEPS[si]}">${STEPS[si]}</button>`;
        }).join('');

        const doneQtyHtml = rs === 'DONE'
          ? `<span class="done-all">✓</span>`
          : rs !== 'WAITING'

                onchange="setCombinedRowDoneQty('${r.id}', this.value, '${item.id}', '${o.id}')"

        </div>`;

        <div class="combined-item-nimike">
          ${item.nimike || item.profile_type || '—'}
        </div>
        ${item.aihio_width_mm ? `<div class="combined-aihio">LL= ${item.aihio_width_mm} mm</div>` : ''}
        <div class="combined-rows">${rowsHtml}</div>
      </div>`;
    }).join('');

    return `<div class="combined-order-block">
      <div class="combined-order-header">
        <span class="combined-customer">${o.customers?.name || '— ei asiakasta —'}</span>
        <span class="combined-kohde">${o.kohde || o.notes || ''}</span>
        <span class="combined-matval">${mat}${color ? ' · ' + color : ''}</span>
        <span class="combined-date">${date}</span>
        <select class="card-status-mini" onchange="quickChangeStatus('${o.id}', this.value)" style="margin-left:auto">
          <option value="" selected>${{DRAFT:'Luonnos',IN_PROGRESS:'Kesken',QUOTED:'Tarjottu',ORDERED:'Tilattu',IN_PRODUCTION:'Työn alla',COMPLETED:'Valmis',INVOICED:'Laskutettu'}[o.status] || o.status || '—'}</option>
          <option value="IN_PROGRESS">Kesken</option>
          <option value="QUOTED">Tarjottu</option>
          <option value="ORDERED">Tilattu</option>
          <option value="IN_PRODUCTION">Työn alla</option>
          <option value="COMPLETED">Valmis</option>
          <option value="INVOICED">Laskutettu</option>
        </select>
      </div>
      ${itemsHtml}
    </div>`;
  }).join('');
}

// ── Tilauslista ───────────────────────────────────────────────────
function renderOrderList(orders, mat, color, thick) {
  const grid = document.getElementById('ordersGrid');
  if (!orders.length) {
    grid.innerHTML = '<div class="empty-state">Ei tilauksia valituilla suodattimilla</div>';
    return;
  }

  const STATUS_FI = {
    DRAFT: 'Luonnos', IN_PROGRESS: 'Kesken', QUOTED: 'Tarjottu', ORDERED: 'Tilattu',
    IN_PRODUCTION: 'Työn alla', COMPLETED: 'Valmis'
  };

  grid.innerHTML = orders.map(o => {
    // Laskee edistyminen
    const relevantItems = mat
      ? o.items.filter(i =>
          i.material === mat &&
          (!color || i.color === color) &&
          (!thick  || String(i.thickness_mm) === String(thick))
        )
      : o.items;

    const countedItems = relevantItems.filter(countsForProgress);
    const total = countedItems.length;
    const done  = countedItems.filter(i => itemOverallStatus(i) === 'DONE').length;

    const date = (o.order_date || '').slice(0,10).split('-').reverse().join('.');
    const deliv = o.delivery_date ? o.delivery_date.slice(0,10).split('-').reverse().join('.') : '—';

    // Materiaalitägit
    const mats = [...new Set(relevantItems.map(i => [i.material, i.color, i.thickness_mm].filter(Boolean).join(' ')))];
    const tags = mats.slice(0,4).map(m => `<span class="mtag${mat ? ' highlight' : ''}">${m}</span>`).join('');

    return `<div class="order-card ${cardClass}" onclick="openOrder('${o.id}')">
      <div class="card-header">
        <div class="card-header-info">
          <div class="card-customer">${o.customers?.name || '— ei asiakasta —'}</div>
          <div class="card-kohde">${o.kohde || o.notes || '—'}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
            <span class="card-status-badge badge-${o.status}">${STATUS_FI[o.status] || o.status}</span>
            <select class="card-status-mini" onchange="quickChangeStatus('${o.id}', this.value)" onclick="event.stopPropagation()">
              <option value="">muuta...</option>
              <option value="IN_PROGRESS">Kesken</option>
              <option value="QUOTED">Tarjottu</option>
              <option value="ORDERED">Tilattu</option>
              <option value="IN_PRODUCTION">Työn alla</option>
              <option value="COMPLETED">Valmis</option>
              <option value="INVOICED">Laskutettu</option>
            </select>
          </div>
        </div>
        <div class="card-date">
          <div>${date}</div>
          <div style="color:var(--kpt-huom);margin-top:2px">${deliv !== '—' ? '→ ' + deliv : ''}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="progress-wrap">
          <div class="progress-label">
            <span>Edistyminen</span>
            <span>${done} / ${total} valmis</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill ${fillClass}" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="material-tags">${tags}</div>
        ${(() => { const ts = orderTimeSummary(o); return ts.total > 0 ? `<div style="margin-top:6px"><span class="time-chip">⏱ ${escT(fmtDuration(ts.total))}${ts.running ? ' ●' : ''}</span></div>` : ''; })()}

  }).join('');
}

  document.getElementById('cardYhteys').innerHTML = [
    puh ? `<a href="tel:${escT(puh.replace(/\s+/g, ''))}">📞 ${escT(puh)}</a>` : '',
    sposti ? `<a href="mailto:${escT(sposti)}">✉ ${escT(sposti)}</a>` : ''
  ].filter(Boolean).join('');
  document.getElementById('cardDate').textContent = 'Tilaus: ' + (o.order_date || '').slice(0,10).split('-').reverse().join('.');
  document.getElementById('cardDelivery').textContent = o.delivery_date
    ? 'Toimitus: ' + o.delivery_date.slice(0,10).split('-').reverse().join('.') : '';

  const STATUS_FI = {
    DRAFT: 'Luonnos', IN_PROGRESS: 'Kesken', QUOTED: 'Tarjottu', ORDERED: 'Tilattu',
    IN_PRODUCTION: 'Työn alla', COMPLETED: 'Valmis'
  };
  document.getElementById('cardStatus') && (document.getElementById('cardStatus').textContent = STATUS_FI[o.status] || o.status);
  // Aseta dropdown oikeaan arvoon
  const sel = document.getElementById('cardStatusSelect');

  // Esivalinta: jos listassa on valittu materiaali ja se vastaa täsmälleen yhtä ryhmää, avataan sillä suodatettuna
  cardFilterKey = '';
  const fMat = document.getElementById('filterMaterial').value;
  if (fMat) {
    const fColor = document.getElementById('filterColor').value;
    const fThick = document.getElementById('filterThickness').value;
    const keys = new Set(o.items.filter(i =>
      i.material === fMat && (!fColor || i.color === fColor) && (!fThick || String(i.thickness_mm) === String(fThick))
    ).map(itemGroupKey));
    if (keys.size === 1) cardFilterKey = [...keys][0];
  }
  toggleAddRow(false);
  haeTilauksenLisatiedot(o);
  renderTimePanel(o);
  refreshTimeForActive();
  renderCardFilterBar(o);
  renderItemCards(o);
}

const STEPS = ['Odottaa', 'Leikattu', 'Kantattu', 'Lisätyöt', 'Valmis'];
const STEP_KEYS = ['WAITING', 'CUT', 'BENT', 'EXTRA', 'DONE'];
const STEP_COLORS = {
  WAITING: 'var(--kpt-reuna)',
  CUT: 'var(--kpt-v-tilaukset)',
  BENT: 'var(--kpt-huom)',
  EXTRA: 'var(--lisatyo)',
  DONE: 'var(--kpt-korostus)',
  PARTIAL: 'var(--kpt-huom)'
};

// ── Apufunktiot: kappaletavara, kokonaistila ja suodatin ──────────
function escT(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtNum(n) {
  return (Number(n) || 0).toLocaleString('fi-FI', { maximumFractionDigits: 2 });
}
function isKappale(item) {
  const hasRows = (item.order_item_rows || []).length > 0;
  return item.profile_type === 'KAPPALE' || (!hasRows && !item.profile_type);
}
function kapMaara(item) {
  const pd = item.profile_data || {};
  return Number(pd.maara) || Number(item.quantity) || 0;
}
function kapToimitukset(item) {
  const t = item.profile_data && item.profile_data.toimitukset;
  return Array.isArray(t) ? t : [];
}
function kapToimitettu(item) {
  return kapToimitukset(item).reduce((s, x) => s + (Number(x.maara) || 0), 0);
}
// Kappaletavaran tila: WAITING (ei mitään), PARTIAL (osa toimitettu), DONE (kaikki)
function kapStatus(item) {
  const tot = kapMaara(item);
  const done = kapToimitettu(item);
  if (kapToimitukset(item).some(x => x.valmis === true)) return 'DONE';
  if (tot > 0 && done >= tot - 1e-9) return 'DONE';
  return done > 0 ? 'PARTIAL' : 'WAITING';
}
// Rivin kokonaistila: pituusrivit -> niistä, kappaletavara -> toimituksista, muut -> kannan kentästä
function itemOverallStatus(item) {
  const rows = item.order_item_rows || [];
  if (rows.length) return calcItemStatus(rows);
  if (isKappale(item)) return kapStatus(item);
  return item.production_status || 'WAITING';
}
// Piipun jalat ja lisäosat (ei pituusrivejä) hoidetaan piippu_tuotanto.html:ssä, joten niitä ei lasketa mukaan
function countsForProgress(item) {
  return !(item.profile_type === 'piippu' && !(item.order_item_rows || []).length);
}
function itemGroupKey(item) {
  if (isKappale(item)) return '__KAP__';
  return [item.material, item.color, item.thickness_mm ? item.thickness_mm + 'mm' : ''].filter(Boolean).join(' ') || '__MUU__';
}
function itemGroupLabel(key) {
  return key === '__KAP__' ? 'Kappaletavara' : key === '__MUU__' ? 'Muut' : key;
}

let cardFilterKey = '';
let dismissedAllDone = new Set();

function renderCardFilterBar(order) {
  const bar = document.getElementById('cardFilterBar');
  const counts = new Map();
  order.items.forEach(i => { const k = itemGroupKey(i); counts.set(k, (counts.get(k) || 0) + 1); });
  if (counts.size < 2) { bar.style.display = 'none'; bar.innerHTML = ''; cardFilterKey = ''; return; }
  const chip = (key, label, n) =>
    `<button class="card-filter-chip${cardFilterKey === key ? ' active' : ''}" data-key="${escT(key)}" onclick="setCardFilter(this.dataset.key)">${escT(label)} (${n})</button>`;
  bar.innerHTML = chip('', 'Kaikki', order.items.length) +
    [...counts.entries()].map(([k, n]) => chip(k, itemGroupLabel(k), n)).join('');
  bar.style.display = 'flex';
}

function setCardFilter(key) {
  cardFilterKey = key || '';
  const o = allOrders.find(x => x.id === activeOrderId);
  if (!o) return;
  renderCardFilterBar(o);
  renderItemCards(o);
}

// Ehdotus "Merkitäänkö tilaus Valmiiksi?" kun kaikki rivit on tehty
function updateAllDoneBanner(order) {
  const banner = document.getElementById('allDoneBanner');
  if (!banner) return;
  const counted = order.items.filter(countsForProgress);
  const allDone = counted.length > 0 && counted.every(i => itemOverallStatus(i) === 'DONE');
  const open = order.status === 'ORDERED' || order.status === 'IN_PRODUCTION';
  banner.style.display = (allDone && open && !dismissedAllDone.has(order.id)) ? 'flex' : 'none';
}
function dismissAllDone() {
  if (activeOrderId) dismissedAllDone.add(activeOrderId);
  document.getElementById('allDoneBanner').style.display = 'none';
}
async function markOrderCompleted() {
  if (!activeOrderId) return;
  await changeOrderStatus('COMPLETED');
  const o = allOrders.find(x => x.id === activeOrderId);
  if (o) updateAllDoneBanner(o);
}

// ── Kappaletavaran toimitukset ─────────────────────────────────────
async function saveKapToimitukset(itemId, orderId, toimitukset) {
  const o = allOrders.find(x => x.id === orderId);
  const item = o && o.items.find(i => i.id === itemId);
  if (!item) return;
  const pd = { ...(item.profile_data || {}), toimitukset };
  const status = kapStatus({ ...item, profile_data: pd }) === 'DONE' ? 'DONE' : 'WAITING';
  const res = await fetch(`${SUPABASE_URL}/rest/v1/order_items?id=eq.${itemId}`, {
    method: 'PATCH',
    headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ profile_data: pd, production_status: status })
  });
  if (!res.ok) {
    const err = await res.text();
    console.warn('Toimituksen tallennus epäonnistui:', res.status, err);
    alert('Tallennus epäonnistui (' + res.status + ')');
    return;
  }
  item.profile_data = pd;
  item.production_status = status;
  renderItemCards(o);
}
function todayIso() { return new Date().toLocaleDateString('sv-SE'); }

async function kapLisaaToimitus(itemId, orderId) {
  const inp = document.getElementById('kapqty-' + itemId);
  const val = parseFloat(String(inp && inp.value).replace(',', '.'));
  if (!(val > 0)) { if (inp) inp.focus(); return; }
  const o = allOrders.find(x => x.id === orderId);
  const item = o && o.items.find(i => i.id === itemId);
  if (!item) return;
  await saveKapToimitukset(itemId, orderId, [...kapToimitukset(item), { pvm: todayIso(), maara: val }]);
}
async function kapKaikkiValmis(itemId, orderId) {
  const o = allOrders.find(x => x.id === orderId);
  const item = o && o.items.find(i => i.id === itemId);
  if (!item) return;
  const remaining = Math.max(0, kapMaara(item) - kapToimitettu(item));
  await saveKapToimitukset(itemId, orderId, [...kapToimitukset(item), { pvm: todayIso(), maara: remaining, valmis: true }]);
}
async function kapNollaa(itemId, orderId) {
  const o = allOrders.find(x => x.id === orderId);
  const item = o && o.items.find(i => i.id === itemId);
  if (!item) return;
  if (kapToimitukset(item).length && !confirm('Poistetaan kaikki toimitusmerkinnät tältä riviltä?')) return;
  await saveKapToimitukset(itemId, orderId, []);
}
async function kapPoistaToimitus(itemId, orderId, idx) {
  const o = allOrders.find(x => x.id === orderId);
  const item = o && o.items.find(i => i.id === itemId);
  if (!item) return;
  const list = kapToimitukset(item).filter((_, i) => i !== idx);
  await saveKapToimitukset(itemId, orderId, list);
}

// ── Rivin lisäys tuotannon aikana ──────────────────────────────────
const LISATTY_RYHMA = 'Lisätty tuotannossa';

function toggleAddRow(show) {
  const form = document.getElementById('addRowForm');
  const open = show === undefined ? form.style.display === 'none' : !!show;
  form.style.display = open ? 'block' : 'none';
  document.getElementById('addRowMsg').textContent = '';
  if (open) {
    const n = document.getElementById('addRowNimike');
    if (n) n.focus();
  } else {
    ['addRowNimike', 'addRowMaara', 'addRowHuomio'].forEach(id => { document.getElementById(id).value = ''; });
    document.getElementById('addRowYksikko').value = 'kpl';
  }
}

async function saveAddRow() {
  const o = allOrders.find(x => x.id === activeOrderId);
  if (!o) return;
  const msg = document.getElementById('addRowMsg');
  const nimike = document.getElementById('addRowNimike').value.trim();
  const maara = parseFloat(String(document.getElementById('addRowMaara').value).replace(',', '.'));
  const yksikko = document.getElementById('addRowYksikko').value || 'kpl';
  const huomio = document.getElementById('addRowHuomio').value.trim();
  if (!nimike) { msg.textContent = 'Kirjoita nimike.'; document.getElementById('addRowNimike').focus(); return; }
  if (!(maara > 0)) { msg.textContent = 'Kirjoita määrä (suurempi kuin 0).'; document.getElementById('addRowMaara').focus(); return; }
  if (o.status === 'COMPLETED' && !confirm('Tilaus on jo merkitty Valmiiksi. Lisätäänkö rivi silti?')) return;

  // Sijoitetaan omaan ryhmään "Lisätty tuotannossa" (jos ryhmä on jo olemassa, sen perään)
  const inGroup = o.items.filter(i => i.group_name === LISATTY_RYHMA);
  const maxGroupOrder = o.items.reduce((m, i) => Math.max(m, i.group_order || 0), 0);
  const group_order = inGroup.length ? (inGroup[0].group_order || 0) : (o.items.length ? maxGroupOrder + 1 : 0);
  const item_order = inGroup.reduce((m, i) => Math.max(m, i.item_order || 0), -1) + 1;

  const body = {
    order_id: o.id,
    group_name: LISATTY_RYHMA,
    group_order,
    item_order,
    nimike,
    profile_type: 'KAPPALE',
    profile_data: { maara, pituus: null, yksikko, huomio, lisatty_tuotannossa: true, lisatty_pvm: todayIso() },
    aihio_width_mm: null,
    quantity: maara,
    production_status: 'WAITING'
  };
  const btn = document.getElementById('addRowSave');
  btn.disabled = true;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/order_items`, {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.text();
      console.warn('Rivin lisäys epäonnistui:', res.status, err);
      msg.textContent = 'Tallennus epäonnistui (' + res.status + ').';
      return;
    }
    const saved = await res.json();
    const row = (saved && saved[0]) ? saved[0] : { ...body, id: 'tmp_' + Date.now() };
    row.order_item_rows = row.order_item_rows || [];
    o.items.push(row);
    toggleAddRow(false);
    // Näytetään uusi rivi: jos suodatin piilottaisi sen, siirrytään "Kaikki"-näkymään
    if (cardFilterKey && cardFilterKey !== itemGroupKey(row)) cardFilterKey = '';
    dismissedAllDone.delete(o.id);
    renderCardFilterBar(o);
    renderItemCards(o);
    applyFilter();
  } catch (e) {
    console.warn('Rivin lisäys epäonnistui', e);
    msg.textContent = 'Tallennus epäonnistui (verkkovirhe).';
  } finally {
    btn.disabled = false;
  }
}

// Laskee order_item tason "kokonaistatus" pituusriveistä
function calcItemStatus(rows) {
  if (!rows || !rows.length) return 'WAITING';
  const statuses = rows.map(r => r.production_status || 'WAITING');
  if (statuses.every(s => s === 'DONE')) return 'DONE';
  if (statuses.some(s => s !== 'WAITING')) return 'CUT'; // aloitettu
  return 'WAITING';
}

// ── Työaika tuotannossa (hinnoittelu vaihe 3b, 27.11.2026, Tomi: "pelti suunnitellaan toimistossa, mutta tuotannossa
// sitten tehdään") ── Suunnitteluaika ja työaika pellin kortissa, molemmat muokattavissa. Tallentuu pellin tietoihin
// profile_data.tyoaika (sama kuin Peltilistojen arvio), joten hinnoittelu käyttää sitä. Piipun, huuvan ja kartion aika
// muokataan niiden omilla tuotantosivuilla. Tallennus hakee ensin tuoreen profile_datan, ettei vanha tieto korvaa muuta.
function tyoaikaKentta(arvo) { return Number(arvo) > 0 ? escT(String(arvo)) : ''; }
function tyoaikaRiviHtml(item, orderId) {
  const ta = (item.profile_data && item.profile_data.tyoaika) || {};
  const kentta = (luokka, arvo, nimi) => `<label class="ta-kentta">${nimi} <input type="number" inputmode="numeric" min="0" step="1" class="ta-input ${luokka}"
    value="${tyoaikaKentta(arvo)}" placeholder="—" onchange="tallennaTyoaika('${item.id}', '${orderId}', this)"> min</label>`;
  return `<div class="tyoaika-rivi" id="tyoaika-${item.id}">
    <span class="ta-otsikko">Työaika</span>${kentta('ta-s', ta.suunnittelu_min, 'Suunnittelu')}${kentta('ta-t', ta.tyo_min, 'Työ')}
    <span class="ta-tila"></span></div>`;
}
async function tallennaTyoaika(itemId, orderId, kentta) {
  const o = allOrders.find(x => x.id === orderId);
  const item = o && o.items.find(i => i.id === itemId);
  const rivi = kentta && kentta.closest('.tyoaika-rivi');
  if (!item || !rivi) return;
  const lue = sel => { const v = parseFloat(rivi.querySelector(sel).value); return isFinite(v) && v >= 0 ? v : null; };
  const s = lue('.ta-s'), t = lue('.ta-t');
  const ta = (s === null && t === null) ? null : { suunnittelu_min: s || 0, tyo_min: t || 0, yhteensa_min: (s || 0) + (t || 0) };
  const tila = rivi.querySelector('.ta-tila');
  tila.className = 'ta-tila'; tila.textContent = 'Tallennetaan…';
  let pd = item.profile_data || {};
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/order_items?id=eq.${itemId}&select=profile_data`, { headers });
    if (r.ok) { const j = await r.json(); if (j && j[0]) pd = j[0].profile_data || {}; }
  } catch (e) { /* käytetään sivun tietoa */ }
  const uusi = Object.assign({}, pd);
  if (ta) uusi.tyoaika = ta; else delete uusi.tyoaika;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/order_items?id=eq.${itemId}`, {
    method: 'PATCH',
    headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ profile_data: uusi })
  });
  if (!res.ok) { tila.className = 'ta-tila virhe'; tila.textContent = 'Tallennus epäonnistui (' + res.status + ')'; return; }
  item.profile_data = uusi;
  tila.className = 'ta-tila ok'; tila.textContent = '✓ tallennettu';
}

function renderItemCards(order) {
  const grid = document.getElementById('itemsGrid');
  if (!order.items.length) {
    grid.innerHTML = '<div class="empty-state">Ei tilausrivejä</div>';
    return;
  }

  // Lajitellaan group_order + item_order mukaan
  const sorted = [...order.items].sort((a,b) =>
    ((a.group_order||0) - (b.group_order||0)) || ((a.item_order||0) - (b.item_order||0))
  );

  const visible = cardFilterKey ? sorted.filter(i => itemGroupKey(i) === cardFilterKey) : sorted;
  if (!visible.length) {
    grid.innerHTML = '<div class="empty-state">Ei rivejä tällä suodattimella</div>';
    updateAllDoneBanner(order);
    return;
  }

  grid.innerHTML = visible.map((item, idx) => {
    const mat = [item.material, item.color, item.thickness_mm ? item.thickness_mm + 'mm' : ''].filter(Boolean).join(' · ');
    const rows = (item.order_item_rows || []).sort((a,b) => (b.kok_mm||0)-(a.kok_mm||0));

    // Kokonaistatus lasketaan riveistä (tai suoraan itemistä jos ei rivejä)
    const overallStatus = itemOverallStatus(item);
    const isDone = overallStatus === 'DONE';

    // Pituustaulukko — sarakkeet: mitta | päät | kok | huomio | kpl | status | tehty
    let cutTable = '';
    if (rows.length) {
      const rowsHtml = rows.map(r => {
        const rs = r.production_status || 'WAITING';
        const rsIdx = STEP_KEYS.indexOf(rs);
        const rsColor = STEP_COLORS[rs] || 'var(--kpt-reuna)';
        const rsDone = rs === 'DONE';
        const doneQty = r.done_qty || 0;
        const totalKpl = r.kpl || 0;

        // Statusnapit per rivi — kompaktit
        const rowSteps = STEP_KEYS.map((key, si) => {
          const active = si === rsIdx ? ' ractive' : si < rsIdx ? ' rpassed' : '';
          return `<button class="row-status-btn${active}"
            onclick="setRowStatus('${r.id}', '${key}', ${idx}, '${item.id}')"
            title="${STEPS[si]}">${STEPS[si]}</button>`;
        }).join('');

        // done_qty kenttä — aina muokattavissa kun ei WAITING eikä DONE
        const doneQtyCell = rs === 'DONE'
          ? `<span class="done-all">✓ kaikki</span>`
          : rs !== 'WAITING'
            ? `<input type="number" class="done-qty-input" value="${doneQty}" min="0" max="${totalKpl}"
                onchange="setRowDoneQty('${r.id}', this.value, ${idx}, '${item.id}')" title="Tehty kpl">`
            : '';

        return `<div class="cut-row-wrap${rsDone ? ' row-done' : ''}" style="border-left:3px solid ${rsColor};margin-bottom:2px">
          <div class="cut-row-top">
            <span class="mitta">${r.mitta_mm || ''}</span>
            <span class="paat">${r.paat_mm || ''}</span>
            <span class="kok">${r.kok_mm || ''}</span>
            <span class="kpl">${totalKpl}</span>
            <span class="done-qty-cell">${doneQtyCell}</span>
            <span class="huomio-cell">${r.huomio ? '⚠ ' + r.huomio : ''}</span>
          </div>
          <div class="cut-row-bottom">
            <div class="row-steps">${rowSteps}</div>
          </div>
        </div>`;
      }).join('');

      cutTable = `
        <div class="cut-section">
          <div class="cut-list">
            <div class="cut-list-header">
              <span class="mitta">mitta</span>
              <span class="paat">päät</span>
              <span class="kok">kok</span>
              <span class="kpl">kpl</span>
              <span class="done-qty-cell">tehty</span>
              <span class="huomio-cell">huomio</span>
            </div>
            ${rowsHtml}
          </div>
        </div>`;
    }

    // Kanttaus-lohko
    let kanttausBlock = '';
    if (item.profile_type && item.profile_type !== 'KAPPALE') {
      // Huuva / kartio (vaihe 8.4c, 25.11.2026): linkki sivulle tuotantotilassa (kuvat, kaistat, työkortti tilauksen tiedoilla)
      if (item.profile_type === 'huuva' || item.profile_type === 'kartio') {
        kanttausBlock = `<div style="margin-top:4px">
          <a href="${item.profile_type}.html?orderId=${item.order_id}&groupName=${encodeURIComponent(item.group_name||'')}"
             target="_blank"
             style="display:inline-block;padding:6px 14px;background:var(--kpt-paneeli2);border:1px solid var(--kpt-korostus);
                    color:var(--kpt-korostus);border-radius:4px;font-size:12px;text-decoration:none;font-family:'IBM Plex Mono',monospace;">
            🏭 Avaa ${item.profile_type} →
          </a>
        </div>`;
      } else
      // Piippu — näytetään linkki erilliselle sivulle
      if (item.profile_type === 'piippu') {
        kanttausBlock = `<div style="margin-top:4px">
          <a href="piippu_tuotanto.html?orderId=${item.order_id}&groupName=${encodeURIComponent(item.group_name||'')}"
             target="_blank"
             style="display:inline-block;padding:6px 14px;background:var(--kpt-paneeli2);border:1px solid var(--kpt-korostus);
                    color:var(--kpt-korostus);border-radius:4px;font-size:12px;text-decoration:none;font-family:'IBM Plex Mono',monospace;">
            🏭 Avaa piippu →
          </a>
        </div>`;
      } else {
      const vals = item.profile_data?.vals || {};
      const opts = item.profile_data?.opts || {};
      const pituudet = (item.order_item_rows || []).map(r => Number(r.kok_mm) || Number(r.mitta_mm) || 0).filter(k => k > 0);
      const pisinRivi = pituudet.length ? Math.max.apply(null, pituudet) : 1000;
      // Saunan kourussa pään B mitat lasketaan kaadosta ja pellin pituudesta, muissa ne ovat tilausrivillä
      const kiilaTiedot = { valsB: kourunValsB(item.profile_type, vals, opts, pisinRivi) || item.profile_data?.valsB || null, viite: item.profile_data?.pituusViite };
      const onKiila = !!(kiilaTiedot.valsB && Object.keys(kiilaTiedot.valsB).length);
      const svgHtml = drawKanttausSVG(item.profile_type, vals, opts, item.profile_data?.asento, item.color, kiilaTiedot);
      // Levityskuva ja merkkausmitat: napista auki, kiilapellissä nappi korostettu
      const voiLevittaa = !!(svgHtml && window.KPT_PROFIILIT && window.KPT_PROFIILIT.mallit[item.profile_type] && item.profile_type !== 'vapaa');
      const valsTable = buildValsTable(item.profile_type, vals);
      kanttausBlock = `
        <div class="kanttaus-section">
          ${item.aihio_width_mm ? `<div class="aihio-width-centered"><strong>LL= ${item.aihio_width_mm} mm</strong>${onKiila ? ' <span class="kiila-merkki">KIILA</span>' : ''}</div>` : (onKiila ? '<div class="aihio-width-centered"><span class="kiila-merkki">KIILA</span></div>' : '')}
          <div class="kanttaus-block">
            ${svgHtml
              ? `<div class="kanttaus-svg">${svgHtml}</div>`
              : `<span class="kanttaus-placeholder">${item.profile_type} — ei piirrostietoja</span>`
            }
          </div>
          ${voiLevittaa ? `<button type="button" class="lev-nappi${onKiila ? ' kiila' : ''}" onclick="vaihdaLevitys('${item.id}', this)">Levityskuva ja merkkausmitat</button>
          <div class="lev-alue" id="lev-${item.id}" style="display:none"></div>` : ''}
        </div>`;
      } // else
    }

    // Kappaletavara-lohko: määrä, toimitusseuranta ja Odottaa / Valmis
    let kapBlock = '';
    if (isKappale(item)) {
      const pd = item.profile_data || {};
      const tot = kapMaara(item);
      const delivered = kapToimitettu(item);
      const left = Math.max(0, tot - delivered);
      const over = Math.max(0, delivered - tot);
      const kst = kapStatus(item);
      const unit = escT(pd.yksikko || item.product_group || '');
      const log = kapToimitukset(item).map((t, ti) => {
        const d = String(t.pvm || '').slice(0, 10).split('-').reverse().slice(0, 2).join('.');
        return `<div class="kap-log-row"><span>${escT(d)}</span><span>${fmtNum(t.maara)} ${unit}${t.valmis ? ' (valmis)' : ''}</span>
          <button class="kap-log-del" title="Poista merkintä" onclick="kapPoistaToimitus('${item.id}', '${order.id}', ${ti})">✕</button></div>`;
      }).join('');
      kapBlock = `
        <div class="kap-block">
          <span class="kap-nimike">${escT(item.nimike || '—')}</span>
          <span class="kap-maara">${fmtNum(tot) || ''}</span>
          <span class="kap-unit">${unit}</span>
          ${pd.huomio ? `<span style="font-size:11px;color:var(--kpt-huom);font-family:'IBM Plex Mono',monospace">⚠ ${escT(pd.huomio)}</span>` : ''}
          ${pd.alkup_maara != null ? `<span style="font-size:11px;color:var(--kpt-huom);font-family:'IBM Plex Mono',monospace">muutettu: alun perin ${fmtNum(pd.alkup_maara)}</span>` : ''}
        </div>
        <div class="kap-track">
          <div class="kap-progress">
            <span>Toimitettu <b>${fmtNum(delivered)}</b> / ${fmtNum(tot)} ${unit}</span>
            ${left > 0 && delivered > 0 ? `<span class="kap-left">puuttuu ${fmtNum(left)} ${unit}</span>` : ''}
            ${over > 0 ? `<span class="kap-over">+${fmtNum(over)} yli tilatun</span>` : ''}
          </div>
          <div class="kap-steps">
            <button class="row-status-btn${kst === 'WAITING' ? ' ractive' : ''}" onclick="kapNollaa('${item.id}', '${order.id}')">Odottaa</button>
            <button class="row-status-btn${kst === 'DONE' ? ' ractive' : ''}" onclick="kapKaikkiValmis('${item.id}', '${order.id}')">Valmis</button>
          </div>
          ${kst !== 'DONE' ? `<div class="kap-add">
            <input type="number" inputmode="decimal" step="any" min="0" class="kap-qty-input" id="kapqty-${item.id}" placeholder="${unit || 'kpl'}"
              onkeydown="if(event.key==='Enter')kapLisaaToimitus('${item.id}', '${order.id}')">
            <button class="kap-add-btn" onclick="kapLisaaToimitus('${item.id}', '${order.id}')">+ Toimitettu nyt</button>
          </div>` : ''}
          ${log ? `<div class="kap-log">${log}</div>` : ''}
        </div>`;
    }

    // Kokonaistilan ilmaisin kortin otsikossa
    const statusColor = STEP_COLORS[overallStatus] || 'var(--kpt-reuna)';

    return `<div class="item-card${isDone ? ' done' : ''}" id="item-card-${idx}" style="border-left:4px solid ${statusColor}">
      <div class="item-card-header">
        <span class="item-nimike">${item.nimike || item.profile_type || '—'}</span>
        ${mat ? `<span class="item-material">${mat}</span>` : ''}
        ${item.profile_data && item.profile_data.lisatty_tuotannossa ? `<span class="lisatty-tag" title="Rivi lisättiin tuotannon aikana">lisätty tuotannossa ${escT(String(item.profile_data.lisatty_pvm || '').slice(0,10).split('-').reverse().slice(0,2).join('.'))}</span>` : ''}
        ${isDone ? '<span class="item-done-badge">✓ VALMIS</span>' : ''}
      </div>
      <div class="item-card-body">
        ${kanttausBlock}
        ${cutTable}
        ${(!isKappale(item) && !['piippu', 'huuva', 'kartio'].includes(item.profile_type)) ? tyoaikaRiviHtml(item, order.id) : ''}
        ${kapBlock}
      </div>
    </div>`;
  }).join('');
  updateAllDoneBanner(order);
}

async function quickChangeStatus(orderId, newStatus) {
  if (!newStatus) return;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${orderId}`, {
    method: 'PATCH',
    headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ status: newStatus })
  });
  if (!res.ok) { alert('Statuksen tallennus epäonnistui'); return; }
  const o = allOrders.find(x => x.id === orderId);
  if (o) o.status = newStatus;

  applyFilter();
}

async function changeOrderStatus(newStatus) {
  if (!activeOrderId) return;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${activeOrderId}`, {
    method: 'PATCH',
    headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ status: newStatus })
  });
  if (!res.ok) {
    const err = await res.text();
    alert('Statuksen tallennus epäonnistui: ' + res.status + ' ' + err);
    return;
  }
  // Päivitetään paikallinen tila ja renderöidään lista uudelleen
  const o = allOrders.find(x => x.id === activeOrderId);
  if (o) {
    o.status = newStatus;
    // Päivitetään myös dropdown oikeaan arvoon
    const sel = document.getElementById('cardStatusSelect');
    if (sel) sel.value = newStatus;
  }
}

async function setRowStatus(rowId, status, itemIdx, itemId) {
  // Tallennetaan Supabaseen
  const res = await fetch(`${SUPABASE_URL}/rest/v1/order_item_rows?id=eq.${rowId}`, {
    method: 'PATCH',
    headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ production_status: status })
  });

  if (!res.ok) { alert('Tallennus epäonnistui'); return; }

  // Päivitetään paikallinen tila
  const o = allOrders.find(x => x.id === activeOrderId);
  if (o) {
    const item = o.items.find(i => i.id === itemId);
    if (item) {
      const row = (item.order_item_rows || []).find(r => r.id === rowId);
      if (row) row.production_status = status;
    }
    // Rendataan kortti uudelleen
    renderItemCards(o);
  }
}

const PROD_TYPES = window.KPT_PROFIILIT ? window.KPT_PROFIILIT.tuotantoKuvat : {};


// ── SVG-renderöinti kanttaus-lohkoon ─────────────────────────────────
// Piirtää mitat viivan vierelle kohtisuoraan (sininen)
// Piirtää kulmat taitospisteisiin (punainen)
// Levityskuva ja merkkausmitat tuotannon kortissa: jokaiselle eri pituudelle oma kuva ja taulukko
function vaihdaLevitys(itemId, nappi) {
  const alue = document.getElementById('lev-' + itemId);
  if (!alue) return;
  if (alue.style.display !== 'none') { alue.style.display = 'none'; return; }
  let item = null;
  allOrders.forEach(o => (o.items || []).forEach(i => { if (String(i.id) === String(itemId)) item = i; }));
  if (!item || !window.KPT_PROFIILIT) return;
  alue.style.display = '';
  const W = Math.max(260, Math.round(alue.getBoundingClientRect().width - 2));
  alue.innerHTML = levitysSisalto(item, W);
}

// Levityskuva ja merkkausmitat yhdelle pellille (kaikki eri pituudet). Käytössä ruudulla ja työkortin tulosteessa.
function levitysSisalto(item, W) {
  const P = window.KPT_PROFIILIT;
  if (!P) return '';
  const pd = item.profile_data || {};
  const malli = P.mallit[item.profile_type];
  const luvut = {};
  (malli ? malli.fields : []).forEach(f => { luvut[f.id] = parseFloat((pd.vals || {})[f.id]) || 0; });
  const pituudet = [...new Set((item.order_item_rows || []).map(r => Number(r.kok_mm) || Number(r.mitta_mm) || 0).filter(k => k > 0))].sort((a, b) => b - a);
  if (!pituudet.length) pituudet.push(1000);
  return pituudet.map(L => {
    const vb = kourunValsB(item.profile_type, luvut, pd.opts || {}, L) || pd.valsB || {};
    const varo = malli && malli.varoitus ? malli.varoitus(luvut, pd.opts || {}, L) : null;
    const laput = malli && malli.paatylaput ? malli.paatylaput(luvut, pd.opts || {}, L) : [];
    const kplTama = (item.order_item_rows || []).filter(r => (Number(r.kok_mm) || Number(r.mitta_mm) || 0) === L).reduce((s, r) => s + (Number(r.kpl) || 0), 0);
    const lappuHtml = laput.length ? `<div class="lev-laput"><b>Päätylaput</b> (erillistä peltiä)` +
      laput.map(x => `<div>${x.nimi}: aihio <b>${P.muotoile(x.leveys)} × ${P.muotoile(x.korkeus)} mm</b>${kplTama ? ' · ' + kplTama + ' kpl' : ''}</div>`).join('') +
      `<div class="lev-vihje">Sivut ja pohja 20 mm (10 mm kohdalta lähes kaksinkerroin, 20 mm kohdalta 90° toiseen suuntaan), yläreuna 10 mm. Kulmat lovetaan. Sovita, purista pihdeillä, lukitse, tiivistysmassa.</div></div>` : '';
    const varoHtml = varo ? `<p class="lev-huom">${varo}</p>` : '';
    const lev = P.laskeLevitys(item.profile_type, luvut, vb, pd.opts || {}, L, pd.pituusViite != null ? pd.pituusViite : (malli && malli.oletusViite));
    if (!lev) return `<div class="lev-pituus">Pituus ${L} mm</div>${varoHtml}<p class="lev-huom">Levityskuvaa ei voi laskea näillä mitoilla.</p>${lappuHtml}`;
    const kuva = P.piirraLevitys(lev, W, { tausta: '#ffffff' });
    return varoHtml + `<div class="lev-pituus">Pituus ${L} mm · levy ${P.muotoile(lev.aihioL)} × ${P.muotoile(lev.aihioW)} mm${lev.kiila ? ' · aihio ' + P.muotoile(lev.aihioA) + '–' + P.muotoile(lev.aihioB) + ' mm' : ''}</div>
      <svg viewBox="0 0 ${kuva.W} ${kuva.H}" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto">${kuva.svg}</svg>
      ${(lev.kiila && lev.suora && !varo) ? `<p class="lev-suora">Suora kaista ${P.muotoile(lev.aihioW)} mm: leikkaa suorana, kiila syntyy merkkauksesta.</p>` : ''}
      ${lev.kaikkiMukana ? '' : '<p class="lev-huom">Osa tämän mallin viivoista ei ole levityskuvassa mukana.</p>'}
      <div class="lev-kehys">${P.levitysTaulukko(lev)}</div>${lappuHtml}`;
  }).join('') + '<p class="lev-vihje">Merkkaa jokaisen viivan päät molempiin päihin ja yhdistä ne suoralla viivalla. Mitat ovat aihion alareunasta, "päästä" on etäisyys aihion päästä. Kuvassa leveys on venytetty.</p>';
}

// Saunan kourun pään B mitat lasketaan kaadosta ja pellin pituudesta
function kourunValsB(profileType, vals, opts, L) {
  const malli = window.KPT_PROFIILIT && window.KPT_PROFIILIT.mallit[profileType];
  if (!malli || !malli.pituusKiila) return null;
  try { return malli.pituusKiila(vals, opts || {}, L); } catch (e) { console.warn('pituusKiila:', e); return null; }
}

function drawKanttausSVG(profileType, vals, opts, asento, vari, kiila) {
  // Malliston rivit (kentät täsmäävät Malliston malliin) piirretään yhteisellä piirrolla samasta
  // kaavasta ja samassa asennossa kuin Mallistossa. Vakiomallien rivit piirretään vanhalla tavalla alempana.
  const P = window.KPT_PROFIILIT;
  const malli = P && P.mallit ? P.mallit[profileType] : null;
  if (malli && profileType !== 'vapaa' && vals && malli.fields && malli.fields.length &&
      malli.fields.every(f => vals[f.id] !== undefined && vals[f.id] !== null)) {
    try {
      const luvut = {};
      malli.fields.forEach(f => { luvut[f.id] = parseFloat(vals[f.id]) || 0; });
      // Tuotannossa pinta merkitään aina kolmiolla (sama merkki kuin Mallistossa), ei väriraidalla:
      // kolmio näkyy myös mustavalkoisessa tulosteessa (Tomi 20.11.2026).
      const merkinta = 'kolmio';
      const KW = 280, KH = 190;
      // Kiilapelti: mitat muodossa "150–200" ja pää B katkoviivalla
      let tulos = malli.build(luvut, opts || {}), haamu = [];
      if (kiila && kiila.valsB && Object.keys(kiila.valsB).length) {
        const kk = P.kiilaKuva(profileType, luvut, kiila.valsB, opts || {}, kiila.viite);
        if (kk && kk.kiila) { tulos = kk.tulos; haamu = kk.haamu; }
      }
      const kuva = P.piirraKuva({ tulos, haamu, W: KW, H: KH, reunus: 36, asento: asento || null, vari: vari || '', merkinta });
      if (kuva.svg) return `<svg width="${KW}" height="${KH}" viewBox="0 0 ${KW} ${KH}" xmlns="http://www.w3.org/2000/svg" style="display:block;max-width:100%;height:auto">${kuva.svg}</svg>`;
    } catch (e) { console.warn('drawKanttausSVG (yhteinen piirto) virhe:', profileType, e); }
  }
  const type = PROD_TYPES[profileType];
  if (!type || !vals || Object.keys(vals).length === 0) return null;

  let result;
  try {
    result = type.build(vals, opts || {});
  } catch(e) { console.warn('drawKanttausSVG virhe:', profileType, e); return null; }

  if (!result || !result.points || result.points.length < 2) return null;

  const points = result.points;
  const labels = result.labels || [];
  const extraLines = result.extraLines || [];
  const angleLabels = result.angleLabels || [];

  // Kerätään kaikki koordinaatit skaalauksen laskemiseksi
  const W = 240, H = 160, pad = 22;
  const xs = points.map(p => p.x);
  const ys = points.map(p => p.y);
  extraLines.forEach(el => { xs.push(el.p1.x, el.p2.x); ys.push(el.p1.y, el.p2.y); });
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rangeX = maxX - minX || 1;
  const rangeY = maxY - minY || 1;
  // Lasketaan skaalaus niin että kuva mahtuu paddingilla
  const scale = Math.min((W - pad * 2.5) / rangeX, (H - pad * 2.5) / rangeY, 3.5);
  // Lasketaan offset niin että kuva on keskitetty
  const drawW = rangeX * scale;
  const drawH = rangeY * scale;
  const offX = (W - drawW) / 2 - minX * scale;
  const offY = (H - drawH) / 2 - minY * scale;
  const tx = p => offX + p.x * scale;
  const ty = p => offY + p.y * scale;

  let html = '';

  // Pääviivat
  const ptStr = points.map(p => `${tx(p).toFixed(1)},${ty(p).toFixed(1)}`).join(' ');
  html += `<polyline points="${ptStr}" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;

  // Lisäviivat (tuplat, tiivisteet)
  extraLines.forEach(el => {
    html += `<line x1="${tx(el.p1).toFixed(1)}" y1="${ty(el.p1).toFixed(1)}" x2="${tx(el.p2).toFixed(1)}" y2="${ty(el.p2).toFixed(1)}" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,2"/>`;
    // Mitta extraLinelle — labelSide: 1 = oikea (oletus), -1 = vasen
    if (el.label) {
      const mx = (tx(el.p1) + tx(el.p2)) / 2;
      const my = (ty(el.p1) + ty(el.p2)) / 2;
      const dx = tx(el.p2) - tx(el.p1);
      const dy = ty(el.p2) - ty(el.p1);
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const side = el.labelSide !== undefined ? el.labelSide : 1;
      const ox = dy / len * 13 * side;
      const oy = -dx / len * 13 * side;
      html += `<text x="${(mx + ox).toFixed(1)}" y="${(my + oy).toFixed(1)}" font-size="10" font-family="IBM Plex Mono,monospace" font-weight="600" fill="#1a6fc4" text-anchor="middle" dominant-baseline="middle">${el.label}</text>`;
    }
    // Kulmateksti extraLinelle (esim. harja_ang päätypellissä)
    if (el.angleText) {
      const mx = (tx(el.p1) + tx(el.p2)) / 2;
      const my = (ty(el.p1) + ty(el.p2)) / 2;
      const dx = tx(el.p2) - tx(el.p1);
      const dy = ty(el.p2) - ty(el.p1);
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const ox = -dy / len * 13 + (el.angleTextOffsetX || 0);
      const oy = dx / len * 13 + (el.angleTextOffsetY || 0);
      html += `<text x="${(mx + ox).toFixed(1)}" y="${(my + oy).toFixed(1)}" font-size="10" font-family="IBM Plex Mono,monospace" font-weight="700" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">${el.angleText}</text>`;
    }
  });

  // Segmenttikohtaiset mitat viivan vierelle (kohtisuoraan)
  for (let i = 0; i < points.length - 1; i++) {
    const lbl = labels[i];
    if (!lbl && lbl !== 0) continue;
    const mx = (tx(points[i]) + tx(points[i+1])) / 2;
    const my = (ty(points[i]) + ty(points[i+1])) / 2;
    const dx = tx(points[i+1]) - tx(points[i]);
    const dy = ty(points[i+1]) - ty(points[i]);
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    // Normaali vasemmalle puolelle viivaa (offset 13px)
    const ox = dy / len * 13;
    const oy = -dx / len * 13;
    html += `<text x="${(mx + ox).toFixed(1)}" y="${(my + oy).toFixed(1)}" font-size="11" font-family="IBM Plex Mono,monospace" font-weight="600" fill="#1a6fc4" text-anchor="middle" dominant-baseline="middle">${lbl}</text>`;
  }

  // Kulmat taitospisteisiin (ei alku- eikä loppupiste)
  const angleOffsetSides = result.angleOffsetSides || [];
  const angleOffsetPx = result.angleOffsetPx || [];
  points.forEach((p, i) => {
    const isEnd = i === 0 || i === points.length - 1;
    const aLbl = angleLabels[i];
    if (aLbl && !isEnd) {
      const prev = points[i-1];
      const next = points[i+1];
      const inDx = p.x - prev.x, inDy = p.y - prev.y;
      const outDx = next.x - p.x, outDy = next.y - p.y;
      const inLen = Math.sqrt(inDx*inDx + inDy*inDy) || 1;
      const outLen = Math.sqrt(outDx*outDx + outDy*outDy) || 1;
      const inUx = inDx/inLen, inUy = inDy/inLen;
      const outUx = outDx/outLen, outUy = outDy/outLen;
      let bx = inUx + outUx, by = inUy + outUy;
      const bLen = Math.sqrt(bx*bx + by*by) || 1;
      bx /= bLen; by /= bLen;
      const side = angleOffsetSides[i] !== undefined ? angleOffsetSides[i] : 1;
      let offBx = bx * 16 * side, offBy = by * 16 * side;
      // Jos angleOffsetPx annettu, lisätään pikselioffset bisektorin päälle
      if (angleOffsetPx[i]) {
        offBx += angleOffsetPx[i][0];
        offBy += angleOffsetPx[i][1];
      }
      html += `<text x="${(tx(p) + offBx).toFixed(1)}" y="${(ty(p) + offBy).toFixed(1)}" font-size="10" font-family="IBM Plex Mono,monospace" font-weight="700" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">${aLbl}</text>`;
    }
  });

  // Pisteet
  points.forEach((p, i) => {
    const isEnd = i === 0 || i === points.length - 1;
    html += `<circle cx="${tx(p).toFixed(1)}" cy="${ty(p).toFixed(1)}" r="${isEnd ? 3.5 : 2.5}" fill="${isEnd ? '#e8a020' : '#888'}"/>`;
  });

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">${html}</svg>`;
}
