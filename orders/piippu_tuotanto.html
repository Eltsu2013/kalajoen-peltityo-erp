<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piippu — Tuotanto</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root {
    --bg: #1e2d20; --panel: #253028; --panel2: #2e3a30;
    --border: #3a5540; --accent: #22c55e; --accent-dim: #16a34a;
    --text: #ededf0; --text-dim: #9595a0;
    --warn: #e8a020; --blue: #3a8fe8; --danger: #e84040;
    --bg2: #2e2e38; --bg3: #3a3a48; --text1: #ededf0; --text2: #9595a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }

  header { background: #162018; border-bottom: 1px solid var(--border); padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 16px; font-weight: 500; color: var(--text); margin-left: 8px; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .nav-menu-wrap { position: relative; }
  .nav-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; }
  .nav-btn:hover { background: var(--panel2); }
  .nav-dropdown { display: none; position: absolute; top: 100%; left: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; min-width: 200px; z-index: 200; margin-top: 4px; padding: 4px 0; }
  .nav-dropdown.open { display: block; }
  .nav-section-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; padding: 6px 12px 2px; }
  .nav-item { display: block; padding: 7px 12px; color: var(--text-dim); text-decoration: none; font-size: 13px; }
  .nav-item:hover { background: var(--panel2); color: var(--text); }
  .nav-item.current { color: var(--accent); font-weight: 600; }
  .nav-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  .page { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }

  .piippu-header { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px 18px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .piippu-header h2 { font-size: 18px; font-weight: 600; color: var(--accent); flex: 1; }
  .piippu-meta { font-size: 13px; color: var(--text-dim); }
  .piippu-meta strong { color: var(--text); }
  .huomio-box { background: #2a1f0a; border: 1px solid var(--warn); border-radius: 4px; padding: 8px 12px; font-size: 13px; color: var(--warn); margin-bottom: 12px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }
  /* Puhelin: yläpalkki rivittyy, napit omalle rivilleen, ettei sivu veny ruutua leveämmäksi (20.11.2026) */
  @media (max-width: 700px) {
    header { flex-wrap: wrap; gap: 8px; padding: 6px 12px; height: auto; min-height: 52px; }
    header h1 { font-size: 14px; }
    .header-right { margin-left: 0; width: 100%; flex-wrap: wrap; }
  }

  .section-card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .section-card h3 { font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px; background: var(--panel2); border-bottom: 1px solid var(--border); }

  table { width: 100%; border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  thead th { background: var(--panel2); color: var(--text-dim); font-weight: 600; padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody td { padding: 7px 8px; vertical-align: middle; }
  .td-num { text-align: right; font-variant-numeric: tabular-nums; }
  .td-osa { font-weight: 600; }

  /* Statusnapit — leveä näyttö */
  .step-btns { display: flex; gap: 3px; flex-wrap: wrap; }
  .step-btn { padding: 3px 7px; font-size: 10px; font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; background: var(--panel2); color: var(--text-dim); transition: all 0.15s; white-space: nowrap; }
  .step-btn.active { font-weight: 700; }
  .step-btn.passed { opacity: 0.5; }
  .step-btn[data-key="WAITING"].active { background: var(--border); color: var(--text); border-color: var(--text-dim); }
  .step-btn[data-key="CUT"].active { background: #1a3a5a; color: var(--blue); border-color: var(--blue); }
  .step-btn[data-key="BENT"].active { background: #2a1f0a; color: var(--warn); border-color: var(--warn); }
  .step-btn[data-key="EXTRA"].active { background: #2a1a3a; color: #a855f7; border-color: #a855f7; }
  .step-btn[data-key="DONE"].active { background: #162018; color: var(--accent); border-color: var(--accent); }
  tr.row-done td { opacity: 0.5; }

  /* Mobiili kompakti vaihenappi */
  .step-btn-mobile { display: none; padding: 4px 10px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; background: var(--panel2); color: var(--text-dim); white-space: nowrap; }
  .step-btn-mobile.status-WAITING { border-color: var(--text-dim); color: var(--text); }
  .step-btn-mobile.status-CUT  { border-color: var(--blue);   color: var(--blue); }
  .step-btn-mobile.status-BENT { border-color: var(--warn);   color: var(--warn); }
  .step-btn-mobile.status-EXTRA{ border-color: #a855f7;       color: #a855f7; }
  .step-btn-mobile.status-DONE { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 600px) {
    .step-btns { display: none; }
    .step-btn-mobile { display: inline-block; }
    /* Taulukon vaihe-sarake leveämmäksi mobiilissa */
    table { font-size: 11px; }
  }

  /* SVG-kuva */
  .svg-wrap { padding: 12px; background: var(--panel2); }
  .svg-wrap svg { display: block; width: 100%; height: auto; }
  .kuvat-rinn { display: grid; grid-template-columns: minmax(0,3fr) minmax(0,2fr); gap: 16px; align-items: center; }   /* sivukuva + etukuva (23.11.2026) */
  @media (max-width: 900px) { .kuvat-rinn { grid-template-columns: minmax(0,1fr); } }

  /* Mitat-lista */
  .mitat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px 12px; padding: 12px 14px; }
  .mitta-row { font-size: 12px; font-family: 'IBM Plex Mono', monospace; display: flex; justify-content: space-between; gap: 8px; }
  .mitta-label { color: var(--text-dim); }
  .mitta-val { color: var(--text); font-weight: 600; }

  /* Yhteenveto */
  .summary-bar { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 16px; }
  .summary-item { font-size: 13px; }
  .summary-item strong { color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 15px; }

  /* Takaisin-nappi */
  .back-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .loading { text-align: center; padding: 60px; color: var(--text-dim); font-size: 15px; }
  .badge { display: inline-block; font-size: 10px; font-family: 'IBM Plex Mono', monospace; padding: 2px 7px; border-radius: 3px; font-weight: 600; }
  .badge-done { background: #162018; color: var(--accent); border: 1px solid var(--accent); }
  .badge-waiting { background: var(--panel2); color: var(--text-dim); border: 1px solid var(--border); }

  /* TULOSTUS */
  @media print {
    body { background: #fff; color: #000; }
    header, .back-btn, .step-btns, .step-btn-mobile, .btn-print { display: none !important; }
    .page { padding: 0; max-width: 100%; }
    .piippu-header { background: #f5f5f5; border: 1px solid #ccc; }
    .piippu-header h2 { color: #000; }
    .piippu-meta { color: #444; }
    .section-card { border: 1px solid #ccc; break-inside: avoid; }
    .section-card h3 { background: #eee; color: #333; }
    thead th { background: #eee; color: #333; }
    tbody td { color: #000; }
    .svg-wrap { background: #fff; }
    /* Piipun pääviivat mustiksi tulostuksessa */
    svg line[stroke="#f1f5f9"] { stroke: #000 !important; }
    svg polyline { stroke: #000 !important; }
    /* Apuviivat (mitat, vinomitta) harmaaksi */
    svg line[stroke="#64748b"] { stroke: #666 !important; }
    svg text { fill: #000 !important; }
    .mitat-grid { columns: 2; }
    .summary-bar { background: #f5f5f5; border: 1px solid #ccc; }
    .summary-item { color: #000; }
    .summary-item strong { color: #000; }
    .huomio-box { background: #fff8e1; border: 1px solid #f0a020; color: #a06000; }
    .mitta-label { color: #666; }
    .mitta-val { color: #000; }
    .two-col { grid-template-columns: 1fr 1fr; }
  }

    /* Valikko mahtuu ruudulle: pitkä lista vierittyy (17.11.2026) */
    #navDropdown, #navDropdownLasku { max-height: calc(100vh - 90px); overflow-y: auto; }
  </style>
</head>

<script>
const SUPA_URL = 'https://hjyeugeqmyavxisndlwp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4';
const headers = { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' };

const params = new URLSearchParams(window.location.search);
const orderId  = params.get('orderId');
const groupName = decodeURIComponent(params.get('groupName') || '');

const STEPS     = ['Odottaa','Leikattu','Kantattu','Lisätyöt','Valmis'];
const STEP_KEYS = ['WAITING','CUT','BENT','EXTRA','DONE'];
const STEP_COLORS = { WAITING:'var(--border)', CUT:'var(--blue)', BENT:'var(--warn)', EXTRA:'#a855f7', DONE:'var(--accent)' };

function r(n) { return Math.round(n); }

function toggleNav(e) {
  e.stopPropagation();
  document.getElementById('navDropdown').classList.toggle('open');

document.addEventListener('click', () => document.getElementById('navDropdown').classList.remove('open'));

// ── Lataa data ────────────────────────────────────────────
async function load() {
  if (!orderId || !groupName) {
    document.getElementById('loading').textContent = 'Virhe: orderId tai groupName puuttuu URL:sta';
    return;
  }

  const res = await fetch(
    `${SUPA_URL}/rest/v1/order_items?order_id=eq.${orderId}&group_name=eq.${encodeURIComponent(groupName)}&profile_type=eq.piippu`+
    `&select=id,nimike,profile_type,aihio_width_mm,material,color,thickness_mm,profile_data,quantity,production_status,`+
    `order_item_rows(id,mitta_mm,paat_mm,kok_mm,kpl,huomio,row_order,production_status,done_qty)`+
    `&order=item_order`,
    { headers }
  );
  const items = await res.json();

  // Hae tilauksen tiedot (asiakas, kohde)
  const oRes = await fetch(
    `${SUPA_URL}/rest/v1/orders?id=eq.${orderId}&select=*,customers(name,phone,email)`,   // * = myös työkortin tiedot (tilausnumero, toimitus, osoite, ohjeet)
    { headers }
  );
  const orders = await oRes.json();
  const order = orders[0] || {};

  render(items, order);
}

// ── Laske peltirivit profile_data:sta ─────────────────────
// Laskenta on yhteisessä tiedostossa piippu-laskenta.js (sama kuin Piippu-sivulla). Tuotanto laskee aina kaikki osat.
// Kiilapiipussa (v.kiilaPaalla) hupun palat, kansi, hattu ja juuret tulevat 3D-mallista (piippu-levitys.js, 20.11.2026).
// Harjapiippu (vaihe 6b, 20.11.2026): tilausrivin vals.tyyppi = 'harjapiippu', laskenta laskeKaikkiHarja.
const onHarja = v => !!(v && v.tyyppi === 'harjapiippu');
function laskePellit(v) {
  if (!v) return { juuret: [], muut: [] };
  if (onHarja(v)) {
    try { const t = KPT_PIIPPU_LEVITYS.laskeKaikkiHarja(v); return { juuret: t.juuret, muut: t.muut, kansi: t.kansi, virhe: (t.virheet || [])[0] }; }
    catch (e) { console.error('Harjapiippu:', e); const t = KPT_PIIPPU.laskeHarjapiippu(v); return { juuret: t.juuret, muut: t.muut, kansi: t.kansi }; }
  }
  try {
    if (window.KPT_PIIPPU_LEVITYS) { const t = KPT_PIIPPU_LEVITYS.laskeKaikki(v); return { juuret: t.juuret, muut: t.muut, kansi: t.kansi, kiila: t.kiila, virhe: t.virhe }; }
  } catch (e) { console.error('Kiilan laskenta:', e); }
  const { juuret, muut, kansi } = KPT_PIIPPU.laskeLapepiippu(v);
  return { juuret, muut, kansi };
}

// Kiila / mutkapiippu: kuva ylhäältä ja muistutus juurista
function kiilaHtml(v) {
  try {
    if (!v || !v.kiilaPaalla || !window.KPT_PIIPPU_LEVITYS) return '';
    const L = KPT_PIIPPU_LEVITYS;
    // Harjapiippu (vaihe 5b, 24.11.2026): oma laskenta ja kuva; varoitukset (laskettu, kiero lape) näkyviin
    const harja = onHarja(v);
    const t = harja ? L.laskeKaikkiHarja(v, { juuret: false, kansi: false, hattu: false }) : L.laskeKaikki(v, { juuret: false, kansi: false, hattu: false });
    if (harja) t.virhe = (t.virheet || [])[0];
    if (!t.kiila && !t.virhe) return '';
    const kuva = harja ? L.harjaKuvaYlhaalta(v) : L.kuvaYlhaalta(v);
    const varoit = (t.varoitukset || []).map(x => `<p style="color:${/^LASKETTU/.test(x) ? 'var(--red,#ef4444);font-weight:600' : '#f59e0b'}">⚠ ${x.replace(/</g, '&lt;')}</p>`).join('');
    return `<div class="section-card" style="margin-bottom:16px">
      <h3>Kiila / mutkapiippu</h3>
      <div style="padding:12px 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start">
        ${kuva ? `<div style="flex:0 1 320px;min-width:0;max-width:100%">${kuva}</div>` : ''}
        <div style="flex:1 1 220px;font-size:13px;line-height:1.5">
          ${t.virhe ? `<p style="color:var(--red,#ef4444)">${t.virhe}</p>` : ''}${varoit}
          <p>Hupun palat on laskettu piipun todellisesta muodosta. Kansi ja hattu leveimmän ja pisimmän kohdan mukaan.</p>
          <p><b>Juuret</b> on laskettu pisimmän sivun mukaan: muotoile ja mittaa ne piipun mukaan.</p>
        </div>
      </div>
    </div>`;
  } catch (e) {
    console.error('Kiila:', e);
    return '';
  }
}

// ── Tilauksen osat ────────────────────────────────────────
// Tuotanto näyttää ne osat, jotka ovat tilauksessa (korjattu 20.11.2026):
//  - lasketuista riveistä vain ne, joiden nimike löytyy tilauksesta (esim. kansi ja hattu pois, jos niitä ei tilattu)
//  - kpl tilauksesta, joten piippujen määrä on mukana
//  - perään tilauksen muut piippurivit, joita laskenta ei tunne (piipun jalat, käsin lisätyt osat)
// Mitat (lev, pit) lasketaan edelleen uudelleen syötöistä.
function kplTilauksesta(item) {
  const rivit = item.order_item_rows || [];
  if (rivit.length) return rivit.reduce((s, x) => s + (Number(x.kpl) || 0), 0);
  return Number(item.quantity) || 0;
}

function tilauksenOsat(v, items) {
  const laskettu = laskePellit(v);
  const loydetyt = new Set();
  const valitse = lista => lista.flatMap(p => {
    const item = items.find(i => i.nimike === p.osa && !loydetyt.has(i.id));
    if (!item) return [];
    loydetyt.add(item.id);
    return [Object.assign({}, p, { kpl: kplTilauksesta(item) || p.kpl, kplPiippua: p.kpl, item })];
  });
  const juuret = valitse(laskettu.juuret);
  const muut = valitse(laskettu.muut);
  // Varmistus: jos lasketut nimikkeet eivät täsmää tilaukseen lainkaan (hyvin vanha tilaus), näytetään laskettu lista kuten ennen
  if (!loydetyt.size && (laskettu.juuret.length || laskettu.muut.length)) return { juuret: laskettu.juuret, muut: laskettu.muut, kansi: laskettu.kansi };
  items.forEach(item => {
    if (loydetyt.has(item.id)) return;
    const rivi = (item.order_item_rows || [])[0];
    const pit = rivi ? (Number(rivi.kok_mm) || Number(rivi.mitta_mm) || 0) : 0;
    muut.push({
      osa: item.nimike || '—',
      lev: pit && Number(item.aihio_width_mm) ? Number(item.aihio_width_mm) : '—',
      pit: pit || '—',
      kpl: kplTilauksesta(item),
      item,
    });
  });
  return { juuret, muut, kansi: laskettu.kansi };
}

// Piippujen määrä: tallennettu arvo, tai vanhoissa tilauksissa päätelty (tilauksen kpl / yhden piipun kpl)
function piippujenMaara(v, osat) {
  if (v && Number(v.piippukpl) > 0) return Number(v.piippukpl);
  const p = [...osat.juuret, ...osat.muut].find(x => x.item && x.kplPiippua > 0 && x.kpl > 0);
  return p ? Math.max(1, Math.round(p.kpl / p.kplPiippua)) : 1;
}

// ── Piirrä SVG-kuva ────────────────────────────────────────
// Etukuva (yhteinen piippu-levitys.js v8, Tomin Excelin malli): leveys, ylitykset, uraan ja kulma, juuren nousu
function etukuvaSvg(v) {
  if (!v || !window.KPT_PIIPPU_LEVITYS || !KPT_PIIPPU_LEVITYS.etukuva) return '';
  try { return KPT_PIIPPU_LEVITYS.etukuva(v); } catch (e) { console.error('Etukuva:', e); return ''; }
}
// Kiilapiipussa kulmat ja kaltevuus oikean sivun korkeuksista, kuten sivukuvassa (vaihe 5c, 24.11.2026)
function sivuV(v) {
  try { const ks = !onHarja(v) && window.KPT_PIIPPU_LEVITYS && KPT_PIIPPU_LEVITYS.kiilaSivukuva ? KPT_PIIPPU_LEVITYS.kiilaSivukuva(v) : null; return ks ? Object.assign({}, v, { etukork: ks.etu, takakork: ks.taka }) : v; }
  catch (e) { return v; }
}
// opts.tuloste (työkortti): tekstit 1,5-kertaisiksi ja kaltevuus pois kuvasta (se on otsikossa), jotta kuva on paperilla luettava
function piirraKuvaSVG(v, opts) {
  if (!v) return '';
  const tuloste = !!(opts && opts.tuloste);
  if (onHarja(v)) { try { return KPT_PIIPPU_LEVITYS.harjaSivukuva(v, { todelliset: true }); } catch (e) { console.error('Harjapiipun kuva:', e); return ''; } }
  // Kiilapiippu (vaihe 5c, 24.11.2026): kuva oikeasta sivusta, korkeudet sen kulmista, ↳-luvut 3D-mallin oikeasta sivupalasta
  let ks = null;
  try { ks = window.KPT_PIIPPU_LEVITYS && KPT_PIIPPU_LEVITYS.kiilaSivukuva ? KPT_PIIPPU_LEVITYS.kiilaSivukuva(v) : null; } catch (e) { ks = null; }
  if (ks) v = Object.assign({}, v, { etukork: ks.etu, takakork: ks.taka });
  const suora=v.suora||0, etukork=v.etukork||0;
  const takakork=v.takakork||0, harjalle=v.harjalle||0;
  const k24=v.k24||0, j25=v.j25||0;
  const huppuSivutKpl=v.huppuSivutKpl||1;

  // Mitat yhteisestä laskennasta (piippu-laskenta.js)
  const g = KPT_PIIPPU.laskeLapepiippu(v).geom;
  const korkeuserot=g.korkeuserot, kattokulma_rad=g.kattokulma_rad;
  // Hupun todellinen korkeus ilman taitoksia (Tomi 20.11.2026: pellissä näkyy se mitta, joka siitä pitää tulla)
  const hEtuKork=ks && ks.etuTod !== null ? ks.etuTod : g.hEtuTodellinen, hTakaKork=ks && ks.takaTod !== null ? ks.takaTod : g.hTakaTodellinen, vinomitta=g.vinomitta;
  const hSivEtenemä=g.hSivEtenema;

  const W=900,H=380,mL=110,mR=160,mT=30,mB=30;
  const drawW=W-mL-mR, drawH=H-mT-mB;
  const maxKork=Math.max(etukork,takakork)||1;
  const etuUloke=k24||50;
  const kokonaisLev=etuUloke+(suora||1)+(harjalle||1);
  const scaleX=drawW*0.92/kokonaisLev, scaleY=drawH*0.72/maxKork;
  const scale=Math.min(scaleX,scaleY);
  const etuX=mL+etuUloke*scale, piipW=suora*scale, takaX=etuX+piipW;
  const etuY=mT+drawH*0.88, takaY=etuY-(etukork-takakork)*scale;
  const slope=piipW>0?(takaY-etuY)/piipW:0;
  const kattoVasenX=etuX-etuUloke*scale, kattoVasenY=etuY-slope*(etuUloke*scale);
  const harjW=harjalle*scale, harjaX=takaX+harjW, harjaY=takaY+slope*harjW;
  const ylaY=Math.min(etuY-etukork*scale,takaY-takakork*scale);
  const kattoLen=Math.sqrt((harjaX-kattoVasenX)**2+(harjaY-kattoVasenY)**2)||1;
  const kattoDX=(harjaX-kattoVasenX)/kattoLen, kattoDY=(harjaY-kattoVasenY)/kattoLen;
  const normX=kattoDY, normY=-kattoDX;
  const c1='#f1f5f9',c2='#64748b',cInfo='#38bdf8';

  let h='';
  // Nuolimääritelmä
  h+=`<defs><marker id="arr2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M1,1 L5,3 L1,5" fill="none" stroke="${c2}" stroke-width="1"/></marker></defs>`;

  h+=`<line x1="${kattoVasenX}" y1="${kattoVasenY}" x2="${harjaX}" y2="${harjaY}" stroke="${c2}" stroke-width="1.5" stroke-linecap="round"/>`;
  h+=`<line x1="${etuX}" y1="${etuY}" x2="${etuX}" y2="${ylaY}" stroke="${c1}" stroke-width="2" stroke-linecap="round"/>`;
  h+=`<line x1="${takaX}" y1="${takaY}" x2="${takaX}" y2="${ylaY}" stroke="${c1}" stroke-width="2" stroke-linecap="round"/>`;
  h+=`<line x1="${etuX}" y1="${ylaY}" x2="${takaX}" y2="${ylaY}" stroke="${c1}" stroke-width="2" stroke-linecap="round"/>`;

  const jEtuX=kattoVasenX, jEtuKattoY=kattoVasenY;
  h+=`<line x1="${etuX}" y1="${etuY}" x2="${jEtuX}" y2="${jEtuKattoY}" stroke="${c1}" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>`;
  const alasLen=j25*scale;
  h+=`<line x1="${jEtuX}" y1="${jEtuKattoY}" x2="${jEtuX-normX*alasLen}" y2="${jEtuKattoY-normY*alasLen}" stroke="${c1}" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>`;
  h+=`<line x1="${takaX}" y1="${takaY}" x2="${harjaX}" y2="${harjaY}" stroke="${c1}" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>`;

  // Vinomitta
  h+=`<line x1="${etuX}" y1="${etuY}" x2="${takaX}" y2="${takaY}" stroke="${cInfo}" stroke-width="1" stroke-dasharray="3 3"/>`;
  h+=`<text x="${(etuX+takaX)/2}" y="${(etuY+takaY)/2+14}" text-anchor="middle" font-size="10" fill="${cInfo}" font-family="system-ui">↗ vino ${r(vinomitta)}</text>`;

  // Suora mitta
  const smY=ylaY-14;
  h+=`<line x1="${etuX}" y1="${smY}" x2="${takaX}" y2="${smY}" stroke="${c2}" stroke-width="0.8" marker-end="url(#arr2)" marker-start="url(#arr2)"/>`;
  h+=`<text x="${(etuX+takaX)/2}" y="${smY-5}" text-anchor="middle" font-size="11" fill="${c2}" font-family="system-ui">Suora ${suora}</text>`;
  if (hSivEtenemä>0) h+=`<text x="${(etuX+takaX)/2}" y="${smY+12}" text-anchor="middle" font-size="10" fill="${cInfo}" font-family="system-ui">↳ etenemä ${hSivEtenemä}</text>`;

  // Etukorkeus
  const eMX=etuX-26, etuMittaY=ylaY+(etuY-ylaY)*0.25;
  h+=`<line x1="${eMX}" y1="${ylaY}" x2="${eMX}" y2="${etuY}" stroke="${c2}" stroke-width="0.8" marker-end="url(#arr2)" marker-start="url(#arr2)"/>`;
  h+=`<text x="${eMX-4}" y="${etuMittaY}" text-anchor="end" font-size="11" fill="${c2}" font-family="system-ui">Etu ${etukork}</text>`;
  h+=`<text x="${eMX-4}" y="${etuMittaY+14}" text-anchor="end" font-size="10" fill="${cInfo}" font-family="system-ui">↳ ${r(hEtuKork)}</text>`;

  // Sivuviivojen saumat
  if (huppuSivutKpl>=2) {
    const diff=hEtuKork-hTakaKork;
    function pirraSivuSauma(frac,korkeus) {
      const vX=etuX+(takaX-etuX)*frac, vYbot=etuY+(takaY-etuY)*frac, vYtop=vYbot-korkeus*scale;
      h+=`<line x1="${vX}" y1="${vYtop}" x2="${vX}" y2="${vYbot}" stroke="${cInfo}" stroke-width="1.5" stroke-linecap="round"/>`;
      h+=`<text x="${vX-6}" y="${(vYtop+vYbot)/2+4}" text-anchor="end" font-size="10" fill="${cInfo}" font-family="system-ui">${r(korkeus)}</text>`;
    }
    if (huppuSivutKpl===2) pirraSivuSauma(0.5,hEtuKork-diff/2);
    else { pirraSivuSauma(1/3,hEtuKork-diff/3); pirraSivuSauma(2/3,hEtuKork-diff*2/3); }
  }

  // Takakorkeus
  const tMX=takaX+24, takaMittaY=ylaY+(takaY-ylaY)*0.25;
  h+=`<line x1="${tMX}" y1="${ylaY}" x2="${tMX}" y2="${takaY}" stroke="${c2}" stroke-width="0.8" marker-end="url(#arr2)" marker-start="url(#arr2)"/>`;
  h+=`<text x="${tMX+4}" y="${takaMittaY}" text-anchor="start" font-size="11" fill="${c2}" font-family="system-ui">Taka ${takakork}</text>`;
  h+=`<text x="${tMX+4}" y="${takaMittaY+14}" text-anchor="start" font-size="10" fill="${cInfo}" font-family="system-ui">↳ ${r(hTakaKork)}</text>`;

  // Harjalle mitta
  const hjOff=14;
  const hj1X=takaX-normX*hjOff, hj1Y=takaY-normY*hjOff;
  const hj2X=harjaX-normX*hjOff, hj2Y=harjaY-normY*hjOff;
  const hjMidX=(hj1X+hj2X)/2, hjMidY=(hj1Y+hj2Y)/2;
  h+=`<line x1="${hj1X}" y1="${hj1Y}" x2="${hj2X}" y2="${hj2Y}" stroke="${c2}" stroke-width="0.8" marker-end="url(#arr2)" marker-start="url(#arr2)"/>`;
  h+=`<text x="${hjMidX}" y="${hjMidY+14}" text-anchor="middle" font-size="11" fill="${c2}" font-family="system-ui">harjalle ${harjalle}</text>`;

  // Eteen piipusta (k24) — vaakamitta kattoviivan alla
  if (k24>0) {
    const k24Y = etuY + 22;
    h+=`<line x1="${kattoVasenX}" y1="${k24Y}" x2="${etuX}" y2="${k24Y}" stroke="${cInfo}" stroke-width="0.8" marker-end="url(#arr2)" marker-start="url(#arr2)"/>`;
    h+=`<text x="${(kattoVasenX+etuX)/2}" y="${k24Y+13}" text-anchor="middle" font-size="11" fill="${cInfo}" font-family="system-ui">eteen ${k24}</text>`;
  }

  // Alas (j25) — pystymitta kattoviivan vieressä
  if (j25>0) {
    const j25X = kattoVasenX - 20;
    const j25bot = jEtuKattoY - normY*alasLen;
    const j25botX = jEtuX - normX*alasLen;
    h+=`<line x1="${j25X}" y1="${jEtuKattoY}" x2="${j25X}" y2="${j25bot+(j25bot-jEtuKattoY<0?-2:2)}" stroke="${cInfo}" stroke-width="0.8" marker-end="url(#arr2)" marker-start="url(#arr2)"/>`;
    h+=`<text x="${j25X-4}" y="${(jEtuKattoY+j25bot)/2+4}" text-anchor="end" font-size="11" fill="${cInfo}" font-family="system-ui">alas ${j25}</text>`;
  }

  // Suhde
  const kattokulma_deg=kattokulma_rad*180/Math.PI;
  const suhde=korkeuserot>0?(suora/korkeuserot).toFixed(1):'—';
  if (!tuloste) h+=`<text x="${W-10}" y="20" text-anchor="end" font-size="11" fill="${c2}" font-family="system-ui">1:${suhde}</text>`;
  if (tuloste) h = h.replace(/font-size="([\d.]+)"/g, (m, x) => `font-size="${(Number(x) * 1.5).toFixed(1)}"`);

  if (ks) h+=`<text x="8" y="${H-8}" font-size="${tuloste?16:11}" fill="${c2}" font-family="system-ui">oikea sivu · muut sivut kuvassa ylhäältä (kiila / mutka)</text>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${h}</svg>`;
}

// ── Renderöi taulu statusnapeilla ─────────────────────────
function renderTauluStatus(pellit, label) {
  let tot=0;
  const rows = pellit.map(p => {
    const m2 = typeof p.lev==='number'&&typeof p.pit==='number' ? p.lev*p.pit*p.kpl/1000000 : null;
    if (m2!==null) tot+=m2;

    // Tilauksen rivi (tilauksenOsat liitti sen). Osilla ilman pituutta (jalat) tila tallennetaan pelkkään order_itemiin.
    const item = p.item;
    const supaRow = item?.order_item_rows?.[0];
    const rowId = supaRow?.id || '';
    const itemId = item?.id || '';
    const status = supaRow?.production_status||item?.production_status||'WAITING';
    const rsIdx = STEP_KEYS.indexOf(status);
    const isDone = status==='DONE';

    const stepBtns = STEP_KEYS.map((key,si) => {
      const cls = si===rsIdx?' active':si<rsIdx?' passed':'';
      return `<button class="step-btn${cls}" data-key="${key}"
        onclick="setStatus('${rowId}','${key}','${itemId}',this)"
        ${!itemId?'disabled title="ei dataa"':''}>${STEPS[si]}</button>`;
    }).join('');

    // Mobiili: yksi nappi joka siirtää seuraavaan vaiheeseen
    const nextIdx = Math.min(rsIdx+1, STEP_KEYS.length-1);
    const nextKey = STEP_KEYS[nextIdx];
    const mobileLabel = isDone ? '✓ Valmis' : `${STEPS[rsIdx]} → ${STEPS[nextIdx]}`;
    const mobileBtnHtml = `<button class="step-btn-mobile status-${status}"
      onclick="setStatusMobile('${rowId}','${nextKey}','${itemId}',${rsIdx},this)"
      ${!itemId?'disabled':''}>${mobileLabel}</button>`;

    return `<tr class="${isDone?'row-done':''}">
      <td class="td-osa">${p.osa}</td>
      <td class="td-num">${p.lev}</td>
      <td style="color:var(--text-dim)">${typeof p.lev==='number'?'×':''}</td>
      <td class="td-num">${typeof p.pit==='number'?p.pit:''}</td>
      <td class="td-num">${p.kpl}</td>
      <td><div class="step-btns">${stepBtns}</div>${mobileBtnHtml}</td>
    </tr>`;
  }).join('');

  return `<div class="section-card">
    <h3>${label}</h3>
    <table>
      <thead><tr>
        <th>Osa</th><th class="td-num">Lev</th><th></th>
        <th class="td-num">Pit</th><th class="td-num">Kpl</th>
        <th>Vaihe</th>
      </tr></thead>
      <tbody>${rows}
        <tr><td colspan="4" style="color:var(--text-dim);font-size:11px;padding-top:6px">Yhteensä</td>
        <td colspan="2" style="text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--accent)">${tot.toFixed(3)} m²</td></tr>
      </tbody>
    </table>
  </div>`;
}

// ── Päivitä status Supabaseen ──────────────────────────────
async function setStatus(rowId, key, itemId, btn) {
  if (!rowId && !itemId) return;
  const tr = btn.closest('tr');
  const allBtns = tr.querySelectorAll('.step-btn');
  const newIdx = STEP_KEYS.indexOf(key);

  // Päivitä UI heti
  allBtns.forEach((b,si) => {
    b.classList.remove('active','passed');
    if (si===newIdx) b.classList.add('active');
    else if (si<newIdx) b.classList.add('passed');
  });
  tr.classList.toggle('row-done', key==='DONE');

  // Tallenna Supabaseen
  if (rowId) await fetch(`${SUPA_URL}/rest/v1/order_item_rows?id=eq.${rowId}`, {
    method: 'PATCH',
    headers: { ...headers, 'Prefer': 'return=minimal' },
    body: JSON.stringify({ production_status: key })
  });

  // Päivitä myös order_item production_status
  if (itemId) {
    await fetch(`${SUPA_URL}/rest/v1/order_items?id=eq.${itemId}`, {
      method: 'PATCH',
      headers: { ...headers, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ production_status: key })
    });
  }
}

// ── Rakenna mitat-lista kahdessa kategoriassa ─────────────
// opts.kuvissa = true: jätetään pois juuren mitat, jotka näkyvät sivu- ja etukuvassa (työkortti, Tomi 23.11.2026)
function mittalista(v, opts) {
  if (!v) return '';
  const kuvissa = !!(opts && opts.kuvissa);

  const rivi = (lbl, val, yksikko='mm', kuvassa=false) =>
    val && !(kuvissa && kuvassa) ? `<div class="mitta-row"><span class="mitta-label">${lbl}</span><span class="mitta-val">${val} ${yksikko}</span></div>` : '';

  if (onHarja(v)) {
    const puolet = (a, b) => a === b || b === null || b === undefined ? a : a + ' / ' + b;
    const juuretH = [
      rivi('Ylitys vasen (puoli 1 / 2)', puolet(v.ylit1V, v.ylit2V), 'mm', true),
      rivi('Ylitys oikea (puoli 1 / 2)', puolet(v.ylit1O, v.ylit2O), 'mm', true),
      rivi('Uraan', v.poimu, 'mm', true),
      rivi('Uraan kulma', v.harjakulma, '°', true),
      rivi('Eteen piipusta (puoli 1 / 2)', puolet(v.k24_1, v.k24_2), 'mm', true),
      rivi('Alas (puoli 1 / 2)', puolet(v.j25_1, v.j25_2), 'mm', true),
      rivi('Juuri nousee piipulle', v.nousu, 'mm', true),
    ].filter(Boolean).join('');
    const huppuH = [
      (() => { const j = KPT_PIIPPU.harjaEtuJako(v), t = k => k === 1 ? 'yhtenä' : k + ' osaa';
        return rivi('Hupun etu', j.jako1 === j.jako2 ? t(j.jako1) : 'etu 1 ' + t(j.jako1) + ' / etu 2 ' + t(j.jako2), ''); })(),
      rivi('Hupun sivut', Number(v.sivutJako) === 2 ? 'poikki harjalta' : 'yhtenä kappaleena', ''),
      Number(v.sivutJako) === 2 ? rivi('Jakosauma harjalla', KPT_PIIPPU.harjaJakosauma(v)) : '',
      rivi('Hupun yläreuna', v.ylareunaV),
      rivi('Hupun alatupla', v.alatupla),
      rivi('Vähennys korkeudesta', v.vahennys),
      rivi('Lisää hupun kokoon', v.huplis),
      rivi('Sivujen liitosvara', v.hsivlisa),
    ].filter(Boolean).join('');
    if (kuvissa && !juuretH) return `<div><div style="font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Hupun mitat</div>${huppuH || '—'}</div>`;
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 24px;">
      <div><div style="font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Juuren mitat</div>${juuretH || '—'}</div>
      <div><div style="font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Hupun mitat</div>${huppuH || '—'}</div>
    </div>`;
  }

  const juuret = [
    rivi('Vasen ylitys', v.vasen, 'mm', true),
    rivi('Oikea ylitys', v.oikea, 'mm', true),
    rivi('Uraan', v.poimu, 'mm', true),
    rivi('Uraan kulma', v.harjakulma, '°', true),
    rivi('Juuri sauma', v.juurisauma),
  ].filter(Boolean).join('');

  const huppu = [
    rivi('Hupun yläreuna', v.ylareunaV),
    rivi('Hupun alatupla', v.alatupla),
    rivi('Vähennys korkeudesta', v.vahennys),
    rivi('Lisää hupun kokoon', v.huplis),
    rivi('Huppu takaa leveämpi', v.huptakalis),
  ].filter(Boolean).join('');

  if (kuvissa && !juuret) return `<div><div style="font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Hupun mitat</div>${huppu || '—'}</div>`;
  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 24px;">
      <div>
        <div style="font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Juuren mitat</div>
        ${juuret||'—'}
      </div>
      <div>
        <div style="font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Hupun mitat</div>
        ${huppu||'—'}
      </div>
    </div>`;
}

// ── Mobiili: siirry seuraavaan vaiheeseen ─────────────────
async function setStatusMobile(rowId, nextKey, itemId, currentIdx, btn) {
  if (!rowId && !itemId) return;
  // Jos jo DONE, kierrä takaisin WAITING:iin
  const key = currentIdx >= STEP_KEYS.length-1 ? 'WAITING' : nextKey;
  const newIdx = STEP_KEYS.indexOf(key);

  // Päivitä mobiilinappi
  btn.className = `step-btn-mobile status-${key}`;
  const nextNextIdx = Math.min(newIdx+1, STEP_KEYS.length-1);
  btn.textContent = key==='DONE' ? '✓ Valmis' : `${STEPS[newIdx]} → ${STEPS[nextNextIdx]}`;
  btn.setAttribute('onclick', `setStatusMobile('${rowId}','${STEP_KEYS[nextNextIdx]}','${itemId}',${newIdx},this)`);

  // Päivitä myös desktop-napit samassa rivissä
  const tr = btn.closest('tr');
  tr.classList.toggle('row-done', key==='DONE');
  tr.querySelectorAll('.step-btn').forEach((b,si) => {
    b.classList.remove('active','passed');
    if (si===newIdx) b.classList.add('active');
    else if (si<newIdx) b.classList.add('passed');
  });

  // Tallenna
  if (rowId) await fetch(`${SUPA_URL}/rest/v1/order_item_rows?id=eq.${rowId}`, {
    method: 'PATCH',
    headers: { ...headers, 'Prefer': 'return=minimal' },
    body: JSON.stringify({ production_status: key })
  });
  if (itemId) {
    await fetch(`${SUPA_URL}/rest/v1/order_items?id=eq.${itemId}`, {
      method: 'PATCH',
      headers: { ...headers, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ production_status: key })
    });
  }
}
// Hupun levityskuvat tilatuista hupun paloista (yhteinen piippu-levitys.js). Pala kerrallaan avattavina korteina.
// Vanhoissa tilauksissa yläreunan taitoksen suuntaa ei ole tallennettu: oletus Ulos.
function levityskuvatHtml(v, muut) {
  try {
    if (!v || !window.KPT_PIIPPU_LEVITYS) return '';
    const L = window.KPT_PIIPPU_LEVITYS;
    const tilatut = new Map(muut.filter(p => p.osa.startsWith('Huppu')).map(p => [p.osa, p.kpl]));
    const t = onHarja(v) ? L.harjaHupunPalat(v) : L.hupunPalat(v);
    if (!t) return '';
    const palat = t.palat.filter(pa => tilatut.has(pa.nimi));
    if (!palat.length) return '';
    return `<div class="section-card" style="margin-bottom:16px">
      <h3>Hupun levityskuvat</h3>
      <div style="padding:12px 14px">${L.SELITE}${palat.map(pa => L.palaHtml(pa, { kpl: tilatut.get(pa.nimi) || pa.kpl })).join('')}</div>
    </div>`;
  } catch (e) {
    console.error('Levityskuvat:', e);
    return '';
  }
}

// Harjapiipun yhteenveto ja kulmat (lapepiipulle tyhjä, joten lapepiipun näkymä ennallaan)
function harjaYhteenveto(v) {
  if (!onHarja(v)) return '';
  const lev = v.lev2 !== null && v.lev2 !== undefined && v.lev2 !== v.lev1 ? v.lev1 + ' / ' + v.lev2 : v.lev1;
  return `<div class="summary-item">Leveys: <strong>${lev} mm</strong></div>
    <div class="summary-item">Suorat: <strong>${r(v.suora1)} + ${r(v.suora2)} mm</strong></div>
    <div class="summary-item">Korkeudet: <strong>${r(v.kork1)} / harja ${r(v.korkH)} / ${r(v.kork2)} mm</strong></div>`;
}
function harjaKulmat(v) {
  if (!onHarja(v)) return '';
  try {
    const g = KPT_PIIPPU.laskeHarjapiippu(v, { juuret: false, huppu: false, kansi: false, hattu: false }).geom;
    const s = KPT_PIIPPU_LEVITYS.harjaSuhde(v);
    const k = x => `<strong style="font-family:'IBM Plex Mono',monospace">${x}</strong>`;
    return `<span style="font-weight:400;color:var(--text);">Etukulmat: ${k(r(g.puoli1.kulmaDeg) + '° / ' + r(g.puoli2.kulmaDeg) + '°')}</span>
      <span style="font-weight:400;color:var(--text);">Kaltevuus: ${k(s.join(' / '))}</span>`;
  } catch (e) { return ''; }
}

function render(items, order) {
  document.getElementById('loading').style.display='none';
  const el = document.getElementById('content');
  el.style.display='block';

  if (!items.length) {
    el.innerHTML='<div class="loading">Ei piippurivejä löytynyt</div>';
    return;
  }

  // Hae vals ensimmäisestä rivistä jolla on profile_data
  const firstWithData = items.find(i => i.profile_data?.vals);

  const huomio = v?.huomio || '';

  const mat = [items[0].material, items[0].color, items[0].thickness_mm?items[0].thickness_mm+'mm':''].filter(Boolean).join(' · ');

  // Tilauksen osat: mitat lasketaan uudelleen syötöistä, osat ja kpl tilauksesta

  const kansi = muut.some(p => p.osa === 'Kansi' && p.item) && osat.kansi ? osat.kansi : null;   // vain tilattu kansi
  tkData = { v, items, order, juuret, muut, piippukpl, mat, totalM2, huomio, kansi, dataItem: firstWithData || null };

  el.innerHTML = `
    <div class="piippu-header">

      ${v?.takakork?`<div class="summary-item">Taka: <strong>${v.takakork} mm</strong></div>`:''}
      ${v?.leveys?`<div class="summary-item">Leveys: <strong>${v.leveys} mm</strong></div>`:''}
      ${v?.suora?`<div class="summary-item">Suora: <strong>${v.suora} mm</strong></div>`:''}
    </div>

    ${svgHtml?`
    <div class="section-card" style="margin-bottom:16px">
      <h3 style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;">
        <span>${onHarja(v) ? 'Harjapiippu' : 'Piippu'} — sivukuva</span>
        ${harjaKulmat(v)}
        ${v?.etukork&&v?.takakork&&v?.suora?`
          <span style="font-weight:400;color:var(--text);">
            Etukulma: <strong style="font-family:'IBM Plex Mono',monospace">${Math.round(Math.atan((v.suora||0)/(sivuV(v).etukork-sivuV(v).takakork||1))*180/Math.PI)}°</strong>
          </span>
          <span style="font-weight:400;color:var(--text);">
            Takakulma: <strong style="font-family:'IBM Plex Mono',monospace">${180-Math.round(Math.atan((v.suora||0)/(sivuV(v).etukork-sivuV(v).takakork||1))*180/Math.PI)}°</strong>
          </span>
          <span style="font-weight:400;color:var(--text);">
            Kaltevuus: <strong style="font-family:'IBM Plex Mono',monospace">1:${((v.suora||0)/(sivuV(v).etukork-sivuV(v).takakork||1)).toFixed(1)}</strong>
          </span>`:''}
      </h3>
      <div class="svg-wrap kuvat-rinn" style="padding:16px"><div>${svgHtml}</div><div>${etukuvaSvg(v)}</div></div>

    ${kiilaHtml(v)}

    <div class="two-col" style="margin-bottom:16px">
      ${juuret.length ? renderTauluStatus(juuret, 'Juuret') : ''}

// ── Kansi ja reiät (vaihe 7b, 23.11.2026) ─────────────────
// Kuva ja reikien mitat kannen reunasta (kansi.js). Kun piipun pellit on liitetty, piipun ulkomitan voi mitata yläreunoista
// ja tallentaa: kansi ja reikien paikat lasketaan sen jälkeen siitä (tallennus vals.kansi.mitattu tilausriville).
let kansiMista = (() => { try { return localStorage.getItem('kpt_kansi_mista') === 'taitettu' ? 'taitettu' : 'leikkuu'; } catch (e) { return 'leikkuu'; } })();
function piirraKansiTuotanto() {
  const el = document.getElementById('kansi-tuotanto');

  const syotto = (id, arvo, laskettu) => `<input type="number" id="${id}" value="${arvo || ''}" placeholder="${Math.round(laskettu * 10) / 10}" style="width:84px;padding:5px 6px;background:var(--bg,#0a0f1a);color:var(--text);border:1px solid ${arvo ? '#f59e0b' : 'var(--border)'};border-radius:3px;font-size:13px">`;
  el.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13px;margin-bottom:10px">${tieto}</div>
    <div style="border:1px solid var(--border);border-radius:4px;padding:8px 10px;margin-bottom:10px;font-size:13px">

      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">

        <label>Vasen–oikea ${syotto('kansi-mit-lev', mit.lev, k.L.laskettu)}</label>
        <button type="button" class="kpk-nappi" onclick="tallennaKansiMitattu(false)">Tallenna</button>
        ${onMit ? `<button type="button" class="kpk-nappi" onclick="tallennaKansiMitattu(true)">Poista mitattu</button>` : ''}
        <span id="kansi-mit-tila" style="color:var(--text-dim);font-size:12px">${onMit ? 'Kansi lasketaan mitatusta (laskettu ' + Math.round(k.S.laskettu) + ' × ' + Math.round(k.L.laskettu) + ').' : 'Tyhjä = laskettu mitta (harmaa luku).'}</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px">Mitat
      <select onchange="kansiMista=this.value;try{localStorage.setItem('kpt_kansi_mista',kansiMista)}catch(e){};piirraKansiTuotanto()" style="padding:4px 6px;background:var(--bg,#0a0f1a);color:var(--text);border:1px solid var(--border);border-radius:3px">
        <option value="leikkuu"${kansiMista === 'leikkuu' ? ' selected' : ''}>tasoaihion leikkuureunasta</option>
        <option value="taitettu"${kansiMista === 'taitettu' ? ' selected' : ''}>taitetun kannen reunasta</option>
      </select></div>
    <div class="kpk-kuva" style="max-width:820px">${KPT_KANSI.kuva(k, { mista: kansiMista })}<div class="kpk-alle">${KPT_KANSI.alateksti({ mista: kansiMista })}</div></div>
    ${k.varoitukset.map(t => `<div class="kpk-varoitus">⚠ ${t}</div>`).join('')}
    ${KPT_KANSI.reikaTaulu(k, { mista: kansiMista })}`;
}
async function tallennaKansiMitattu(poista) {
  const tila = document.getElementById('kansi-mit-tila');
  const it = tkData && tkData.dataItem;
  if (!it || !it.profile_data || !it.profile_data.vals) { if (tila) tila.textContent = 'Piipun tietoja ei löytynyt, tallennus ei onnistu.'; return; }
  const luku = id => { const x = parseFloat(document.getElementById(id).value); return x > 0 ? x : null; };
  const mitattu = poista ? null : { lev: luku('kansi-mit-lev'), syv: luku('kansi-mit-syv') };
  const vals = Object.assign({}, it.profile_data.vals);
  vals.kansi = Object.assign({}, vals.kansi || {});
  if (mitattu && (mitattu.lev || mitattu.syv)) vals.kansi.mitattu = mitattu; else delete vals.kansi.mitattu;
  const pd = Object.assign({}, it.profile_data, { vals });
  if (tila) tila.textContent = 'Tallennetaan…';
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/order_items?id=eq.${it.id}`, {
      method: 'PATCH', headers: { ...headers, 'Prefer': 'return=minimal' }, body: JSON.stringify({ profile_data: pd }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    it.profile_data = pd;
    render(tkData.items, tkData.order);   // kansirivi, kuva ja reiät mitatun mukaan
  } catch (e) {
    console.error('Kannen mitan tallennus:', e);
    if (tila) tila.textContent = 'Tallennus epäonnistui. Tarkista yhteys ja yritä uudelleen.';
  }
}

// ── Työkortti (vaihe 7.1, 23.11.2026) ─────────────────────
// Yhteinen pohja tyokortti.js. Sivu 1: tilauksen tiedot, sivu- ja etukuva, osat ja mitat. Sivut 2–: hupun palat (7.2).
let tkData = null;
// Kulmat ja kaltevuus tekstinä (sama laskenta kuin sivukuvan otsikossa)
function kulmatTeksti(v) {
  if (!v) return '';
  try {
    if (onHarja(v)) {
      const g = KPT_PIIPPU.laskeHarjapiippu(v, { juuret: false, huppu: false, kansi: false, hattu: false }).geom;
      return 'Etukulmat ' + r(g.puoli1.kulmaDeg) + '° / ' + r(g.puoli2.kulmaDeg) + '° · kaltevuus ' + KPT_PIIPPU_LEVITYS.harjaSuhde(v).join(' / ');
    }
    v = sivuV(v);
    if (v.etukork && v.takakork && v.suora) {
      const ero = (v.etukork - v.takakork) || 1, etu = Math.round(Math.atan((v.suora || 0) / ero) * 180 / Math.PI);
      return 'Etukulma ' + etu + '° · takakulma ' + (180 - etu) + '° · kaltevuus 1:' + ((v.suora || 0) / ero).toFixed(1);
    }
  } catch (e) { console.warn('Kulmat:', e); }
  return '';
}
function rakennaPiipunTyokortti(valinnat) {
  const val = Object.assign({ merkinta: true, lahikuvat: true, kansi: true }, valinnat || {});
  const T = window.KPT_TYOKORTTI;
  if (!T || !tkData) return '';
  const { v, order, juuret, muut, piippukpl, mat, totalM2, huomio, kansi } = tkData;
  const e = T.esc;
  const cust = order.customers || {};
  const numero = order.order_number || '';
  let h = T.ylaosa({
    otsikko: 'TYÖKORTTI · PIIPPU' + (numero ? ' · TILAUS ' + numero : ''),
    alaotsikko: groupName,
    pieni: [order.status ? 'Tila: ' + (T.STATUS_FI[order.status] || order.status) : '', mat].filter(Boolean).join(' · '),
    qr: location.href, qrTeksti: 'Avaa piippu puhelimella',
  });
  h += T.tiedot({ asiakas: cust.name, puhelin: cust.phone, email: cust.email, kohde: order.kohde, toimitus: order.delivery_date,
    osoite: order.site_address, tilattu: order.order_date, ohjeet: order.site_instructions });
  h += T.huomio(huomio);
  h += `<div class="tkk-rivi"><span>Materiaali <b>${e(mat || '—')}</b></span>${piippukpl > 1 ? `<span>Piippuja ${T.kpl(piippukpl)}</span>` : ''}<span>Peltiä <b>${totalM2.toFixed(2).replace('.', ',')} m²</b></span></div>`;

  const kuva = piirraKuvaSVG(v, { tuloste: true }), etu = etukuvaSvg(v);
  if (kuva || etu) h += `<h2>${onHarja(v) ? 'Harjapiippu' : 'Piippu'} sivulta ja edestä<span>${e(kulmatTeksti(v))}</span></h2>
    <div class="tkk-kuvat"><div class="tkk-kuva">${kuva ? T.paperille(T.rajaa(kuva)) : ''}</div><div class="tkk-kuva">${etu ? T.paperille(etu) : ''}</div></div>`;
  if (v && v.kiilaPaalla && window.KPT_PIIPPU_LEVITYS) {
    try {
      const L = KPT_PIIPPU_LEVITYS, harja = onHarja(v);
      const ylh = harja ? L.harjaKuvaYlhaalta(v) : L.kuvaYlhaalta(v);
      // harjapiipun lasketut korkeudet myös paperille (Tomi 24.11.2026: selvä varoitus, ettei arvo ole mitattu)
      const m = harja ? L.harjaMalli(v) : null, lask = m && m.lasketut.length ? `<p><b>LASKETTU, EI MITATTU:</b> ${e(m.lasketut.map(x => x.nimi + ' ' + Math.round(x.arvo) + ' mm').join(', '))} (kuvassa ≈). Tarkista paikan päällä.</p>` : '';
      if (ylh) h += `<h2>${harja ? 'Harjapiippu' : 'Kiila / mutkapiippu'} ylhäältä<span>juuret pisimmän sivun mukaan, muotoile paikan päällä</span></h2><div class="tkk-kuva" style="max-width:${harja ? 110 : 90}mm">${T.paperille(ylh)}</div>${lask}`;
    } catch (err) { console.warn('Kiilan kuva:', err); }
  }

  const kplYht = [...juuret, ...muut].reduce((s, p) => s + (Number(p.kpl) || 0), 0);
  const rivi = p => {
    const lev = typeof p.lev === 'number' ? r(p.lev) : (p.lev || '—'), pit = typeof p.pit === 'number' ? r(p.pit) : (p.pit || '—');
    return `<tr><td class="tkk-teksti"><b>${e(p.osa)}</b>${p.lisa ? `<span class="tkk-lisa">${e(p.lisa)}</span>` : ''}</td><td class="tkk-r">${e(lev)}</td><td class="tkk-r">${e(pit)}</td>
      <td class="tkk-c"><b>${e(p.kpl)}</b></td><td class="tkk-c">${T.ruutu()}</td><td class="tkk-c">${T.ruutu()}</td></tr>`;
  };
  h += `<h2>Osat<span>Pellit yhteensä ${kplYht} kpl</span></h2>
    <table><colgroup><col><col style="width:14%"><col style="width:14%"><col style="width:9%"><col style="width:13%"><col style="width:13%"></colgroup>
      <tr><th>Osa</th><th class="tkk-r">LL</th><th class="tkk-r">Pituus</th><th class="tkk-c">kpl</th><th class="tkk-c">Leikattu</th><th class="tkk-c">Kantattu</th></tr>
      ${juuret.map(rivi).join('')}${muut.map(rivi).join('')}
    </table>
    <div style="font-size:7.5pt;margin-top:1mm">Hupun palat aihion kokoisina (taitokset mukana). Levityskuvat ja merkintäpisteet piipun Tuotanto-sivulla (QR).</div>`;
  const mitat = mittalista(v, { kuvissa: true });
  if (mitat) h += `<h2>Muut mitat</h2><div class="tkk-mitat">${mitat}</div>`;
  // Hupun palojen sivut (vaihe 7.2): samat tilatut palat kuin ruudun levityskuvissa
  const palat = tyokorttiPalat(v, muut);
  // Jokaisesta palasta kaksi sivua: taitossivu (levityskuva, taitokset, lähikuvat) ja merkintäsivu (pisteet leikkuuseen)
  const kansiSivulle = !!(val.kansi && kansi && kansi.reiat.length);   // kansisivu vain, jos kanteen tulee reikiä
  const sivuja = 1 + (val.merkinta ? 2 : 1) * palat.length + (kansiSivulle ? 1 : 0), otsikko = 'TYÖKORTTI · PIIPPU' + (numero ? ' · TILAUS ' + numero : '');
  h += T.alaosa('Piipun työkortti · sivu 1 / ' + sivuja);
  let html = T.sivu(h);
  let nro = 1;
  palat.forEach(x => {
    const o = { otsikko, mat, lahikuvat: val.lahikuvat, merkinta: val.merkinta };
    html += T.sivu(palaSivu(x.pa, x.kpl, Object.assign({ sivu: 'sivu ' + (++nro) + ' / ' + sivuja }, o)));
    if (val.merkinta) html += T.sivu(merkintaSivu(x.pa, x.kpl, Object.assign({ sivu: 'sivu ' + (++nro) + ' / ' + sivuja }, o)));
  });
  if (kansiSivulle) {
    const kp = muut.find(p => p.osa === 'Kansi');
    html += T.sivu(kansiSivu(kansi, kp ? kp.kpl : 1, { otsikko, mat, sivu: 'sivu ' + (++nro) + ' / ' + sivuja }));
  }
  return html;
}

// Kannen sivu (vaihe 7b): levityskuva reikineen ja reikien mitat kannen reunasta (paperiväreinä)
function kansiSivu(k, kpl, o) {
  const T = window.KPT_TYOKORTTI, e = T.esc;
  const mm = x => (Math.round(x * 10) / 10).toLocaleString('fi-FI', { maximumFractionDigits: 1 });
  let h = T.ylaosaPieni({ otsikko: o.otsikko, alaotsikko: groupName, sivu: o.sivu });
  h += `<h1 class="tkk-pala">Kansi ${T.kpl(kpl)}</h1>`;
  h += `<div class="tkk-rivi">${KPT_KANSI.tiedot(k).slice(0, 3).map(([a, b]) => `<span>${e(a)} <b>${e(b)}</b></span>`).join('')}${o.mat ? `<span>${e(o.mat)}</span>` : ''}</div>`;
  if (k.as.mitattu.lev || k.as.mitattu.syv) h += `<div class="tkk-rivi"><span><b>Laskettu mitatusta ulkomitasta</b> ${e(KPT_KANSI.tiedot(k)[3][1])}</span></div>`;
  h += `<div class="tkk-levitys">${T.paperille(T.rajaa(KPT_KANSI.kuva(k, { mista: kansiMista })))}</div><div class="tkk-selite">${e(KPT_KANSI.alateksti({ mista: kansiMista }))} Katkoviiva reiän sisällä = leikkausviiva, reuna karvataan ylös.</div>`;
  const sN = k.as.syva === 'etu' ? (k.harja ? 'Etu 1:stä' : 'Edestä') : (k.harja ? 'Etu 2:sta' : 'Takaa'), vN = k.as.vaaka === 'vasen' ? 'Vasemmasta' : 'Oikeasta';
  h += `<h2>Reiät<span>mm ${kansiMista === 'taitettu' ? 'taitetun kannen reunasta' : 'tasoaihion leikkuureunasta'}</span></h2>
    <table><tr><th>Reikä</th><th>Koko</th><th class="tkk-r">${sN} alku</th><th class="tkk-r">keski</th><th class="tkk-r">loppu</th><th class="tkk-r">${vN} alku</th><th class="tkk-r">keski</th><th class="tkk-r">loppu</th><th>Karvaus</th><th class="tkk-c">Tehty</th></tr>
    ${k.reiat.map(r => {
      const m = KPT_PIIPPU.kansiReianMitat(r, k, kansiMista), pyo = r.muoto === 'pyorea';
      const koko = pyo ? 'Ø' + mm(r.dw) : mm(r.du) + ' × ' + mm(r.dw);
      const karv = r.karvaus ? mm(r.karvaus) + ' mm, leikataan ' + (pyo ? 'Ø' + mm(r.leikDw) : mm(r.leikDu) + ' × ' + mm(r.leikDw)) : 'ei';
      return `<tr><td><b>${r.nro}</b></td><td>${koko}</td><td class="tkk-r">${mm(m.sAlku)}</td><td class="tkk-r">${mm(m.sKeski)}</td><td class="tkk-r">${mm(m.sLoppu)}</td>
        <td class="tkk-r">${mm(m.vAlku)}</td><td class="tkk-r">${mm(m.vKeski)}</td><td class="tkk-r">${mm(m.vLoppu)}</td><td class="tkk-teksti">${karv}</td><td class="tkk-c">${T.ruutu()}</td></tr>`;
    }).join('')}</table>`;
  h += `<h2>Muistiinpanot</h2><div class="tkk-viivat"></div>`;
  h += T.alaosa('Piipun työkortti · ' + o.sivu);
  return h;
}

// Tilatut hupun palat työkorttiin (kpl kuten osat-taulukossa)
function tyokorttiPalat(v, muut) {
  try {
    const L = window.KPT_PIIPPU_LEVITYS;
    if (!v || !L || !L.palaTiedot) return [];
    const tilatut = new Map(muut.filter(p => p.osa.startsWith('Huppu')).map(p => [p.osa, p.kpl]));
    const t = onHarja(v) ? L.harjaHupunPalat(v) : L.hupunPalat(v);
    if (!t) return [];
    return t.palat.filter(pa => tilatut.has(pa.nimi)).map(pa => ({ pa, kpl: tilatut.get(pa.nimi) || pa.kpl }));
  } catch (e) { console.error('Työkortin palat:', e); return []; }
}

// Yksi hupun pala omalle sivulleen: levityskuva, taitokset, lähikuvat ja merkintäpisteet (paperiväreinä)
const PALA_SELITE = 'Kuva ulkopuolelta katsottuna. Paksu viiva = paneeli (näkyvä pinta), ohut = taitos / sauma, '
  + '- - - taitto ulos, -·-· taitto sisään, ···· nurkka (ei taitosta), vinoviivoitus = loveus, leikataan pois ennen taittoa.';
function palaSivu(pa, kpl, o) {
  const T = window.KPT_TYOKORTTI, L = window.KPT_PIIPPU_LEVITYS, P = window.KPT_PELLIT, e = T.esc;
  const t = L.palaTiedot(pa), lv = t.lv;
  let h = T.ylaosaPieni({ otsikko: o.otsikko, alaotsikko: groupName, sivu: o.sivu });
  h += `<h1 class="tkk-pala">${e(pa.nimi)} ${T.kpl(kpl)}</h1>`;
  h += `<div class="tkk-rivi"><span>Aihio <b>${t.aw} × ${t.ah} mm</b></span><span>Korkeus <b>${e(t.korkeus)}</b></span>${o.mat ? `<span>${e(o.mat)}</span>` : ''}${pa.peili ? '<span><b>Toinen sivu peilikuva</b></span>' : ''}</div>`;
  h += `<div class="tkk-levitys">${T.paperille(L.piirraPala(pa, lv))}</div><div class="tkk-selite">${e(PALA_SELITE)}</div>`;
  h += `<h2>Taitokset</h2><table><colgroup><col style="width:22%"><col style="width:14%"><col style="width:14%"><col style="width:11%"><col><col style="width:9%"></colgroup>
    <tr><th>Reuna</th><th>Mitta</th><th>Kanttaus</th><th>Taitto</th><th>Huom.</th><th class="tkk-c">Tehty</th></tr>
    ${t.taitokset.map(r => `<tr>${r.map((x, i) => `<td${i === 0 || i === 4 ? ' class="tkk-teksti"' : ''}>${e(x)}</td>`).join('')}<td class="tkk-c">${T.ruutu()}</td></tr>`).join('')}</table>`;
  if (o.lahikuvat !== false) h += `<h2>${lv.harja ? 'Harjan kohta ja kulmat' : 'Kulmat'} lähikuvina<span>${t.symm ? 'oikeat kulmat ovat vasempien peilikuvat' : ''}</span></h2>
    <div class="tkk-lahi">${t.kulmat.map(k => T.paperille(k)).join('')}</div>`;
  if (o.merkinta !== false) h += `<div class="tkk-selite" style="margin-top:2mm">Merkintäpisteet seuraavalla sivulla.</div>`;
  h += `<h2>Muistiinpanot</h2><div class="tkk-viivat"></div>`;
  h += T.alaosa('Piipun työkortti · ' + o.sivu);
  return h;
}

// Palan merkintäsivu: ääriviiva numeroiduin pistein ja pistetaulukko (kuten Huuvassa)
function merkintaSivu(pa, kpl, o) {
  const T = window.KPT_TYOKORTTI, L = window.KPT_PIIPPU_LEVITYS, P = window.KPT_PELLIT, e = T.esc;
  const t = L.palaTiedot(pa), lv = t.lv;
  let h = T.ylaosaPieni({ otsikko: o.otsikko, alaotsikko: groupName, sivu: o.sivu });
  h += `<h1 class="tkk-pala">${e(pa.nimi)} · merkintä ${T.kpl(kpl)}</h1>`;
  h += `<div class="tkk-rivi"><span>Aihio <b>${t.aw} × ${t.ah} mm</b></span><span>${t.pisteita} pistettä</span><span>x ja y aihion vasemmasta alakulmasta (mm)</span></div>`;
  h += `<div class="tkk-merk-iso"><svg viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg">${P.merkintaSvgSisalto(lv.p, 520, 380, P.TEEMA_PAPERI, false, null)}</svg></div>`;
  h += `<div class="tkk-pisteet">${P.pisteTaulu(lv.p, 'tkk-pt', false)}</div>`;
  h += `<div class="tkk-selite">1. Leikkaa aihio ${t.aw} × ${t.ah} mm. 2. Merkitse pisteet mittaamalla vasemmasta alakulmasta (x oikealle, y ylös). `
    + `3. Leikkaa ääriviiva pisteestä pisteeseen järjestyksessä 1 → 2 → … → 1. 4. Vedä taitosviivat vasta leikkauksen jälkeen (taitossivu). `
    + `Katkoviivat kuvassa ovat paneelin reunat ja taitosviivat, eivät pisteitä.</div>`;
  h += T.alaosa('Piipun työkortti · ' + o.sivu);
  return h;
}

// Muokkaa piippua (vaihe 6c, 20.11.2026): avataan tilaus uuteen välilehteen, ja tilaussivu korostaa tämän piipun
// "Muokkaa piippua" -napin. Piippua ei avata suoraan, koska tallennus kulkee tilaussivun kautta.
function muokkaaPiippua() {
  try { localStorage.setItem('openOrderId', orderId); localStorage.setItem('kpt_avaa_piippu', groupName); } catch (e) { /* ei tallennusta */ }
  window.open('tilaus.html', '_blank');
}

if (window.KPT_TYOKORTTI) KPT_TYOKORTTI.asenna(rakennaPiipunTyokortti, { avain: 'kpt_tyokortti_piippu', valinnat: [
  { id: 'merkinta', teksti: 'Merkintäsivut (pisteet leikkuuseen)', oletus: true },
  { id: 'lahikuvat', teksti: 'Kulmien lähikuvat', oletus: true },
  { id: 'kansi', teksti: 'Kannen sivu (jos kanteen tulee reikiä)', oletus: true },
] });   // myös Ctrl+P tulostaa työkortin
window._authReady.then(load);
</script>
