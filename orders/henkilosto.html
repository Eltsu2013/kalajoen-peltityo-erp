<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henkilöstö — Kalajoen Peltityö</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Ulkoasuremontti R6a (26.11.2026): uusi ulkoasu (tyyli.css + teema.js). Rakenne, luokat ja skripti ennallaan,
       tyylit vain --kpt-muuttujilla. "+ Lisää työntekijä" yläpalkissa, lomake puhelimella koko ruudulle. -->
  <link rel="stylesheet" href="tyyli.css?v=2">
  <script src="teema.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <style>
    .page { max-width: 800px; }

    /* ── KORTIT ── */
    .section-label { font-family: var(--kpt-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--kpt-himmea); margin: 0 0 8px; }
    .section-label + div, #archivedList { margin-bottom: 20px; }
    .employee-card { background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna); border-radius: var(--kpt-pyoristys); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; transition: border-color 0.15s; }
    .employee-card:hover { border-color: var(--kpt-korostus); }
    .employee-card.no-click { cursor: default; }
    .employee-card.no-click:hover { border-color: var(--kpt-reuna); }
    .employee-card.archived { opacity: 0.55; }
    .employee-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .employee-name { font-weight: 600; font-size: 16px; }
    .employee-meta { font-size: 13px; color: var(--kpt-himmea); font-family: var(--kpt-mono); overflow-wrap: anywhere; }
    .badge-owner, .badge-archived { display: inline-block; vertical-align: 2px; font-size: 11px; font-family: var(--kpt-mono); font-weight: 600; padding: 1px 7px; border-radius: 999px; letter-spacing: 0.04em; }
    .badge-owner { background: var(--kpt-korostus-tausta); color: var(--kpt-korostus); }
    .badge-archived { background: color-mix(in srgb, var(--kpt-himmea) 15%, transparent); color: var(--kpt-himmea); }
    .card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .card-right span { color: var(--kpt-himmea) !important; }

    /* ── NAPIT (vanhat luokat, uusi ulkoasu) ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border-radius: 6px; cursor: pointer; font: 600 14px var(--kpt-fontti); background: transparent; color: var(--kpt-teksti); border: 1px solid var(--kpt-reuna2); }
    .btn:hover { border-color: var(--kpt-himmea); }
    .btn-accent { background: var(--kpt-korostus); color: var(--kpt-teksti-korostuksella); border-color: var(--kpt-korostus); }
    .btn-accent:hover { filter: brightness(1.08); border-color: var(--kpt-korostus); }
    .btn-danger { color: var(--kpt-virhe); border-color: color-mix(in srgb, var(--kpt-virhe) 55%, transparent); }
    .btn-danger:hover { background: color-mix(in srgb, var(--kpt-virhe) 12%, transparent); border-color: var(--kpt-virhe); }
    .btn-success { color: var(--kpt-ok); border-color: color-mix(in srgb, var(--kpt-ok) 55%, transparent); }
    .btn-success:hover { background: color-mix(in srgb, var(--kpt-ok) 12%, transparent); border-color: var(--kpt-ok); }
    .kpt-yla #addBtn { min-height: 32px; padding: 0 10px; font-size: 13px; }

    /* ── LOMAKE-IKKUNA ── */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 500; align-items: center; justify-content: center; padding: 16px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna); border-radius: var(--kpt-pyoristys); box-shadow: var(--kpt-varjo); padding: 20px; width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow-y: auto; }
    .modal h3 { font-size: 17px; margin-bottom: 16px; color: var(--kpt-korostus); }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
    .form-group label { font-size: 13px; color: var(--kpt-himmea); }
    .form-group input { width: 100%; min-height: 42px; padding: 0 10px; font: 15px var(--kpt-fontti); background: var(--kpt-kentta); color: var(--kpt-teksti); border: 1px solid var(--kpt-reuna2); border-radius: 6px; }
    .form-group input:focus { outline: none; border-color: var(--kpt-korostus); box-shadow: 0 0 0 3px var(--kpt-korostus-tausta); }
    .form-group input:disabled { opacity: 0.55; cursor: not-allowed; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .modal-actions .left { margin-right: auto; display: flex; gap: 8px; }

    .readonly-note { font-size: 12px; color: var(--kpt-himmea); font-style: italic; margin-top: 4px; }

    /* ── TYHJÄ ── */
    .empty { color: var(--kpt-himmea); text-align: center; padding: 32px; font-size: 14px; border: 1px dashed var(--kpt-reuna); border-radius: var(--kpt-pyoristys); }

    /* ── PUHELIN: lomake koko ruudulle, kentät allekkain, napit alalaidassa ── */
    @media (max-width: 700px) {
      .modal-backdrop { padding: 0; align-items: stretch; }
      .modal { max-width: none; max-height: none; height: 100%; border-radius: 0; border: 0; padding: 16px 16px 0; display: flex; flex-direction: column; }
      .form-row { grid-template-columns: 1fr; }
      .form-group input { min-height: 48px; font-size: 16px; }   /* 16 px: iPhone ei zoomaa kenttään */
      .modal-actions { position: sticky; bottom: 0; margin-top: auto; padding: 12px 0 16px; background: var(--kpt-paneeli); }
      .modal-actions .btn { min-height: 48px; flex: 1; }
      .modal-actions .left { width: 100%; margin: 0; }
      .modal-actions .left:empty, .modal-actions .left:not(:has(.btn:not([style*="none"]))) { display: none; }
      .modal-actions .left .btn { flex: 1; }
      .employee-card { padding: 12px 14px; }
    }
  </style>
</head>
<body class="kpt-sivu">
<header class="kpt-yla">
  <a class="kpt-logo" href="etusivu.html">
    <img class="kpt-vain-tumma" src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="118" height="40">
    <img class="kpt-vain-vaalea" src="logo-musta.png" alt="Kalajoen Peltityö" width="118" height="40">
  </a>
  <div class="nav-menu-wrap">
    <button class="kpt-valikko-nappi" type="button">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=5"></script>
  </div>
  <div class="kpt-otsikko"><span class="kpt-kategoria"></span><h1>Henkilöstö</h1></div>
  <div class="header-right">
    <button class="btn btn-accent" id="addBtn" style="display:none" onclick="openNew()">+ Lisää työntekijä</button>
    <button class="kpt-teema-kytkin" type="button"></button>
  </div>
</header>
<main class="kpt-sisalto page">
  <div class="section-label">Aktiiviset</div>
  <div id="activeList"><div class="empty">Ladataan...</div></div>

  <div class="section-label" id="archivedLabel" style="display:none">Arkistoidut</div>
  <div id="archivedList"></div>
</main>

<!-- MODAALI -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal">
    <h3 id="modalTitle">Työntekijä</h3>

    <div class="form-row">
      <div class="form-group">
        <label>Etunimi</label>
        <input type="text" id="fFirstName" placeholder="Etunimi">
      </div>
      <div class="form-group">
        <label>Sukunimi</label>
        <input type="text" id="fLastName" placeholder="Sukunimi">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Puhelin</label>
        <input type="tel" id="fPhone" placeholder="0401234567">
      </div>
      <div class="form-group">
        <label>Sähköposti</label>
        <input type="email" id="fEmail" placeholder="nimi@esimerkki.fi">
      </div>
    </div>
    <div class="form-group">
      <label>Tilinumero (IBAN)</label>
      <input type="text" id="fAccount" placeholder="FI12 3456 7890 1234 56">
    </div>
    <div class="form-group">
      <label>Lähiosoite</label>
      <input type="text" id="fAddress" placeholder="Esimerkkikatu 1">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Postinumero</label>
        <input type="text" id="fPostal" placeholder="85100">
      </div>
      <div class="form-group">
        <label>Postitoimipaikka</label>
        <input type="text" id="fCity" placeholder="Kalajoki">
      </div>
    </div>

    <div class="modal-actions">
      <div class="left">
        <button class="btn btn-danger" id="archiveBtn" style="display:none" onclick="archiveEmployee()">Arkistoi</button>
        <button class="btn btn-success" id="restoreBtn" style="display:none" onclick="restoreEmployee()">Palauta</button>
      </div>
      <button class="btn" onclick="closeModal()">Peruuta</button>
      <button class="btn btn-accent" id="saveBtn" onclick="saveEmployee()">Tallenna</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hjyeugeqmyavxisndlwp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4';

let employees  = [];
let isOwner    = false;
let currentUserId = null;
let editingId  = null;
let authToken  = null;

window._authReady.then(async session => {
  // auth-guard.js palauttaa session suoraan tai datan sisällä — kokeillaan molemmat
  const s = session?.data?.session ?? session?.session ?? session;
  authToken     = s?.access_token ?? session?.data?.session?.access_token;
  currentUserId = s?.user?.id     ?? session?.data?.session?.user?.id;
  await loadEmployees();
});

function getHeaders() {
  const h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
  if (authToken) h['Authorization'] = 'Bearer ' + authToken;
  return h;
}

async function loadEmployees() {
  const res  = await fetch(`${SUPABASE_URL}/rest/v1/employees?order=employee_number`, { headers: getHeaders() });
  employees  = await res.json();

  // Tarkistetaan onko kirjautunut käyttäjä omistaja
  // Ensin auth_user_id:llä, varmuudeksi myös is_owner-kentällä suoraan
  const me = employees.find(e => e.auth_user_id === currentUserId);
  isOwner  = me?.is_owner ?? false;

  // Jos auth_user_id-linkitys puuttuu mutta käyttäjä on kirjautunut,
  // tarkistetaan onko kukaan is_owner=true ilman auth_user_id:tä ja yritetään linkittää
  if (!isOwner && currentUserId) {
    const unlinkedOwner = employees.find(e => e.is_owner && !e.auth_user_id);
    if (unlinkedOwner) {
      // Linkitetään automaattisesti
      await fetch(`${SUPABASE_URL}/rest/v1/employees?id=eq.${unlinkedOwner.id}`, {
        method: 'PATCH',
        headers: { ...getHeaders(), 'Prefer': 'return=representation' },
        body: JSON.stringify({ auth_user_id: currentUserId })
      });
      isOwner = true;
    }
  }

  // Omistaja näkee lisäysnapin
  if (isOwner) document.getElementById('addBtn').style.display = 'inline-block';

  renderList();
}

function renderList() {
  const active   = employees.filter(e => e.is_active);
  const archived = employees.filter(e => !e.is_active);

  document.getElementById('activeList').innerHTML =
    active.length ? active.map(cardHTML).join('') : '<div class="empty">Ei aktiivisia työntekijöitä</div>';

  if (archived.length) {
    document.getElementById('archivedLabel').style.display = 'block';
    document.getElementById('archivedList').innerHTML = archived.map(cardHTML).join('');
  } else {
    document.getElementById('archivedLabel').style.display = 'none';
    document.getElementById('archivedList').innerHTML = '';
  }
}

function cardHTML(emp) {
  const badges = [];
  if (emp.is_owner)  badges.push('<span class="badge-owner">Omistaja</span>');
  if (!emp.is_active) badges.push('<span class="badge-archived">Arkistoitu</span>');

  const meta = [emp.email, emp.phone].filter(Boolean).join(' · ');
  const canEdit = isOwner || emp.auth_user_id === currentUserId;

  return `<div class="employee-card${emp.is_active ? '' : ' archived'}${canEdit ? '' : ' no-click'}" ${canEdit ? `onclick="openEdit('${emp.id}')"` : ''}>
    <div class="employee-info">
      <div class="employee-name">${emp.name} ${badges.join(' ')}</div>
      ${meta ? `<div class="employee-meta">${meta}</div>` : ''}
    </div>
    <div class="card-right">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)">#${emp.employee_number}</span>
    </div>
  </div>`;
}

// ── MODAALI ──
function openNew() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Uusi työntekijä';
  clearForm();
  setFormDisabled(false);
  document.getElementById('archiveBtn').style.display = 'none';
  document.getElementById('restoreBtn').style.display = 'none';
  document.getElementById('saveBtn').style.display    = 'inline-block';
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('fFirstName').focus();
}

function openEdit(id) {
  const emp = employees.find(e => e.id === id);
  if (!emp) return;

  const canEdit = isOwner || emp.auth_user_id === currentUserId;
  editingId = id;

  // Nimi on tallennettu yhtenä kenttänä — jaetaan etu/sukunimeen välilyönnistä
  const parts = (emp.name || '').split(' ');
  const lastName  = parts.pop() || '';
  const firstName = parts.join(' ');

  document.getElementById('modalTitle').textContent = emp.name;
  document.getElementById('fFirstName').value = firstName;
  document.getElementById('fLastName').value  = lastName;
  document.getElementById('fPhone').value     = emp.phone || '';
  document.getElementById('fEmail').value     = emp.email || '';
  document.getElementById('fAccount').value   = emp.account_number || '';
  document.getElementById('fAddress').value   = emp.address || '';
  document.getElementById('fPostal').value    = emp.postal_code || '';
  document.getElementById('fCity').value      = emp.city || '';

  setFormDisabled(!canEdit);
  document.getElementById('saveBtn').style.display    = canEdit ? 'inline-block' : 'none';
  document.getElementById('archiveBtn').style.display = (canEdit && isOwner && emp.is_active && !emp.is_owner) ? 'inline-block' : 'none';
  document.getElementById('restoreBtn').style.display = (canEdit && isOwner && !emp.is_active) ? 'inline-block' : 'none';

  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalBackdrop')) return;
  document.getElementById('modalBackdrop').classList.remove('open');
  editingId = null;
}

function clearForm() {
  ['fFirstName','fLastName','fPhone','fEmail','fAccount','fAddress','fPostal','fCity']
    .forEach(id => document.getElementById(id).value = '');
}

function setFormDisabled(disabled) {
  ['fFirstName','fLastName','fPhone','fEmail','fAccount','fAddress','fPostal','fCity']
    .forEach(id => document.getElementById(id).disabled = disabled);
}

async function saveEmployee() {
  const firstName = document.getElementById('fFirstName').value.trim();
  const lastName  = document.getElementById('fLastName').value.trim();
  if (!firstName && !lastName) { alert('Anna nimi'); return; }

  const name = [firstName, lastName].filter(Boolean).join(' ');

  const payload = {
    name:           name,
    phone:          document.getElementById('fPhone').value.trim() || null,
    email:          document.getElementById('fEmail').value.trim() || null,
    account_number: document.getElementById('fAccount').value.trim() || null,
    address:        document.getElementById('fAddress').value.trim() || null,
    postal_code:    document.getElementById('fPostal').value.trim() || null,
    city:           document.getElementById('fCity').value.trim() || null,
  };

  let res;
  if (editingId) {
    res = await fetch(`${SUPABASE_URL}/rest/v1/employees?id=eq.${editingId}`, {
      method: 'PATCH',
      headers: { ...getHeaders(), 'Prefer': 'return=representation' },
      body: JSON.stringify(payload)
    });
  } else {
    // Haetaan seuraava employee_number
    const maxNum = employees.reduce((m, e) => Math.max(m, e.employee_number), 0);
    payload.employee_number = maxNum + 1;
    payload.is_active = true;
    res = await fetch(`${SUPABASE_URL}/rest/v1/employees`, {
      method: 'POST',
      headers: { ...getHeaders(), 'Prefer': 'return=representation' },
      body: JSON.stringify(payload)
    });
  }

  if (res.ok) {
    document.getElementById('modalBackdrop').classList.remove('open');
    await loadEmployees();
  } else {
    const err = await res.json();
    alert('Virhe: ' + (err.message || JSON.stringify(err)));
  }
}

async function archiveEmployee() {
  if (!confirm('Arkistoidaanko työntekijä? Tuntihistoria säilyy.')) return;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/employees?id=eq.${editingId}`, {
    method: 'PATCH',
    headers: { ...getHeaders(), 'Prefer': 'return=representation' },
    body: JSON.stringify({ is_active: false })
  });
  if (res.ok) {
    document.getElementById('modalBackdrop').classList.remove('open');
    await loadEmployees();
  }
}

async function restoreEmployee() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/employees?id=eq.${editingId}`, {
    method: 'PATCH',
    headers: { ...getHeaders(), 'Prefer': 'return=representation' },
    body: JSON.stringify({ is_active: true })
  });
  if (res.ok) {
    document.getElementById('modalBackdrop').classList.remove('open');
    await loadEmployees();
  }
}

</script>
</body>
</html>
