<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etusivu — Kalajoen Peltityö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
  :root{
    --bg: #1e2a30;
    --bg-panel: #253540;
    --bg-card: #2b3d48;
    --bg-dim: #1a2429;
    --border: #374b56;
    --text: #e8edf0;
    --text-dim: #9fb0b8;
    --accent: #14b8a6;
    --accent-dim: #0d9488;
    --accent-glow: rgba(20,184,166,0.15);
    --danger: #ef4444;
    --danger-glow: rgba(239,68,68,0.12);
    --warn: #e8a020;
    --warn-glow: rgba(232,160,32,0.12);
    --stale: #8b9aa5;
    --stale-glow: rgba(139,154,165,0.10);
    --high: #ef4444;
    --normal: #eab308;
    --low: #22c55e;
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }

  /* HEADER — sama rakenne kuin muilla sivuilla */
  header {
    background: #241e30;
    border-bottom: 2px solid var(--accent);
    padding: 10px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 500; color: var(--text); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .nav-menu-wrap { position: relative; }
  .nav-btn {
    background: #3a3545; border: 1px solid #585568;
    color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; letter-spacing: 0.04em;
  }
  .nav-btn:hover { background: #4a4558; }
  .nav-dropdown {
    display: none; position: absolute; top: calc(100% + 6px); left: 0;
    background: #3a3545; border: 1px solid var(--border);
    border-radius: 6px; min-width: 200px; z-index: 999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); overflow: hidden;
  }
  .nav-dropdown.open { display: block; }
  .nav-section-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); padding: 8px 14px 4px;
  }
  .nav-item {
    display: block; width: 100%; text-align: left;
    padding: 8px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--text); background: none;
    border: none; cursor: pointer; text-decoration: none;
    transition: background 0.1s;
  }
  .nav-item:hover { background: var(--accent-glow); color: var(--accent); }
  .nav-item.current { color: var(--accent); font-weight: 600; }
  .nav-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  main{max-width:1280px;margin:0 auto;padding:20px;}

  section{margin-bottom:28px;}
  .section-title{
    font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text-dim);margin-bottom:10px;font-family:'IBM Plex Mono',monospace;
    display:flex;align-items:center;justify-content:space-between;
  }
  .section-title a{color:var(--accent);text-decoration:none;font-size:12px;}
  .section-title a:hover{text-decoration:underline;}

  /* ---------- Pikanapit ---------- */
  .quick-actions{display:flex;flex-wrap:wrap;gap:8px;}
  .qa-btn{
    flex:1;min-width:100px;
    background:var(--bg-card);border:1px solid var(--border);color:var(--text);
    padding:11px 8px;border-radius:6px;text-decoration:none;
    display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
    transition:border-color .15s,transform .1s;
  }
  .qa-btn:hover{border-color:var(--accent);transform:translateY(-1px);}
  .qa-btn .qa-icon{font-size:18px;}
  .qa-btn .qa-label{font-weight:600;font-size:12px;}
  .qa-btn.primary{background:var(--accent);border-color:var(--accent);color:#0a1e1c;}
  .qa-btn.primary:hover{background:var(--accent-dim);}

  /* ---------- Status-kortit ---------- */
  .status-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;
  }
  .status-card{
    background:var(--bg-card);border:1px solid var(--border);border-radius:6px;
    padding:12px;text-align:center;cursor:pointer;text-decoration:none;color:var(--text);
    transition:border-color .15s;
  }
  .status-card:hover{border-color:var(--accent);}
  .status-count{font-size:22px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .status-name{font-size:11px;color:var(--text-dim);margin-top:2px;}

  /* ---------- Vaatii toimenpiteitä ---------- */
  .action-list{
    display:grid;grid-template-columns:1fr;gap:8px;
    align-items:start;
  }
  @media (min-width:640px){
    .action-list{grid-template-columns:1fr 1fr;}
  }
  @media (min-width:1000px){
    .action-list{grid-template-columns:1fr 1fr 1fr;}
  }
  /* Alaotsikot ("🔴 Myöhässä" jne.) vievät aina koko leveyden, jotta ne toimivat
     selkeinä väliotsikkoina eivätkä vain yhtenä ruudukon soluna muiden joukossa. */
  .action-subgroup-label{grid-column:1 / -1;}
  .action-item{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-card);border-left:3px solid var(--border);border-radius:var(--radius);
    padding:10px 14px;text-decoration:none;color:var(--text);
    transition:background .1s;
  }
  .action-item:hover{filter:brightness(1.15);}
  .action-item.overdue{border-left-color:var(--danger);background:linear-gradient(90deg, var(--danger-glow), var(--bg-card) 20%);}
  .action-item.unbilled{border-left-color:var(--warn);background:linear-gradient(90deg, var(--warn-glow), var(--bg-card) 20%);}
  .action-item.stale{border-left-color:var(--stale);background:linear-gradient(90deg, var(--stale-glow), var(--bg-card) 20%);}
  .action-icon{font-size:16px;flex-shrink:0;}
  .action-body{flex:1;min-width:0;}
  .action-name{font-weight:600;font-size:14px;}
  .action-meta{font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .action-subgroup-label{
    font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;
    margin:14px 0 6px;font-family:'IBM Plex Mono',monospace;
  }
  .action-subgroup-label:first-child{margin-top:0;}
  .all-clear{
    grid-column:1 / -1;
    background:var(--bg-card);border:1px dashed var(--border);border-radius:var(--radius);
    padding:20px;text-align:center;color:var(--text-dim);font-size:14px;
  }

  /* ---------- Agenda ---------- */
  #agendaList{
    display:grid;grid-template-columns:1fr;gap:8px;align-items:start;
  }
  @media (min-width:640px){
    #agendaList{grid-template-columns:1fr 1fr;}
  }
  @media (min-width:1000px){
    #agendaList{grid-template-columns:1fr 1fr 1fr;}
  }
  .day-row{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--bg-card);border-radius:var(--radius);
    border-left:3px solid transparent;
    padding:10px 14px;margin-bottom:0;
  }
  .day-row.today{border-left-color:var(--accent);background:var(--accent-glow);}
  .day-row.empty-day{opacity:.5;}
  .day-label{
    flex-shrink:0;width:78px;font-family:'IBM Plex Mono',monospace;
    display:flex;flex-direction:column;line-height:1.3;padding-top:2px;
  }
  .day-name{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}
  .day-num{font-size:15px;font-weight:600;}
  .day-row.today .day-num{color:var(--accent);}
  .day-tags{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
  .day-empty{color:var(--text-dim);font-size:13px;flex:1;padding-top:3px;}
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:12px;font-size:12px;
    text-decoration:none;border:1px solid transparent;line-height:1.2;
  }
  .tag-order{cursor:pointer;font-weight:600;}
  .tag-order .tag-status{font-size:10px;font-weight:400;opacity:.8;font-family:'IBM Plex Mono',monospace;}
  .event-draft{background:#333340;color:var(--text-dim);}
  .event-active{background:#0e2535;color:#0ea5e9;}
  .event-quoted{background:#1e1535;color:#a855f7;}
  .event-production{background:#2a2010;color:#e8a020;}
  .event-done{background:#1a3028;color:#3dba6e;}
  .event-invoiced{background:#1a3028;color:#3dba6e;}
  .event-archived{background:#2a2a2a;color:#666;}
  .tag-todo{background:var(--bg-panel);color:var(--text);border-left:3px solid var(--normal);}
  .tag-todo.prio-high{border-left-color:var(--high);}
  .tag-todo.prio-normal{border-left-color:var(--normal);}
  .tag-todo.prio-low{border-left-color:var(--low);}
  .tag-todo.is-done{opacity:.5;text-decoration:line-through;}

  .loading{grid-column:1 / -1;color:var(--text-dim);font-size:13px;padding:10px 0;}

  @media (max-width:640px){
    main{padding:14px;}
    .qa-btn{min-width:100%;}
    .day-row{flex-direction:column;gap:6px;}
    .day-label{flex-direction:row;gap:8px;width:auto;align-items:baseline;}
  }

    /* Valikko mahtuu ruudulle: pitkä lista vierittyy (17.11.2026) */
    #navDropdown, #navDropdownLasku { max-height: calc(100vh - 90px); overflow-y: auto; }
  </style>
</head>
<body>

<header>
  <div class="logo-img" style="height:50px;display:flex;align-items:center"><img src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="147" height="50" style="height:50px;width:auto;display:block"></div>
  <div class="nav-menu-wrap">
    <button class="nav-btn" onclick="toggleNav(event)">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=3"></script>
  </div>
  <h1>Etusivu</h1>
</header>

<main>

  <section>
    <div class="quick-actions">
      <a class="qa-btn primary" href="tilaus.html">
        <span class="qa-icon">✏️</span>
        <span class="qa-label">Uusi tilaus</span>
      </a>
      <a class="qa-btn" href="asiakkaat.html">
        <span class="qa-icon">👤</span>
        <span class="qa-label">Uusi asiakas</span>
      </a>
      <a class="qa-btn" href="tilaukset.html">
        <span class="qa-icon">📋</span>
        <span class="qa-label">Tilaukset</span>
      </a>
      <a class="qa-btn" href="tuotanto.html">
        <span class="qa-icon">⚙️</span>
        <span class="qa-label">Tuotanto</span>
      </a>
      <a class="qa-btn" href="ajanseuranta.html">
        <span class="qa-icon">⏲</span>
        <span class="qa-label">Ajanseuranta</span>
      </a>
    </div>
  </section>


  <section>
    <div class="section-title">Tilauskanta</div>
    <div class="status-grid" id="statusGrid">
      <div class="loading">Ladataan…</div>
    </div>
  </section>

  <section>
    <div class="section-title">⚠️ Vaatii toimenpiteitä</div>
    <div class="action-list" id="actionList">
      <div class="loading">Ladataan…</div>
    </div>
  </section>

  <section>
    <div class="section-title">
      Lähipäivät
      <a href="kalenteri.html">Avaa koko kalenteri →</a>
    </div>
    <div id="agendaList">
      <div class="loading">Ladataan…</div>
    </div>
  </section>

</main>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://hjyeugeqmyavxisndlwp.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4";

  const STATUS_FI = {
    DRAFT: 'Luonnos', IN_PROGRESS: 'Kesken', QUOTED: 'Tarjottu',
    ORDERED: 'Tilattu', IN_PRODUCTION: 'Työn alla',
    COMPLETED: 'Valmis', INVOICED: 'Laskutettu', ARCHIVED: 'Arkisto'
  };
  const STATUS_ORDER = ['DRAFT','IN_PROGRESS','QUOTED','ORDERED','IN_PRODUCTION','COMPLETED','INVOICED','ARCHIVED'];
  const STATUS_CLASS = {
    DRAFT: 'draft', IN_PROGRESS: 'active', QUOTED: 'quoted',
    ORDERED: 'active', IN_PRODUCTION: 'production',
    COMPLETED: 'done', INVOICED: 'invoiced', ARCHIVED: 'archived'
  };
  const OVERDUE_DAYS = 14; // 2 viikkoa — kuinka monta päivää toimituspäivän jälkeen tilaus lasketaan "myöhässä"-listalle
  const OVERDUE_STATUSES = ['IN_PROGRESS', 'QUOTED', 'ORDERED', 'IN_PRODUCTION'];
  const STALE_DRAFT_DAYS = 14; // 2 viikkoa
  const AGENDA_DAYS = 7;
  const DAYS_SHORT_FI = ['Su','Ma','Ti','Ke','To','Pe','La'];

  // ---------- Nav-valikko ----------
  window.toggleNav = function(e){
    e.stopPropagation();
    document.getElementById("navDropdown").classList.toggle("open");
  };
  document.addEventListener("click", function(){
    document.getElementById("navDropdown").classList.remove("open");
  });

  // ---------- Auth helpers ----------
  async function getAuthHeaders(){
    const session = await window.getAuthSession();
    const token = session && session.data && session.data.session
      ? session.data.session.access_token
      : null;
    return {
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + (token || ANON_KEY),
      "Content-Type": "application/json"
    };
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function pad2(n){ return String(n).padStart(2, "0"); }
  function dateKey(y, m, d){ return y + "-" + pad2(m+1) + "-" + pad2(d); }
  function todayISO(){
    const d = new Date();
    return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function fmtDateFi(dateStr){
    if(!dateStr) return "—";
    const p = dateStr.split("-");
    return parseInt(p[2],10) + "." + parseInt(p[1],10) + "." + p[0];
  }
  function daysBetween(dateStr, todayStr){
    const a = new Date(dateStr + "T00:00:00");
    const b = new Date(todayStr + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }

  // ---------- Data ----------
  async function loadDashboard(){
    try{
      const headers = await getAuthHeaders();
      const todayStr = todayISO();
      const agendaEnd = new Date();
      agendaEnd.setDate(agendaEnd.getDate() + (AGENDA_DAYS - 1));
      const agendaEndStr = dateKey(agendaEnd.getFullYear(), agendaEnd.getMonth(), agendaEnd.getDate());

      const ordersUrl = SUPABASE_URL + "/rest/v1/orders?select=id,order_date,delivery_date,status,kohde,customers(name)&order=order_date.desc";
      const todosUrl = SUPABASE_URL + "/rest/v1/todos?select=*&due_date=gte." + todayStr + "&due_date=lte." + agendaEndStr + "&order=due_date.asc";

      const [ordersRes, todosRes] = await Promise.all([
        fetch(ordersUrl, { headers: headers }),
        fetch(todosUrl, { headers: headers })
      ]);
      if(!ordersRes.ok || !todosRes.ok) throw new Error("Haku epäonnistui");

      const orders = await ordersRes.json();
      const todos = await todosRes.json();

      renderStatusGrid(orders);
      renderActionList(orders, todayStr);
      renderAgenda(orders, todos, todayStr);
    }catch(err){
      console.error(err);
      document.getElementById("statusGrid").innerHTML = '<div class="loading">Lataus epäonnistui</div>';
      document.getElementById("actionList").innerHTML = '<div class="loading">Lataus epäonnistui</div>';
      document.getElementById("agendaList").innerHTML = '<div class="loading">Lataus epäonnistui</div>';
    }
  }

  // ---------- Status-kortit ----------
  function renderStatusGrid(orders){
    const counts = {};
    STATUS_ORDER.forEach(function(s){ counts[s] = 0; });
    orders.forEach(function(o){
      if(counts.hasOwnProperty(o.status)) counts[o.status]++;
    });

    const html = STATUS_ORDER.map(function(s){
      return '<a class="status-card" href="tilaukset.html?filter=' + s + '">'
        + '<div class="status-count">' + counts[s] + '</div>'
        + '<div class="status-name">' + STATUS_FI[s] + '</div>'
        + '</a>';
    }).join("");

    document.getElementById("statusGrid").innerHTML = html;
  }

  // ---------- Vaatii toimenpiteitä ----------
  function renderActionList(orders, todayStr){
    const overdue = orders.filter(function(o){
      if(!o.delivery_date) return false;
      if(OVERDUE_STATUSES.indexOf(o.status) === -1) return false;
      return daysBetween(o.delivery_date, todayStr) > OVERDUE_DAYS;
    }).sort(function(a,b){ return a.delivery_date < b.delivery_date ? -1 : 1; });

    const unbilled = orders.filter(function(o){
      return o.status === 'COMPLETED';
    }).sort(function(a,b){
      const da = a.delivery_date || a.order_date || "";
      const db = b.delivery_date || b.order_date || "";
      return da < db ? -1 : 1;
    });

    const stale = orders.filter(function(o){
      if(o.status !== 'DRAFT' || !o.order_date) return false;
      return daysBetween(o.order_date, todayStr) > STALE_DRAFT_DAYS;
    }).sort(function(a,b){ return a.order_date < b.order_date ? -1 : 1; });

    let html = "";

    if(overdue.length){
      html += '<div class="action-subgroup-label">🔴 Myöhässä (' + overdue.length + ')</div>';
      html += overdue.map(function(o){
        const name = (o.customers && o.customers.name) ? o.customers.name : (o.kohde || "Tilaus");
        const daysLate = daysBetween(o.delivery_date, todayStr);
        const meta = "Toimitus oli " + daysLate + " pv sitten (" + fmtDateFi(o.delivery_date) + ")";
        return '<a class="action-item overdue" href="tilaukset.html?id=' + o.id + '">'
          + '<span class="action-icon">⏰</span>'
          + '<div class="action-body"><div class="action-name">' + escapeHtml(name) + '</div><div class="action-meta">' + meta + '</div></div>'
          + '</a>';
      }).join("");
    }

    if(unbilled.length){
      html += '<div class="action-subgroup-label">💰 Valmis, ei laskutettu (' + unbilled.length + ')</div>';
      html += unbilled.map(function(o){
        const name = (o.customers && o.customers.name) ? o.customers.name : (o.kohde || "Tilaus");
        const meta = o.delivery_date ? ("Toimitettu " + fmtDateFi(o.delivery_date)) : ("Tilattu " + fmtDateFi(o.order_date));
        return '<a class="action-item unbilled" href="tilaukset.html?id=' + o.id + '">'
          + '<span class="action-icon">💰</span>'
          + '<div class="action-body"><div class="action-name">' + escapeHtml(name) + '</div><div class="action-meta">' + meta + '</div></div>'
          + '</a>';
      }).join("");
    }

    if(stale.length){
      html += '<div class="action-subgroup-label">📝 Luonnos yli 2 viikkoa (' + stale.length + ')</div>';
      html += stale.map(function(o){
        const name = (o.customers && o.customers.name) ? o.customers.name : (o.kohde || "Tilaus");
        const age = daysBetween(o.order_date, todayStr);
        const meta = "Luotu " + fmtDateFi(o.order_date) + " (" + age + " pv sitten)";
        return '<a class="action-item stale" href="tilaukset.html?id=' + o.id + '">'
          + '<span class="action-icon">📝</span>'
          + '<div class="action-body"><div class="action-name">' + escapeHtml(name) + '</div><div class="action-meta">' + meta + '</div></div>'
          + '</a>';
      }).join("");
    }

    if(!overdue.length && !unbilled.length && !stale.length){
      html = '<div class="all-clear">✅ Ei toimenpiteitä juuri nyt — hyvä homma!</div>';
    }

    document.getElementById("actionList").innerHTML = html;
  }

  // ---------- Agenda ----------
  function orderTagHtml(o){
    const cls = STATUS_CLASS[o.status] || "draft";
    const fi = STATUS_FI[o.status] || o.status;
    const name = (o.customers && o.customers.name) ? o.customers.name : (o.kohde || "Tilaus");
    return '<a class="tag tag-order event-' + cls + '" href="tilaukset.html?id=' + o.id + '">'
      + '📋 ' + escapeHtml(name)
      + ' <span class="tag-status">' + fi + '</span>'
      + '</a>';
  }
  function todoTagHtml(t){
    const prio = t.priority || "normal";
    const doneClass = t.is_done ? " is-done" : "";
    return '<span class="tag tag-todo prio-' + prio + doneClass + '">'
      + (t.is_done ? "✓ " : "✅ ") + escapeHtml(t.title)
      + '</span>';
  }

  function renderAgenda(orders, todos, todayStr){
    const ordersByDate = {};
    orders.forEach(function(o){
      const key = (o.delivery_date || "").slice(0,10);
      if(!key) return;
      if(!ordersByDate[key]) ordersByDate[key] = [];
      ordersByDate[key].push(o);
    });
    const todosByDate = {};
    todos.forEach(function(t){
      const key = (t.due_date || "").slice(0,10);
      if(!key) return;
      if(!todosByDate[key]) todosByDate[key] = [];
      todosByDate[key].push(t);
    });

    const now = new Date();
    let html = "";
    for(let i = 0; i < AGENDA_DAYS; i++){
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
      const key = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      const dow = d.getDay();
      const isToday = (key === todayStr);
      const dayOrders = ordersByDate[key] || [];
      const dayTodos = todosByDate[key] || [];
      const hasItems = dayOrders.length || dayTodos.length;

      let classes = "day-row";
      if(isToday) classes += " today";
      if(!hasItems) classes += " empty-day";

      const tagsHtml = hasItems
        ? '<div class="day-tags">' + dayOrders.map(orderTagHtml).join("") + dayTodos.map(todoTagHtml).join("") + '</div>'
        : '<div class="day-empty">—</div>';

      const label = isToday ? "Tänään" : DAYS_SHORT_FI[dow];

      html += '<div class="' + classes + '">'
        + '<div class="day-label"><span class="day-name">' + label + '</span><span class="day-num">' + d.getDate() + '.' + (d.getMonth()+1) + '.</span></div>'
        + tagsHtml
        + '</div>';
    }

    document.getElementById("agendaList").innerHTML = html;
  }

  // ---------- Init ----------
  window._authReady.then(function(){
    loadDashboard();
  });

})();
</script>
