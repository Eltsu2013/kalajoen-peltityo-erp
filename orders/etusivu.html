<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etusivu — Kalajoen Peltityö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Etusivu uudessa ulkoasussa (ulkoasuremontti R3a, 26.11.2026, suunnitelma projektin claude/ulkoasu_remontti_suunnitelma.md
     kohta 2): Tuotanto isona ylhäällä, pikanapit, kategoriaruudut valikosta (window.KPT_VALIKKO, joten uusi sivu
     ilmestyy tänne itsestään) ja tilannekuva kuten ennen. Sivun omissa tyyleissä vain --kpt-muuttujia. -->
<link rel="stylesheet" href="tyyli.css?v=2">
<script src="teema.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
  /* ---------- Asettelu: tietokoneella kaksi saraketta (vasemmalla napit ja ruudut, oikealla tilannekuva) ---------- */
  .etu-ruudukko { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; }
  @media (min-width: 1000px) { .etu-ruudukko { grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 28px; } }
  .etu-sarake { min-width: 0; }
  .etu-sarake > section { margin-bottom: 24px; }
  /* Puhelimella ja tabletilla yksi pino: tilannekuva ennen sivuruutuja (sivut löytyvät myös valikosta) */
  @media (max-width: 999px) {
    .etu-ruudukko { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
    .etu-sarake { display: contents; }
    .etu-ruudukko section { margin-bottom: 22px; }
    .o-tuotanto { order: 1; } .o-pika { order: 2; } .o-kanta { order: 3; } .o-toimet { order: 4; } .o-paivat { order: 5; } .o-sivut { order: 6; }
  }
  .osio-otsikko {
    font-family: var(--kpt-mono); font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--kpt-himmea); margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .osio-otsikko a { color: var(--kpt-himmea); text-decoration: none; letter-spacing: .04em; }
  .osio-otsikko a:hover { color: var(--kpt-teksti); text-decoration: underline; }

  /* ---------- Tuotanto isona ---------- */
  .tuotanto-iso {
    display: flex; align-items: center; gap: 16px; text-decoration: none !important;
    background: color-mix(in srgb, var(--kpt-v-tuotanto) 14%, var(--kpt-paneeli));
    border: 1px solid color-mix(in srgb, var(--kpt-v-tuotanto) 45%, var(--kpt-reuna));
    border-left: 6px solid var(--kpt-v-tuotanto); border-radius: var(--kpt-pyoristys);
    padding: 18px 20px; color: var(--kpt-teksti) !important; transition: transform .1s, border-color .15s;
  }
  .tuotanto-iso:hover { transform: translateY(-1px); border-color: var(--kpt-v-tuotanto); }
  .tuotanto-iso .ikoni { font-size: 34px; line-height: 1; }
  .tuotanto-iso .teksti { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tuotanto-iso .nimi { font-size: 22px; font-weight: 600; color: var(--kpt-v-tuotanto); line-height: 1.2; }
  .tuotanto-iso .tila { font-family: var(--kpt-mono); font-size: 13px; color: var(--kpt-himmea); margin-top: 4px; }
  .tuotanto-iso .tila b { color: var(--kpt-teksti); font-weight: 600; }
  .tuotanto-iso .nuoli { font-size: 22px; color: var(--kpt-v-tuotanto); }

  /* ---------- Pikanapit (väri = sivun kategoria) ---------- */
  .pikanapit { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .pikanappi {
    --v: var(--kpt-v-neutraali);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center;
    min-height: 74px; padding: 10px 6px; border-radius: var(--kpt-pyoristys); text-decoration: none !important;
    background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna); border-top: 3px solid var(--v);
    color: var(--kpt-teksti) !important; transition: transform .1s, border-color .15s;
  }
  .pikanappi:hover { transform: translateY(-1px); border-color: var(--v); }
  .pikanappi .ikoni { font-size: 22px; line-height: 1; }
  .pikanappi .nimi { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .pikanappi.ensisijainen { background: var(--v); border-color: var(--v); color: var(--kpt-teksti-korostuksella) !important; }

  /* ---------- Kategoriaruudut (luetaan valikosta) ---------- */
  .kategoriat { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 10px; }
  .kat-ruutu {
    --v: var(--kpt-v-neutraali);
    background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna); border-left: 4px solid var(--v);
    border-radius: var(--kpt-pyoristys); padding: 12px 14px 10px;
  }
  .kat-ruutu h2 {
    font-family: var(--kpt-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--v); margin: 0 0 6px !important;
  }
  .kat-ruutu a {
    display: block; padding: 7px 8px; margin: 0 -8px; border-radius: 6px; font-size: 14px;
    color: var(--kpt-teksti) !important; text-decoration: none;
  }
  .kat-ruutu a:hover { background: color-mix(in srgb, var(--v) 14%, transparent); }
  .kat-ruutu[data-kat="tilaukset"], .pikanappi[data-kat="tilaukset"] { --v: var(--kpt-v-tilaukset); }
  .kat-ruutu[data-kat="mallisto"],  .pikanappi[data-kat="mallisto"]  { --v: var(--kpt-v-mallisto); }
  .kat-ruutu[data-kat="varasto"],   .pikanappi[data-kat="varasto"]   { --v: var(--kpt-v-varasto); }
  .kat-ruutu[data-kat="ajat"],      .pikanappi[data-kat="ajat"]      { --v: var(--kpt-v-ajat); }
  .kat-ruutu[data-kat="toimisto"],  .pikanappi[data-kat="toimisto"]  { --v: var(--kpt-v-toimisto); }

  /* ---------- Tilauskanta ---------- */
  .status-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .status-card {
    background: var(--kpt-paneeli); border: 1px solid var(--kpt-reuna); border-radius: var(--kpt-pyoristys);
    padding: 10px 6px; text-align: center; text-decoration: none !important; color: var(--kpt-teksti) !important;
    transition: border-color .15s;
  }
  .status-card:hover { border-color: var(--kpt-v-tilaukset); }
  .status-card.nolla { opacity: .55; }
  .status-count { font-size: 22px; font-weight: 600; font-family: var(--kpt-mono); line-height: 1.2; }
  .status-name { font-size: 11.5px; color: var(--kpt-himmea); margin-top: 2px; }

  /* ---------- Vaatii toimenpiteitä ---------- */
  .action-list { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: start; }
  @media (min-width: 640px) and (max-width: 999px) { .action-list { grid-template-columns: 1fr 1fr; } }
  /* Alaotsikot ("🔴 Myöhässä" jne.) vievät aina koko leveyden */
  .action-subgroup-label {
    grid-column: 1 / -1; font-size: 11px; color: var(--kpt-himmea); text-transform: uppercase; letter-spacing: .05em;
    margin: 10px 0 0; font-family: var(--kpt-mono);
  }
  .action-subgroup-label:first-child { margin-top: 0; }
  .action-item {
    --v: var(--kpt-reuna);
    display: flex; align-items: center; gap: 12px; text-decoration: none !important; color: var(--kpt-teksti) !important;
    background: linear-gradient(90deg, color-mix(in srgb, var(--v) 14%, transparent), transparent 30%), var(--kpt-paneeli);
    border: 1px solid var(--kpt-reuna); border-left: 3px solid var(--v); border-radius: 6px; padding: 10px 14px;
  }
  .action-item:hover { border-color: var(--v); }
  .action-item.overdue  { --v: var(--kpt-virhe); }
  .action-item.unbilled { --v: var(--kpt-huom); }
  .action-item.stale    { --v: var(--kpt-heikko); }
  .action-icon { font-size: 16px; flex-shrink: 0; }
  .action-body { flex: 1; min-width: 0; }
  .action-name { font-weight: 600; font-size: 14px; }
  .action-meta { font-size: 12px; color: var(--kpt-himmea); font-family: var(--kpt-mono); margin-top: 2px; }
  .all-clear {
    grid-column: 1 / -1; background: var(--kpt-paneeli); border: 1px dashed var(--kpt-reuna); border-radius: 6px;
    padding: 18px; text-align: center; color: var(--kpt-himmea); font-size: 14px;
  }

  /* ---------- Lähipäivät ---------- */
  #agendaList { display: grid; grid-template-columns: 1fr; gap: 6px; align-items: start; }
  @media (min-width: 640px) and (max-width: 999px) { #agendaList { grid-template-columns: 1fr 1fr; } }
  .day-row {
    display: flex; gap: 14px; align-items: flex-start; background: var(--kpt-paneeli);
    border: 1px solid var(--kpt-reuna); border-left: 3px solid transparent; border-radius: 6px; padding: 9px 14px;
  }
  .day-row.today { border-left-color: var(--kpt-v-tuotanto); background: color-mix(in srgb, var(--kpt-v-tuotanto) 10%, var(--kpt-paneeli)); }
  .day-row.empty-day { opacity: .55; padding-top: 6px; padding-bottom: 6px; }
  .day-label { flex-shrink: 0; width: 78px; font-family: var(--kpt-mono); display: flex; flex-direction: column; line-height: 1.3; padding-top: 2px; }
  .day-name { font-size: 11px; color: var(--kpt-himmea); text-transform: uppercase; letter-spacing: .05em; }
  .day-num { font-size: 15px; font-weight: 600; }
  .day-row.today .day-num { color: var(--kpt-v-tuotanto); }
  .day-tags { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .day-empty { color: var(--kpt-himmea); font-size: 13px; flex: 1; padding-top: 3px; }
  .tag {
    --v: var(--kpt-himmea);
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 12px; font-size: 12px;
    text-decoration: none !important; line-height: 1.2; color: var(--v) !important;
    background: color-mix(in srgb, var(--v) 15%, transparent); border: 1px solid color-mix(in srgb, var(--v) 30%, transparent);
  }
  .tag-order { font-weight: 600; }
  .tag-order .tag-status { font-size: 10px; font-weight: 400; opacity: .85; font-family: var(--kpt-mono); }
  .event-active     { --v: var(--kpt-v-tilaukset); }
  .event-quoted     { --v: var(--kpt-v-ajat); }
  .event-production { --v: var(--kpt-huom); }
  .event-done, .event-invoiced { --v: var(--kpt-ok); }
  .event-archived   { --v: var(--kpt-heikko); }
  .tag-todo { --v: var(--kpt-teksti); border-left: 3px solid var(--kpt-huom); border-radius: 6px; font-weight: 500; }
  .tag-todo.prio-high { border-left-color: var(--kpt-virhe); }
  .tag-todo.prio-low  { border-left-color: var(--kpt-ok); }
  .tag-todo.is-done { opacity: .5; text-decoration: line-through !important; }

  .loading { grid-column: 1 / -1; color: var(--kpt-himmea); font-size: 13px; padding: 10px 0; }

  @media (max-width: 640px) {
    .tuotanto-iso { padding: 16px; gap: 12px; }
    .tuotanto-iso .ikoni { font-size: 28px; }
    .tuotanto-iso .nimi { font-size: 20px; }
    .pikanapit { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pikanappi { min-height: 64px; flex-direction: row; justify-content: flex-start; gap: 10px; padding: 10px 12px; text-align: left; }
    .kat-ruutu { padding: 10px 12px 8px; }
    .kat-ruutu .linkit { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
    .kat-ruutu a { font-size: 13.5px; padding: 7px 6px; margin: 0 -6px; }
    .status-card { padding: 8px 4px; }
    .status-count { font-size: 19px; }
    .status-name { font-size: 10.5px; }
    .day-row { flex-direction: column; gap: 4px; }
    .day-row.empty-day { flex-direction: row; align-items: baseline; }
    .day-label { flex-direction: row; gap: 8px; width: auto; align-items: baseline; }
  }
</style>
</head>
<body class="kpt-sivu">

<header class="kpt-yla">
  <a class="kpt-logo" href="etusivu.html">
    <img class="kpt-vain-tumma" src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="118" height="40">
    <img class="kpt-vain-vaalea" src="logo-musta.png" alt="Kalajoen Peltityö" width="118" height="40">
  </a>
  <div class="nav-menu-wrap">
    <button class="kpt-valikko-nappi" type="button">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=5"></script>
  </div>
  <div class="kpt-otsikko"><span class="kpt-kategoria"></span><h1>Etusivu</h1></div>
  <div class="header-right"><button class="kpt-teema-kytkin" type="button"></button></div>
</header>

<main class="kpt-sisalto">
<div class="etu-ruudukko">

  <div class="etu-sarake">
    <section class="o-tuotanto">
      <a class="tuotanto-iso" href="tuotanto.html">
        <span class="ikoni">⚙️</span>
        <span class="teksti">
          <span class="nimi">Tuotanto</span>
          <span class="tila" id="tuotantoTila">Ladataan…</span>
        </span>
        <span class="nuoli">→</span>
      </a>
    </section>

    <section class="o-pika">
      <div class="pikanapit">
        <a class="pikanappi ensisijainen" data-kat="tilaukset" href="tilaus.html"><span class="ikoni">✏️</span><span class="nimi">Uusi tilaus</span></a>
        <a class="pikanappi" data-kat="ajat" href="ajanseuranta.html"><span class="ikoni">⏲</span><span class="nimi">Ajanseuranta</span></a>
        <a class="pikanappi" data-kat="varasto" href="varastotyo.html"><span class="ikoni">📱</span><span class="nimi">Varastotyö</span></a>

  <div class="etu-sarake">
    <section class="o-kanta">
      <div class="osio-otsikko">Tilauskanta <a href="tilaukset.html">Kaikki tilaukset →</a></div>
      <div class="status-grid" id="statusGrid">
        <div class="loading">Ladataan…</div>
      </div>

    <section class="o-toimet">
      <div class="osio-otsikko">⚠️ Vaatii toimenpiteitä</div>

      </div>

    <section class="o-paivat">
      <div class="osio-otsikko">Lähipäivät <a href="kalenteri.html">Avaa koko kalenteri →</a></div>

</div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://hjyeugeqmyavxisndlwp.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4";

  const STATUS_FI = {
    DRAFT: 'Luonnos', IN_PROGRESS: 'Kesken', QUOTED: 'Tarjottu',
    ORDERED: 'Tilattu', IN_PRODUCTION: 'Työn alla',
    COMPLETED: 'Valmis', INVOICED: 'Laskutettu', ARCHIVED: 'Arkisto'
  };
  const STATUS_ORDER = ['DRAFT','IN_PROGRESS','QUOTED','ORDERED','IN_PRODUCTION','COMPLETED','INVOICED','ARCHIVED'];
  const STATUS_CLASS = {
    DRAFT: 'draft', IN_PROGRESS: 'active', QUOTED: 'quoted',
    ORDERED: 'active', IN_PRODUCTION: 'production',
    COMPLETED: 'done', INVOICED: 'invoiced', ARCHIVED: 'archived'
  };
  const OVERDUE_DAYS = 14; // 2 viikkoa — kuinka monta päivää toimituspäivän jälkeen tilaus lasketaan "myöhässä"-listalle
  const OVERDUE_STATUSES = ['IN_PROGRESS', 'QUOTED', 'ORDERED', 'IN_PRODUCTION'];
  const STALE_DRAFT_DAYS = 14; // 2 viikkoa
  const AGENDA_DAYS = 7;
  const DAYS_SHORT_FI = ['Su','Ma','Ti','Ke','To','Pe','La'];

  // ---------- Kategoriaruudut valikosta (nav.js: window.KPT_VALIKKO), joten uusi sivu ilmestyy tänne itsestään ----------
  function renderKategoriat(){
    const el = document.getElementById("kategoriat");
    const V = window.KPT_VALIKKO;
    if(!el || !V || !V.VALIKKO){ if(el) el.closest("section").style.display = "none"; return; }
    el.innerHTML = V.VALIKKO.map(function(k){
      return '<div class="kat-ruutu" data-kat="' + escapeHtml(k.id) + '"><h2>' + escapeHtml(k.nimi) + '</h2>'
        + '<div class="linkit">' + k.sivut.map(function(s){ return '<a href="' + escapeHtml(s.href) + '">' + escapeHtml(s.label) + '</a>'; }).join("")
        + '</div></div>';
    }).join("");
  }

  // ---------- Auth helpers ----------
  async function getAuthHeaders(){
    const session = await window.getAuthSession();
    const token = session && session.data && session.data.session
      ? session.data.session.access_token
      : null;
    return {
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + (token || ANON_KEY),
      "Content-Type": "application/json"
    };
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function pad2(n){ return String(n).padStart(2, "0"); }
  function dateKey(y, m, d){ return y + "-" + pad2(m+1) + "-" + pad2(d); }
  function todayISO(){
    const d = new Date();
    return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function fmtDateFi(dateStr){
    if(!dateStr) return "—";
    const p = dateStr.split("-");
    return parseInt(p[2],10) + "." + parseInt(p[1],10) + "." + p[0];
  }
  function daysBetween(dateStr, todayStr){
    const a = new Date(dateStr + "T00:00:00");
    const b = new Date(todayStr + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }

  // ---------- Data ----------
  async function loadDashboard(){
    try{
      const headers = await getAuthHeaders();
      const todayStr = todayISO();
      const agendaEnd = new Date();
      agendaEnd.setDate(agendaEnd.getDate() + (AGENDA_DAYS - 1));
      const agendaEndStr = dateKey(agendaEnd.getFullYear(), agendaEnd.getMonth(), agendaEnd.getDate());

      const ordersUrl = SUPABASE_URL + "/rest/v1/orders?select=id,order_date,delivery_date,status,kohde,customers(name)&order=order_date.desc";
      const todosUrl = SUPABASE_URL + "/rest/v1/todos?select=*&due_date=gte." + todayStr + "&due_date=lte." + agendaEndStr + "&order=due_date.asc";

      const [ordersRes, todosRes] = await Promise.all([
        fetch(ordersUrl, { headers: headers }),
        fetch(todosUrl, { headers: headers })
      ]);
      if(!ordersRes.ok || !todosRes.ok) throw new Error("Haku epäonnistui");

      const orders = await ordersRes.json();
      const todos = await todosRes.json();

      renderTuotanto(orders);
      renderStatusGrid(orders);
      renderActionList(orders, todayStr);
      renderAgenda(orders, todos, todayStr);
    }catch(err){
      console.error(err);
      document.getElementById("statusGrid").innerHTML = '<div class="loading">Lataus epäonnistui</div>';
      document.getElementById("tuotantoTila").textContent = "Avaa tuotanto";
      document.getElementById("actionList").innerHTML = '<div class="loading">Lataus epäonnistui</div>';
      document.getElementById("agendaList").innerHTML = '<div class="loading">Lataus epäonnistui</div>';
    }
  }

  // ---------- Tuotanto isona: montako tilausta on työn alla ja tilattu (sama haku kuin tilauskannalla) ----------
  function renderTuotanto(orders){
    const n = function(s){ return orders.filter(function(o){ return o.status === s; }).length; };
    const tyon = n('IN_PRODUCTION'), tilattu = n('ORDERED');
    const osat = [];
    if(tyon) osat.push('<b>' + tyon + '</b> työn alla');
    if(tilattu) osat.push('<b>' + tilattu + '</b> tilattu');
    document.getElementById("tuotantoTila").innerHTML = osat.length ? osat.join(' · ') : 'Ei tilauksia tuotannossa';
  }

  // ---------- Status-kortit ----------
  function renderStatusGrid(orders){
    const counts = {};
    STATUS_ORDER.forEach(function(s){ counts[s] = 0; });
    orders.forEach(function(o){
      if(counts.hasOwnProperty(o.status)) counts[o.status]++;
    });

    const html = STATUS_ORDER.map(function(s){
      return '<a class="status-card' + (counts[s] ? '' : ' nolla') + '" href="tilaukset.html?filter=' + s + '">'
        + '<div class="status-count">' + counts[s] + '</div>'
        + '<div class="status-name">' + STATUS_FI[s] + '</div>'
        + '</a>';
    }).join("");

    document.getElementById("statusGrid").innerHTML = html;
  }

  // ---------- Vaatii toimenpiteitä ----------
  function renderActionList(orders, todayStr){
    const overdue = orders.filter(function(o){
      if(!o.delivery_date) return false;
      if(OVERDUE_STATUSES.indexOf(o.status) === -1) return false;
      return daysBetween(o.delivery_date, todayStr) > OVERDUE_DAYS;
    }).sort(function(a,b){ return a.delivery_date < b.delivery_date ? -1 : 1; });

    const unbilled = orders.filter(function(o){
      return o.status === 'COMPLETED';
    }).sort(function(a,b){
      const da = a.delivery_date || a.order_date || "";
      const db = b.delivery_date || b.order_date || "";
      return da < db ? -1 : 1;
    });

    const stale = orders.filter(function(o){
      if(o.status !== 'DRAFT' || !o.order_date) return false;
      return daysBetween(o.order_date, todayStr) > STALE_DRAFT_DAYS;
    }).sort(function(a,b){ return a.order_date < b.order_date ? -1 : 1; });

    let html = "";

    if(overdue.length){
      html += '<div class="action-subgroup-label">🔴 Myöhässä (' + overdue.length + ')</div>';
      html += overdue.map(function(o){
        const name = (o.customers && o.customers.name) ? o.customers.name : (o.kohde || "Tilaus");
        const daysLate = daysBetween(o.delivery_date, todayStr);
        const meta = "Toimitus oli " + daysLate + " pv sitten (" + fmtDateFi(o.delivery_date) + ")";
        return '<a class="action-item overdue" href="tilaukset.html?id=' + o.id + '">'
          + '<span class="action-icon">⏰</span>'
          + '<div class="action-body"><div class="action-name">' + escapeHtml(name) + '</div><div class="action-meta">' + meta + '</div></div>'
          + '</a>';
      }).join("");
    }

    if(unbilled.length){
      html += '<div class="action-subgroup-label">💰 Valmis, ei laskutettu (' + unbilled.length + ')</div>';
      html += unbilled.map(function(o){
        const name = (o.customers && o.customers.name) ? o.customers.name : (o.kohde || "Tilaus");
        const meta = o.delivery_date ? ("Toimitettu " + fmtDateFi(o.delivery_date)) : ("Tilattu " + fmtDateFi(o.order_date));
        return '<a class="action-item unbilled" href="tilaukset.html?id=' + o.id + '">'
          + '<span class="action-icon">💰</span>'
          + '<div class="action-body"><div class="action-name">' + escapeHtml(name) + '</div><div class="action-meta">' + meta + '</div></div>'
          + '</a>';
      }).join("");
    }

    if(stale.length){
      html += '<div class="action-subgroup-label">📝 Luonnos yli 2 viikkoa (' + stale.length + ')</div>';
      html += stale.map(function(o){
        const name = (o.customers && o.customers.name) ? o.customers.name : (o.kohde || "Tilaus");
        const age = daysBetween(o.order_date, todayStr);
        const meta = "Luotu " + fmtDateFi(o.order_date) + " (" + age + " pv sitten)";
        return '<a class="action-item stale" href="tilaukset.html?id=' + o.id + '">'
          + '<span class="action-icon">📝</span>'
          + '<div class="action-body"><div class="action-name">' + escapeHtml(name) + '</div><div class="action-meta">' + meta + '</div></div>'
          + '</a>';
      }).join("");
    }

    if(!overdue.length && !unbilled.length && !stale.length){
      html = '<div class="all-clear">✅ Ei toimenpiteitä juuri nyt — hyvä homma!</div>';
    }

    document.getElementById("actionList").innerHTML = html;
  }

  // ---------- Agenda ----------
  function orderTagHtml(o){
    const cls = STATUS_CLASS[o.status] || "draft";
    const fi = STATUS_FI[o.status] || o.status;
    const name = (o.customers && o.customers.name) ? o.customers.name : (o.kohde || "Tilaus");
    return '<a class="tag tag-order event-' + cls + '" href="tilaukset.html?id=' + o.id + '">'
      + '📋 ' + escapeHtml(name)
      + ' <span class="tag-status">' + fi + '</span>'
      + '</a>';
  }
  function todoTagHtml(t){
    const prio = t.priority || "normal";
    const doneClass = t.is_done ? " is-done" : "";
    return '<span class="tag tag-todo prio-' + prio + doneClass + '">'
      + (t.is_done ? "✓ " : "✅ ") + escapeHtml(t.title)
      + '</span>';
  }

  function renderAgenda(orders, todos, todayStr){
    const ordersByDate = {};
    orders.forEach(function(o){
      const key = (o.delivery_date || "").slice(0,10);
      if(!key) return;
      if(!ordersByDate[key]) ordersByDate[key] = [];
      ordersByDate[key].push(o);
    });
    const todosByDate = {};
    todos.forEach(function(t){
      const key = (t.due_date || "").slice(0,10);
      if(!key) return;
      if(!todosByDate[key]) todosByDate[key] = [];
      todosByDate[key].push(t);
    });

    const now = new Date();
    let html = "";
    for(let i = 0; i < AGENDA_DAYS; i++){
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
      const key = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      const dow = d.getDay();
      const isToday = (key === todayStr);
      const dayOrders = ordersByDate[key] || [];
      const dayTodos = todosByDate[key] || [];
      const hasItems = dayOrders.length || dayTodos.length;

      let classes = "day-row";
      if(isToday) classes += " today";
      if(!hasItems) classes += " empty-day";

      const tagsHtml = hasItems
        ? '<div class="day-tags">' + dayOrders.map(orderTagHtml).join("") + dayTodos.map(todoTagHtml).join("") + '</div>'
        : '<div class="day-empty">—</div>';

      const label = isToday ? "Tänään" : DAYS_SHORT_FI[dow];

      html += '<div class="' + classes + '">'
        + '<div class="day-label"><span class="day-name">' + label + '</span><span class="day-num">' + d.getDate() + '.' + (d.getMonth()+1) + '.</span></div>'
        + tagsHtml
        + '</div>';
    }

    document.getElementById("agendaList").innerHTML = html;
  }

  // ---------- Init ----------
  renderKategoriat();
  window._authReady.then(function(){
    loadDashboard();
  });

})();
</script>
