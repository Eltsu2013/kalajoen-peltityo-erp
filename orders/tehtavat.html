<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tehtävät — Kalajoen Peltityö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Ulkoasuremontti R6b (26.11.2026): uusi ulkoasu (tyyli.css + teema.js). Vanhat värinimet kytketty --kpt-muuttujiin,
     rakenne ja skripti ennallaan (oma valikkokoodi pois). Lomake puhelimella koko ruudulle, kentät 16 px. -->
<link rel="stylesheet" href="tyyli.css?v=2">
<script src="teema.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Vanhat värinimet → yhteiset --kpt-värit (R6b). Kiireellisyys: punainen / keltainen / vihreä. */
  :root, html[data-teema]{
    --bg: var(--kpt-tausta);
    --bg-panel: var(--kpt-paneeli);
    --bg-card: var(--kpt-paneeli);
    --border: var(--kpt-reuna);
    --text: var(--kpt-teksti);
    --text-dim: var(--kpt-himmea);
    --accent: var(--kpt-korostus);
    --accent-dim: color-mix(in srgb, var(--kpt-korostus) 20%, transparent);
    --accent-glow: var(--kpt-korostus-tausta);
    --high: var(--kpt-virhe);
    --normal: var(--kpt-huom);
    --low: var(--kpt-ok);
    --radius: 6px;
  }

  main{max-width:1200px;margin:0 auto;padding:20px;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    margin-bottom:20px;
  }
  .btn{
    background:var(--accent);color:var(--kpt-teksti-korostuksella);border:none;
    padding:10px 18px;border-radius:var(--radius);font-weight:600;
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;cursor:pointer;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn.secondary{
    background:transparent;color:var(--text);border:1px solid var(--border);
  }
  .btn.secondary:hover{border-color:var(--accent);color:var(--accent);}
  .btn.danger{background:var(--high);color:var(--kpt-teksti-korostuksella);}
  .btn-primary{background:var(--accent);color:var(--kpt-teksti-korostuksella);}
  .btn-primary:hover{filter:brightness(1.1);}
  .saving{font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}

  .toggle-wrap{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-dim);}
  .toggle-wrap input{accent-color:var(--accent);width:16px;height:16px;}

  .columns{
    display:grid;grid-template-columns:1fr 1fr;gap:20px;
  }
  @media (max-width:800px){
    .columns{grid-template-columns:1fr;}
  }
  .column h2{
    font-size:15px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-dim);border-bottom:1px solid var(--border);
    padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;
  }
  .column h2 .count{
    background:var(--bg-card);color:var(--text);font-family:'IBM Plex Mono',monospace;
    font-size:12px;padding:2px 8px;border-radius:10px;
  }
  .cards{display:flex;flex-direction:column;gap:10px;}
  .empty-state{
    color:var(--text-dim);font-size:14px;padding:24px 10px;text-align:center;
    border:1px dashed var(--border);border-radius:var(--radius);
  }

  .card{
    background:var(--bg-card);border-radius:var(--radius);
    border-left:4px solid var(--normal);
    padding:12px 14px;cursor:pointer;
    display:flex;gap:12px;align-items:flex-start;
    transition:background .15s;
  }
  .card:hover{background:var(--kpt-paneeli2);}
  .card.priority-high{border-left-color:var(--high);}
  .card.priority-normal{border-left-color:var(--normal);}
  .card.priority-low{border-left-color:var(--low);}
  .card.done{opacity:.5;}
  .card.done .card-title{text-decoration:line-through;}

  .card input[type=checkbox]{
    margin-top:2px;width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;
  }
  .card-body{flex:1;min-width:0;}
  .card-title{font-weight:600;font-size:15px;}
  .card-meta{
    margin-top:4px;font-size:12px;color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .card-phone{margin-top:6px;}
  .card-customer{margin-top:6px;}
  .card-customer a{
    color:var(--accent);text-decoration:none;font-weight:600;
    font-family:'IBM Plex Mono',monospace;font-size:13px;
  }
  .card-customer a:hover{text-decoration:underline;}
  .card-phone a{
    color:var(--accent);text-decoration:none;font-weight:600;
    font-family:'IBM Plex Mono',monospace;font-size:13px;
  }
  .card-phone a:hover{text-decoration:underline;}
  .card-notes{
    margin-top:6px;font-size:13px;color:var(--text-dim);
    white-space:pre-wrap;word-break:break-word;
  }

  /* Modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
    z-index:100;align-items:center;justify-content:center;padding:16px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--bg-panel);border:1px solid var(--border);
    border-radius:var(--radius);width:100%;max-width:480px;
    max-height:90vh;overflow-y:auto;padding:20px;
  }
  .modal h3{margin:0 0 16px 0;font-size:17px;color:var(--accent);}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:13px;color:var(--text-dim);margin-bottom:5px;
  }
  .field input[type=text],
  .field input[type=tel],
  .field input[type=date],
  .field input[type=time],
  .field select,
  .field textarea{
    width:100%;background:var(--bg-card);border:1px solid var(--border);
    color:var(--text);padding:9px 10px;border-radius:var(--radius);
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--accent);
  }
  #todoPriority{font-weight:600;transition:border-color .15s,color .15s;}
  #todoPriority.prio-high{border-color:var(--high);color:var(--high);}
  #todoPriority.prio-normal{border-color:var(--normal);color:var(--normal);}
  #todoPriority.prio-low{border-color:var(--low);color:var(--low);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .checkbox-field{display:flex;align-items:center;gap:8px;}

  /* Asiakashaku */
  .customer-dropdown{
    display:none;position:absolute;top:100%;left:0;right:0;
    background:var(--bg-card);border:1px solid var(--border);border-top:none;
    max-height:180px;overflow-y:auto;z-index:50;border-radius:0 0 4px 4px;
  }
  .customer-dropdown.open{display:block;}
  .customer-dropdown-item{
    padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);
  }
  .customer-dropdown-item:last-child{border-bottom:none;}
  .customer-dropdown-item:hover{background:var(--accent-glow);color:var(--accent);}
  .customer-chip{
    margin-top:8px;display:flex;align-items:center;gap:8px;
    background:var(--accent-glow);border:1px solid var(--accent);border-radius:12px;
    padding:5px 10px;font-size:13px;color:var(--accent);width:fit-content;
  }
  .customer-chip button{
    background:none;border:none;color:var(--accent);cursor:pointer;
    font-size:12px;padding:0;line-height:1;
  }

  /* Piilotettava yhteystieto-osio */
  .contact-toggle{
    background:none;border:none;color:var(--accent);cursor:pointer;
    font-size:13px;padding:0;margin-bottom:12px;text-decoration:underline;
    font-family:'IBM Plex Sans',sans-serif;
  }

  .checkbox-field input{width:18px;height:18px;accent-color:var(--accent);}
  .checkbox-field label{margin:0;color:var(--text);font-size:14px;}
  .modal-actions{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:18px;gap:10px;flex-wrap:wrap;
  }
  .modal-actions .right{display:flex;gap:10px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--bg-card);border:1px solid var(--accent);color:var(--text);
    padding:10px 18px;border-radius:var(--radius);font-size:14px;z-index:200;
    display:none;
  }
  .toast.show{display:block;}


  /* ---------- R6b: uusi ulkoasu ja puhelin (26.11.2026) ---------- */
  .field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=date],
  .field input[type=time], .field select, .field textarea{
    background:var(--kpt-kentta);border-color:var(--kpt-reuna2);min-height:42px;
  }
  .field input[type=email]{width:100%;color:var(--text);padding:9px 10px;border:1px solid var(--kpt-reuna2);border-radius:var(--radius);font-family:var(--kpt-fontti);font-size:14px;}
  .modal{box-shadow:var(--kpt-varjo);}
  .card{border:1px solid var(--border);border-left-width:4px;}
  .column h2{font-family:var(--kpt-mono);font-size:12px;letter-spacing:.1em;}
  .column h2 .count{background:var(--kpt-paneeli2);}
  .customer-dropdown{background:var(--kpt-paneeli);box-shadow:var(--kpt-varjo);}
  .btn{min-height:40px;}
  .kpt-yla #newBtn{min-height:32px;padding:0 12px;font-size:13px;}

  @media (max-width:700px){
    .card{padding:14px;}
    .card input[type=checkbox]{width:24px;height:24px;}
    .toggle-wrap{font-size:15px;min-height:40px;}
    .toggle-wrap input{width:22px;height:22px;}
    /* Lomake koko ruudulle, kentät 16 px (iPhone ei zoomaa), Tallenna alalaidassa */
    .overlay{padding:0;align-items:stretch;}
    .modal{max-width:none;max-height:none;height:100%;border-radius:0;border:none;padding:16px 16px 0;display:flex;flex-direction:column;}
    .field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=date],
    .field input[type=time], .field select, .field textarea{font-size:16px;min-height:48px;}
    .checkbox-field{min-height:44px;}
    .checkbox-field input{width:24px;height:24px;}
    .checkbox-field label{font-size:16px;}
    .contact-toggle{font-size:15px;min-height:40px;}
    .customer-dropdown-item{padding:12px;font-size:15px;}
    .modal-actions{position:sticky;bottom:0;margin-top:auto;padding:12px 0 16px;background:var(--bg-panel);}
    .modal-actions .right{flex:1;}
    .modal-actions .btn{min-height:48px;font-size:15px;}
    .modal-actions .right .btn{flex:1;}
  }
  </style>
</head>
<body class="kpt-sivu">

<header class="kpt-yla">
  <a class="kpt-logo" href="etusivu.html">
    <img class="kpt-vain-tumma" src="logo-valkoinen.png" alt="Kalajoen Peltityö" width="118" height="40">
    <img class="kpt-vain-vaalea" src="logo-musta.png" alt="Kalajoen Peltityö" width="118" height="40">
  </a>
  <div class="nav-menu-wrap">
    <button class="kpt-valikko-nappi" type="button">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <!-- Valikon sisältö tulee tiedostosta nav.js. Tämä linkki näkyy vain, jos nav.js ei lataudu. -->
      <a class="nav-item" href="etusivu.html">🏠 Etusivu</a>
    </div>
    <script src="nav.js?v=6"></script>
  </div>
  <div class="kpt-otsikko"><span class="kpt-kategoria"></span><h1>Tehtävät</h1></div>
  <div class="header-right">
    <span class="saving" id="saveStatus"></span>
    <button class="btn btn-primary" id="newBtn">+ Uusi tehtävä</button>
    <button class="kpt-teema-kytkin" type="button"></button>
  </div>
</header>

<main>
  <div class="toolbar">
    <label class="toggle-wrap">
      <input type="checkbox" id="showDoneToggle">
      Näytä tehdyt
    </label>
  </div>

  <div class="columns">
    <div class="column">
      <h2>Omat <span class="count" id="ownCount">0</span></h2>
      <div class="cards" id="ownCards"></div>
    </div>
    <div class="column">
      <h2>Yhteiset <span class="count" id="sharedCount">0</span></h2>
      <div class="cards" id="sharedCards"></div>
    </div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Uusi tehtävä</h3>
    <input type="hidden" id="todoId">
    <div class="field">
      <label for="todoTitle">Otsikko *</label>
      <input type="text" id="todoTitle" maxlength="200">
    </div>

    <div class="field">
      <label for="customerSearch">Asiakas (valinnainen)</label>
      <div style="position:relative;">
        <input type="text" id="customerSearch" placeholder="Hae nimellä..." autocomplete="off">
        <div id="customerDropdown" class="customer-dropdown"></div>
      </div>
      <input type="hidden" id="todoCustomerId">
      <div id="customerChip" class="customer-chip" style="display:none;">
        <span id="customerChipName"></span>
        <button type="button" id="customerChipClear" title="Poista yhteys">✕</button>
      </div>
    </div>

    <div class="field">
      <label for="todoNotes">Lisätiedot</label>
      <textarea id="todoNotes"></textarea>
    </div>

    <button type="button" id="contactToggle" class="contact-toggle">+ Lisää yhteystiedot (puhelin / sähköposti)</button>
    <div id="contactFields" style="display:none;">
      <div class="field">
        <label for="todoPhone">Puhelinnumero</label>
        <input type="tel" id="todoPhone" placeholder="esim. 040 123 4567">
      </div>
      <div class="field">
        <label for="todoEmail">Sähköposti</label>
        <input type="email" id="todoEmail" placeholder="esim. matti@yritys.fi">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="todoDate">Eräpäivä</label>
        <input type="date" id="todoDate">
      </div>
      <div class="field">
        <label for="todoTime">Kellonaika</label>
        <input type="time" id="todoTime">
      </div>
    </div>
    <div class="field">
      <label for="todoPriority">Prioriteetti</label>
      <select id="todoPriority">
        <option value="high">🔴 Kiireellinen</option>
        <option value="normal" selected>🟡 Normaali</option>
        <option value="low">🟢 Ei kiireellinen</option>
      </select>
    </div>
    <div class="field checkbox-field">
      <input type="checkbox" id="todoShared">
      <label for="todoShared">Näkyy kaikille</label>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="deleteBtn" style="display:none;">Poista</button>
      <div class="right">
        <button class="btn secondary" id="cancelBtn">Peruuta</button>
        <button class="btn" id="saveBtn">Tallenna</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="auth-guard.js"></script>
<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://hjyeugeqmyavxisndlwp.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWV1Z2VxbXlhdnhpc25kbHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDM2NzgsImV4cCI6MjA4NjcxOTY3OH0.ZMuN6lruMUHkASUtwnoShiqHLAg6YBEGsC7zMlymLs4";
  const REST_URL = SUPABASE_URL + "/rest/v1/todos";

  let allTodos = [];
  let currentUserId = null;
  let showDone = false;
  let allCustomers = [];
  let linkedCustomerName = null;

  // ---------- Nav-valikko (sama toteutus kuin muilla sivuilla) ----------
  // Valikko: nav.js hoitaa (R6, oma toggleNav poistettu)

  // ---------- Auth helpers ----------
  async function getAuthHeaders(){
    const session = await window.getAuthSession();
    const token = session && session.data && session.data.session
      ? session.data.session.access_token
      : null;
    return {
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + (token || ANON_KEY),
      "Content-Type": "application/json"
    };
  }

  async function getCurrentUserId(){
    const session = await window.getAuthSession();
    return session && session.data && session.data.session
      ? session.data.session.user.id
      : null;
  }

  // ---------- Toast ----------
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2500);
  }

  // ---------- Data loading ----------
  async function loadTodos(){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(REST_URL + "?select=*,customers(name)&order=due_date.asc.nullslast,priority.asc", { headers: headers });
      if(!res.ok){
        throw new Error("Haku epäonnistui: " + res.status);
      }
      allTodos = await res.json();
      render();
    }catch(err){
      console.error(err);
      showToast("Tehtävien haku epäonnistui");
    }
  }

  // Asiakaslista haetaan kerran, käytetään lomakkeen hakukentässä (nimi + puhelin + sähköposti
  // automaattitäyttöä varten). Sama periaate kuin tilaus.html:ssä.
  async function loadCustomersForSearch(){
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(SUPABASE_URL + "/rest/v1/customers?select=id,name,phone,email&is_active=eq.true&order=name.asc", { headers: headers });
      if(!res.ok) throw new Error("Asiakashaku epäonnistui: " + res.status);
      allCustomers = await res.json();
    }catch(err){
      console.error(err);
      // Ei näytetä toast-virhettä tästä — asiakashaku ei ole pakollinen tehtävän
      // luonnille, joten annetaan käyttäjän jatkaa ilman sitä.
    }
  }

  // ---------- Rendering ----------
  function fmtDate(dateStr){
    if(!dateStr) return "";
    const parts = dateStr.split("-");
    return parts[2] + "." + parts[1] + "." + parts[0];
  }
  function fmtTime(timeStr){
    if(!timeStr) return "";
    return timeStr.substring(0,5);
  }

  function telHref(phone){
    return "tel:" + phone.replace(/[^\d+]/g, "");
  }

  function cardHtml(todo){
    const prio = todo.priority || "normal";
    const doneClass = todo.is_done ? " done" : "";
    const dateBits = [];
    if(todo.due_date) dateBits.push(fmtDate(todo.due_date));
    if(todo.due_time) dateBits.push(fmtTime(todo.due_time));
    const metaLine = dateBits.length ? '<div class="card-meta"><span>📅 ' + dateBits.join(" klo ") + '</span></div>' : "";
    const customerName = todo.customers && todo.customers.name ? todo.customers.name : null;
    const customerLine = customerName
      ? '<div class="card-customer"><a href="asiakkaat.html?id=' + todo.customer_id + '" onclick="event.stopPropagation()">🏢 ' + escapeHtml(customerName) + '</a></div>'
      : "";
    const phoneLine = todo.phone ? '<div class="card-phone"><a href="' + telHref(todo.phone) + '" onclick="event.stopPropagation()">📞 ' + escapeHtml(todo.phone) + '</a></div>' : "";
    const emailLine = todo.email ? '<div class="card-phone"><a href="mailto:' + escapeHtml(todo.email) + '" onclick="event.stopPropagation()">✉️ ' + escapeHtml(todo.email) + '</a></div>' : "";
    const notesLine = todo.notes ? '<div class="card-notes">' + escapeHtml(todo.notes) + '</div>' : "";
    return (
      '<div class="card priority-' + prio + doneClass + '" data-id="' + todo.id + '">' +
        '<input type="checkbox" class="done-check" ' + (todo.is_done ? "checked" : "") + '>' +
        '<div class="card-body">' +
          '<div class="card-title">' + escapeHtml(todo.title) + '</div>' +
          metaLine +
          customerLine +
          phoneLine +
          emailLine +
          notesLine +
        '</div>' +
      '</div>'
    );
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Asiakashaku (lomakkeessa) ----------
  function filterCustomersForTodo(q){
    const dd = document.getElementById("customerDropdown");
    const ql = (q || "").toLowerCase().trim();
    if(!ql){ dd.classList.remove("open"); dd.innerHTML = ""; return; }
    const matches = allCustomers.filter(function(c){
      return (c.name || "").toLowerCase().includes(ql);
    }).slice(0, 20);
    if(!matches.length){ dd.classList.remove("open"); dd.innerHTML = ""; return; }
    dd.innerHTML = matches.map(function(c){
      return '<div class="customer-dropdown-item" data-customer-id="' + c.id + '">' + escapeHtml(c.name) + '</div>';
    }).join("");
    dd.classList.add("open");
  }

  function selectCustomerForTodo(customerId){
    const c = allCustomers.find(function(x){ return String(x.id) === String(customerId); });
    if(!c) return;
    document.getElementById("todoCustomerId").value = c.id;
    linkedCustomerName = c.name;
    document.getElementById("customerSearch").value = "";
    document.getElementById("customerDropdown").classList.remove("open");

    // Jos otsikko on vielä tyhjä, ehdotetaan asiakkaan nimeä otsikoksi —
    // silloin tägiä ei tarvitse näyttää erikseen (syncCustomerChipVisibility hoitaa piilotuksen).
    const titleField = document.getElementById("todoTitle");
    if(!titleField.value.trim()){
      titleField.value = c.name;
    }
    syncCustomerChipVisibility();

    // Automaattitäyttö — vain jos kentät ovat vielä tyhjiä, ettei ylikirjoiteta
    // jo käsin syötettyä tietoa.
    const phoneField = document.getElementById("todoPhone");
    const emailField = document.getElementById("todoEmail");
    let filledSomething = false;
    if(!phoneField.value && c.phone){ phoneField.value = c.phone; filledSomething = true; }
    if(!emailField.value && c.email){ emailField.value = c.email; filledSomething = true; }
    if(filledSomething){
      document.getElementById("contactFields").style.display = "";
      document.getElementById("contactToggle").style.display = "none";
    }
  }

  // Tägi näkyy AINA paitsi silloin kun otsikko on täsmälleen sama kuin liitetyn
  // asiakkaan nimi — silloin nimi näkyy jo otsikossa eikä tägiä tarvita erikseen.
  // Kutsutaan aina kun asiakas valitaan/poistetaan TAI otsikkoa muokataan.
  function syncCustomerChipVisibility(){
    const customerId = document.getElementById("todoCustomerId").value;
    const chip = document.getElementById("customerChip");
    if(!customerId || !linkedCustomerName){
      chip.style.display = "none";
      return;
    }
    const titleVal = document.getElementById("todoTitle").value.trim();
    if(titleVal === linkedCustomerName){
      chip.style.display = "none";
    }else{
      document.getElementById("customerChipName").textContent = "🏢 " + linkedCustomerName;
      chip.style.display = "flex";
    }
  }

  function clearCustomerSelection(){
    document.getElementById("todoCustomerId").value = "";
    linkedCustomerName = null;
    document.getElementById("customerChip").style.display = "none";
    document.getElementById("customerSearch").value = "";
  }

  document.getElementById("customerSearch").addEventListener("input", function(e){
    filterCustomersForTodo(e.target.value);
  });
  document.getElementById("customerDropdown").addEventListener("click", function(e){
    const item = e.target.closest(".customer-dropdown-item");
    if(!item) return;
    selectCustomerForTodo(item.getAttribute("data-customer-id"));
  });
  document.getElementById("customerChipClear").addEventListener("click", clearCustomerSelection);
  document.getElementById("todoTitle").addEventListener("input", syncCustomerChipVisibility);
  document.addEventListener("click", function(e){
    if(!e.target.closest("#customerSearch") && !e.target.closest("#customerDropdown")){
      document.getElementById("customerDropdown").classList.remove("open");
    }
  });

  // ---------- Piilotettava yhteystieto-osio ----------
  document.getElementById("contactToggle").addEventListener("click", function(){
    document.getElementById("contactFields").style.display = "";
    document.getElementById("contactToggle").style.display = "none";
  });

  function render(){
    const own = [];
    const shared = [];
    allTodos.forEach(function(t){
      if(!showDone && t.is_done) return;
      if(t.is_shared){
        shared.push(t);
      }else{
        own.push(t);
      }
    });

    const ownCards = document.getElementById("ownCards");
    const sharedCards = document.getElementById("sharedCards");

    ownCards.innerHTML = own.length
      ? own.map(cardHtml).join("")
      : '<div class="empty-state">Ei omia tehtäviä</div>';

    sharedCards.innerHTML = shared.length
      ? shared.map(cardHtml).join("")
      : '<div class="empty-state">Ei yhteisiä tehtäviä</div>';

    document.getElementById("ownCount").textContent = own.length;
    document.getElementById("sharedCount").textContent = shared.length;

    attachCardEvents();
  }

  function attachCardEvents(){
    document.querySelectorAll(".card").forEach(function(card){
      const id = card.getAttribute("data-id");
      card.addEventListener("click", function(e){
        if(e.target.classList.contains("done-check")) return;
        openModal(allTodos.find(function(t){ return String(t.id) === id; }));
      });
      const check = card.querySelector(".done-check");
      check.addEventListener("click", function(e){
        e.stopPropagation();
        toggleDone(id, check.checked);
      });
    });
  }

  // ---------- Toggle done ----------
  async function toggleDone(id, isDone){
    try{
      const headers = await getAuthHeaders();
      const body = {
        is_done: isDone,
        done_at: isDone ? new Date().toISOString() : null
      };
      const res = await fetch(REST_URL + "?id=eq." + id, {
        method: "PATCH",
        headers: headers,
        body: JSON.stringify(body)
      });
      if(!res.ok) throw new Error("Päivitys epäonnistui: " + res.status);
      const local = allTodos.find(function(t){ return String(t.id) === id; });
      if(local){
        local.is_done = isDone;
        local.done_at = body.done_at;
      }
      render();
    }catch(err){
      console.error(err);
      showToast("Tilan päivitys epäonnistui");
      loadTodos();
    }
  }

  // ---------- Modal ----------
  const overlay = document.getElementById("overlay");
  const modalTitle = document.getElementById("modalTitle");
  const deleteBtn = document.getElementById("deleteBtn");

  function updatePriorityColor(){
    const sel = document.getElementById("todoPriority");
    sel.classList.remove("prio-high", "prio-normal", "prio-low");
    sel.classList.add("prio-" + sel.value);
  }
  document.getElementById("todoPriority").addEventListener("change", updatePriorityColor);

  function openModal(todo, presetDate){
    document.getElementById("todoId").value = todo ? todo.id : "";
    document.getElementById("todoTitle").value = todo ? todo.title : "";
    document.getElementById("todoNotes").value = todo ? (todo.notes || "") : "";
    document.getElementById("todoPhone").value = todo ? (todo.phone || "") : "";
    document.getElementById("todoEmail").value = todo ? (todo.email || "") : "";
    document.getElementById("todoDate").value = todo ? (todo.due_date || "") : (presetDate || "");
    document.getElementById("todoTime").value = todo ? (todo.due_time ? todo.due_time.substring(0,5) : "") : "";
    document.getElementById("todoPriority").value = todo ? todo.priority : "normal";
    updatePriorityColor();
    document.getElementById("todoShared").checked = todo ? !!todo.is_shared : false;

    // Asiakas
    document.getElementById("customerSearch").value = "";
    document.getElementById("customerDropdown").classList.remove("open");
    if(todo && todo.customer_id && todo.customers && todo.customers.name){
      document.getElementById("todoCustomerId").value = todo.customer_id;
      linkedCustomerName = todo.customers.name;
    }else{
      document.getElementById("todoCustomerId").value = "";
      linkedCustomerName = null;
    }
    syncCustomerChipVisibility();

    // Puhelin/sähköposti-osio: näytetään suoraan jos jompikumpi jo täytetty
    // (tai asiakas liitetty), muuten piilotetaan "+ Lisää yhteystiedot" -linkin taakse.
    const hasContactInfo = todo && (todo.phone || todo.email || todo.customer_id);
    document.getElementById("contactFields").style.display = hasContactInfo ? "" : "none";
    document.getElementById("contactToggle").style.display = hasContactInfo ? "none" : "";

    modalTitle.textContent = todo ? "Muokkaa tehtävää" : "Uusi tehtävä";
    deleteBtn.style.display = todo ? "inline-block" : "none";
    overlay.classList.add("open");
  }

  function closeModal(){
    overlay.classList.remove("open");
  }

  document.getElementById("newBtn").addEventListener("click", function(){
    openModal(null);
  });
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e){
    if(e.target === overlay) closeModal();
  });

  document.getElementById("saveBtn").addEventListener("click", async function(){
    const id = document.getElementById("todoId").value;
    const title = document.getElementById("todoTitle").value.trim();
    if(!title){
      showToast("Otsikko puuttuu");
      return;
    }
    const payload = {
      title: title,
      notes: document.getElementById("todoNotes").value.trim() || null,
      phone: document.getElementById("todoPhone").value.trim() || null,
      email: document.getElementById("todoEmail").value.trim() || null,
      customer_id: document.getElementById("todoCustomerId").value || null,
      due_date: document.getElementById("todoDate").value || null,
      due_time: document.getElementById("todoTime").value || null,
      priority: document.getElementById("todoPriority").value,
      is_shared: document.getElementById("todoShared").checked
    };

    try{
      const headers = await getAuthHeaders();
      let res;
      if(id){
        res = await fetch(REST_URL + "?id=eq." + id, {
          method: "PATCH",
          headers: headers,
          body: JSON.stringify(payload)
        });
      }else{
        if(!currentUserId){
          currentUserId = await getCurrentUserId();
        }
        payload.user_id = currentUserId;
        res = await fetch(REST_URL, {
          method: "POST",
          headers: Object.assign({}, headers, { "Prefer": "return=representation" }),
          body: JSON.stringify(payload)
        });
      }
      if(!res.ok) throw new Error("Tallennus epäonnistui: " + res.status);
      closeModal();
      showToast("Tallennettu");
      await loadTodos();
    }catch(err){
      console.error(err);
      showToast("Tallennus epäonnistui");
    }
  });

  deleteBtn.addEventListener("click", async function(){
    const id = document.getElementById("todoId").value;
    if(!id) return;
    if(!confirm("Poistetaanko tehtävä?")) return;
    try{
      const headers = await getAuthHeaders();
      const res = await fetch(REST_URL + "?id=eq." + id, {
        method: "DELETE",
        headers: headers
      });
      if(!res.ok) throw new Error("Poisto epäonnistui: " + res.status);
      closeModal();
      showToast("Poistettu");
      await loadTodos();
    }catch(err){
      console.error(err);
      showToast("Poisto epäonnistui");
    }
  });

  // ---------- Show done toggle ----------
  document.getElementById("showDoneToggle").addEventListener("change", function(e){
    showDone = e.target.checked;
    render();
  });

  // ---------- Suora linkitys yhteen tehtävään tai uuden lisäys valmiiksi täytetyllä päivällä ----------
  // Käyttö A: tehtavat.html?edit=<tehtävän id>       → avaa olemassa olevan tehtävän muokkaukseen
  // Käyttö B: tehtavat.html?newDate=<YYYY-MM-DD>      → avaa "Uusi tehtävä" -lomakkeen valmiilla eräpäivällä
  function openTodoFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const targetId = params.get("edit");
    const newDate = params.get("newDate");

    if(targetId){
      const todo = allTodos.find(function(t){ return String(t.id) === String(targetId); });
      if(todo){
        openModal(todo);
      }else{
        showToast("Tehtävää ei löytynyt (tai se ei ole näkyvissäsi)");
      }
      return;
    }

    if(newDate){
      openModal(null, newDate);
    }
  }

  // ---------- Init ----------
  window._authReady.then(async function(){
    currentUserId = await getCurrentUserId();
    await loadTodos();
    loadCustomersForSearch(); // ei odoteta - täydentyy taustalla, ei estä sivun avautumista
    openTodoFromUrl();
  });

})();
</script>

</body>
</html>
